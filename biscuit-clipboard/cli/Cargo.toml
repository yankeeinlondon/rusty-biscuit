[package]
name = "biscuit-clipboard-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "clip"
path = "src/main.rs"

[dependencies]
biscuit-clipboard = { path = "../lib" }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
