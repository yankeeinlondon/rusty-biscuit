[package]
name = "biscuit-clipboard-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "clip"
path = "src/main.rs"

[dependencies]
biscuit-clipboard = { path = "../lib" }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
# `bin_exe!`: resolves the `clip` path at run time so the integration tests
# survive execution from a relocated nextest archive (the wsl2 leg).
biscuit-test-harness = { path = "../../biscuit-test-harness" }
assert_cmd = "2"
predicates = "3"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

# CI exclusion: 201 tests across three packages that currently run in no CI
# job. Promotion is blocked on the canonical just recipe set and on confirming
# headless-runner clipboard behavior.
[package.metadata.ci]
gates = false
exclusion-class = "promotion-pending"
owner = "@yankeeinlondon"
reason = "201 tests that currently run in NO CI job, across three packages. Promotion is blocked on the canonical just recipe set and on confirming headless-runner clipboard behavior (no X11/Wayland display)."
expiry = "2026-10-31"
