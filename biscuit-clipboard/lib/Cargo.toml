[package]
name = "biscuit-clipboard"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
biscuit-hash = { path = "../../biscuit-hash/lib" }
chrono = { version = "0.4", features = ["serde"] }
clipboard-rs = "0.3"
dirs = "6"
eventsource-stream = "0.2"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tracing = "0.1"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "rt-multi-thread"] }
wiremock = "0.6"

# CI exclusion: 201 tests across three packages that currently run in no CI
# job. Promotion is blocked on the canonical just recipe set and on confirming
# headless-runner clipboard behavior.
[package.metadata.ci]
gates = false
exclusion-class = "promotion-pending"
owner = "@yankeeinlondon"
reason = "201 tests that currently run in NO CI job, across three packages. Promotion is blocked on the canonical just recipe set and on confirming headless-runner clipboard behavior (no X11/Wayland display)."
expiry = "2026-10-31"
