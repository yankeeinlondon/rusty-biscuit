[package]
name = "biscuit-clipboard-service"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "clipper"
path = "src/main.rs"

[dependencies]
biscuit-clipboard = { path = "../lib" }
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
fs4 = "0.13"
tower = "0.5"
libc = "0.2"

[dev-dependencies]
# `bin_exe!`: resolves the `clipper` path at run time so the e2e test survives
# execution from a relocated nextest archive (the wsl2 leg).
biscuit-test-harness = { path = "../../biscuit-test-harness" }
axum-test = "16"
tempfile = "3"
tower = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

# CI exclusion: ~79 service tests that currently run in no CI job. Promotion
# is blocked on the canonical just recipe set and on confirming
# headless-runner clipboard behavior.
[package.metadata.ci]
gates = false
exclusion-class = "promotion-pending"
owner = "@yankeeinlondon"
reason = "~79 clipboard service (daemon) tests that currently run in NO CI job. Promotion is blocked on the canonical just recipe set and on confirming headless-runner clipboard behavior (no X11/Wayland display) — the service's HTTP surface is testable headless, but its clipboard writes go through the same display-dependent backend."
expiry = "2026-10-31"
