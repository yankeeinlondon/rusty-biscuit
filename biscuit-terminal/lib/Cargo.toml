[package]
name = "biscuit-terminal"
description = "A set of utilities for making working in the terminal more rewarding"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/yankeeinlondon/rusty-biscuit"
keywords = ["terminal", "syntax-highlighting", "themes"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "biscuit_terminal"
path = "src/lib.rs"


[features]
clap = ["dep:clap", "renderable/clap"]
# Enables `serde::{Serialize, Deserialize}` derives on a small subset of
# public value types (currently: `components::horizontal_rule::{RuleStyle,
# RuleAlignment, RuleWeight}`). Off by default — opt in when persisting or
# round-tripping these values through JSON/YAML.
serde = []

[dependencies]
base64 = "0.22"
biscuit-visualized = { path = "../../biscuit-visualized/src", features = ["clap"] }
ignore = "0.4"
image = "0.25"
renderable = { path = "../../renderable" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
terminal_size = "0.4.3"
termini = "1.0"
thiserror = "2.0"
tracing = "0.1"
unicode-width = "0.2"
regex = "1.11"
paste = "1.0"
globset = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unic-langid = "0.9.6"

# Terminal image rendering
viuer = { version = "0.11", features = ["print-file"] }

# SVG rasterization for terminal image rendering
resvg = "0.45"

# CLI argument parsing (optional, for ValueEnum derive)
clap = { version = "4", features = ["derive"], optional = true }

# Temporary files (for mermaid rendering)
tempfile = "3"
chrono = { version = "0.4.43", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
criterion = { version = "0.5", features = ["html_reports"] }
expectrl = "0.8.0"
insta = "1.46"
predicates = "3"
proptest = "1.5"
serial_test = "3"
tempfile = "3"
tracing-test = "0.2"

[[bench]]
name = "rendering"
harness = false
