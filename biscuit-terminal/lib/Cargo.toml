[package]
name = "biscuit-terminal"
description = "A set of utilities for making working in the terminal more rewarding"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/yankeeinlondon/rusty-biscuit"
keywords = ["terminal", "syntax-highlighting", "themes"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "biscuit_terminal"
path = "src/lib.rs"


[features]
clap = ["dep:clap", "renderable/clap"]
# Enables `serde::{Serialize, Deserialize}` derives on a small subset of
# public value types (currently: `components::horizontal_rule::{RuleStyle,
# RuleAlignment, RuleWeight}`). Off by default — opt in when persisting or
# round-tripping these values through JSON/YAML.
serde = []
# Enables SVG rasterization via resvg for terminal image rendering.
image = ["dep:resvg", "dep:biscuit-visualized", "biscuit-visualized/image"]

[dependencies]
base64 = "0.22"
biscuit-visualized = { path = "../../biscuit-visualized/src", features = ["clap"], optional = true }
# Structured config parsing for app-metadata value extraction. Normalizes
# TOML/YAML/JSON5 to `serde_json::Value`; the underlying parsers stay indirect.
# `default-features = false` keeps the heavy PDF/gix tree out.
biscuit-file = { path = "../../biscuit-file/lib", default-features = false, features = ["toml", "yaml", "json5"] }
ignore = "0.4"
image = "0.25"
renderable = { path = "../../renderable" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
terminal_size = "0.4.3"
termini = "1.0"
thiserror = "2.0"
tracing = "0.1"
unicode-width = "0.2"
url = "2.5"
regex = "1.11"
paste = "1.0"
globset = "0.4"
# Apple property-list (XML + binary) extraction for iTerm2 / Apple Terminal
# config value reading; the only structured parser added directly (§6/§10).
plist = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unic-langid = "0.9.6"

# Terminal image rendering
viuer = { version = "0.11", features = ["print-file"] }

# SVG rasterization for terminal image rendering
resvg = { version = "0.45", optional = true }

# CLI argument parsing (optional, for ValueEnum derive)
clap = { version = "4", features = ["derive"], optional = true }

# Temporary files (for mermaid rendering)
tempfile = "3"
chrono = { version = "0.4.43", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Re-declares the renderable path dep with the test-only `hint-access-counter`
# feature so the terminal perf-gate test (`tests/perf_gate.rs`) can observe the
# `NodeAttrs::data` access counter while folding a corpus. The feature is unioned
# into test/bench builds only; normal `cargo build` keeps it off.
renderable = { path = "../../renderable", features = ["hint-access-counter"] }
assert_cmd = "2"
criterion = { version = "0.5", features = ["html_reports"] }
expectrl = "0.8.0"
insta = "1.46"
predicates = "3"
proptest = "1.5"
serial_test = "3"
tempfile = "3"
tracing-test = "0.2"
# Browser-tier (real headless Chrome) computed-style tests for Prose table
# cells (`tests/prose_cells_parity.rs`). They skip cleanly when no
# Chrome/Chromium is found.
biscuit-browser-harness = { path = "../../biscuit-browser-harness" }
# Real-terminal (Level-2) harness for the OSC 10 cache proof
# (`tests/level2_terminal_osc_wezterm.rs`). Shared harness — biscuit-terminal
# adds no PTY abstraction of its own.
biscuit-test-harness = { path = "../../biscuit-test-harness" }
# `require_level!` gating for the Level-2 tier.
test-toolkit = { path = "../../tools/test-toolkit" }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "rendering"
harness = false

[[bench]]
name = "render_tree"
harness = false

# CI policy: L1 runs with the `image` feature; biscuit-terminal owns L2
# (real-terminal) and browser (headless) tier tests.
[package.metadata.ci.tests]
tiers = ["L1", "L2", "browser"]
l2-backends = ["tmux", "wezterm", "kitty", "apple-terminal"]
features = ["image"]
