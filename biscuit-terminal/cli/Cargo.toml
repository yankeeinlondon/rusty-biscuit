[package]
name = "biscuit-terminal-cli"
description = "CLI for terminal utilities including syntax highlighting and themes"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/yankeeinlondon/rusty-biscuit"
autotests = false

[[bin]]
name = "bt"
path = "src/main.rs"

[features]
terminal-tests = ["dep:biscuit-test-harness", "dep:test-toolkit"]

[dependencies]
biscuit-terminal = { path = "../lib", features = ["clap", "image"] }
renderable = { path = "../../renderable" }
sniff = { path = "../../sniff/lib" }
clap = { version = "4.5", features = ["derive", "unstable-ext"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
biscuit-test-harness = { path = "../../biscuit-test-harness", optional = true }
test-toolkit = { path = "../../tools/test-toolkit", optional = true }

[dev-dependencies]
biscuit-test-harness = { path = "../../biscuit-test-harness" }
assert_cmd = "2"
expectrl = "0.8.0"
insta = "1.46.3"
predicates = "3"
serial_test = "3"
sha2 = "0.10"
tempfile = "3"
unicode-width = "0.2"
# The Level 1 layout gate (`tests/l1/test_layout.rs`) calls
# `test_toolkit::test_layout`. The optional normal dependency above only
# exists under `terminal-tests`.
test-toolkit = { path = "../../tools/test-toolkit" }

# One test binary per execution contract (tier × exact `required-features`),
# declared explicitly: `autotests = false` above, so a `tests/` file reaches a
# binary only through one of these roots (`2026-09-21-consolidated-test-binaries`).
[[test]]
name = "l1"
path = "tests/l1/main.rs"

[[test]]
name = "level2"
path = "tests/level2/main.rs"
required-features = ["terminal-tests"]

# CI policy: biscuit-terminal-cli owns L2 (real-terminal) tier tests.
[package.metadata.ci.tests]
tiers = ["L1", "L2"]
l2-backends = ["tmux", "wezterm", "kitty", "apple-terminal"]
# The L2 tier spawns one shared terminal pane through the harness broker.
# It is a compile-time binary of another package, so the producer builds it
# as a sidecar; an archive consumer has no Cargo to build one with.
sidecars = ["backend-proof", "harness-broker"]
features = ["terminal-tests"]
local-features = []
