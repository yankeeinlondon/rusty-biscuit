[package]
name = "biscuit-speaks-cli"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[[bin]]
name = "so-you-say"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.53", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
biscuit-speaks = { path = "../lib", features = ["playa"] }
inquire = "0.9"
owo-colors = { version = "4.3", features = ["supports-colors"] }
darkmatter = { path = "../../darkmatter/lib" }
sniff = { path = "../../sniff/lib" }
strum = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
# `bin_exe!`: resolves the `so-you-say` path at run time so the integration
# tests survive execution from a relocated nextest archive (the wsl2 leg).
biscuit-test-harness = { path = "../../biscuit-test-harness" }
tempfile = "3"


# Opt-out of benchmarking: this is a thin CLI wrapper; benchmarks belong
# on the underlying library crate.
[package.metadata.benchmarks]
required = false
reason = "Thin CLI wrapper around biscuit-speaks; no measurable hot paths."
