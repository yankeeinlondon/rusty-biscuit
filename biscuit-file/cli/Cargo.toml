[package]
name = "biscuit-file-cli"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "File format conversion and extraction utility"
repository = "https://github.com/yankeeinlondon/rusty-biscuit"
homepage = "https://github.com/yankeeinlondon/rusty-biscuit/tree/main/biscuit-file"

[[bin]]
name = "bf"
path = "src/main.rs"

[dependencies]
biscuit-file = { path = "../lib" }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
color-eyre = "0.6"
serde_json = "1.0"
serde_yaml_ng = "0.10"
toml = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
biscuit-test-harness = { path = "../../biscuit-test-harness" }
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[package.metadata.ci.tests]
# The path lookup guard includes darkmatter-cli's shared engine by `#[path]`
# and spells both files in its test.
source-inputs = ["darkmatter/cli/tests/common/path_lookup_guard.rs", "darkmatter/cli/tests/common/source_scan.rs"]

# cargo-binstall reads these from the tagged manifest (`--git`, or `--manifest-path`
# on a tag checkout). release-plz tags are `{package}-v{version}`, which binstall's
# default URL guesses never match. Binary distribution is not approved for this
# package, so `crate-meta-data` is disabled: binstall reports an opt-out instead of
# probing for archives. Enabling the `binstall` channel in `docs/deployment.yaml`
# removes `crate-meta-data` here in the same release proposal; distribution preflight
# refuses the two disagreeing.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "txz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
disabled-strategies = ["crate-meta-data", "quick-install", "compile"]
