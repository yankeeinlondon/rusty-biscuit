[package]
name = "biscuit-file-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bf"
path = "src/main.rs"

[dependencies]
biscuit-file = { path = "../lib" }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
color-eyre = "0.6"
serde_json = "1.0"
serde_yaml_ng = "0.10"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
