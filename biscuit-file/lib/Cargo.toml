[package]
name = "biscuit-file"
version = "0.1.0"
edition = "2024"
description = "File format utilities for PDF, TOML, and YAML"
license = "AGPL-3.0-only"
autotests = false

[lib]
name = "biscuit_file"
path = "src/lib.rs"
# Disable the default bench harness so `cargo bench` only runs Criterion targets.
bench = false

[features]
default = ["toml", "yaml", "json5", "extract", "lopdf", "file-reference"]

# Format support
toml = ["dep:toml"]
yaml = ["dep:serde_yaml_ng"]
json5 = ["dep:json-five"]

# PDF backends
extract = ["dep:pdf-extract"]
lopdf = ["dep:lopdf"]
pdfium = ["dep:pdfium-render"]

# File reference grammar: passive parsing of file and glob references and the
# data types they produce. No `gix` or `walkdir`; `globset` stays because glob
# pattern parsing validates the glob text.
file-reference-syntax = ["dep:globset", "url"]

# File reference resolution, listing, and git root discovery
file-reference = ["file-reference-syntax", "dep:gix", "dep:walkdir"]

# URL support (automatically enabled by file-reference-syntax)
url = ["dep:url"]

# Remote fetch (off-by-default; gates reqwest and HTTP dependencies)
fetch = ["file-reference", "dep:reqwest", "dep:bytes", "dep:tokio"]

# Delimited text (CSV/TSV) reader (off-by-default; gates csv and csv-core)
delimited = ["dep:csv", "dep:csv-core"]

# Optional features
schema = ["dep:jsonschema"]
full = ["toml", "yaml", "json5", "extract", "lopdf", "pdfium", "schema", "file-reference", "fetch", "delimited"]

[dependencies]
# Core serialization
serde = { version = "1.0", features = ["derive"] }
# `raw_value`: `data_locations` locates a JSON value by its borrowed source slice.
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "2.0"

# Structured logging
tracing = "0.1"

# File type detection
infer = "0.19"

# TOML support (optional, default)
toml = { version = "1.0", optional = true }

# YAML support (optional, default)
serde_yaml_ng = { version = "0.10", optional = true }

# JSON5 support (optional, default)
json-five = { version = "0.3", optional = true }

# Delimited text (CSV/TSV) reader (optional, off by default)
csv = { version = "1.3", optional = true }
csv-core = { version = "0.1.13", optional = true }

# PDF backends
pdf-extract = { version = "0.10", optional = true }
lopdf = { version = "0.39", optional = true }
pdfium-render = { version = "0.8", optional = true }

# File reference resolution
gix = { version = "=0.84.0", optional = true, default-features = false, features = [
    "sha1",
] }
walkdir = { version = "2", optional = true }
globset = { version = "0.4", optional = true }
url = { version = "2.5", optional = true }

# Windows `\\?\` verbatim-prefix stripping (no-op on every other target).
# Unconditional: it serves the resolver's root boundary (`simplify_root`, behind
# `file-reference`) *and* the unfeatured path→text boundary
# (`to_portable_string`), which must build with no default features.
dunce = "1"

# Remote fetch
# default-features = false drops reqwest's system-proxy only; see docs/dependencies.md.
reqwest = { version = "0.13", optional = true, default-features = false, features = ["default-tls", "charset", "http2", "json"] }
bytes = { version = "1", optional = true }
tokio = { version = "1", optional = true, features = ["rt"] }

# Schema validation
jsonschema = { version = "0.55", optional = true }

[dev-dependencies]
biscuit-test-harness = { path = "../../biscuit-test-harness" }
serde_json = "1.0"
toml = "1.0"
serde_yaml_ng = "0.10"
tempfile = "3"
serial_test = "3"
proptest = "1.6"
criterion = { version = "0.5", features = ["html_reports"] }
wiremock = "0.6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
# `test_toolkit::test_layout`, for the layout gate in the `l1` binary.
test-toolkit = { path = "../../tools/test-toolkit" }

[[bench]]
name = "parsers"
harness = false
required-features = ["toml", "yaml", "json5"]

# One test binary per execution contract (tier × exact `required-features`),
# declared explicitly: `autotests = false` above, so a `tests/` file reaches a
# binary only through one of these roots (`2026-09-21-consolidated-test-binaries`).
[[test]]
name = "l1"
path = "tests/l1/main.rs"

[[test]]
name = "l1-fetch"
path = "tests/l1-fetch/main.rs"
required-features = ["fetch"]

[[test]]
name = "l1-delimited"
path = "tests/l1-delimited/main.rs"
required-features = ["delimited"]

# CI policy: the L1 suite runs with `fetch`, which gates the fetch helper unit
# tests and the `l1-fetch` target (wiremock; no external network), and with
# `delimited`, which gates the `l1-delimited` target.
[package.metadata.ci.tests]
features = ["fetch", "delimited"]
# The path lookup guard includes darkmatter-cli's shared engine by `#[path]`
# and spells both files in its test.
source-inputs = ["darkmatter/cli/tests/common/path_lookup_guard.rs", "darkmatter/cli/tests/common/source_scan.rs"]
