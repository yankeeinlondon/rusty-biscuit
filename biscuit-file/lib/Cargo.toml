[package]
name = "biscuit-file"
version = "0.1.0"
edition = "2024"
description = "File format utilities for PDF, TOML, and YAML"
license = "MIT"

[lib]
name = "biscuit_file"
path = "src/lib.rs"
# Disable the default bench harness so `cargo bench` only runs Criterion targets.
bench = false

[features]
default = ["toml", "yaml", "json5", "extract", "lopdf", "file-reference"]

# Format support
toml = ["dep:toml"]
yaml = ["dep:serde_yaml_ng"]
json5 = ["dep:json-five"]

# PDF backends
extract = ["dep:pdf-extract"]
lopdf = ["dep:lopdf"]
pdfium = ["dep:pdfium-render"]

# File reference resolution
file-reference = ["dep:gix", "dep:walkdir", "dep:dirs", "url"]

# URL support (automatically enabled by file-reference)
url = ["dep:url"]

# Remote fetch (off-by-default; gates reqwest and HTTP dependencies)
fetch = ["file-reference", "dep:reqwest", "dep:bytes", "dep:tokio"]

# Optional features
schema = ["dep:jsonschema"]
full = ["toml", "yaml", "json5", "extract", "lopdf", "pdfium", "schema", "file-reference", "fetch"]

[dependencies]
# Core serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# Structured logging
tracing = "0.1"

# File type detection
infer = "0.19"

# TOML support (optional, default)
toml = { version = "1.0", optional = true }

# YAML support (optional, default)
serde_yaml_ng = { version = "0.10", optional = true }

# JSON5 support (optional, default)
json-five = { version = "0.3", optional = true }

# PDF backends
pdf-extract = { version = "0.10", optional = true }
lopdf = { version = "0.39", optional = true }
pdfium-render = { version = "0.8", optional = true }

# File reference resolution
gix = { version = "=0.84.0", optional = true, default-features = false, features = [
    "sha1",
] }
walkdir = { version = "2", optional = true }
url = { version = "2.5", optional = true }

# Cross-platform home directory (Windows-correct, unlike `$HOME` alone)
dirs = { version = "6", optional = true }

# Windows `\\?\` verbatim-prefix stripping (no-op on every other target).
# Unconditional: it serves the resolver's root boundary (`simplify_root`, behind
# `file-reference`) *and* the unfeatured path→text boundary
# (`to_portable_string`), which must build with no default features.
dunce = "1"

# Remote fetch
reqwest = { version = "0.13", optional = true, features = ["json"] }
bytes = { version = "1", optional = true }
tokio = { version = "1", optional = true, features = ["rt"] }

# Schema validation
jsonschema = { version = "0.42", optional = true }

[dev-dependencies]
serde_json = "1.0"
toml = "1.0"
serde_yaml_ng = "0.10"
tempfile = "3"
serial_test = "3"
proptest = "1.6"
criterion = { version = "0.5", features = ["html_reports"] }
wiremock = "0.6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[[bench]]
name = "parsers"
harness = false

[[test]]
name = "fetch_integration"
required-features = ["fetch"]
