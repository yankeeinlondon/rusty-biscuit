# Reviewed implementation mappings, schema version 1.
#
# Validates `messenger/docs/research/implementation/mappings.yaml`. Mappings
# describe Messenger's adapter code, not the platforms, so they live apart
# from the research documents and are reviewed separately. They support
# reporting only and never change `CapabilitySet` or delivery behavior.
#
# Named types live in ../platforms/_types.yaml (`Assessment`, `Fingerprint`).
$schema:
    schema_version: literal(1; required)
    inspected_revision: "Revision(required)@../platforms/_types.yaml"
    fingerprint_algorithm: literal(xxh64; required)
    assessments: "Assessment[](required)@../platforms/_types.yaml"
    "<pattern::^(prompt|hash)$>": any
