[package]
name = "messenger-cli"
version = "0.1.0"
edition = "2024"

[lib]
name = "messenger_cli"
path = "src/lib.rs"

[[bin]]
name = "messenger"
path = "src/main.rs"

[features]
# Platform-specific features (no-ops here; exist for justfile compatibility)
sfx-native-macos = []
sfx-native-windows = []
sfx-native-linux = []

[dependencies]
messenger = { path = "../lib", features = ["discord", "slack", "signal", "whatsapp", "telegram", "desktop"] }
sniff = { path = "../../sniff/lib" }
biscuit-terminal = { path = "../../biscuit-terminal/lib" }
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
inquire = "0.9"
strum = "0.28"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
color-eyre = "0.6"
secrecy = "0.10"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.15"
serial_test = "3"
insta = "1.47"

# CI exclusion: promoted together with the messenger library.
[package.metadata.ci]
gates = false
exclusion-class = "promotion-pending"
owner = "@yankeeinlondon"
reason = "covered only by the bespoke messenger-desktop specialized job, like the messenger library. Promotion is blocked on the canonical just recipe set — messenger/ defines only test and lint."
expiry = "2026-10-31"
