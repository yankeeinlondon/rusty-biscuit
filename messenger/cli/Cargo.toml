[package]
name = "messenger-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "messenger"
path = "src/main.rs"

[features]
# Platform-specific features (no-ops here; exist for justfile compatibility)
sfx-native-macos = []
sfx-native-windows = []
sfx-native-linux = []

[dependencies]
messenger = { path = "../lib", features = ["discord", "slack", "signal", "whatsapp", "telegram"] }
biscuit-terminal = { path = "../../biscuit-terminal/lib" }
clap = { version = "4", features = ["derive"] }
inquire = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
color-eyre = "0.6"
secrecy = "0.10"
dirs = "6"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3.15"
