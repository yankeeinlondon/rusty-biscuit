# PILOT (schema_version 0) -- document shape for Messenger platform research.
#
# Not the accepted contract. Draft for the 2026-09-17 "Schema Pilots" task.
# Named types live in ./_types.yaml (see the note at the top of that file).
#
# Root closure: SimplifiedSchema roots allow unknown keys unless a pattern key
# is present; the `<pattern::...>` entry below admits only the composition
# metadata allowlist and closes the root (probes/p1, p2). `$schema` itself is
# stripped before validation, so it never needs to be listed.
$schema:
    schema_version: literal(0; required)
    platform_id: enum(discord,slack,telegram,whatsapp,signal; required)
    created: date(required)
    last_updated: date(required)
    agent: string(required)
    model: string(required)

    sources: "Source[](min(1); required)@./_types.yaml"
    interfaces: "Interface[](min(1); required)@./_types.yaml"

    api_versions: "ApiVersionFinding[](required)@./_types.yaml"
    chronology: "ChronologyEntry[](required)@./_types.yaml"

    constraints: "Constraint[](required)@./_types.yaml"
    format_profiles: "FormatProfile[](required)@./_types.yaml"
    text_bindings: "TextBinding[](required)@./_types.yaml"
    image_bindings: "ImageBinding[](required)@./_types.yaml"
    role_coverage: "RoleCoverage[](required)@./_types.yaml"

    envelopes: "Envelope[](required)@./_types.yaml"
    errors: "ErrorRecord[](required)@./_types.yaml"
    error_fixtures: "ErrorFixture[](required)@./_types.yaml"

    capabilities: "Capability[](required)@./_types.yaml"

    inbound_bindings: "InboundBinding[](required)@./_types.yaml"
    question_bindings: "QuestionBinding[](required)@./_types.yaml"
    form_bindings: "FormBinding[](required)@./_types.yaml"

    changes: "Change[](required)@./_types.yaml"
    gaps: "Gap[](required)@./_types.yaml"
    requires_messenger_update: boolean(required)
    reason: string

    "<pattern::^(prompt|hash)$>": any
