[package]
name = "messenger"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
pulldown-cmark = "0.13"
reqwest = { version = "0.12", features = ["json", "multipart"], optional = true }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
twilight-http = { version = "0.17", optional = true }
twilight-model = { version = "0.17", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3.15"
wiremock = "0.6"
serial_test = "3"

[features]
default = ["discord", "slack"]
discord = ["dep:twilight-http", "dep:twilight-model", "dep:rustls", "dep:reqwest"]
slack = ["dep:reqwest"]
signal = ["dep:reqwest"]
whatsapp = ["dep:reqwest"]
telegram = ["dep:reqwest"]
