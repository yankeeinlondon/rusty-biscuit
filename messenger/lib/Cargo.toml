[package]
name = "messenger"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
pulldown-cmark = "0.13"
reqwest = { version = "0.12", features = ["json", "multipart"], optional = true }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
twilight-http = { version = "0.17", optional = true }
twilight-model = { version = "0.17", optional = true }
jsonwebtoken = { version = "9", optional = true }
sniff = { path = "../../sniff/lib", optional = true }
tokio = { version = "1", features = ["process", "time"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "4", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
winrt-notification = { version = "0.5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", optional = true }
objc2-user-notifications = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3.15"
wiremock = "0.6"
serial_test = "3"

[features]
default = ["discord", "slack"]
discord = ["dep:twilight-http", "dep:twilight-model", "dep:rustls", "dep:reqwest"]
slack = ["dep:reqwest"]
signal = ["dep:reqwest"]
whatsapp = ["dep:reqwest"]
telegram = ["dep:reqwest"]
desktop = [
    "dep:uuid",
    "dep:notify-rust",
    "dep:winrt-notification",
    "dep:objc2-foundation",
    "dep:objc2-user-notifications",
    "dep:sniff",
    "dep:tokio",
]
apns = ["dep:reqwest", "dep:jsonwebtoken"]
fcm = ["dep:reqwest"]
