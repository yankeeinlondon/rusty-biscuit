[package]
name = "messenger"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
pulldown-cmark = "0.13"
reqwest = { version = "0.12", features = ["json", "multipart"], optional = true }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
twilight-http = { version = "0.17", optional = true }
twilight-model = { version = "0.17", optional = true }
twilight-util = { version = "0.17", optional = true, features = ["builder"] }
jsonwebtoken = { version = "9", optional = true }
sniff = { path = "../../sniff/lib", optional = true }
tokio = { version = "1", features = ["process", "time"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "4", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
winrt-notification = { version = "0.5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", optional = true }
objc2-user-notifications = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3.15"
wiremock = "0.6"
serial_test = "3"

[features]
default = ["discord", "slack"]
discord = ["dep:twilight-http", "dep:twilight-model", "dep:twilight-util", "dep:rustls", "dep:reqwest"]
slack = ["dep:reqwest"]
signal = ["dep:reqwest"]
whatsapp = ["dep:reqwest"]
telegram = ["dep:reqwest"]
desktop = [
    "dep:uuid",
    "dep:notify-rust",
    "dep:winrt-notification",
    "dep:objc2-foundation",
    "dep:objc2-user-notifications",
    "dep:sniff",
    "dep:tokio",
]
apns = ["dep:reqwest", "dep:jsonwebtoken"]
fcm = ["dep:reqwest"]

# Helper-stub binaries used by the desktop helper integration tests.
# They are tiny (only `std`) and only built when the `desktop` feature is
# enabled, so they do not affect the lib's normal compile graph.

[[bin]]
name = "stub_dunstify"
path = "tests/bin/stub_dunstify/main.rs"
required-features = ["desktop"]
test = false
doctest = false
bench = false

[[bin]]
name = "stub_notify_send"
path = "tests/bin/stub_notify_send/main.rs"
required-features = ["desktop"]
test = false
doctest = false
bench = false

[[bin]]
name = "stub_snoretoast"
path = "tests/bin/stub_snoretoast/main.rs"
required-features = ["desktop"]
test = false
doctest = false
bench = false

[[bin]]
name = "stub_burnttoast"
path = "tests/bin/stub_burnttoast/main.rs"
required-features = ["desktop"]
test = false
doctest = false
bench = false

[[bin]]
name = "stub_terminal_notifier"
path = "tests/bin/stub_terminal_notifier/main.rs"
required-features = ["desktop"]
test = false
doctest = false
bench = false

[[bin]]
name = "stub_alerter"
path = "tests/bin/stub_alerter/main.rs"
required-features = ["desktop"]
test = false
doctest = false
bench = false

# CI exclusion: promotion is blocked on the canonical just recipe set. The
# `desktop` feature selection and the Linux D-Bus headers are recorded so a
# promotion changes exactly one field.
[package.metadata.ci]
gates = false
exclusion-class = "promotion-pending"
owner = "@yankeeinlondon"
reason = "564 tests, covered only by the bespoke messenger-desktop specialized job (cargo test, not the canonical recipe, and outside the rollup). Promotion is blocked on the canonical just recipe set — messenger/ defines only test and lint. Its bespoke WSL1 job was deleted 2026-07-27; wsl2-ubuntu coverage arrives with promotion, via _wsl-ci.yml."
expiry = "2026-10-31"

[package.metadata.ci.tests]
features = ["desktop"]

[package.metadata.ci.native]
ubuntu-latest = ["libdbus-1-dev"]
