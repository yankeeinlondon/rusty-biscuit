$schema:
    created: datetime -> an ISO8601 representation of the date and time this review was created (using host's timezone)
    agent: "string -> a string representation of agent and model: `${agent}/${model}`"
    description: string -> description of the review
    parent_scope: string -> the parent of the parent directory (typically something like "reviews", "features", etc.)
    scope: string -> the parent directory in which this review was saved (_this typically helps to scope the review_)
    baseline: string -> the review file (_including the parent directory for scoping purposes_)
    implemented: boolean -> whether the suggestions in this review have been implemented
    follow_up_review: string -> the filename of the review that followed _this_ review to validate whether the suggestions here we actually implemented
