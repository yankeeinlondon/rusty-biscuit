[package]
name = "claudine-catalog-types"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Shared leaf types for the generated Claudine provider catalog"

[lib]
name = "claudine_catalog_types"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"

# Declared rather than defaulted (2026-09-07-faster-claudine-tests, Phase 6).
# This is a leaf type crate: 21 pure serde/strum unit tests, no features, no
# tier above L1, nothing to provision. The values below are the defaults
# `scripts/ci/affected_scope.py` would apply anyway — written out so the route
# is a decision on record instead of an omission.
[package.metadata.ci.tests]
tiers = ["L1"]
features = []
local-features = []
