# SimplifiedSchema for the non-interactive-sessions research topic.
#
# Captures how each provider runs headlessly and emits structured output for
# Claudine's wrapper, stream parser, reporting, and lifecycle machinery.
$schema:
    created: date
    last_updated: date(required)
    agent: string(required)
    model: string(required)

    # Non-interactive invocation forms, such as `-p`, `exec`, `run`, or `--print`.
    invocation: "{ command: string(required), stdin_support: boolean, prompt_arg: string, notes: string }[]"

    # Structured output formats available in non-interactive mode.
    output_formats: "{ name: string(required), cli_value: string(required), stream: boolean, format: enum(json,jsonl,ndjson,sse,text,other; required), description: string, side_effects: string }[]"

    # Formal or informal schema sources for the structured stream/output.
    schema_sources: "{ url: string, schema_type: enum(json_schema,openapi,typescript,rust,protobuf,examples,none,other; required), formal: boolean(required), notes: string }[]"

    # CLI flags that affect headless execution or structured output.
    cli_params: "{ flag: string(required), value: string, description: string(required), example: string }[]"

    # Event families visible in structured output.
    stream_events: "{ event: string(required), category: enum(session,assistant,reasoning,tool_call,tool_result,file_change,plan,usage,error,permission,subagent,other; required), fields: string[], notes: string }[]"

    # Built-in tools and how their calls/results appear in headless streams.
    tools: "{ name: string(required), call_visible: boolean, result_visible: boolean, metadata: string[], notes: string }[]"

    # Known states Claudine wants to detect from non-interactive output.
    use_cases: "{ name: enum(plan_cap_approaching,plan_capped,no_funds,auth,permission_read_denied,permission_write_denied,tokens_consumed,model_used,human_in_loop,subagent_prompt_injection,other; required), detectable: boolean(required), event_types: string[], fields: string[], hook_parity: string, notes: string }[]"

    # Non-interactive failure and blocking behavior.
    headless_constraints: "{ constraint: string(required), mitigation: string, notes: string }[]"

    docs: url
    data_format: enum(json,jsonl,ndjson,sse,text,other)
    changes: string[]
    requires_claudine_update: boolean(required)
    reason: string
