# Research contract for the agent-cli topic, revision 2.
#
# Captures the public CLI surface that Claudine wrappers and provider metadata
# need: version and documentation links, the typed switch inventory,
# subcommands, configuration discovery, and platform packaging. Every object
# shape is a named type, in ./_types.yaml or ../_types.yaml.
#
# Revision 2 types the switch inventory (`cli_switch@./_types.yaml`) so
# `claudine-gen` can project it into the compiled catalog. Every document is
# at revision 2, so no frozen `_schema.r<N>.yaml` is kept; before the next
# revision change, copy this file to `_schema.r2.yaml`.
$schema:
    schema_revision: literal(2; required) -> Revision of this research contract; a document written for another revision is validated against that revision's frozen contract, and its switches generate as unknown
    provider: identifier(required)@../_types.yaml -> Roster slug of the provider this document describes
    created: date(required) -> Date this document was first written; kept unchanged on refresh
    last_updated: date(required) -> Date of the research run that produced this version
    contract_checked: date -> Date the fleet last confirmed this document satisfies the contract; written by the fleet after validation and never by the researcher
    agent: research_agent(required)@../_types.yaml -> Agentic CLI that performed the research, which the fleet checks against its assignment
    model: research_model(required)@../_types.yaml -> Model that performed the research, recorded so findings can be weighed by who produced them
    reasoning_effort: research_effort(required)@../_types.yaml -> Reasoning effort the research itself ran with
    latest_version: string(required; pattern(^[0-9]+[.][0-9]+[.][0-9]+[0-9A-Za-z.+-]*$|^unknown$)) -> Newest released version found upstream, or unknown when no release channel states one
    versions_examined: version[](required)@../_types.yaml -> Provider versions whose help output, documentation, or source the switch records were established from
    evidence: evidence[](required)@../_types.yaml -> Every source a switch record rests on, cited by its evidence_ids

    homepage: url(required) -> The provider's product page for the CLI
    repo: url -> Source repository, absent when the CLI is closed source
    docs: url(required) -> Entry page of the provider's general documentation
    cli_docs: url -> Page documenting the command-line reference, absent when the provider publishes none

    binaries: binary_record[](required; min(1))@./_types.yaml -> The command name on each operating system, one record per operating system
    install_methods: install_method[](required)@./_types.yaml -> Each documented way to install the CLI, one record per operating system and method
    subcommands: subcommand[](required)@./_types.yaml -> Every native command path below the executable; empty when the CLI has none

    cli_switches: cli_switch[](required)@./_types.yaml -> Full CLI switch inventory, one record per switch and command path set; empty only when cli_switches_gap explains why
    cli_switches_gap: string(not-empty) -> Why the switch inventory could not be established and the check that would establish it; present exactly when cli_switches is empty

    config_paths: config_path[](required)@./_types.yaml -> Configuration files the CLI discovers, one record per operating system and file
    env_vars: env_var[](required)@./_types.yaml -> General CLI and runtime variables; variables owned by the model-config, agent-permissions, mcp, agent-logging, or streaming topics belong there
    machine_introspection: introspection_command[](required)@./_types.yaml -> Commands that report provider state a program can use, such as model catalogs, configuration dumps, or doctor checks; plain help and version output is listed only when it has a machine-readable mode
    wrapper_notes: string(not-empty)[](required) -> Caveats a wrapper author must handle, such as noisy stderr on success, terminal requirements, quoting hazards, or configuration side effects

    changes: string(not-empty)[](required) -> What changed in this document since the previous version
    requires_claudine_update: boolean(required) -> Whether a finding here means Claudine's code or metadata must change
    reason: string(required; not-empty) -> Why Claudine does or does not need to change
