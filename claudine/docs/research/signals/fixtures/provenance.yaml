# Fixture provenance manifest — one entry per file under fixtures/ (relative
# path from this directory). CI-enforced by `gen/tests/fixtures_provenance.rs`:
# every fixture file must have exactly one entry, every entry must point at an
# existing file, `class` must be one of the four values below, and `source`
# must be non-empty. `README.md`, `.gitkeep`, and this manifest are not
# fixtures and carry no entries.
#
# Provenance classes (ruling 2026-07-06):
#
#   capture      — real wire/live-run bytes captured from an actual provider
#                  session. `source` records "live capture <date>".
#   test_vector  — originates from claudine's committed parser test data (the
#                  2026-07-05 seed pass): inline Rust test payloads unescaped
#                  to the real wire line, or verbatim/curated copies of
#                  committed fixture files. `source` is the repo path + line.
#   source_shape — synthesized byte-shape verified VERBATIM against pinned
#                  provider source. Legitimate ONLY when labeled as such here.
#                  `source` is the provider repo + pinned commit/tag.
#   docs_example — verbatim from official provider documentation. `source` is
#                  the URL.
#
# Rule: a fixture you typed from memory is not evidence — `source_shape`
# requires verbatim verification against pinned source. Anything less is
# fabrication and must not enter this corpus.
#
# Path shorthand for test_vector sources: `protocol/` and `providers/` mean
# `claudine/lib/src/stream/protocol/` and `claudine/lib/src/stream/providers/`;
# `errors.rs` means `claudine/lib/src/stream/logs/opencode/errors.rs`;
# `lib/tests/...` means `claudine/lib/tests/...`. Line numbers are as of the
# 2026-07-05 seed pass.

