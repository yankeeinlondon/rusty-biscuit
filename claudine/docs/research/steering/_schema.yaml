# Revision 3 research contract. Shape validation is only the first gate;
# _fleet.md defines relational, coverage, and evidence review.
$schema:
    schema_revision: literal(3; required)
    receipt_observations: "{ mechanism_id: string(required), timing: enum(early,terminal,multi_phase,none,unknown; required), signal: string(required), evidence_ids: string[](required) }[](required)"
