    discovery_gaps: "{ profile_id: string(required), os: enum(macos,linux,windows; required), origin: enum(native,claudine; required), launch_mode: enum(interactive,non_interactive; required), session_state: enum(working,idle; required), detail: string(required), next_check: string(required) }[](required)"
    provider: string(required)
    created: date(required)
    last_updated: date(required)
    agent: string(required)
    model: string(required)
    reasoning_effort: literal(low; required)
    versions_examined: string[](required)
    launch_profiles: "{ id: string(required), description: string(required), endpoint_scope: enum(internal,externally_reachable,retained_stdio,extension,none,unknown; required), lifetime: enum(one_shot,while_client_open,long_lived,provider_managed,unknown; required), applicable_os: enum(macos,linux,windows)[](required), applicable_launch_modes: enum(interactive,non_interactive)[](required), applicable_origins: enum(native,claudine)[](required), baseline: boolean(required), startup_requirements: string[](required), preserves_extensions: enum(yes,no,partial,unknown; required), preserves_skills: enum(yes,no,partial,unknown; required), preserves_templates: enum(yes,no,partial,unknown; required), preserves_context: enum(yes,no,partial,unknown; required), evidence_ids: string[](required) }[](required)"
    access_findings: "{ mechanism_id: string(required), profile_id: string(required), os: enum(macos,linux,windows; required), status: enum(available,setup_required,blocked,unknown; required), prerequisite: string(required), applies_to_existing_sessions: enum(yes,no,unknown; required), evidence_ids: string[](required) }[](required)"
    delivery_states: "{ mechanism_id: string(required), states: enum(accepted,queued,held,delivered,refused,expired,unknown)[](required), observable_by_external_sender: enum(yes,partial,no,unknown; required), correlation: string(required), evidence_ids: string[](required) }[](required)"
    receipt_guarantees: "{ mechanism_id: string(required), request_acceptance: enum(confirmed,rejected,unknown; required), persistence: enum(confirmed,not_persisted,unknown; required), scheduling: enum(confirmed,not_scheduled,unknown; required), conversation_delivery: enum(confirmed,not_delivered,unknown; required), provider_signals: string[](required), correlation: enum(request_id,message_id,operation_id,none,unknown; required), evidence_ids: string[](required), limitations: string(required) }[](required)"
    evidence: "{ id: string(required), method: enum(official_docs,source_code,local_inspection,disposable_test,inference; required), location: string(required), version: string(required), observed_on: date(required), claim: string(required), limitations: string(required) }[](required)"
    discovery: "{ id: string(required), profile_id: string(required), os: enum(macos,linux,windows; required), origin: enum(native,claudine; required), method: enum(provider_registry,provider_api,process_inspection,claudine_registration,other; required), locator: string(required), identity_check: string(required), liveness_check: string(required), state_detection: string(required), observation_source: string(required), observed_at: string(required), available_labels: string[](required), prerequisites: string[](required), evidence_ids: string[](required) }[](required)"
    mechanisms: "{ id: string(required), interface_status: enum(documented,undocumented,unknown; required), maturity: enum(stable,experimental,provider_unsupported,unknown; required), transport: enum(unix_socket,named_pipe,http,websocket,stdio,hook,extension,other,unknown; required), initialization: string(required), operation_intent: enum(steer_active_turn,start_idle_turn,interrupt_then_submit,queue_follow_up,unknown; required), conversation_effect: enum(preserve_running_turn,cancel_turn_same_conversation,resume_same_conversation,new_conversation,unknown; required), delivery_boundary: enum(during_generation,next_tool_boundary,end_of_tool_batch,next_turn,idle_turn_start,unknown; required), destination: string(required), authentication: string(required), startup_requirements: string[](required), target_preconditions: string[](required), target_guards: string[](required), request_framing: string(required), response_framing: string(required), request_format: string(required), response_format: string(required), long_tool_behavior: string(required), tool_batch_behavior: enum(continue_all,stop_remaining,provider_defined,not_applicable,unknown; required), queue_behavior: string(required), message_interpretation: enum(literal,skills_templates,extension_command,input_extension,provider_defined,unknown; required), interruption_phases: string[](required), interruption_partial_failure: string(required), ordering: string(required), sender_message_id: enum(supported,unsupported,unknown; required), retry_policy: enum(safe_same_id,unsafe_possible_duplicate,never_retry,unknown; required), duplicate_handling: string(required), cancellation: string(required), limits: string(required), evidence_ids: string[](required) }[](required)"
    compatibility: "{ mechanism_id: string(required), profile_id: string(required), os: enum(macos,linux,windows; required), versions_verified: string[](required), documented_version_bounds: string(required), read_only_check: string(required), success_criteria: string(required), failure_behavior: string(required), evidence_ids: string[](required) }[](required)"
    verification: "{ mechanism_id: string(required), profile_id: string(required), os: enum(macos,linux,windows; required), provider_version: string(required), launch_mode: enum(interactive,non_interactive; required), origin: enum(native,claudine; required), session_state: enum(working,idle; required), outcome: enum(passed,failed,inconclusive; required), tested_on: date(required), fixture: string(required), assertions: string[](required), limitations: string(required), evidence_ids: string[](required) }[](required)"
    cases: "{ profile_id: string(required), os: enum(macos,linux,windows; required), launch_mode: enum(interactive,non_interactive; required), origin: enum(native,claudine; required), session_state: enum(working,idle; required), support: enum(non_interrupting,interruption_required,unsupported,unknown; required), discovery_ids: string[](required), mechanism_ids: string[](required), prerequisites: string[](required), evidence_ids: string[](required), reason: string(required) }[](required)"
    gaps: "{ area: string(required), detail: string(required), next_check: string(required) }[](required)"
    changes: string[](required)
    requires_claudine_update: boolean(required)
    reason: string(required)
