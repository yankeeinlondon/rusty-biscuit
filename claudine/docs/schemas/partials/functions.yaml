kind: schema
# Draft function contracts for review during 2026-09-16-expression-type-system.
# These declarations target the shared argument-conversion layer, not today's
# runtime. M1 adopts shared conversions; M2 rejects implicit null propagation.
# Behavior metadata carries the settled exceptions shared by runtime and DMLS.
# Parameters describe handler inputs. Shared conversion happens before invocation;
# `any` preserves the original value. Optional `?:` permits omission, not null.
# `fallible` means the operation can fail after valid arguments are supplied;
# argument-count, type, and constraint errors do not alone require it.
# When categories are declared, every category used below must be listed here.
categories:
    - |-
        Type Predicates ->
        Guard clauses that answer _“what is this value?”_. Inspecting predicates accept `any` unchanged and test its original type or shape.
        Sign predicates require a number and use the shared numeric conversion rules.
    - Math -> Numeric comparisons, absolute values, and rounding.
    - Collection -> Array selection, object membership, and size.
    - Type Conversion -> Explicitly request a converted result.
    - String Predicates -> Test string contents.
    - String Mutations -> Change case, affixes, and literal substrings.
    - Rendering
    - Date Formatting
    - Date Validators
    - Date Arithmetic
    - Logical
    - Filesystem
    - Context
    - List Formatting
    - Devops
    - Git
    - CI/CD
    - Shell
    - Agentic CLIs
    - Repository
    - Network
    - Composition
behavior:
    number:
        numeric_recovery: {argument: x, fallback: fallback}
    round:
        numeric_recovery: {argument: x, fallback: fallback}
    length:
        reject_sources: {x: [boolean]}
    file_exists:
        advisory_file: value
        true_facts: [{argument: value, suitable_for: file}]
    is_file_type:
        true_facts: [{argument: value, suitable_for: file}]
    is_string:
        true_facts: [{argument: x, suitable_for: string}]
    is_number:
        true_facts: [{argument: x, suitable_for: number}]
    is_integer:
        true_facts: [{argument: val, suitable_for: number}]
    is_array:
        true_facts: [{argument: x, suitable_for: 'any[]'}]
    is_object:
        true_facts: [{argument: x, suitable_for: object}]
    is_null:
        true_facts: [{argument: x, suitable_for: 'null'}]
    and:
        evaluation: short-circuit-and
    or:
        evaluation: short-circuit-or
types:
    is_string: |-
        function(
            parameters(x: any);
            returns(boolean);
            category(Type Predicates);
        ) -> Returns true when the original value is a string.
    is_number: |-
        function(
            parameters(x: any);
            returns(boolean);
            category(Type Predicates);
        ) -> Returns true when the original value is a number.
    is_array: |-
        function(
            parameters(x: any);
            returns(boolean);
            category(Type Predicates);
        ) -> Returns true when the original value is an array.
    is_null: |-
        function(
            parameters(x: any);
            returns(boolean);
            category(Type Predicates);
        ) -> Returns true when the value is null.
    is_object: |-
        function(
            parameters(x: any);
            returns(boolean);
            category(Type Predicates);
        ) -> Returns true when the original value is an object.
    is_empty: |-
        function(
            parameters(x: any);
            returns(boolean);
            category(Type Predicates);
        ) -> Returns true for null, an empty string, an empty array, or an object with no keys.
    is_positive: |-
        function(
            parameters(val: number);
            returns(boolean);
            category(Type Predicates);
        ) -> Returns true when the number is greater than zero.
    is_negative: |-
        function(
            parameters(val: number);
            returns(boolean);
            category(Type Predicates);
        ) -> Returns true when the number is less than zero.
    is_integer: |-
        function(
            parameters(val: any);
            returns(boolean);
            category(Type Predicates);
        ) -> Returns true when the original value is a number with no fractional part.
    min: |-
        function(
            parameters(a: number, b: number);
            returns(number);
            category(Math);
            example('min("4", 5)', '4');
        ) -> Returns the smaller of two numbers.
    max: |-
        function(
            parameters(a: number, b: number);
            returns(number);
            category(Math);
        ) -> Returns the larger of two numbers.
    abs: |-
        function(
            parameters(x: number);
            returns(number);
            category(Math);
        ) -> Returns the absolute value of a number.
    # M14: Use the shared numeric conversion/fallback contract, then round.
    round: |-
        function(
            parameters(x: numberlike, fallback?: number);
            returns(number);
            category(Math);
            example('round("pear", 2.7)', '3');
        ) -> Converts the value to a number, using the supplied fallback if needed, then rounds to the nearest whole number. Halfway values round away from zero.
    first: |-
        function(
            parameters(x: any[]);
            returns(any);
            category(Collection);
        ) -> Returns the first array element unchanged, or null for an empty array.
    last: |-
        function(
            parameters(x: any[]);
            returns(any);
            category(Collection);
        ) -> Returns the last array element unchanged, or null for an empty array.
    has_key: |-
        function(
            parameters(obj: object, key: string);
            returns(boolean);
            category(Collection);
        ) -> Tests whether the object has the exact top-level key, including a key whose value is null. Dots in the key are literal; this does not traverse nested properties.
    contains: |-
        function(
            parameters(haystack: string | any[] | object, needle: any);
            returns(boolean);
            category(Collection);
        ) -> Searches strings for a case-sensitive substring, arrays for an element, and objects for a value, comparing rendered text. Thus [4] contains "4". Use has_key to test object keys.
    # M11: Reject boolean source values before shared string conversion.
    # The compiled contract must retain this explicit input exclusion.
    length: |-
        function(
            parameters(x: string | number | any[] | object);
            returns(number(integer; min(0)));
            category(Collection);
        ) -> Counts string characters, array elements, object keys, or characters in a number's displayed text. Booleans and null are rejected.
    # M12: A valid supplied fallback handles any failure to use x as a number.
    # Recovery consumes the shared coercion result; invalid x never reaches a handler.
    # M13: Failed conversion without a fallback returns the coercion error.
    number: |-
        function(
            parameters(x: numberlike, fallback?: number);
            returns(number);
            category(Type Conversion);
            example('number("pear", 7)', '7');
        ) -> Converts a number or numeric text to a number, using the supplied fallback if conversion fails.
    starts_with: |-
        function(
            parameters(x: string, find: string);
            returns(boolean);
            category(String Predicates);
        ) -> Returns true when the string starts with the given prefix (case-sensitive).
    ends_with: |-
        function(
            parameters(x: string, find: string);
            returns(boolean);
            category(String Predicates);
        ) -> Returns true when the string ends with the given suffix (case-sensitive).
    lower: |-
        function(
            parameters(x: string);
            returns(string);
            category(String Mutations);
        ) -> Applies Unicode lowercase conversion to the string.
    upper: |-
        function(
            parameters(x: string);
            returns(string);
            category(String Mutations);
        ) -> Applies Unicode uppercase conversion to the string.
    capitalize: |-
        function(
            parameters(x: string);
            returns(string);
            category(String Mutations);
        ) -> Uppercases the first Unicode character and leaves the remainder unchanged. An empty string stays empty.
    kebab_case: |-
        function(
            parameters(x: string);
            returns(string);
            category(String Mutations);
        ) -> Splits at separators and case boundaries, then produces lowercase words joined by hyphens.
    snake_case: |-
        function(
            parameters(x: string);
            returns(string);
            category(String Mutations);
        ) -> Splits at separators and case boundaries, then produces lowercase words joined by underscores.
    camel_case: |-
        function(
            parameters(x: string);
            returns(string);
            category(String Mutations);
        ) -> Splits at separators and case boundaries, then produces lower camelCase.
    pascal_case: |-
        function(
            parameters(x: string);
            returns(string);
            category(String Mutations);
        ) -> Splits at separators and case boundaries, then produces PascalCase.
    title_case: |-
        function(
            parameters(x: string);
            returns(string);
            category(String Mutations);
        ) -> Splits at separators and case boundaries, then produces capitalized words separated by spaces.
    without_date: |-
        function(
            parameters(string: string);
            returns(string);
            category(String Mutations);
        ) -> Removes substrings that are real YYYY-MM-DD calendar dates, leaving surrounding text untouched.
    ensure_leading: |-
        function(
            parameters(var: string | number, prefix: string | number);
            returns(string | number);
            category(String Mutations);
        ) -> Ensures the text form starts with prefix, preserving an already matching value. Added numeric affixes preserve a numeric value when the combined text is representable.
    ensure_trailing: |-
        function(
            parameters(var: string | number, postfix: string | number);
            returns(string | number);
            category(String Mutations);
        ) -> Ensures the text form ends with postfix, preserving an already matching value. Added numeric affixes preserve a numeric value when the combined text is representable.
    replace: |-
        function(
            parameters(x: string, find: string, replacement: string);
            returns(string);
            category(String Mutations);
        ) -> Replaces every literal occurrence of a substring; empty find is a no-op.
    replace_first: |-
        function(
            parameters(x: string, find: string, replacement: string);
            returns(string);
            category(String Mutations);
        ) -> Replaces the first literal occurrence of a substring; empty find is a no-op.
    replace_last: |-
        function(
            parameters(x: string, find: string, replacement: string);
            returns(string);
            category(String Mutations);
        ) -> Replaces the last literal occurrence of a substring; empty find is a no-op.
    terminal: |-
        function(
            parameters(content: string);
            returns(string);
            category(Rendering);
        ) -> Renders Prose markup as styled terminal text with supported hyperlinks.
    date: |-
        function(
            parameters(iso: string, fmt: string);
            returns(string);
            category(Date Formatting);
            fallible;
        ) -> Formats an ISO date or datetime for display. Supported formats are "MMMM Do" (alias "short"), "MMMM Do [YYYY]" ("short-optional"), "MMMM Do YYYY", "D MMMM [YYYY]", "D MMMM YYYY", and "ddd, MMMM Do, YYYY" ("long"). [YYYY] omits the current local year. Invalid dates and unsupported formats are errors.
    is_date: |-
        function(
            parameters(x: any);
            returns(boolean);
            category(Date Validators);
        ) -> Returns true for a string containing a valid YYYY-MM-DD date.
    is_date_utc: |-
        function(
            parameters(x: any);
            returns(boolean);
            category(Date Validators);
        ) -> Returns true for a string containing a valid YYYY-MM-DD date.
    is_date_time: |-
        function(
            parameters(x: any);
            returns(boolean);
            category(Date Validators);
        ) -> Returns true for a string containing a valid ISO datetime.
    is_date_time_utc: |-
        function(
            parameters(x: any);
            returns(boolean);
            category(Date Validators);
        ) -> Returns true for a string containing a valid ISO datetime.
    is_today: |-
        function(
            parameters(x: any);
            returns(boolean);
            category(Date Validators);
        ) -> Tests whether an ISO date or datetime falls in today, using local time; invalid values return false.
    is_today_utc: |-
        function(
            parameters(x: any);
            returns(boolean);
            category(Date Validators);
        ) -> Tests whether an ISO date or datetime falls in today, using UTC; invalid values return false.
    is_yesterday: |-
        function(
            parameters(x: any);
            returns(boolean);
            category(Date Validators);
        ) -> Tests whether an ISO date or datetime falls in yesterday, using local time; invalid values return false.
    is_yesterday_utc: |-
        function(
            parameters(x: any);
            returns(boolean);
            category(Date Validators);
        ) -> Tests whether an ISO date or datetime falls in yesterday, using UTC; invalid values return false.
    is_tomorrow: |-
        function(
            parameters(x: any);
            returns(boolean);
            category(Date Validators);
        ) -> Tests whether an ISO date or datetime falls in tomorrow, using local time; invalid values return false.
    is_tomorrow_utc: |-
        function(
            parameters(x: any);
            returns(boolean);
            category(Date Validators);
        ) -> Tests whether an ISO date or datetime falls in tomorrow, using UTC; invalid values return false.
    is_this_month: |-
        function(
            parameters(x: any);
            returns(boolean);
            category(Date Validators);
        ) -> Tests whether an ISO date or datetime falls in the current month and year, using local time; invalid values return false.
    is_this_month_utc: |-
        function(
            parameters(x: any);
            returns(boolean);
            category(Date Validators);
        ) -> Tests whether an ISO date or datetime falls in the current month and year, using UTC; invalid values return false.
    is_this_year: |-
        function(
            parameters(x: any);
            returns(boolean);
            category(Date Validators);
        ) -> Tests whether an ISO date or datetime falls in the current year, using local time; invalid values return false.
    is_this_year_utc: |-
        function(
            parameters(x: any);
            returns(boolean);
            category(Date Validators);
        ) -> Tests whether an ISO date or datetime falls in the current year, using UTC; invalid values return false.
    date_delta: |-
        function(
            parameters(date1: string, date2: string, diff: string);
            returns(boolean);
            category(Date Arithmetic);
            fallible;
        ) -> Returns true when the two dates are at least the given duration apart, ignoring order (duration like 14d, 2mo, 1 hour).
    older_than: |-
        function(
            parameters(date1: string, date2: string, diff: string);
            returns(boolean);
            category(Date Arithmetic);
            fallible;
        ) -> Returns true when date1 is at least the given duration older (earlier) than date2.
    newer_than: |-
        function(
            parameters(date1: string, date2: string, diff: string);
            returns(boolean);
            category(Date Arithmetic);
            fallible;
        ) -> Returns true when date1 is at least the given duration newer (later) than date2.
    and: |-
        function(
            parameters(...values: any);
            returns(boolean);
            category(Logical);
        ) -> Logical AND of all arguments. Short-circuits on first _falsy_ value.
    or: |-
        function(
            parameters(...values: any);
            returns(boolean);
            category(Logical);
        ) -> Logical OR of all arguments. Short-circuits on first _truthy_ value.
    absolute: |-
        function(
            parameters(file: file);
            returns(file);
            category(Filesystem);
            fallible;
        ) -> Resolves a file path to an absolute path.
    relative: |-
        function(
            parameters(file: file);
            returns(file);
            category(Filesystem);
            fallible;
        ) -> Returns a best-effort relative path from the document base directory.
    file_exists: |-
        function(
            parameters(value: string | file | null);
            returns(boolean);
            category(Filesystem);
            fallible;
        ) -> Tests local existence or an allowed remote fetch. Null, unsupported inputs, and malformed references return false; remote evaluation requires a supported context.
    frontmatter:
        - |-
            function(
                parameters(file: file);
                returns(object);
                category(Filesystem);
                fallible;
            ) -> Reads the frontmatter of a Markdown file as an object.
        - |-
            function(
                parameters(file: file, prop: string);
                returns(any);
                category(Filesystem);
                fallible;
            ) -> Reads a single property from the frontmatter of a Markdown file.
    markdown_body_empty: |-
        function(
            parameters(file: file);
            returns(boolean);
            category(Filesystem);
            fallible;
        ) -> Returns true when the Markdown body has only whitespace.
    markdown_title: |-
        function(
            parameters(file: file);
            returns(string | null);
            category(Filesystem);
            fallible;
        ) -> Returns the string-valued frontmatter title, otherwise the first H1, or null if neither exists. Multiple H1 headings produce a warning.
    validate_schema:
        - |-
            function(
                parameters(file: file);
                returns(boolean);
                category(Filesystem);
                fallible;
            ) -> Reads a Markdown document and validates its frontmatter against its declared schema. Returns false for validation failures and true when no schema is declared. File-loading and schema-processing failures are errors.
        - |-
            function(
                parameters(file: file, obj: object);
                returns(boolean);
                category(Filesystem);
                fallible;
            ) -> Merges obj into the page's frontmatter, then validates the combined frontmatter against its schema.
    is_indexed_file: |-
        function(
            parameters(file: file);
            returns(boolean);
            category(Filesystem);
            fallible;
        ) -> Returns true when the filename stem matches the indexed grammar (base-NNN).
    file_index: |-
        function(
            parameters(file: file);
            returns(number);
            category(Filesystem);
            fallible;
        ) -> Returns the parsed index suffix, or -1 when non-indexed.
    increment_file_index: |-
        function(
            parameters(file: file);
            returns(file);
            category(Filesystem);
            fallible;
        ) -> Increments the numeric index suffix, preserving zero-padding width.
    decrement_file_index: |-
        function(
            parameters(file: file);
            returns(file);
            category(Filesystem);
            fallible;
        ) -> Decrements the numeric index suffix, clamped at 0.
    find_first_index: |-
        function(
            parameters(file: file);
            returns(file);
            category(Filesystem);
            fallible;
        ) -> Returns the lowest-indexed existing sibling in the file's directory, with the unindexed base sorting first; returns the input when the family has no existing member.
    find_last_index: |-
        function(
            parameters(file: file);
            returns(file);
            category(Filesystem);
            fallible;
        ) -> Returns the highest-indexed existing sibling in the file's directory; returns the input when the family has no existing member.
    basename: |-
        function(
            parameters(file: file);
            returns(string);
            category(Filesystem);
            fallible;
        ) -> Returns the final path component including extension.
    basename_without_index: |-
        function(
            parameters(file: file);
            returns(string);
            category(Filesystem);
            fallible;
        ) -> Returns the basename with any indexed suffix removed from the stem.
    dirname: |-
        function(
            parameters(file: file);
            returns(string);
            category(Filesystem);
            fallible;
        ) -> Returns the directory portion of the display path.
    ext: |-
        function(
            parameters(file: file);
            returns(string);
            category(Filesystem);
            fallible;
        ) -> Returns the final extension without the leading dot.
    parent_dir: |-
        function(
            parameters(file: file);
            returns(string);
            category(Filesystem);
            fallible;
        ) -> Returns the directory segment immediately above the basename.
    file_trailing: |-
        function(
            parameters(file: file);
            returns(string);
            category(Filesystem);
            fallible;
        ) -> Returns the last directory segment plus the basename.
    dir_leading: |-
        function(
            parameters(file: file);
            returns(string);
            category(Filesystem);
            fallible;
        ) -> Returns the directory path above the last directory segment, dropping the basename and its parent (the complement of file_trailing).
    join: |-
        function(
            parameters(left: string, right: string);
            returns(string);
            category(Filesystem);
            fallible;
        ) -> Joins local path strings with normalized separators; HTTP(S) arguments are invalid.
    link:
        - |-
            function(
                parameters(file: file);
                returns(string);
                category(Filesystem);
                fallible;
            ) -> Creates a Markdown link to a local file, using its relative path as the link text.
        - |-
            function(
                parameters(target: file, desc: string);
                returns(string);
                category(Filesystem);
                fallible;
            ) -> Creates a Markdown link to a local file or HTTP(S) URL with the given link text.
    has_command: |-
        function(
            parameters(cmd: any);
            returns(boolean);
            category(Filesystem);
        ) -> Tests whether a string names a command on PATH or an executable absolute path; other values return false.
    has_skill: |-
        function(
            parameters(name: string);
            returns(boolean);
            category(Context);
            fallible;
        ) -> Returns true when a skill directory exists in a user-scoped or local-scoped skill root.
    has_local_skill: |-
        function(
            parameters(name: string);
            returns(boolean);
            category(Context);
            fallible;
        ) -> Returns true when a skill directory exists in a local-scoped skill root.
    as_line_separated: |-
        function(
            parameters(list: any[]);
            returns(string);
            category(List Formatting);
        ) -> Joins the rendered array elements with newlines. Null elements render as empty text.
    as_csv: |-
        function(
            parameters(list: any[]);
            returns(string);
            category(List Formatting);
        ) -> Joins rendered array elements with a comma and space, without CSV escaping.
    as_tsv: |-
        function(
            parameters(list: any[]);
            returns(string);
            category(List Formatting);
        ) -> Joins rendered array elements with tabs, without escaping tabs or newlines.
    as_space_separated: |-
        function(
            parameters(list: any[]);
            returns(string);
            category(List Formatting);
        ) -> Joins the rendered array elements with spaces. Null elements render as empty text.
    as_unordered_list: |-
        function(
            parameters(list: any[]);
            returns(string);
            category(List Formatting);
        ) -> Renders a list as a Markdown unordered list, auto-nesting nested arrays and object-array shapes as indented sublists.
    as_ordered_list: |-
        function(
            parameters(list: any[]);
            returns(string);
            category(List Formatting);
        ) -> Renders a list as a Markdown ordered list, auto-nesting nested arrays and object-array shapes as indented sublists.
    as_json: |-
        function(
            parameters(list: any[]);
            returns(string);
            category(List Formatting);
        ) -> Serializes the array as compact JSON.
    as_json5: |-
        function(
            parameters(list: any[]);
            returns(string);
            category(List Formatting);
        ) -> Serializes the array as single-line JSON5 with single-quoted strings and unquoted identifier keys.
    predict_conflicts: |-
        function(
            parameters(branch: string);
            returns(string[]);
            category(Git);
            fallible;
        ) -> Returns the repository-relative paths that would conflict if the named local branch were merged into the caller's current branch.
    branch_exists_on_remote:
        - |-
            function(
                parameters(void);
                returns(boolean);
                category(Git);
                fallible;
            ) -> Returns whether the current branch exists in the preferred remote's live ref advertisement or authoritative provider API.
        - |-
            function(
                parameters(branch: string);
                returns(boolean);
                category(Git);
                fallible;
            ) -> Returns whether an exact branch exists in the preferred remote's live ref advertisement or authoritative provider API.
        - |-
            function(
                parameters(branch: string, remote: string);
                returns(boolean);
                category(Git);
                fallible;
            ) -> Returns whether an exact branch exists in the named remote's live ref advertisement or authoritative provider API.
    remote_vendor: |-
        function(
            parameters(remote?: string);
            returns(enum("", github, gitlab, gitea, forgejo, bitbucket, azure_devops, aws_code_commit, source_hut));
            category(Git);
            fallible;
        ) -> Returns the configured remote's provider token, or an empty string if unknown. Omission selects the preferred remote; permitted discovery may probe ambiguous servers.
    pr: |-
        function(
            parameters(id: number(integer; min(1)) | string(min-length(1)));
            returns(string);
            category(Devops);
            fallible;
        ) -> Fetches a pull or merge request by positive number, decimal identifier text, or canonical HTTP(S) request URL, and renders Markdown.
    pr_list:
        - |-
            function(
                parameters(query: object);
                returns(string[]);
                category(Devops);
                fallible;
            ) -> Queries pull or merge requests with the canonical bounded filter vocabulary. See the Darkmatter provider query vocabulary for keys, enum values, defaults, and bounds.
        - |-
            function(
                parameters(count: number(integer; min(1); max(100)));
                returns(string[]);
                category(Devops);
                fallible;
            ) -> Returns the newest `count` open pull or merge requests.
    cicd: |-
        function(
            parameters(id: number(integer; min(1)) | string(min-length(1)));
            returns(string);
            category(CI/CD);
            fallible;
        ) -> Fetches a CI/CD job by positive number or nonempty, nonzero provider identifier, and renders Markdown.
    cicd_list:
        - |-
            function(
                parameters(query: object);
                returns(string[]);
                category(CI/CD);
                fallible;
            ) -> Queries CI/CD jobs with bounded direct listing or parent-execution traversal. See the Darkmatter provider query vocabulary for keys, enum values, defaults, and bounds.
        - |-
            function(
                parameters(count: number(integer; min(1); max(100)));
                returns(string[]);
                category(CI/CD);
                fallible;
            ) -> Returns the newest `count` CI/CD jobs of any status.
    is_file_type: |-
        function(
            parameters(value: any);
            returns(boolean);
            category(Type Predicates);
        ) -> Tests whether the original value is a structurally valid file reference, without resolving it or checking existence.
    has_binary: |-
        function(
            parameters(name_or_path: any);
            returns(boolean);
            category(Filesystem);
        ) -> Tests whether a string names a command on PATH or an executable absolute path; other values return false.
    has_alias: |-
        function(
            parameters(name: any);
            returns(boolean);
            category(Shell);
        ) -> Tests whether a string names a login-shell alias. Other values and probe failures return false.
    has_builtin_function: |-
        function(
            parameters(name: any);
            returns(boolean);
            category(Shell);
        ) -> Tests whether a string names a shell builtin or PowerShell cmdlet. Other values and probe failures return false.
    has_user_function: |-
        function(
            parameters(name: any);
            returns(boolean);
            category(Shell);
        ) -> Tests whether a string names a login-shell user function. Other values and probe failures return false.
    can_execute: |-
        function(
            parameters(name: any);
            returns(boolean);
            category(Shell);
        ) -> Tests whether a string names a binary, alias, builtin, or user function, without executing the named command.
    has_agentic_cli: |-
        function(
            parameters(agent: agentic-cli);
            returns(boolean);
            category(Agentic CLIs);
        ) -> Tests whether the named supported agentic CLI is installed on the captured PATH.
    package_area: |-
        function(
            parameters(where: file);
            returns(string);
            category(Repository);
            fallible;
        ) -> Returns the package area containing a local path in the captured repository, or an empty string for no match.
    package: |-
        function(
            parameters(where: file);
            returns(string);
            category(Repository);
            fallible;
        ) -> Returns the package containing a local path in the captured repository, or an empty string for no match.
    recent_commits: |-
        function(
            parameters(count: number(integer; min(1); max(9007199254740991)));
            returns(string[]);
            category(Git);
            fallible;
        ) -> Reads recent repository history at call time and returns up to count formatted commit entries; returns an empty array outside a repository.
    ipv4: |-
        function(
            parameters(filter?: string);
            returns(string[]);
            category(Network);
        ) -> Returns captured IPv4 addresses. A CIDR selects its network; otherwise a substring filters the default set, excluding loopback and link-local addresses.
    ipv6: |-
        function(
            parameters(filter?: string);
            returns(string[]);
            category(Network);
        ) -> Returns captured IPv6 addresses with scope suffixes, using the same CIDR or substring filtering as ipv4.
    ping: |-
        function(
            parameters(address: ip-address, timeout?: number);
            returns(boolean | null);
            category(Network);
            fallible;
        ) -> Sends one ICMP echo with a timeout in milliseconds (default 100). Returns null with a warning when access is denied, otherwise whether a reply arrived in time.
    ping_under: |-
        function(
            parameters(address: ip-address, timeout: number, attempts?: number(integer; min(1); max(100)));
            returns(boolean | literal("unstable") | null);
            category(Network);
            fallible;
        ) -> Sends sequential ICMP echoes (default 3). Returns true if all reply in time, false if none do, "unstable" otherwise, or null with a warning when access is denied.
    as_markdown: |-
        function(
            parameters(content: string);
            returns(string);
            category(Composition);
            fallible;
        ) -> Composes Markdown within the root request, preserving its context, base directory, access policy, and recursion budget.
