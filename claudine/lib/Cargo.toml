[package]
name = "claudine"
version = "0.1.0"
edition = "2024"
autotests = false
license = "AGPL-3.0-only"

[lib]
name = "claudine"

# One test binary per execution contract (tier × exact `required-features`),
# declared explicitly: `autotests = false` above, so a `tests/` file reaches a
# binary only through one of these roots (`2026-09-21-consolidated-test-binaries`).
[[test]]
name = "l1"
path = "tests/l1/main.rs"

[[bench]]
name = "runtime_hot_paths"
harness = false

[features]
# Process-level test seams, off in every default and installed build. Enabled
# only through `claudine-cli`'s own `test-fixtures` feature, whose L1 tests
# drive them from outside the process.
test-fixtures = []

[dependencies]
# Internal
claudine-catalog-types = { path = "../catalog-types" }
sniff = { path = "../../sniff/lib" }
biscuit-hash = { path = "../../biscuit-hash/lib", features = ["xx_hash", "blake3"] }
biscuit-file = { path = "../../biscuit-file/lib", features = ["yaml", "json5", "file-reference"] }
darkmatter = { path = "../../darkmatter/lib" }
playa = { path = "../../playa/lib", features = ["sound-effects", "async", "native-playback"] }
biscuit-speaks = { path = "../../biscuit-speaks/lib", features = ["playa"] }
messenger = { path = "../../messenger/lib", default-features = false, features = ["discord", "slack", "signal", "whatsapp", "desktop"] }
secrecy = "0.10"
biscuit-terminal = { path = "../../biscuit-terminal/lib" }
renderable = { path = "../../renderable" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"

# Error handling
thiserror = "2.0"

# Async runtime
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "process", "time", "fs", "sync"] }
async-trait = "0.1"

# Random v4 identifiers for steering executions and requests
uuid = { version = "1", features = ["v4"] }

# Regex for matcher engine
regex = "1.11"

# URL validation
url = { version = "2.5", features = ["serde"] }

# HTTP client for log server
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

# TOML editing (preserves formatting)
toml_edit = "0.25"

# Ordered maps for harness types
indexmap = { version = "2", features = ["serde"] }

# TOML validation for harness checks
toml = "1.0"

# Structured logging
tracing = "0.1"

# Atomic file writes via unique temp file + rename
tempfile = "3"

# SQLite reporting index
rusqlite = { version = "0.31", features = ["bundled", "chrono", "serde_json"] }

# Directory traversal
walkdir = "2.5"

# Executable lookup
which = "8"

# Shell-words parsing for bash params
shell-words = "1"

# Enum variant-name reflection for the render dispatch-table completeness test
strum = { version = "0.28", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
# Process-group termination for task shell commands: `kill(-pgid, …)` is the
# only way to reach descendants a command backgrounded (see
# `composition/sequence/task/shell.rs`).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Object ownership of a task shell command's process tree, mirroring the
# CLI wrap path. No `Win32_System_Console`: this path terminates the Job
# directly and sends no console control events.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # Thread enumeration for the suspended-spawn → Job-assign → resume
    # sequence: std exposes no thread handle, so the initial thread is found
    # via a Toolhelp snapshot (see `composition/sequence/task/shell.rs`).
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
dunce = "1"
# `test-util` gives the delivery-tracker tests a paused clock, so deadline
# assertions cost no wall time.
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
serial_test = "3"
serde_json = "1.0"
criterion = "0.5"
proptest = "1.6"
rstest = "0.25"
tracing-test = "0.2"
test-toolkit = { path = "../../tools/test-toolkit" }
biscuit-test-harness = { path = "../../biscuit-test-harness" }
# The messaging spawn guard lexes source instead of grepping it, so a spawn
# named in a comment or string never trips it and a real one always does.
proc-macro2 = { version = "1.0", features = ["span-locations"] }

[package.metadata.ci.native]
ubuntu-latest = ["libasound2-dev"]

[lints.clippy]
# Off by default so test targets may construct commands freely; the crate root
# denies it for production builds (see `clippy.toml` for the method list).
disallowed_methods = "allow"

[package.metadata.ci.tests]
# The context construction and path lookup guards include darkmatter-cli's
# shared engines by `#[path]` and spell those files in their tests.
source-inputs = [
  "darkmatter/cli/tests/common/context_guard.rs",
  "darkmatter/cli/tests/common/path_lookup_guard.rs",
  "darkmatter/cli/tests/common/source_scan.rs",
]
