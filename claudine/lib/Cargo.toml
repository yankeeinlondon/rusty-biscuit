[package]
name = "claudine"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "claudine"

[dependencies]
# Internal
sniff = { path = "../../sniff/lib" }
biscuit-hash = { path = "../../biscuit-hash/lib", features = ["xx_hash", "blake3"] }
biscuit-file = { path = "../../biscuit-file/lib", features = ["yaml", "json5"] }
darkmatter = { path = "../../darkmatter/lib" }
playa = { path = "../../playa/lib", features = ["sound-effects", "async"] }
biscuit-speaks = { path = "../../biscuit-speaks/lib", features = ["playa"] }
messenger = { path = "../../messenger/lib", default-features = false, features = ["discord", "slack", "signal", "whatsapp"] }
secrecy = "0.10"
biscuit-terminal = { path = "../../biscuit-terminal/lib" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"

# Async runtime
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }

# Regex for matcher engine
regex = "1.11"

# Home directory
dirs = "6"

# URL validation
url = { version = "2.5", features = ["serde"] }

# HTTP client for log server
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

# TOML editing (preserves formatting)
toml_edit = "0.25"

# Ordered maps for harness types
indexmap = { version = "2", features = ["serde"] }

# TOML validation for harness checks
toml = "1.0"

# Structured logging
tracing = "0.1"

# File locking
fs2 = "0.4"

# SQLite reporting index
rusqlite = { version = "0.31", features = ["chrono", "serde_json"] }

# Directory traversal
walkdir = "2.5"

# Executable lookup
which = "7"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
serial_test = "3"
serde_json = "1.0"
