# The `kind: sequence` YAML document: a sequence file Claudine runs directly.
# Hand-maintained; see claudine/docs/topics/schemas.md.
#
# `sequence` is required and always an inline list here: an empty list is
# valid, and a scalar item is the parser's shorthand for `{ name: <scalar> }`
# (sequence.yaml's `step`). A file reference or dynamic source belongs to a
# Markdown sequence document (sequence-document.yaml). The root is open, so
# the document's own values beside `sequence` are kept.
kind: yaml-schema
description: A formal YAML sequence file
$schema:
    kind: literal(sequence; required) -> the document kind
    description: string -> the sequence's summary
    template: object -> defaults merged into every item of the document's own `sequence:` list
    $schema: |-
        schema -> The global `fm` schema for frontmatter that the sequence has. This can be useful for ensuring that parameters being passed into the sequence are both _typed_ and _available_ for the sequence.

        See the `$state` schema for defining the schema for each step's `seq` state.
    $state: |-
        schema -> The shape for state in each step in the sequence. This defines what properties will eventually be made available off the `seq` namespace.
    sequence: "step[](required)@./sequence.yaml -> the sequence's steps, in order"
