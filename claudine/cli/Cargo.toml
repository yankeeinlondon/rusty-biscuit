[package]
name = "claudine-cli"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "cross-agent abstraction and meta-agent harness"

[[bin]]
name = "claudine"
path = "src/main.rs"

# Test-only PTY harness used by `tests/level2_validation_reporter_pty.rs` to observe
# the exact ANSI/OSC-8 output of the harness validation failure reporter
# under a real PTY. Not intended for end-user invocation.
[[bin]]
name = "validation_reporter_pty_harness"
path = "src/bin/validation_reporter_pty_harness.rs"

[dependencies]
biscuit-file = { path = "../../biscuit-file/lib" }
biscuit-speaks = { path = "../../biscuit-speaks/lib" }
claudine = { path = "../lib" }
playa = { path = "../../playa/lib", features = ["sound-effects"] }
sniff = { path = "../../sniff/lib" }
biscuit-terminal = { path = "../../biscuit-terminal/lib" }
biscuit-tui = { path = "../../biscuit-tui/lib" }
clap = { version = "4.5", features = ["derive", "env", "unstable-ext"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "8"
inquire = "0.9"
ratatui = "0.30"
crossterm = "0.29"
darkmatter = { path = "../../darkmatter/lib" }
darkmatter-cli = { path = "../../darkmatter/cli" }
color-eyre = "0.6"
indexmap = "2"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
ignore = "0.4"
globset = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"
libc = "0.2"
shellexpand = "3"
url = "2"

[target.'cfg(windows)'.dependencies]
# Q15 Ctrl+C / timeout parity: the unified wait loop targets the child tree
# with a Job Object and console control events. Only the feature subsets the
# `windows_wait_loop` uses are enabled (matches the `0.62` workspace convention
# in biscuit-location / sniff / playa).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Enable darkmatter's test-only effect instrumentation for tests only. Cargo
# applies dev-dependency features when building tests/benches but not the
# release binary, so the `claudine` binary carries none of the counter state.
darkmatter = { path = "../../darkmatter/lib", features = ["effects-instrumentation"] }
assert_cmd = "2"
predicates = "3"
insta = { version = "1.34", features = ["json"] }
expectrl = "0.8"
proptest = "1.4"
serial_test = "3"
rstest = "0.25"
tracing-test = "0.2"
test-toolkit = { path = "../../tools/test-toolkit" }
biscuit-test-harness = { path = "../../biscuit-test-harness" }
