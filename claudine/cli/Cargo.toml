[package]
name = "claudine-cli"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "cross-agent abstraction and meta-agent harness"

[[bin]]
name = "claudine"
path = "src/main.rs"

[dependencies]
biscuit-file = { path = "../../biscuit-file/lib" }
biscuit-speaks = { path = "../../biscuit-speaks/lib" }
claudine = { path = "../lib" }
playa = { path = "../../playa/lib", features = ["sound-effects"] }
sniff = { path = "../../sniff/lib" }
biscuit-terminal = { path = "../../biscuit-terminal/lib" }
# Browser-fragment types for the dual-target `dashboard` render component
# (mirrors the `MetricsReport` precedent in the claudine lib).
renderable = { path = "../../renderable" }
biscuit-tui = { path = "../../biscuit-tui/lib" }
clap = { version = "4.5", features = ["derive", "env", "unstable-ext"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "8"
inquire = "0.9"
ratatui = "0.30"
crossterm = "0.29"
darkmatter = { path = "../../darkmatter/lib" }
darkmatter-cli = { path = "../../darkmatter/cli" }
color-eyre = "0.6"
indexmap = "2"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
ignore = "0.4"
globset = "0.4"
ansi-to-tui = "8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Cross-platform rendezvous client used by the lifecycle `requeue(...)` control
# action. On Unix the client connects over a Unix Domain Socket; on Windows it
# connects over a named pipe. When the daemon is unreachable the requeue path
# persists the deferred prompt to a local fallback file (see
# `commands/wrap/harness_orch/loop_control.rs`).
rendezvous-client = { path = "../rendezvous/client" }
rendezvous-core = { path = "../rendezvous/core" }
tonic = { version = "0.14", default-features = false, features = ["codegen"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"
libc = "0.2"
shellexpand = "3"
url = "2"

[target.'cfg(windows)'.dependencies]
# Q15 Ctrl+C / timeout parity: the unified wait loop targets the child tree
# with a Job Object and console control events. Only the feature subsets the
# `windows_wait_loop` uses are enabled (matches the `0.62` workspace convention
# in biscuit-location / sniff / playa).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Enable darkmatter's test-only effect instrumentation for tests only. Cargo
# applies dev-dependency features when building tests/benches but not the
# release binary, so the `claudine` binary carries none of the counter state.
darkmatter = { path = "../../darkmatter/lib", features = ["effects-instrumentation"] }
assert_cmd = "2"
predicates = "3"
insta = { version = "1.34", features = ["json"] }
expectrl = "0.8"
proptest = "1.4"
serial_test = "3"
rstest = "0.25"
tracing-test = "0.2"
# The D8 lossy-boundary guard and the D2 registry-parity test read the area's
# production sources as syntax trees rather than text: their whole premise is
# that an interpolated binding is only lossy when it is *provably* an error
# binding, which a grep cannot know.
syn = { version = "2.0", features = ["full", "parsing", "visit", "extra-traits"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
toml = "1.0"
# The catalog-parity corpus needs a `url::ParseError` to reach
# `ClaudineError::UrlError` → `io.network`. `url` is a cfg(unix) *runtime*
# dependency, so a dev-dependency is what keeps the corpus building on Windows.
url = "2"
# Same reason as `url`: `commands::init` is a `#[cfg(test)]` module, so its
# reference helpers compile on every test target while `shellexpand` itself is
# declared only for `cfg(unix)`.
shellexpand = "3"
test-toolkit = { path = "../../tools/test-toolkit" }
biscuit-test-harness = { path = "../../biscuit-test-harness" }
# `test-support` supplies the endpoint constructor the daemon-spawning fixtures
# build against. Unlike the daemon itself it carries no native dependency, so it
# is available on every target.
rendezvous-core = { path = "../rendezvous/core", features = ["test-support"] }

# The daemon-spawning fixtures boot through `spawn_local_server`, which binds a
# Unix socket or a named pipe depending on the target — the daemon is not
# Unix-only, so the gate below is on the *ABI*, not the OS.
#
# `rendezvous-daemon` pulls `duckdb` with `features = ["bundled"]`, whose unity
# build emits translation units of >40k COFF sections. GNU `as` caps out below
# that ("too many sections … file too big"); clearing it would need
# `-Wa,-mbig-obj` plumbed through `duckdb-sys`' build script, which is not ours
# to set. MSVC's assembler has no such cap, so `x86_64-pc-windows-msvc` keeps the
# fixtures — only the `-gnu` cross-check target drops them, and that target
# exists here purely to type-check the Windows sources. Dropping the dependency
# is what makes `cargo check -p claudine-cli --tests
# --target x86_64-pc-windows-gnu` reach the Windows test suites at all: a
# `#![cfg(unix)]` inside a test file still builds every dev-dependency.
[target.'cfg(not(all(windows, target_env = "gnu")))'.dev-dependencies]
rendezvous-daemon = { path = "../rendezvous/daemon" }
