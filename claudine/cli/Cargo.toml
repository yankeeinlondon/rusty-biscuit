[package]
name = "claudine-cli"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "cross-agent abstraction and meta-agent harness"

[[bin]]
name = "claudine"
path = "src/main.rs"

[features]
# Keep the bundled DuckDB build out of the ordinary local test graph. CI and
# the explicit daemon-test recipe enable this feature on every supported OS.
daemon-tests = ["dep:rendezvous-daemon"]
terminal-tests = []
real-tests = []

[dependencies]
biscuit-file = { path = "../../biscuit-file/lib" }
# Non-crypto content hashing authority (xxHash) for the resume session-
# compatibility key's content digests. Same hasher the `claudine` library uses
# for MCP catalog IDs, so digests are comparable across the two crates.
biscuit-hash = { path = "../../biscuit-hash/lib", features = ["xx_hash"] }
biscuit-speaks = { path = "../../biscuit-speaks/lib" }
claudine = { path = "../lib" }
playa = { path = "../../playa/lib", features = ["sound-effects"] }
sniff = { path = "../../sniff/lib" }
biscuit-terminal = { path = "../../biscuit-terminal/lib" }
# Browser-fragment types for the dual-target `dashboard` render component
# (mirrors the `MetricsReport` precedent in the claudine lib).
renderable = { path = "../../renderable" }
biscuit-tui = { path = "../../biscuit-tui/lib" }
clap = { version = "4.5", features = ["derive", "env", "unstable-ext"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "8"
inquire = "0.9"
ratatui = "0.30"
crossterm = "0.29"
darkmatter = { path = "../../darkmatter/lib" }
darkmatter-cli = { path = "../../darkmatter/cli" }
color-eyre = "0.6"
indexmap = "2"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
ignore = "0.4"
globset = "0.4"
ansi-to-tui = "8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Cross-platform rendezvous client used by the lifecycle `requeue(...)` control
# action. On Unix the client connects over a Unix Domain Socket; on Windows it
# connects over a named pipe. When the daemon is unreachable the requeue path
# persists the deferred prompt to a local fallback file (see
# `commands/wrap/harness_orch/loop_control.rs`).
rendezvous-client = { path = "../rendezvous/client" }
rendezvous-core = { path = "../rendezvous/core" }
rendezvous-daemon = { path = "../rendezvous/daemon", optional = true }
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
url = "2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"
libc = "0.2"
shellexpand = "3"

[target.'cfg(windows)'.dependencies]
# Q15 Ctrl+C / timeout parity: the unified wait loop targets the child tree
# with a Job Object and console control events. Only the feature subsets the
# `windows_wait_loop` uses are enabled (matches the `0.62` workspace convention
# in biscuit-location / sniff / playa).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Enable darkmatter's test-only effect instrumentation for tests only. Cargo
# applies dev-dependency features when building tests/benches but not the
# release binary, so the `claudine` binary carries none of the counter state.
darkmatter = { path = "../../darkmatter/lib", features = ["effects-instrumentation"] }
assert_cmd = "2"
predicates = "3"
insta = { version = "1.34", features = ["json"] }
expectrl = "0.8"
proptest = "1.4"
serial_test = "3"
rstest = "0.25"
tracing-test = "0.2"
# The D8 lossy-boundary guard and the D2 registry-parity test read the area's
# production sources as syntax trees rather than text: their whole premise is
# that an interpolated binding is only lossy when it is *provably* an error
# binding, which a grep cannot know.
syn = { version = "2.0", features = ["full", "parsing", "visit", "extra-traits"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
toml = "1.0"
# The catalog-parity corpus needs a `url::ParseError` to reach
# `ClaudineError::UrlError` → `io.network`. `url` is a cfg(unix) *runtime*
# dependency, so a dev-dependency is what keeps the corpus building on Windows.
url = "2"
# Same reason as `url`: `commands::init` is a `#[cfg(test)]` module, so its
# reference helpers compile on every test target while `shellexpand` itself is
# declared only for `cfg(unix)`.
shellexpand = "3"
test-toolkit = { path = "../../tools/test-toolkit" }
biscuit-test-harness = { path = "../../biscuit-test-harness" }
# `test-support` supplies the endpoint constructor the daemon-spawning fixtures
# build against. Unlike the daemon itself it carries no native dependency, so it
# is available on every target.
rendezvous-core = { path = "../rendezvous/core", features = ["test-support"] }

[[test]]
name = "level2_auto_complete_chooser"
required-features = ["terminal-tests"]

[[test]]
name = "level2_auto_complete_operation_file"
required-features = ["terminal-tests"]

[[test]]
name = "level2_explicit_operation_file_miss"
required-features = ["terminal-tests"]

[[test]]
name = "level2_context_capture"
required-features = ["terminal-tests"]

[[test]]
name = "level2_dry_run_approval_capture"
required-features = ["terminal-tests"]

[[test]]
name = "level2_dry_run_metadata_capture"
required-features = ["terminal-tests"]

[[test]]
name = "level2_dry_run_pty"
required-features = ["terminal-tests"]

[[test]]
name = "level2_file_resolution_capture"
required-features = ["terminal-tests"]

[[test]]
name = "level2_inline_compose_mismatch_capture"
required-features = ["terminal-tests"]

[[test]]
name = "level2_interrupt_feedback_capture"
required-features = ["terminal-tests"]

[[test]]
name = "level2_invalid_file_reference_capture"
required-features = ["terminal-tests"]

[[test]]
name = "level2_lifecycle_action_forms"
required-features = ["terminal-tests"]

[[test]]
name = "level2_lifecycle_control"
required-features = ["terminal-tests"]

[[test]]
name = "level2_lifecycle_dispatch"
required-features = ["terminal-tests"]

[[test]]
name = "level2_lifecycle_loop"
required-features = ["terminal-tests"]

[[test]]
name = "level2_malformed_frontmatter_capture"
required-features = ["terminal-tests"]

[[test]]
name = "level2_perf_capture"
required-features = ["terminal-tests"]

[[test]]
name = "level2_prompt_reporting_capture"
required-features = ["terminal-tests"]

[[test]]
name = "level2_provided_partial_file_pty"
required-features = ["terminal-tests"]

[[test]]
name = "level2_pty_tests"
required-features = ["terminal-tests"]

[[test]]
name = "level2_removed_validation_key_capture"
required-features = ["terminal-tests"]

[[test]]
name = "level2_schema_parse_capture"
required-features = ["terminal-tests"]

[[test]]
name = "level2_schema_prompt_pty"
required-features = ["terminal-tests"]

[[test]]
name = "level2_sequence_task_stream_capture"
required-features = ["terminal-tests"]

[[test]]
name = "level2_stalled_generation_capture"
required-features = ["terminal-tests"]

[[test]]
name = "level2_typed_error_render_capture"
required-features = ["terminal-tests"]

[[test]]
name = "level2_wrap_ctrl_c_loop_wedge_tmux"
required-features = ["terminal-tests"]

[[test]]
name = "level2_wrap_ctrl_c_tmux"
required-features = ["terminal-tests"]

[[test]]
name = "level3_auto_complete_chooser"
required-features = ["terminal-tests"]

[[test]]
name = "level3_linux_sequence_ctrl_c"
required-features = ["terminal-tests"]

[[test]]
name = "level3_sequence_ctrl_c"
required-features = ["terminal-tests"]

[[test]]
name = "level3_windows_sequence_ctrl_c"
required-features = ["terminal-tests"]

[[test]]
name = "level3_wrap_ctrl_c"
required-features = ["terminal-tests"]

[[test]]
name = "real_opencode_yolo_subagent"
required-features = ["real-tests"]

# CI policy: claudine-cli owns the area's L2 (PTY/tmux) tier tests. Its tests
# need inert AI-provider CLI stubs for provider discovery, and the darkmatter
# `md` binary built into the workspace target dir (inline_compose_hash).
[package.metadata.ci.tests]
tiers = ["L1", "L2"]
features = ["daemon-tests", "terminal-tests"]
local-features = []
l2-backends = ["tmux", "wezterm"]
runner-tools = ["ai-provider-stubs", "darkmatter-md-fixture", "l2-parallel-self-spawn"]
