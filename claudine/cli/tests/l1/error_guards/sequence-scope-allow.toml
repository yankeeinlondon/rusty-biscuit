# Exceptions to the sequence error scope guards, read by
# `cli/tests/l1/error_guards/sequence_scope.rs`.
#
# `guard` is `site` (a `Sequence…` variant without `site` or
# `source_path` + `property`), `noun` (a hard-coded construct noun in an
# `#[error]` text, keyed by variant, or in a renderer, keyed by
# `render/<file>.rs`), or `catch_all` (a variant that renders as the generic
# "composition failed" block).
#
# `sequence-error-standard` entries are the sequence errors still to be given
# a site and a block of their own (Phase 8 of
# 2026-11-22-better-errors-and-dry-run empties them). `outside-scope` entries
# are other variants the sequence error standard does not cover.

