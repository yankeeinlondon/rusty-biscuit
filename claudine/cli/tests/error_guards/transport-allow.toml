# D8 lossy-boundary exceptions, read by `cli/tests/error_guards.rs`.
#
# Each entry suppresses one shape in one enclosing symbol in one file. Keying on
# the symbol — not, as the predecessor grep guard did, on a trimmed source line —
# is deliberate: a line is not unique, so an exception granted to one boundary
# used to silently cover an identical line anywhere else in the tree.
#
# Three tests keep this file honest: an entry naming no live site fails as
# stale, an entry with an unknown shape or tag fails, and an entry without a
# substantive reason fails.
#
# ## Tags
#
# `retained` — permanent. The value genuinely has no typed source (a panic
# payload, arbitrary user text, a ratified String-carrying cross-package
# contract), or the site is downstream of the final render boundary — including
# a `color_eyre::eyre::Report` in hand, which does not implement
# `std::error::Error` and so cannot be a `#[source]`.
#
# `d10-routing-change` — a ratified cross-spec deferral, not a burn-down. A typed
# error IS in hand, but typing it here would change an authored matching surface
# (`err.kind`/`err.variant`/`err.code` a `when:` clause selects on), which spec
# §D10 and decisions D-2/D-12 reserve for a separate versioned migration. The
# entry's reason names the surface that would move. This is a closed decision, so
# the set does not grow: a *new* collapse with a typed source still fails the
# guard and must be fixed, never tagged.
#
# The `error-propagation-followup` burn-down is closed (all entries fixed or
# reclassified); the tag no longer exists. A typed error in hand, inside this
# feature's scope, is a defect to fix — never an entry here.

