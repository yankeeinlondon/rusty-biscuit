# D8 lossy-boundary exceptions, read by `cli/tests/error_guards.rs`.
#
# Each entry suppresses one shape in one enclosing symbol in one file. Keying on
# the symbol — not, as the predecessor grep guard did, on a trimmed source line —
# is deliberate: a line is not unique, so an exception granted to one boundary
# used to silently cover an identical line anywhere else in the tree.
#
# Three tests keep this file honest: an entry naming no live site fails as
# stale, an entry with an unknown shape or tag fails, and an entry without a
# substantive reason fails.
#
# ## Tags
#
# `retained` — permanent. The value genuinely has no typed source (a panic
# payload, arbitrary user text, a ratified String-carrying cross-package
# contract), or the site is downstream of the final render boundary.
#
# `error-propagation-followup` — burn-down, following the grandfather convention
# of `dispatch_inventory.rs`'s GUARD_ALLOWLIST. The Phase 1 inventory
# (`features/2026-07-13-error-propogation/inventory.md`) was produced by grep and
# classified 51 Category-1 sites; this guard parses the sources and sees 77
# symbols. The extra ones were never in the Phase 4/5 work list because nothing
# could see them, and spec §D10 requires an out-of-scope discovery be split into
# its own spec rather than fixed opportunistically. They are recorded here so the
# set is frozen: a *new* collapse still fails the guard.
#
# A typed error in hand, inside this feature's scope, is a defect to fix — never
# an entry here.

