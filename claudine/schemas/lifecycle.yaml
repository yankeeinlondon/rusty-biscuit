    step:
        - string
        - number
        - boolean
        - task
    task:
        name: "string(not-empty) -> the step or leg name"
        prompt: "string -> the prompt file reference"
        shell: "unknown -> a shell command; the task parser checks its form"
        side_effect: "unknown -> a side effect; the task parser checks its arguments"
        task: "unknown -> a referenced task; the task parser checks its form"
        sequence:
            - "step-2[] -> inline nested tasks"
            - "string -> a sequence file reference, optionally with an offset and operator"
        group:
            - group
            - "string -> a group file reference"
        params: "object -> parameters passed to the executable"
        operation: "string -> the task operation"
        flow: "string -> the task flow"
        timeout: "string -> the per-command timeout"
        when: "string(not-empty) -> the task's guard, a condition expression read at the task's turn; false skips the task"
        loop: "object -> an inline sequence's loop, beside `sequence:`; the loop parser checks it"
        "<string>": "unknown -> authored step state; the task parser rejects reserved keys"
        initialize: loose-body
        start: loose-body
        blocked: loose-body
        success: loose-body
        failure: loose-body
        cancelled: cancelled-stack
        finalize: loose-body
    group:
        name: "string(not-empty) -> the container name"
        tasks: "task-2[](required; min(1)) -> named legs; the task parser checks unique names"
        variables: "object -> bindings scoped to this group"
        description: "string -> the container summary"
        operation: "string -> default operation for prompt legs"
        flow: "string -> default flow for prompt legs"
        fail_fast: "boolean -> cancel opted-in siblings after a leg fails; defaults to true"
        max_parallel: "number(integer; min(1)) -> the maximum number of concurrent legs"
        loop: "object -> the group's loop, beside `tasks:`; the loop parser checks it"
        initialize: loose-body
        start: loose-body
        blocked: loose-body
        success: loose-body
        failure: loose-body
        cancelled: cancelled-stack
        finalize: loose-body
