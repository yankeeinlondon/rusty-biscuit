    cancelled-stack:
        - cancelled-item[]
        - cancelled-entry
    cancelled-item:
        - cancelled-entry
        - cancelled-conditional
        - "enum(stop) -> stop, written as a bare list item"
    cancelled-entry:
        - communicate@./action.yaml
        - cancelled-stop@./action.yaml
        - shell@./action.yaml
        - expression@./action.yaml
        - cancelled-bundle@./action.yaml
    cancelled-conditional:
        when: "expression(required) -> the condition choosing then or else"
        then: "cancelled-stack(required) -> the actions to run when the condition holds"
        else: "cancelled-stack -> the actions to run when it does not"
