    cancelled-stack:
        - cancelled-item-1[]
        - cancelled-bundle@./action.yaml
    cancelled-item-1:
        - communicate@./action.yaml
        - cancelled-stop@./action.yaml
        - shell@./action.yaml
        - expression@./action.yaml
        - cancelled-bundle@./action.yaml
        - cancelled-conditional-1
        - "enum(stop)"
    cancelled-conditional-1:
        when: "expression(required)"
        "<pattern::^(?:then|else)$>": cancelled-stack-2
        $constraints:
            min-keys: 2
    cancelled-stack-2:
        - cancelled-item-2[]
        - cancelled-bundle@./action.yaml
    cancelled-item-2:
        - communicate@./action.yaml
        - cancelled-stop@./action.yaml
        - shell@./action.yaml
