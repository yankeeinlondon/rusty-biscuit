# Claudine's lifecycle stack types and the `loop:` block type.
# Hand-maintained; see README.md.
#
# Three recursive families type every event stack at every conditional depth:
# - `stack`/`item`/`conditional` for the ordinary events and a loop's `gate:`;
# - `initialize-*` for `initialize`, which never admits a shell, in either
#   branch, at any depth;
# - `cancelled-*` for `cancelled`, which admits `stop` as its only flow
#   directive.
# Each family recurses through a conditional's `then`/`else`, so the resolver
# stores it once as a definition and references it wherever it is used. The
# schema has no depth limit: the lifecycle parser alone rejects a sixth
# conditional level.
#
# The sequence container types (`step`, `task`, `group`) that import these
# stacks live in sequence-types.yaml.
kind: schema
types:
    bare-verb: "enum(stop, skip, error, retry, break, and, or, branch_exists_on_remote, ipv4, ipv6, remote_vendor) -> a zero-argument verb written as a bare list item"
    stack:
        - item[]
        - bundle@./action.yaml
    item:
        - communicate@./action.yaml
        - flow@./action.yaml
        - shell@./action.yaml
        - expression@./action.yaml
        - bundle@./action.yaml
        - conditional
        - bare-verb
    conditional:
        when: "expression(required) -> the condition choosing then or else"
        then: "stack(required) -> the actions to run when the condition holds"
        else: "stack -> the actions to run when it does not"
    initialize-stack:
        - initialize-item[]
        - initialize-bundle@./action.yaml
    initialize-item:
        - communicate@./action.yaml
        - flow@./action.yaml
        - expression@./action.yaml
        - initialize-bundle@./action.yaml
        - initialize-conditional
        - bare-verb
    initialize-conditional:
        when: "expression(required) -> the condition choosing then or else"
        then: "initialize-stack(required) -> the actions to run when the condition holds"
        else: "initialize-stack -> the actions to run when it does not"
    loop-action: "{ op: enum(increment, decrement, set, append, prepend, merge; required), prop: string(not-empty; required), value: unknown }"
    loop-action-entry:
        - string
        - loop-action
    loop:
        while: "expression -> keep iterating while this condition holds"
        until: "expression -> stop iterating once this condition holds"
        action:
            - "string -> an iteration action such as increment(iteration)"
            - loop-action
            - "loop-action-entry[]"
        actions:
            - "string -> an iteration action such as increment(iteration)"
            - loop-action
            - "loop-action-entry[]"
        max:
            - "number(integer; min(1)) -> the most iterations to run"
            - "interpolation@./action.yaml -> a cap such as {{ cap }}, resolved once before the loop starts"
        on_rate_limit: "enum(pause, abort, continue) -> what to do when the provider reports a rate limit; a document loop only"
        gate: "stack -> the lifecycle stack run after each iteration; never beside loose verb keys"
        no_error: "boolean -> keep the loop running when one of the loose actions fails"
