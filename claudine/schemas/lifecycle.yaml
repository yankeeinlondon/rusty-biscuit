# Claudine's lifecycle stack types and the `loop:` block type. Named types are
# inlined, so a conditional's nesting is unrolled one type per level.
# Hand-maintained; see README.md.
#
# The `stack` and `initialize-*` families are typed three conditional levels
# deep: a `then`/`else` body inside a level-3 conditional is accepted loosely,
# and the lifecycle parser still checks it. `initialize-*` excludes shells.
#
# The `cancelled-*` family permits only stop among flow directives, and is
# unrolled to the parser's five-level limit, so the restriction holds at every
# depth the parser accepts and a sixth-level `when`/`then` conditional is a
# schema error (a guarded bundle there is left to the parser).
# Its conditionals type `then` and `else` with one pattern key: two literal
# keys would inline each body twice per level, and five such levels make
# every validation about ten times slower. The cost of the pattern key is
# that the parser alone requires `then` beside `else`, and the editor does not
# complete `then`/`else` or resolve values below them.
#
# Named types are inlined, never referenced, so containers cannot recurse:
# `task`/`group` and their direct children (`step-2`, `task-2`, `group-2`) are
# typed, and a grandchild list is left to the task parser. Every typed
# container types `cancelled` with `cancelled-stack`. Its other events keep
# the list/dictionary shape only: a full `stack` per event on every inlined
# container multiplies the compiled schema (see docs/topics/schemas.md). For
# the same reason a container `loop` is typed as an object only, not with the
# `loop` type and its gate `stack`.
kind: schema
types:
    bare-verb: "enum(stop, skip, error, retry, break, and, or, branch_exists_on_remote, ipv4, ipv6, remote_vendor) -> a zero-argument verb written as a bare list item"
    loose-body:
        - "unknown[] -> a list of actions, checked only by the lifecycle parser"
        - "{ <string>: unknown } -> a dictionary of verbs, checked only by the lifecycle parser"
    stack:
        - item-1[]
        - bundle@./action.yaml
    item-1:
        - communicate@./action.yaml
        - flow@./action.yaml
        - shell@./action.yaml
        - expression@./action.yaml
        - bundle@./action.yaml
        - conditional-1
        - bare-verb
    conditional-1:
        when: "expression(required) -> the condition choosing then or else"
        then: "stack-2(required) -> the actions to run when the condition holds"
        else: "stack-2 -> the actions to run when it does not"
    stack-2:
        - item-2[]
        - bundle@./action.yaml
    item-2:
        - communicate@./action.yaml
        - flow@./action.yaml
        - shell@./action.yaml
        - expression@./action.yaml
        - bundle@./action.yaml
        - conditional-2
        - bare-verb
    conditional-2:
        when: "expression(required) -> the condition choosing then or else"
        then: "stack-3(required) -> the actions to run when the condition holds"
        else: "stack-3 -> the actions to run when it does not"
    stack-3:
        - item-3[]
        - bundle@./action.yaml
    item-3:
        - communicate@./action.yaml
        - flow@./action.yaml
        - shell@./action.yaml
        - expression@./action.yaml
        - bundle@./action.yaml
        - conditional-3
        - bare-verb
    conditional-3:
        when: "expression(required) -> the condition choosing then or else"
        then: "loose-body(required) -> the actions to run when the condition holds"
        else: "loose-body -> the actions to run when it does not"
    initialize-stack:
        - initialize-item-1[]
        - initialize-bundle@./action.yaml
    initialize-item-1:
        - communicate@./action.yaml
        - flow@./action.yaml
        - expression@./action.yaml
        - initialize-bundle@./action.yaml
        - initialize-conditional-1
        - bare-verb
    initialize-conditional-1:
        when: "expression(required) -> the condition choosing then or else"
        then: "initialize-stack-2(required) -> the actions to run when the condition holds"
        else: "initialize-stack-2 -> the actions to run when it does not"
    initialize-stack-2:
        - initialize-item-2[]
        - initialize-bundle@./action.yaml
    initialize-item-2:
        - communicate@./action.yaml
        - flow@./action.yaml
        - expression@./action.yaml
        - initialize-bundle@./action.yaml
        - initialize-conditional-2
        - bare-verb
    initialize-conditional-2:
        when: "expression(required) -> the condition choosing then or else"
        then: "initialize-stack-3(required) -> the actions to run when the condition holds"
        else: "initialize-stack-3 -> the actions to run when it does not"
    initialize-stack-3:
        - initialize-item-3[]
        - initialize-bundle@./action.yaml
    initialize-item-3:
        - communicate@./action.yaml
        - flow@./action.yaml
        - expression@./action.yaml
        - initialize-bundle@./action.yaml
        - initialize-conditional-3
        - bare-verb
    initialize-conditional-3:
        when: "expression(required) -> the condition choosing then or else"
        then: "loose-body(required) -> the actions to run when the condition holds"
        else: "loose-body -> the actions to run when it does not"
    loop-action: "{ op: enum(increment, decrement, set, append, prepend, merge; required), prop: string(not-empty; required), value: unknown }"
    loop-action-entry:
        - string
        - loop-action
    loop:
        while: "expression -> keep iterating while this condition holds"
        until: "expression -> stop iterating once this condition holds"
        action:
            - "string -> an iteration action such as increment(iteration)"
            - loop-action
            - "loop-action-entry[]"
        actions:
            - "string -> an iteration action such as increment(iteration)"
            - loop-action
            - "loop-action-entry[]"
        max:
            - "number(integer; min(1)) -> the most iterations to run"
            - "interpolation@./action.yaml -> a cap such as {{ cap }}, resolved once before the loop starts"
        on_rate_limit: "enum(pause, abort, continue) -> what to do when the provider reports a rate limit; a document loop only"
        gate: "stack -> the lifecycle stack run after each iteration; never beside loose verb keys"
        no_error: "boolean -> keep the loop running when one of the loose actions fails"
        say: "string -> speak the text aloud through text-to-speech"
        speak: "string -> alias of say"
        effect: "string -> play the named sound effect from the effect catalog"
        message: "string -> send the text to the configured messaging routes"
        notify: "string -> show the text as a desktop notification"
        stderr: "string -> write the text to standard error"
        stdout: "string -> write the text to standard output"
        info: "string -> print the text as an informational status line"
        warn: "string -> print the text as a warning status line"
        success: "string -> print the text as a success status line"
        stop:
            - null
            - "unknown[](max(0)) -> stop the remaining actions of this stack"
        skip:
            - null
            - "unknown[](max(0)) -> skip the provider run (the parser allows skip only in initialize)"
        error:
            - null
            - "unknown[](max(0))"
            - "string -> fail the run with this reason"
        proxy: "string -> hand the run to the target prompt: a file reference such as @prompts/next.md or a whole-value interpolation"
        retry:
            - null
            - "unknown[](max(0))"
            - "count@./action.yaml -> re-read and re-run the document at most this many times"
        resume: "string -> send this follow-up message into the live session"
        defer: "string -> planned: defer the run by this delay; the parser accepts it but the runtime does not run it yet"
        break:
            - null
            - "unknown[](max(0))"
            - "string -> end the nearest enclosing loop with this reason (an empty string is an empty reason); a break outside every loop fails its event"
        prep: "string(not-empty) -> run the target (a file reference such as @prompts/setup.md or a whole-value interpolation), then continue with the next action; a target that fails fails this event"
        shell: "shell -> run a shell command (never in initialize)"
        set: "object -> assign runtime values: a mapping of destinations to values (no long form, no no_error)"
        append_frontmatter: "unknown -> Darkmatter side effect; the parser checks its arguments"
        append_jsonl: "unknown -> Darkmatter side effect; the parser checks its arguments"
        append_line: "unknown -> Darkmatter side effect; the parser checks its arguments"
        decrement_frontmatter: "unknown -> Darkmatter side effect; the parser checks its arguments"
