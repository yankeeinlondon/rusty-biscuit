            - stderr-long@darkmatter:lifecycle
        stdout:
            - stdout-short@darkmatter:lifecycle
            - stdout-long@darkmatter:lifecycle
        info:
            - info-short@darkmatter:lifecycle
            - info-long@darkmatter:lifecycle
        warn:
            - warn-short@darkmatter:lifecycle
            - warn-long@darkmatter:lifecycle
        success:
            - success-short@darkmatter:lifecycle
            - success-long@darkmatter:lifecycle
        when: "expression -> run the action only when this condition holds; a list item only"
        no_error: "boolean -> keep the stack running when this action fails"
        $constraints:
            min-keys: 1
            max-keys: 1
            uncounted-keys: [when, no_error]
