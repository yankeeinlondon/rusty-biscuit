# Claudine's lifecycle action types: one closed type per action category, and
# event-specific dictionary-bundle types. Hand-maintained; see README.md.
#
# A category type holds exactly one verb, whose value is its short form or its
# closed long form. A bundle holds several verbs in short form only, plus
# `when` and `no_error`. The Darkmatter side-effect and expression-function
# verbs are listed one key per name with untyped values; Claudine's lifecycle
# parser checks their arguments. Tests in claudine/lib/tests/l1 keep the
# bundles, the generated keys, and the parser's verb inventory aligned.
kind: schema
types:
    interpolation: "string(pattern(^\\s*\\x7b\\x7b[\\s\\S]*\\x7d\\x7d\\s*$)) -> a whole-value {{ … }} interpolation"
    count:
        - "number(integer; min(0)) -> a count"
        - interpolation
    communicate:
        say:
            - "string -> speak the text aloud through text-to-speech"
            - "{ text: string(required), no_error: boolean }"
        speak:
            - "string -> alias of say"
            - "{ text: string(required), no_error: boolean }"
        effect:
            - "string -> play the named sound effect from the effect catalog"
            - "{ text: string(required), no_error: boolean }"
        message:
            - "string -> send the text to the configured messaging routes"
            - "{ text: string(required), no_error: boolean }"
        notify:
            - "string -> show the text as a desktop notification"
            - "{ text: string(required), no_error: boolean }"
        stderr:
            - "string -> write the text to standard error"
            - "{ text: string(required), no_error: boolean }"
        stdout:
            - "string -> write the text to standard output"
            - "{ text: string(required), no_error: boolean }"
        info:
            - "string -> print the text as an informational status line"
            - "{ text: string(required), no_error: boolean }"
        warn:
            - "string -> print the text as a warning status line"
            - "{ text: string(required), no_error: boolean }"
        success:
            - "string -> print the text as a success status line"
            - "{ text: string(required), no_error: boolean }"
        $constraints:
            min-keys: 1
            max-keys: 1
    flow:
        stop:
            - null
            - "unknown[](max(0)) -> stop the remaining actions of this stack"
            - "{ no_error: boolean }"
        skip:
            - null
            - "unknown[](max(0)) -> skip the provider run (the parser allows skip only in initialize)"
            - "{ no_error: boolean }"
        error:
            - null
            - "unknown[](max(0))"
            - "string -> fail the run with this reason"
            - "{ reason: string, no_error: boolean }"
        proxy:
            - "string -> hand the run to the target prompt: a file reference such as @prompts/next.md or a whole-value interpolation"
            - "{ target: string(required), with: object, no_error: boolean }"
        retry:
            - null
            - "unknown[](max(0))"
            - "count -> re-read and re-run the document at most this many times"
            - "{ max_attempts: count, delay: string, backoff: enum(fixed, exponential), with: object, no_error: boolean }"
        resume:
            - "string -> send this follow-up message into the live session"
            - "{ message: string(required), max_attempts: count, no_error: boolean }"
        defer:
            - "string -> planned: defer the run by this delay; the parser accepts it but the runtime does not run it yet"
            - "{ delay: string(required), reason: string, no_error: boolean }"
        break:
            - null
            - "unknown[](max(0))"
            - "string -> planned: leave the loop or sequence with this reason; not yet accepted by the parser"
            - "{ reason: string, code: number(integer; min(0); max(255)), no_error: boolean }"
        prep:
            - "string -> planned: prepare the target prompt (a file reference such as @prompts/next.md or a whole-value interpolation); not yet accepted by the parser"
            - "{ target: string(required), with: object, no_error: boolean }"
        $constraints:
            min-keys: 1
            max-keys: 1
    shell:
        shell:
            - "shell -> run a shell command (never in initialize)"
            - "{ command: shell(required), on_error: string, no_error: boolean }"
        $constraints:
            min-keys: 1
            max-keys: 1
