# Claudine's lifecycle action types: one closed type per action category, and
# event-specific dictionary-bundle types. Hand-maintained; see README.md.
#
# Darkmatter owns the shape of every lifecycle verb
# (darkmatter/schemas/partials/lifecycle.yaml); this file selects the verbs
# Claudine provides and names each shape through the reserved `darkmatter:`
# namespace rather than copying it. Claudine provides every verb it parses,
# so its categories and bundles hold exactly Darkmatter's neutral ones and
# stay closed to unknown verbs.
#
# A category type is a single-action dictionary: exactly one verb, whose value
# is its short form or its closed long form, plus `when` and `no_error`, which
# `uncounted-keys` leaves out of the one-key count. A bundle holds several
# verbs in short form only, plus `when` and `no_error`. The lifecycle parser
# alone refuses `when` outside a list item.
#
# The Darkmatter side-effect and expression-function verbs are listed one key
# per name and reference the per-verb types Darkmatter generates from their
# typed catalog signatures. Tests in
# claudine/lib/tests/l1 keep the bundles, the generated keys and their
# references, and the parser's verb inventory aligned.
kind: schema
types:
    interpolation: interpolation@darkmatter:lifecycle
    count: count@darkmatter:lifecycle
    communicate:
        say:
            - say-short@darkmatter:lifecycle
            - say-long@darkmatter:lifecycle
        speak:
            - speak-short@darkmatter:lifecycle
            - speak-long@darkmatter:lifecycle
        effect:
            - effect-short@darkmatter:lifecycle
            - effect-long@darkmatter:lifecycle
        message:
