syntax = "proto3";

package rendezvous;

// Control-plane gRPC service exposed by the rendezvous daemon over a
// Unix Domain Socket. Phase 1 covers liveness (`Ping`) and a minimal
// `Status` snapshot used by the test client to verify IPC end-to-end.
// Phase 2 adds the session-log append/read surface backed by Loro
// documents persisted in redb plus a DuckDB analytical projection.
service Rendezvous {
    rpc Ping(PingRequest) returns (PingResponse);
    rpc Status(StatusRequest) returns (StatusResponse);

    // Append a single entry to the session log identified by
    // (`owner_node_id`, `session_id`). The daemon picks the active chunk
    // (rotating to a new one when the chunk threshold is exceeded),
    // assigns a monotonic `sequence`, persists the resulting Loro snapshot
    // to redb, and queues the entry for DuckDB projection.
    rpc AppendEntry(AppendEntryRequest) returns (AppendEntryResponse);

    // List entries currently materialised in the in-memory Loro doc for a
    // specific chunk. This is the source-of-truth read path that bypasses
    // the (potentially lagging) DuckDB projection.
    rpc ListChunkEntries(ListChunkEntriesRequest) returns (ListChunkEntriesResponse);

    // Enumerate all chunk IDs known for a (`owner_node_id`, `session_id`)
    // pair, in ascending chunk-index order.
    rpc ListSessionChunks(ListSessionChunksRequest) returns (ListSessionChunksResponse);

    // Query the DuckDB analytical projection for entries matching a
    // session. The projection lags redb (it is fed by a micro-batching
    // pipeline) and must not be treated as authoritative.
    rpc QueryProjection(QueryProjectionRequest) returns (QueryProjectionResponse);

    // Encode the local daemon's connection info (advertised QUIC
    // address plus node public key) into a self-contained bech32
    // invitation string suitable for sharing with another node.
    rpc CreateInvitation(CreateInvitationRequest) returns (CreateInvitationResponse);

    // Decode an invitation string and initiate a QUIC connection to
    // the peer it describes. The handshake completes asynchronously;
    // the response reports the locally observed peer info on success.
    rpc ConnectToPeer(ConnectToPeerRequest) returns (ConnectToPeerResponse);

    // Enumerate peers currently known to the daemon (discovered via
    // mDNS, supplied via invitations, or actively connected).
    rpc ListPeers(ListPeersRequest) returns (ListPeersResponse);

    // Mark a peer as approved for direct sync. Pairing is persisted in
    // redb so it survives daemon restarts. The peer is identified by
    // its hex-encoded `node_id` (the wire-level public key).
    rpc ApprovePeer(ApprovePeerRequest) returns (ApprovePeerResponse);

    // Revoke a previously approved pairing. Subsequent sync attempts
    // from this peer will be rejected.
    rpc RevokePeer(RevokePeerRequest) returns (RevokePeerResponse);

    // Enumerate all currently approved pairings.
    rpc ListPairings(ListPairingsRequest) returns (ListPairingsResponse);

    // Run the direct-sync protocol against a paired peer: exchange
    // state vectors and push missing deltas in both directions. The
    // RPC completes only after the protocol terminates (or fails).
    rpc SyncWithPeer(SyncWithPeerRequest) returns (SyncWithPeerResponse);

    // Enumerate host-capability registers known to this daemon: its
    // own plus the synced replica of every mesh peer's.
    rpc ListHostCapabilities(ListHostCapabilitiesRequest) returns (ListHostCapabilitiesResponse);

    // Enumerate checked-out-repos registers known to this daemon: its
    // own plus the synced replica of every mesh peer's. This is the
    // scheduler's "which hosts already have this repo, and how fresh"
    // read path.
    rpc ListHostRepos(ListHostReposRequest) returns (ListHostReposResponse);

    // Report a session lifecycle transition on THIS host. Producers
    // (the Claudine wrapper today, the process monitor later) call this
    // on start / meaningful status change / end — transitions, never
    // heartbeats: every call writes this host's sessions-active
    // register, which replicates to every mesh peer.
    rpc ReportSessionEvent(ReportSessionEventRequest) returns (ReportSessionEventResponse);

    // Enumerate the active-session registers known to this daemon: its
    // own plus the synced replica of every mesh peer's. This is the
    // dashboard's NOW-view read path.
    rpc ListActiveSessions(ListActiveSessionsRequest) returns (ListActiveSessionsResponse);
}

message PingRequest {
    // Opaque token echoed back unchanged so callers can correlate responses.
    string nonce = 1;
}

message PingResponse {
    // The same nonce sent in the request, for round-trip correlation.
    string nonce = 1;
    // Semver string of the daemon (Cargo package version).
    string daemon_version = 2;
    // Server wall-clock at the moment the response was constructed, in
    // milliseconds since the Unix epoch.
    int64 timestamp_unix_ms = 3;
}

message StatusRequest {}

message StatusResponse {
    // Semver string of the daemon (Cargo package version).
    string daemon_version = 1;
    // Daemon uptime in whole seconds since process start.
    int64 uptime_seconds = 2;
    // Daemon start time in milliseconds since the Unix epoch.
    int64 started_at_unix_ms = 3;
    // Hex-encoded public key of THIS daemon's node. Lets a reader
    // (e.g. the dashboard) tell its own registers — always fresh —
    // apart from synced replicas of mesh peers.
    string node_id = 4;
}

// Generic session-log entry. Mirrors `rendezvous_core::session_log::Entry`.
message SessionEntry {
    // Per-session monotonic counter assigned by the daemon when the entry
    // is appended. Stable across restarts.
    uint64 sequence = 1;
    // Wall-clock at append time, in milliseconds since the Unix epoch.
    int64 created_at_unix_ms = 2;
    // Free-form source identifier (e.g., "claude", "test-client").
    string source = 3;
    // Severity / log level (e.g., "info", "warn", "error").
    string level = 4;
    // Human-readable message body.
    string message = 5;
    // Optional structured metadata encoded as a JSON object string. Empty
    // when no metadata is attached.
    string metadata_json = 6;
}

message AppendEntryRequest {
    // Owner node identifier. Phase 2 has no node identity yet; callers may
    // pass a stable test-only string ("local-node" by convention).
    string owner_node_id = 1;
    // Session identifier (free-form).
    string session_id = 2;
    // Free-form source identifier.
    string source = 3;
    // Severity / log level.
    string level = 4;
    // Human-readable message body.
    string message = 5;
    // Optional structured metadata encoded as a JSON object string. Empty
    // when no metadata is attached.
    string metadata_json = 6;
}

message AppendEntryResponse {
    // Deterministic chunk ID the entry was appended to, in
    // `session/{owner_node_id}/{session_id}/part/{chunk_index}` form.
    string chunk_id = 1;
    // Zero-based chunk index inside the session.
    uint64 chunk_index = 2;
    // Sequence number assigned to this entry within its session.
    uint64 sequence = 3;
    // Wall-clock at append time, in milliseconds since the Unix epoch.
    int64 created_at_unix_ms = 4;
    // `true` if appending this entry caused a chunk rotation (i.e., the
    // entry went into a freshly created chunk).
    bool rotated_chunk = 5;
}

message ListChunkEntriesRequest {
    // Deterministic chunk ID, as returned by `AppendEntry`.
    string chunk_id = 1;
}

message ListChunkEntriesResponse {
    string chunk_id = 1;
    repeated SessionEntry entries = 2;
}

message ListSessionChunksRequest {
    string owner_node_id = 1;
    string session_id = 2;
}

message ListSessionChunksResponse {
    repeated string chunk_ids = 1;
}

message QueryProjectionRequest {
    string owner_node_id = 1;
    string session_id = 2;
}

message ProjectionRow {
    string chunk_id = 1;
    uint64 chunk_index = 2;
    uint64 sequence = 3;
    int64 created_at_unix_ms = 4;
    string source = 5;
    string level = 6;
    string message = 7;
}

message QueryProjectionResponse {
    repeated ProjectionRow rows = 1;
}

// How the daemon learned about a peer.
enum PeerSource {
    PEER_SOURCE_UNSPECIFIED = 0;
    // Discovered via mDNS service browsing.
    PEER_SOURCE_MDNS = 1;
    // Supplied manually via a decoded invitation.
    PEER_SOURCE_MANUAL = 2;
    // Connected inbound (the remote initiated the QUIC handshake).
    PEER_SOURCE_INBOUND = 3;
}

// Current connection state for a peer.
enum PeerConnectionState {
    PEER_CONNECTION_STATE_UNSPECIFIED = 0;
    // Discovered but no active QUIC connection has been attempted.
    PEER_CONNECTION_STATE_DISCOVERED = 1;
    // An outbound connection attempt is in progress.
    PEER_CONNECTION_STATE_CONNECTING = 2;
    // A QUIC connection is currently open with the peer.
    PEER_CONNECTION_STATE_CONNECTED = 3;
    // A previously open connection has dropped.
    PEER_CONNECTION_STATE_DISCONNECTED = 4;
    // The most recent attempt failed; the daemon will retry later.
    PEER_CONNECTION_STATE_FAILED = 5;
}

message PeerInfo {
    // Hex-encoded public key (the wire-level `node_id`). Empty for
    // peers discovered via mDNS whose TXT record could not be parsed.
    string node_id = 1;
    // Socket address (`ip:port`) the peer advertises for QUIC traffic.
    string socket_addr = 2;
    // How the daemon learned about this peer.
    PeerSource source = 3;
    // Current connection state.
    PeerConnectionState state = 4;
    // Last observation timestamp, in milliseconds since the Unix epoch.
    // Bumped by mDNS re-announcements and connection-state changes —
    // a reachability signal, NOT proof that data actually synced.
    int64 last_seen_unix_ms = 5;
    // If the most recent connection attempt failed, this carries a
    // short human-readable description of the failure.
    string last_error = 6;
    // Timestamp of the most recent SUCCESSFUL direct-sync round with
    // this peer, in milliseconds since the Unix epoch (0 = never
    // synced). This is the honest freshness clock for the peer's
    // synced register replicas: unlike `last_seen_unix_ms` it does not
    // advance on mDNS chatter, so a peer that stays discoverable while
    // its sync fails reads stale. The dashboard's 60s staleness
    // threshold keys off this field.
    int64 last_synced_unix_ms = 7;
}

message CreateInvitationRequest {
    // Optional override of the public address the invitation should
    // advertise. When empty, the daemon advertises the address its
    // QUIC endpoint is bound to (substituting `127.0.0.1` for the
    // wildcard `0.0.0.0` / `[::]`).
    string advertise_addr = 1;
}

message CreateInvitationResponse {
    // Bech32-encoded invitation string.
    string invitation = 1;
    // Hex-encoded public key embedded in the invitation.
    string node_id = 2;
    // Socket address (`ip:port`) embedded in the invitation.
    string socket_addr = 3;
}

message ConnectToPeerRequest {
    // Bech32-encoded invitation string produced by `CreateInvitation`.
    string invitation = 1;
}

message ConnectToPeerResponse {
    // Peer info recorded for the invitation. The connection state
    // reflects the outcome of the QUIC handshake (CONNECTED on
    // success, FAILED with `last_error` populated otherwise).
    PeerInfo peer = 1;
}

message ListPeersRequest {}

message ListPeersResponse {
    repeated PeerInfo peers = 1;
}

// A peer the daemon has explicitly approved for direct sync.
message PairingInfo {
    // Hex-encoded `node_id` of the paired peer.
    string node_id = 1;
    // Wall-clock at which the pairing was recorded, in milliseconds
    // since the Unix epoch.
    int64 paired_at_unix_ms = 2;
    // Optional human-readable note (e.g., a device label) attached at
    // approval time.
    string note = 3;
}

message ApprovePeerRequest {
    // Hex-encoded `node_id` to approve. Must be 64 lowercase hex
    // characters (32-byte public key).
    string node_id = 1;
    // Optional free-form note saved alongside the pairing.
    string note = 2;
}

message ApprovePeerResponse {
    PairingInfo pairing = 1;
}

message RevokePeerRequest {
    string node_id = 1;
}

message RevokePeerResponse {
    // `true` if a pairing existed and was removed, `false` if the peer
    // was not previously paired.
    bool removed = 1;
}

message ListPairingsRequest {}

message ListPairingsResponse {
    repeated PairingInfo pairings = 1;
}

// Per-chunk outcome of a direct-sync session.
message SyncChunkOutcome {
    // Path of the chunk that was synced.
    string chunk_id = 1;
    // Number of bytes received from the remote (delta + snapshot).
    uint64 received_bytes = 2;
    // Number of bytes transmitted to the remote (delta + snapshot).
    uint64 sent_bytes = 3;
    // `true` if the local snapshot for this chunk advanced as a
    // result of applying remote updates.
    bool advanced = 4;
}

message SyncWithPeerRequest {
    // Hex-encoded `node_id` of the peer to sync with. The peer must
    // be present in the registry with an active connection and
    // approved for pairing on both sides.
    string node_id = 1;
}

message SyncWithPeerResponse {
    // Hex-encoded `node_id` of the peer that was synced with.
    string node_id = 1;
    // Total bytes received during this sync session.
    uint64 received_bytes = 2;
    // Total bytes transmitted during this sync session.
    uint64 sent_bytes = 3;
    // Per-chunk outcome breakdown.
    repeated SyncChunkOutcome chunks = 4;
}

message ListHostCapabilitiesRequest {}

// One host's capability register as currently known to this daemon.
message HostCapability {
    // Document path (`capability/{node_id}`).
    string document_id = 1;
    // Hex-encoded node the register describes (also its single writer).
    string owner_node_id = 2;
    // Current field values as a JSON object string. JSON keeps the
    // wire stable while the capability schema evolves — readers ignore
    // unknown fields and treat missing fields as "unknown".
    string fields_json = 3;
}

message ListHostCapabilitiesResponse {
    repeated HostCapability hosts = 1;
}

message ListHostReposRequest {}

// One host's checked-out-repos register as currently known to this
// daemon.
message HostRepos {
    // Document path (`repos/{node_id}`).
    string document_id = 1;
    // Hex-encoded node the register describes (also its single writer).
    string owner_node_id = 2;
    // Current map of canonical repo id → HEAD commit hash, as a JSON
    // object string.
    string repos_json = 3;
}

message ListHostReposResponse {
    repeated HostRepos hosts = 1;
}

// Kind of session lifecycle transition being reported.
enum SessionEventKind {
    SESSION_EVENT_KIND_UNSPECIFIED = 0;
    // A session started: creates the register entry (stamping
    // started_at) and merges `details_json` into it.
    SESSION_EVENT_KIND_STARTED = 1;
    // A session's attributes changed (e.g. status flipped to
    // waiting-on-user): merges `details_json` over the existing entry.
    // Reported for transitions the dashboard should see, not as a
    // heartbeat.
    SESSION_EVENT_KIND_UPDATED = 2;
    // A session ended: removes the register entry (the register holds
    // only LIVE sessions; history belongs to the session log).
    SESSION_EVENT_KIND_ENDED = 3;
}

// The displayable state of a session, ordered by intervention strength.
// The daemon folds one of these per producer into the effective status.
enum SessionStatusState {
    SESSION_STATUS_STATE_UNSPECIFIED = 0;
    ACTIVE = 1;
    IDLE = 2;
    WAITING_ON_USER = 3;
}

// Which producer authored a status contribution — its slot key in the
// entry. `PERMISSION_HOOK` and `IDLE_HOOK` are distinct even though both
// originate from `claudine handle`.
enum StatusProducer {
    STATUS_PRODUCER_UNSPECIFIED = 0;
    LIFECYCLE = 1;
    SINK = 2;
    IDLE_HOOK = 3;
    PROCESS_MONITOR = 4;
    PERMISSION_HOOK = 5;
}

// Why the producer believes the state — surfaced to the UI for honesty.
enum SessionStatusBasis {
    SESSION_STATUS_BASIS_UNSPECIFIED = 0;
    SESSION_STATUS_BASIS_LIFECYCLE = 1;
    PERMISSION_ASK = 2;
    INTERACTIVE_TURN_COMPLETE = 3;
    PROCESS_HEURISTIC = 4;
}

// One producer's opinion about a session's displayed status. The daemon
// stores it in the producer's slot (revision-guarded, last-writer-wins
// per slot) and recomputes the effective status from every live slot.
message StatusContribution {
    SessionStatusState state = 1;
    StatusProducer producer = 2;
    SessionStatusBasis basis = 3;
    // Producer-captured unix-ns wall clock. The daemon rejects any
    // contribution whose revision <= the stored slot revision.
    int64 revision = 4;
}

message ReportSessionEventRequest {
    // Producer-scoped session identifier (whatever identifier the
    // producer natively has; correlation across producers happens
    // downstream, per the logging-refactor rulings).
    string session_id = 1;
    SessionEventKind kind = 2;
    // DESCRIPTIVE session attributes only (agent, model, repo,
    // interactive, pid, permission_signal, ...) as a JSON object string.
    // Merged over the existing entry; ignored for ENDED. The status
    // opinion moved to the typed `status` field; the daemon owns and
    // strips started_at_unix_ms / updated_at_unix_ms / status /
    // status_basis / status_producer / status_slots.
    string details_json = 3;
    // Present when this event carries a status opinion (a producer's
    // slot contribution). Absent for pure descriptive updates.
    StatusContribution status = 4;
}

message ReportSessionEventResponse {
    // Number of sessions active on this host after applying the event.
    uint64 active_count = 1;
}

message ListActiveSessionsRequest {}

// One host's active-session register as currently known to this daemon.
message HostActiveSessions {
    // Document path (`sessions-active/{node_id}`).
    string document_id = 1;
    // Hex-encoded node the register describes (also its single writer).
    string owner_node_id = 2;
    // session_id → entry-object map as a JSON object string. Entries
    // carry the reported attributes plus daemon-stamped
    // started_at_unix_ms / updated_at_unix_ms (consumers judge
    // staleness from the latter; a crashed producer never reports its
    // end).
    string sessions_json = 3;
}

message ListActiveSessionsResponse {
    repeated HostActiveSessions hosts = 1;
}

// ---------------------------------------------------------------------
// Direct-sync wire protocol (transported over QUIC bidirectional streams,
// length-prefixed with a big-endian u32 per frame).
// ---------------------------------------------------------------------

// Wire-level analogue of `rendezvous_core::SignedEnvelope`. Serialised
// as protobuf so receivers can verify the Ed25519 signature without
// trusting transport metadata.
message SignedEnvelopeWire {
  // 32-byte compressed Ed25519 public key of the sender.
  bytes sender = 1;
  // 32-byte monotonic message identifier.
  bytes message_id = 2;
  // 32-byte BLAKE3 content hash of the payload.
  bytes content_hash = 3;
  // 64-byte Ed25519 signature.
  bytes signature = 4;
  // Opaque payload bytes.
  bytes payload = 5;
  // Chunk path this envelope is bound to (e.g.
  // "session/shared/s1/part/0").
  string document_id = 6;
  // Payload kind: 0 = snapshot, 1 = delta, 2 = snapshot-replace.
  int32 payload_kind = 7;
}

// Initial frame sent by both sides of a sync session. The receiver
// uses `node_id` to look the sender up in its pairing registry.
message SyncHello {
    // 32-byte compressed Ed25519 public key of the sender.
    bytes node_id = 1;
    // Protocol version. Currently `1`.
    uint32 version = 2;
}

// One advertisement of the local state for a session-log chunk.
message SyncChunkAdvertise {
    // Path of the chunk, in `session/{node}/{session}/part/{idx}` form.
    string chunk_id = 1;
    // Loro version vector encoded via `VersionVector::encode()`. Empty
    // when the sender has no copy of the chunk and wants the full
    // snapshot.
    bytes version_vector = 2;
}

// Closing frame in the advertise phase. Tells the peer no more
// advertisements are coming.
message SyncAdvertiseEnd {}

// A signed delta carrying new Loro updates the peer is missing.
message SyncDelta {
    // Path of the chunk the delta applies to.
    string chunk_id = 1;
    // Signed envelope wrapping the encoded Loro updates.
    SignedEnvelopeWire envelope = 2;
    // `true` if `envelope.payload` is a full Loro snapshot (peer had
    // no prior state); `false` if it is an incremental update bundle.
    bool is_snapshot = 3;
    // `true` when the snapshot must REPLACE the receiver's replica
    // wholesale: the sender's document was re-based (history
    // compacted) past the receiver's advertised version, so no delta
    // can connect and merging does not converge. Implies
    // `is_snapshot`. The flag is authenticated via the envelope's
    // `payload_kind` (2 = snapshot-replace), which is covered by the
    // signature.
    bool replace = 4;
}

// Closing frame in the sync phase. Tells the peer no more deltas are
// coming for this direction.
message SyncEnd {}

// Fatal error report. The sender closes its stream half immediately
// after writing this frame.
message SyncError {
    uint32 code = 1;
    string message = 2;
}

// Single frame on the sync stream. Exactly one variant is populated.
message SyncFrame {
    oneof kind {
        SyncHello hello = 1;
        SyncChunkAdvertise advertise = 2;
        SyncAdvertiseEnd advertise_end = 3;
        SyncDelta delta = 4;
        SyncEnd end = 5;
        SyncError error = 6;
    }
}
