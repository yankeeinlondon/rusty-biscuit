[package]
name = "rendezvous-daemon"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Long-running companion daemon for the Claudine CLI. Phase 2 adds Loro/redb/DuckDB session-log persistence on top of the Phase-1 IPC scaffold."

[[bin]]
name = "rendezvous-daemon"
path = "src/main.rs"

[lib]
name = "rendezvous_daemon"
path = "src/lib.rs"

[dependencies]
rendezvous-core = { path = "../core" }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "server", "router"] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
loro = "1"
redb = "2"
sniff = { path = "../../../sniff/lib" }
duckdb = { version = "1", features = ["bundled"] }
flume = "0.11"
parking_lot = "0.12"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
mdns-sd = "0.12"

# The current-user DACL shared by the named-pipe endpoint and the data root:
# SECURITY_ATTRIBUTES and PSECURITY_DESCRIPTOR live in Win32_Security, the SDDL
# and GetNamedSecurityInfoW conversions in Win32_Security_Authorization,
# LocalFree in Win32_Foundation, and CreateDirectoryW (which applies the DACL at
# creation, leaving no permissive window) in Win32_Storage_FileSystem.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rendezvous-client = { path = "../client" }
rendezvous-core = { path = "../core", features = ["test-support"] }

# umask(2) has no std wrapper, and the socket-mode test's whole point is that
# the daemon's mode does not come from the umask.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# Declared rather than defaulted (2026-09-07-faster-claudine-tests, Phase 6).
# CI runs L1 with no features. `peer_discovery.rs`'s two `real_*` identities
# bind a real mDNS responder to the runner's network and are excluded by the L1
# tier filter by name; their route is `just test-real` inside
# `claudine/rendezvous`, which Phase 6 added — before it they were reachable by
# no recipe at all.
[package.metadata.ci.tests]
tiers = ["L1"]
features = []
local-features = []
