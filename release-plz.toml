# release-plz configuration for rusty-biscuit monorepo
# Documentation: https://release-plz.dev/docs/config
#
# Crate→directory mapping is authoritative via `sniff repo packages -v`.

[workspace]
# PR configuration
pr_draft = true
pr_labels = ["release", "automated"]

# Git release configuration
git_release_enable = true
git_release_draft = false
git_tag_enable = true
git_tag_name = "{{ package }}-v{{ version }}"

# No crates.io publishing, and no crates.io READING either.
#
# `publish = false` only skips `cargo publish`. Version detection still asked
# crates.io for each member's "current" version, and a dozen of this
# workspace's names are taken there by unrelated authors — `research` (2.2.2),
# `reaper` (2.0.0), `playa`, `worktree`, `queue`, `sniff`, `darkmatter`,
# `messenger`, `homelab`, `visualizer`, `dmls`, `queue`. release-plz downloaded
# those strangers' crates and diffed this source against them, which is both
# the wall of `Package … not found` warnings and a version baseline belonging
# to someone else's project.
#
# `git_only` moves version detection onto this repository's own
# `{{ package }}-v{{ version }}` tags and contacts no registry at all. It
# cannot be combined with `publish = true`, which is already the case here.
publish = false
git_only = true
# Disabled: semver-checks builds each crate during version determination, and
# with `publish = false` there is no crates.io consumer for semver gating.
semver_check = false
changelog_update = true
# Proposal branch prefix and release trigger, stated rather than inherited:
# publication refuses any merged pull request whose branch lacks this prefix,
# and releases happen only when a merged release proposal bumps a version.
pr_branch_prefix = "release-plz-"
release_always = false

# TEMPORARY first-release allowlist. Workspace-wide eligibility is off and only
# `sniff-detection-cli` and `git-wt-cli` opt back in below, so the first run of
# a publication path that has never succeeded can create at most two permanent
# tags. A calculation that proposes any other package is an error, not a
# reason to widen this list. Restore workspace-wide eligibility (delete this
# line and the two `release = true` entries) in a separate change once the
# first release's tags, GitHub Releases, and published-release event are
# verified.
release = false

[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first | trim }}
{%- endfor %}
{% endfor %}
"""
trim = true
sort_commits = "newest"

commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^docs", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^test", group = "Testing" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps\\)", group = "Dependencies" },
    { message = "^chore", group = "Miscellaneous" },
]

# Package-specific changelog paths
[[package]]
name = "darkmatter"
changelog_path = "darkmatter/CHANGELOG.md"

[[package]]
name = "research-cli"
changelog_path = "research/cli/CHANGELOG.md"

[[package]]
name = "research"
changelog_path = "research/lib/CHANGELOG.md"

[[package]]
name = "biscuit-speaks-cli"
changelog_path = "biscuit-speaks/cli/CHANGELOG.md"

[[package]]
name = "sniff-detection-cli"
changelog_path = "sniff/cli/CHANGELOG.md"
release = true # temporary first-release allowlist; see [workspace].release

[[package]]
name = "git-wt-cli"
changelog_path = "worktree/cli/CHANGELOG.md"
release = true # temporary first-release allowlist; see [workspace].release

[[package]]
name = "sniff"
changelog_path = "sniff/lib/CHANGELOG.md"

[[package]]
name = "unchained-ai"
changelog_path = "unchained-ai/lib/CHANGELOG.md"

[[package]]
name = "unchained-ai-gen"
changelog_path = "unchained-ai/gen/CHANGELOG.md"

[[package]]
name = "model_id"
changelog_path = "unchained-ai/model_id/CHANGELOG.md"

# Placeholder packages - exclude from releases
[[package]]
name = "biscuit-tui"
release = false

[[package]]
name = "biscuit-tui-cli"
release = false

[[package]]
name = "tabby"
release = false

[[package]]
name = "ui"
release = false
