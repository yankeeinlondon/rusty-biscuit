# Stable test-tier filter expressions (Topic 1 / D15 in the testing-best-practices spec).
#
# Tier identifiers appear in either the test function name or the enclosing
# module path. Nextest does not yet expose user-named filterset aliases as a
# stable feature, so each canonical `just` recipe passes the appropriate
# expression to `nextest run -E '...'` directly. Treat the expressions below as
# the authoritative source for shared lifecycle recipes:
#
#   level2  = test(/(^|::)level2_/)
#   level3  = test(/(^|::)level3_/)
#   browser = test(/(^|::)browser_/)
#   real    = test(/(^|::)real_/)
#   slow    = test(/(^|::)level2_/) + test(/(^|::)level3_/) + test(/(^|::)browser_/) + test(/(^|::)real_/) + test(/(^|::)slow_/)
#
# `just sanity` uses `!(...slow...)` to exclude every non-default tier in one shot.

experimental = ["setup-scripts"]

# Every `ci-build` end-to-end fixture first rebuilds the shipped binary
# (`shipped_wrapper`), deliberately, so a stale one can never be driven. From a
# CI archive the checkout's own `target/` starts cold: the first fixture to ask
# compiled `ci-build` and its dependencies inside its own test, every concurrent
# fixture queued on Cargo's lock behind it, and on `windows-latest` the first
# four hit the 90s kill together. Building once here, before any of them runs,
# leaves each fixture's own rebuild the no-op it is on a warm tree.
[scripts.setup.build-ci-build]
command = 'cargo build --quiet --no-default-features --features build-tools --manifest-path scripts/Cargo.toml --bin ci-build'

[[profile.default.scripts]]
filter = 'binary_id(repo-deps::bin/ci-build)'
setup = 'build-ci-build'

# A process's first CoreText font scan lists the directory its executable is
# in, and concurrent listings are served one after another. A test binary's is
# `target/debug/deps`, which a long-lived target fills with 100,000+ entries:
# eleven `wt list` graph-layout tests starting together then took 7-15 s each,
# against 0.7 s with this. Naming another executable's path as the process's
# own (`CFProcessPath`) makes the scan list `/usr/bin` instead; nothing else in
# these tests reads the main bundle. An installed `wt` lists its own small
# directory, so production never pays this.
[scripts.setup.coretext-small-bundle]
command = 'sh -c "echo CFProcessPath=/usr/bin/true >> $NEXTEST_ENV"'

[[profile.default.scripts]]
platform = { host = "cfg(target_os = \"macos\")" }
filter = 'package(worktree-cli) & (test(/^commands::git_graph::tests::gathered_graph_lays_out_/) | test(=commands::git_graph::tests::the_observed_graph_keeps_recent_commits_on_every_lane_at_200x60) | test(=commands::list::tests::run_pipeline_gathers_the_graph_on_a_narrow_image_terminal))'
setup = 'coretext-small-bundle'

# Every biscuit-visualized render over the host's fonts asks fontique, so the
# same scan: about 150 such L1 tests ran at 4.5-5.8 s each together, against
# about 1 s with this. The tier markers are left out because those tests may
# start applications, which must keep their own main bundle.
[[profile.default.scripts]]
platform = { host = "cfg(target_os = \"macos\")" }
filter = 'package(biscuit-visualized) & !test(/(^|::)(level2_|level3_|browser_|real_)/)'
setup = 'coretext-small-bundle'

[test-groups]
# Claudine's L1 library tests repeatedly perform repository discovery, so CI
# keeps their concurrency bounded on contended runners. Local runs use the
# normal scheduler so developer machines are not capped at four tests.
claudine-l1 = { max-threads = 4 }
# Sniff exercises shared Windows host-network APIs from both direct tests and
# spawned CLI processes. Windows may fail-fast a changing test process when
# full network detections overlap, so CI runs them one process at a time. Local
# Windows development retains Nextest's normal scheduler.
sniff-windows-l1 = { max-threads = 1 }
# Schematic's fresh-output guard compiles generated client crates in one shared
# child target directory. One at a time keeps them from queuing on Cargo's lock
# inside each other's timeouts.
schematic-fresh-output = { max-threads = 1 }
# Apple Terminal has no background mode: each L2 test opens a visible window on
# the developer's desktop. Parallel L2 runs them one at a time so at most one
# window is open, while the rest of the tier keeps its parallel workers.
apple-terminal-l2 = { max-threads = 1 }
# Every FSEvents stream registers with the one fseventsd, which serves those
# registrations one after another: fifteen `wt remove` observer tests starting
# streams together each waited up to 5s, while one alone starts in about 20ms.
# macOS runs them one at a time; the rest of the suite keeps its workers.
fsevents-l1 = { max-threads = 1 }

[profile.default]
# Direct local nextest invocations also leave capacity for other host work.
# Canonical just recipes calculate the CI <=4-core exception and export
# NEXTEST_TEST_THREADS; explicit CLI settings retain Nextest's precedence.
test-threads = -2
# A test that passes only on retry is still a failed test run. Keep retries
# disabled so timing and resource-contention defects remain visible locally.
retries = 0
# Mark tests slower than 5s as slow; terminate after 6×5s = 30s. Many integration
# tests spawn the claudine binary plus git/composition/system-prompt resolution
# and finish in 5–10s isolated but get squeezed past 15s under heavy parallel
# load. 30s catches real hangs without killing healthy-but-contended tests.
slow-timeout = { period = "5s", terminate-after = 6 }
# Fail any test that leaves a child process holding its stdout/stderr open when
# it exits (nextest's `LEAK` status). `result = "fail"` stays: a genuinely
# leaked child is a hard failure everywhere.
#
# The window is 30s, not the 100ms stock default. Under full-workspace parallel
# load, nextest's post-test pipe-drain observation is scheduler-starved on this
# host and the spurious LEAK-FAIL lands on a RANDOM fast test each run — every
# victim exits code 0 with assertions green and provably holds no pipe (pure
# string/formatting tests flagged repeatedly, e.g. sniff's `error::tests::*_display`,
# messenger-cli's `windows_shortcut_path_builds_start_menu_layout`,
# biscuit-terminal's `standalone_code_block_emits_no_restoration_escape`,
# claudine-cli's argv-parse tests that never spawn at all). The historical
# record was a dozen per-package exemptions (worktree, preflight_graph,
# biscuit-speaks-cli, claudine-cli L2, characterization, biscuit-terminal,
# browser-tier Chrome teardown, and more); that many exceptions — plus victims
# observed lagging even a 1s window — is evidence the global default was the
# thing that was wrong, so one shared window replaced those blocks. A 5s window
# still produced a false LEAK-FAIL on a pure parser test in a loaded macOS CI
# run; its assertions finished successfully and 26 immediate local CI-profile
# reruns were clean. The 30s window covers transient pipe inheritance without
# slowing clean tests (their pipes reach EOF immediately); an actual leak still
# waits out the window and fails.
leak-timeout = { period = "30s", result = "fail" }

# The sequence-budget end-to-end fixtures spawn real `claudine` sequence
# workers whose steps sleep (`sleep:3000`, a ten-minute `hang` that the ledger
# must stop) and then wait on ledgers, pid files, and shared locks. Isolated
# they take 0.5–4.2s each; inside the full `claudine-cli` L1 run on a host at
# load ~72 (four agent sessions plus a cold rebuild, 2026-09-20) all ten were
# killed at the default 30s ceiling. Their own deadlines are 60s and 40s, so
# the 90s leash lets a loaded run finish while a genuine hang still trips it.
[[profile.default.overrides]]
filter = 'binary_id(claudine-cli::l1) & test(/^sequence_budget::/)'
slow-timeout = { period = "30s", terminate-after = 3 }

# This test composes every variable the `ctx` catalog declares, once under a
# deliberate full `ComposeContext::capture()` and once under ambient
# `ComposeOptions::new()`, then compares the two renderings. Two complete
# runtime captures is not incidental cost — it *is* the comparison, and each
# walks the working tree for repository, document, and file-change facts
# (~1.9s apiece in this monorepo on native Windows). The toolchain-free WSL
# archive has measured 48s under suite load because both captures cross its
# virtualized filesystem, so this remains bounded by a 90s termination leash.
#
# It earns that: when the 2026-08-02 ambient-capture regression is reintroduced,
# this reports all 36 blanked variables by name. The narrower two-variable test
# it replaced cost nearly as much, because the capture dominates regardless of
# how many variables are read.
[[profile.default.overrides]]
filter = 'test(=ambient_ctx_capture::every_catalog_variable_survives_ambient_options)'
slow-timeout = { period = "30s", terminate-after = 3 }

# The real-archive relocation proof copies this repository once, produces two
# real package archives from that one checkout, then runs each archived suite
# with the producer deleted. Its duration is those compiles: 58s measured on a
# 16-core M4 (down from 107s, before the producer checkout and target directory
# were shared across the two packages). It is excluded from L1 — `repo-deps`
# does not set `l1-include-slow`, so no recipe, hook, or CI cell selects it —
# and this leash exists only so a deliberate direct run can finish. Same 90s as
# every other earned override here, not a bespoke number: 58s fits, and a
# producer that never returns still trips it.
[[profile.default.overrides]]
filter = 'test(=archive::tests::slow_real_package_archives_read_their_fixtures_from_the_consumers_checkout)'
slow-timeout = { period = "30s", terminate-after = 3 }

# Tree Hugger's generic-position boundary tests each analyze one generated
# source whose generic list holds 65,536 or 65,537 parameters (about half a
# megabyte): the `u16` boundary is the contract, so the source cannot shrink.
# Each test runs one analysis; the C++ and C# readers, whose parameters are
# records, take ~7s alone in a debug build and 15-20s when the 37 boundary
# tests run together on a loaded macOS host (2026-10-05). Same 90s leash as
# the other earned overrides; CI's profile default already allows it.
[[profile.default.overrides]]
filter = 'package(tree-hugger) & test(/generic_boundary::|oversized_owner_warm_hits::|oversized_enclosing_generic|oversized_owner_impl/)'
slow-timeout = { period = "30s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'test(/(^|::)level2_apple_terminal_/)'
test-group = 'apple-terminal-l2'

# Browser-tier tests spawn real headless Chrome, whose multi-process teardown
# (helper + crashpad processes that inherit the test's stdout) is the slowest
# in the workspace. Chrome's teardown fits the global 5s leak window (the
# tier also runs with `-j 1`, see `_test_browser`, so only one Chrome tears
# down at a time), so the historical 5s browser override was removed with the
# other exemptions; `result = "fail"` still catches a genuinely runaway
# browser.

# claudine-cli's L2 tier runs in parallel self-spawn mode (see
# `claudine/justfile`'s `test-l2` and `just/devops.just`'s `BISCUIT_L2_THREADS`
# path): these tests own an internal ~40s wait-for-marker deadline (the
# tmux spawn boots a login shell, then a real claudine run drives a fake
# provider through the full lifecycle). The default 5s×6 = 30s termination
# ceiling is *below* that internal deadline, so a healthy-but-heavily-contended
# run gets killed by nextest at 30s before its own deadline can settle — which,
# previously, with retries enabled, surfaced as repeated timeouts even though
# nothing is actually hung. Raise the termination ceiling to 30s×3 = 90s so a
# contended run is governed by its own 40s deadline + assertion, while a
# genuine deadlock still trips the longer window.
[[profile.default.overrides]]
platform = { host = "cfg(target_os = \"macos\")" }
filter = 'package(worktree) & (test(/^remove::.*::native_/) | test(/^remove::observation::fsevents::/))'
test-group = 'fsevents-l1'

[[profile.default.overrides]]
filter = 'package(claudine-cli) & test(/level2_/)'
slow-timeout = { period = "30s", terminate-after = 3 }

# Each native-provider interactive startup test boots a real agentic CLI and
# waits for two real model turns; its own deadlines total 330s (180s first
# turn, 120s second, 30s exit), which the default 30s ceiling cuts short.
[[profile.default.overrides]]
filter = 'binary_id(claudine-cli::real) & test(/^real_native_interactive_startup::/)'
slow-timeout = { period = "60s", terminate-after = 6 }

# `wt --ff` against an origin that holds the fetch proves the listing returns
# at the worker's own 60 s fetch deadline, so the elapsed time is the contract.
# The 30s×3 = 90s ceiling leaves the test's own upper bound (60 s plus 3 s) in
# charge. It runs only in `just test-perf` (`perf_`), serially.
[[profile.default.overrides]]
filter = 'package(worktree-cli) & test(=perf_fast_forward_against_a_held_fetch_reports_within_the_fetch_deadline)'
slow-timeout = { period = "30s", terminate-after = 3 }

# The graph-stage timings run `wt list` in a pseudo-terminal that never
# answers terminal queries, so every run waits out about 2.5 s of query
# timeouts. One sample per fixture (the default) needs about 12 s; a recorded
# 10-sample run about 120 s. The 60s×5 = 300s ceiling covers the recorded run.
# It runs only in `just test-perf` (`perf_`), serially.
[[profile.default.overrides]]
filter = 'package(worktree-cli) & test(=perf_graph_stages_are_reported_for_every_graph_fixture)'
slow-timeout = { period = "60s", terminate-after = 5 }

# The Kitty graph tests skip, with the reason on stderr, when the host cannot
# screenshot what Kitty drew (no Screen Recording permission). A skip reports
# as a pass and Kitty never runs in CI, so the passing output is shown to keep
# that reason (and the kept evidence paths) visible in `just test-l2` and
# pre-push runs.
[[profile.default.overrides]]
filter = 'package(worktree-cli) & binary(level2_graph_in_kitty)'
success-output = "final"

# Every `slow_` test in schematic-gen's L1 binary generates a client crate and
# compiles it offline with a child Cargo (`tests/common/fresh_output.rs`). A
# cold compile of all 18 APIs takes minutes; the 60s x 15 = 15 min ceiling
# bounds a hang. Nextest kills the test's process group at the ceiling, which
# also ends the child build.
[[profile.default.overrides]]
filter = 'binary_id(schematic-gen::l1) & test(/(^|::)slow_/)'
test-group = 'schematic-fresh-output'
slow-timeout = { period = "60s", terminate-after = 15 }

# schematic-runtime's `slow_` L1 test is its trybuild suite, which builds the
# crate and every compile-fail case with a child Cargo. Cold, that takes about
# 17s on build-linux and passed the default 30s kill on native Windows; the
# 60s x 5 = 5 min ceiling bounds a hang.
[[profile.default.overrides]]
filter = 'binary_id(schematic-runtime::l1) & test(/(^|::)slow_/)'
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.local-evidence]
# Evidence needs Nextest's machine-readable report without CI's runner-specific
# concurrency caps. Test selection and failure policy inherit from the local
# default profile; the planner binds reuse to the gate-input identity.
junit = { path = "test-results.xml" }

[profile.ci]
# Deterministic L1 failures must run exactly ONCE (D6). Blanket retries would run
# a compile/assertion/timeout failure up to 4× before reporting the same result —
# masking flakes and quadrupling wasted time. Only the resource-sensitive tiers
# below keep a scoped, justified retry.
retries = 0
# Mark slow at 30s, kill at 90s (3 x 30s).
#
# Was `10s x 3` = a 30-second kill, which was below what correct tests need on a
# contended runner and, with `retries = 0`, gave them no second chance. Measured
# on run 30562649123: the claudine shards reported 11 timeouts and ZERO assertion
# failures — every "failure" was the harness killing a slow test. One of them
# (`agent_errors_fleet::exhausted_remediation_fails_finalize_and_preserves_findings`)
# takes ~21s alone on an 8-core dev machine and 83s under full-suite contention;
# a 2-core runner is slower still.
#
# 90s is not a licence to be slow — it is the difference between "this is hung"
# and "this is slow", which is what a termination ceiling should express. The
# per-test overrides that remain in this file all raise the period to 30s for
# exactly this reason; the count used to be fifteen, which was evidence the
# global default was the thing that was wrong. Note that a per-test
# `{ period = "30s", terminate-after = 3 }` inside *this* profile is now a no-op
# against the profile default above — an override here only earns its place by
# expressing a contract that must survive a change to that default.
#
# `retries = 0` deliberately stays. A timeout must not be retried into looking
# healthy — it should either fit the ceiling or be reported.
slow-timeout = { period = "30s", terminate-after = 3 }
# Leaked child processes are a hard failure in CI as well. The 30s observation
# window matches the default-profile policy above; `result = "fail"` keeps
# genuine leaks fatal without turning timing-sensitive pipe drainage into a
# nondeterministic gate.
leak-timeout = { period = "30s", result = "fail" }
# JUnit XML for CI dashboards.
junit = { path = "test-results.xml" }

# Keep the resource-sensitive real-terminal tier retry-free too: transient PTY
# or remote-control failures must remain visible to the CI gate.
[[profile.ci.overrides]]
filter = 'test(/level2_/)'
retries = 0

[[profile.ci.overrides]]
filter = 'package(claudine) & !test(/(^|::)level2_/) & !test(/(^|::)level3_/) & !test(/(^|::)browser_/) & !test(/(^|::)real_/) & !test(/(^|::)slow_/)'
test-group = 'claudine-l1'

[[profile.ci.overrides]]
platform = { host = "cfg(windows)" }
filter = 'package(sniff) + package(sniff-cli)'
test-group = 'sniff-windows-l1'

# The wall-clock performance assertion needs an otherwise idle CI runner to
# avoid turning unrelated contention into a gate failure. Local runs favor
# throughput and leave it under the normal scheduler.
[[profile.ci.overrides]]
filter = 'test(=integration::test_detect_completes_in_reasonable_time)'
threads-required = "num-cpus"

# The browser tier runs serially (see `_test_browser`) but does not retry.
[[profile.ci.overrides]]
filter = 'test(/browser_/)'
retries = 0

# See the default-profile note: this test's cost is two complete runtime
# captures, which is the comparison it performs. CI uses the same measured WSL
# allowance.
[[profile.ci.overrides]]
filter = 'test(=ambient_ctx_capture::every_catalog_variable_survives_ambient_options)'
slow-timeout = { period = "30s", terminate-after = 3 }

# See the default-profile note: Chrome teardown fits the global 5s window,
# so the historical 5s browser override was removed with the other
# exemptions; `result = "fail"` still catches a genuinely runaway browser.
