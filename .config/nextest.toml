# Stable test-tier filter expressions (Topic 1 / D15 in the testing-best-practices spec).
#
# Tier identifiers appear in either the test function name or the enclosing
# module path. Nextest does not yet expose user-named filterset aliases as a
# stable feature, so each canonical `just` recipe passes the appropriate
# expression to `nextest run -E '...'` directly. Treat the expressions below as
# the authoritative source for shared lifecycle recipes:
#
#   level2  = test(/level2_/)
#   level3  = test(/level3_/)
#   browser = test(/browser_/)
#   real    = test(/real_/)
#   slow    = test(/level2_/) + test(/level3_/) + test(/browser_/) + test(/real_/) + test(/slow_/)
#
# `just sanity` uses `!(...slow...)` to exclude every non-default tier in one shot.

[test-groups]
# biscuit-speaks-cli integration tests spawn the `so-you-say` binary, which
# drives real OS TTS/audio (`say`, audio playback). Running a dozen of those
# concurrently saturates the shared audio subsystem: process teardown lags, which
# both inflates "slow" markers and trips nextest's post-test pipe-drain LEAK check
# on whichever fast test loses the race. Capping concurrency keeps only a few
# audio children alive at once — same philosophy as the browser tier's `-j 1`.
# 4 was the empirical sweet spot here: zero flakes, far fewer spurious slow marks.
tts-audio = { max-threads = 4 }

[profile.default]
# Retry failed tests up to 3 times to mitigate flakiness in PTY tests or timing issues
retries = 3
# Mark tests slower than 5s as slow; terminate after 6×5s = 30s. Many integration
# tests spawn the claudine binary plus git/composition/system-prompt resolution
# and finish in 5–10s isolated but get squeezed past 15s under heavy parallel
# load. 30s catches real hangs without killing healthy-but-contended tests.
slow-timeout = { period = "5s", terminate-after = 6 }
# Fail any test that leaves a child process holding its stdout/stderr open when
# it exits (nextest's `LEAK` status). Keep the default 100ms grace period so
# clean tests are not slowed — only an actual leak waits the window out. To
# downgrade leaks back to a non-fatal warning, drop `result = "fail"`.
leak-timeout = { period = "100ms", result = "fail" }

# Tests that intentionally wait on a real clock (e.g. rate-limit pause policies)
# need an even longer leash than the default termination window.
[[profile.default.overrides]]
filter = 'test(=compose_loop_rate_limit_pause_waits_then_continues)'
slow-timeout = { period = "30s", terminate-after = 3 }

# This sequence perf test drives a failing multi-step CLI run and may finish just
# beyond the default 30s termination window on macOS debug builds.
[[profile.default.overrides]]
filter = 'test(=sequence_perf_with_fail_fast_still_renders_partial_report)'
slow-timeout = { period = "30s", terminate-after = 3 }

# Same sequence perf path, but successful: it still launches the claudine CLI
# once per sequence step and can approach the default 30s termination window
# under full-suite contention on macOS debug builds.
[[profile.default.overrides]]
filter = 'test(=sequence_perf_renders_single_aggregated_report)'
slow-timeout = { period = "30s", terminate-after = 3 }

# These stdout parity tests launch the claudine CLI twice (perf and non-perf).
# They are below the default timeout isolated, but can exceed 30s under
# full-suite contention on macOS debug builds.
[[profile.default.overrides]]
filter = 'test(=compose_perf_stdout_matches_non_perf)'
slow-timeout = { period = "30s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'test(=inline_compose_perf_stdout_matches_non_perf)'
slow-timeout = { period = "30s", terminate-after = 3 }

# This integration test shells out to the CLI multiple times; it is below the
# default timeout isolated, but can exceed 30s under full-suite contention.
[[profile.default.overrides]]
filter = 'test(=agents_and_commands_route_to_empty_state_messages)'
slow-timeout = { period = "30s", terminate-after = 3 }

# This seeded loop repro resolves live derived state and can exceed the default
# timeout under the full claudine suite on macOS debug builds.
[[profile.default.overrides]]
filter = 'test(=composition::loop_engine::tests::seeded_loop_repro_runs_to_completion_with_live_derived_variable)'
slow-timeout = { period = "30s", terminate-after = 3 }

# Proptest-driven acceptance test exploring many randomized compose conditions.
# Finishes in ~7s isolated but is squeezed toward (and past) the default 30s
# termination ceiling under full parallel `just test darkmatter` load. Give it
# the same generous leash as the rate-limit pause test so contention never kills
# a healthy run while a genuine hang still trips the longer window.
#
# NOTE: lib unit tests match in filtersets by their *full* module path, so a
# bare-leaf `test(=execution_subset_…)` matches nothing. The full path is
# required for this override to bind.
[[profile.default.overrides]]
filter = 'test(=markdown::compose::preflight::acceptance_tests::execution_subset_of_approval_across_randomized_conditions)'
slow-timeout = { period = "30s", terminate-after = 3 }

# Browser-tier tests spawn real headless Chrome, whose multi-process teardown
# (helper + crashpad processes that inherit the test's stdout) routinely takes
# longer than the default 100ms leak window — producing spurious LEAK-FAILs even
# though the test itself exits cleanly (code 0). Give Chrome room to reap before
# the leak check fires; keep `result = "fail"` so a genuinely runaway browser
# still fails. The tier also runs with `-j 1` (see `_test_browser`) so only one
# Chrome tears down at a time.
[[profile.default.overrides]]
filter = 'test(/browser_/)'
leak-timeout = { period = "5s", result = "fail" }

# The `preflight_graph_*` acceptance tests exercise preflight-graph reuse over
# `::file` transclusion only — they spawn no subprocess at all (the echo-spawning
# acceptance tests live under different names and are deliberately excluded). Yet
# under full-suite parallel load nextest's post-test pipe-drain check occasionally
# flags them with a spurious LEAK-FAIL (exits code 0, but the pipe read lags the
# 100ms window). Same situation as the worktree note below: give a 1s grace
# window; keep `result = "fail"` so a genuine leak still fails. The strict 100ms
# window stays in force for the sibling acceptance tests that do spawn `echo`.
[[profile.default.overrides]]
filter = 'test(/markdown::compose::preflight::acceptance_tests::preflight_graph_/)'
leak-timeout = { period = "1s", result = "fail" }

# worktree's lib/CLI tests are fast and spawn only short-lived git children.
# Under heavy parallel load nextest's post-test pipe-drain check occasionally
# flags spurious LEAK-FAILs on tests that provably spawn nothing (e.g.
# `classify_dirty_lines_clean`, a pure string parse). Give the runner a 1s
# grace window to observe the closed pipe; keep `result = "fail"` so a genuine
# runaway child still fails (1s is far longer than any real git child here).
[[profile.default.overrides]]
filter = 'package(worktree) + package(worktree-cli)'
leak-timeout = { period = "1s", result = "fail" }

# biscuit-speaks-cli's integration tests spawn the `so-you-say` binary, which in
# turn spawns OS TTS/audio children (`say`, audio playback). Under full-suite
# parallel load — up to a dozen of those concurrent — nextest's post-test
# pipe-drain check occasionally lags past the 100ms window and flags a spurious
# LEAK-FAIL, hopping between whichever fast test loses the race (including ones
# that spawn nothing, e.g. `test_cli_empty_stdin`). The tests themselves exit
# clean (code 0) and the `--background` child is redirected to null, so no real
# pipe is held. The `tts-audio` test-group caps how many run at once (root cause);
# the 1s grace window absorbs any residual teardown lag. Keep `result = "fail"`
# so a genuinely runaway TTS child still fails.
[[profile.default.overrides]]
filter = 'package(biscuit-speaks-cli)'
test-group = 'tts-audio'
leak-timeout = { period = "1s", result = "fail" }

# claudine-cli's L2 tier runs in parallel self-spawn mode (see
# `claudine/justfile`'s `test-l2` and `just/devops.just`'s `BISCUIT_L2_THREADS`
# path): every test spawns its own tmux session / PTY plus short-lived
# claudine+git children. Under `-j N` their concurrent teardown occasionally
# lags nextest's 100ms post-test pipe-drain check and flags a spurious
# LEAK-FAIL — same situation as the worktree / tts-audio groups above. Give a
# 1s grace window; keep `result = "fail"` so a genuinely leaked child still
# fails.
#
# slow-timeout: these tests own an internal ~40s wait-for-marker deadline (the
# tmux spawn boots a login shell, then a real claudine run drives a fake
# provider through the full lifecycle). The default 5s×6 = 30s termination
# ceiling is *below* that internal deadline, so a healthy-but-heavily-contended
# run gets killed by nextest at 30s before its own deadline can settle — which,
# under `retries = 3`, surfaces as "timed out on all four attempts" even though
# nothing is actually hung. Raise the termination ceiling to 30s×3 = 90s so a
# contended run is governed by its own 40s deadline + assertion, while a
# genuine deadlock still trips the longer window.
[[profile.default.overrides]]
filter = 'package(claudine-cli) & test(/level2_/)'
leak-timeout = { period = "1s", result = "fail" }
slow-timeout = { period = "30s", terminate-after = 3 }

# The sequence idle-flush pane test is slow by construction, not by contention.
# `spawn_flush_if_idle_ticker`'s silence window and cadence are both a
# hardcoded 30s with no env override, and the stall must clear the ticker's
# second tick to be reliable (the first only fires if the block was stamped as
# the ticker started), so the run costs ~80s plus pane setup. The default 30s
# termination window would kill it mid-stall.
[[profile.default.overrides]]
filter = 'test(=level2_prompt_idle_flush_keeps_the_task_bar_in_tmux)'
slow-timeout = { period = "30s", terminate-after = 6 }

# The error-propagation D10 characterization baseline
# (`claudine/features/2026-07-13-error-propogation/`) spawns the real claudine
# binary once per route, which in turn forks short-lived children (git
# discovery, the provider shim, terminal capability probes). Under parallel
# load their teardown lags nextest's 100ms post-test pipe-drain check and flags
# a spurious LEAK-FAIL on whichever route finishes fastest — reliably
# `characterize_unstructured_fallback`, which fails during argument parsing in
# ~0.1s and so loses the race. Same situation as the worktree / tts-audio /
# level2_ groups above; the test itself exits code 0 with every assertion
# passing. Give a 1s grace window; keep `result = "fail"` so a genuinely leaked
# child still fails. This baseline must be non-flaky by Checkpoint 1 — a flaky
# baseline cannot prove the migration was behavior-neutral.
[[profile.default.overrides]]
filter = 'package(claudine-cli) & binary(characterization_error_routes)'
leak-timeout = { period = "1s", result = "fail" }

[profile.ci]
# Same behavior for CI environment
retries = 3
# Stricter slow-test marker for CI, same generous termination ceiling.
slow-timeout = { period = "10s", terminate-after = 3 }
# Leaked child processes are a hard failure in CI as well.
leak-timeout = { period = "100ms", result = "fail" }
# JUnit XML for CI dashboards.
junit = { path = "test-results.xml" }

[[profile.ci.overrides]]
filter = 'test(=compose_loop_rate_limit_pause_waits_then_continues)'
slow-timeout = { period = "30s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'test(=sequence_perf_with_fail_fast_still_renders_partial_report)'
slow-timeout = { period = "30s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'test(=sequence_perf_renders_single_aggregated_report)'
slow-timeout = { period = "30s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'test(=compose_perf_stdout_matches_non_perf)'
slow-timeout = { period = "30s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'test(=inline_compose_perf_stdout_matches_non_perf)'
slow-timeout = { period = "30s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'test(=agents_and_commands_route_to_empty_state_messages)'
slow-timeout = { period = "30s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'test(=composition::loop_engine::tests::seeded_loop_repro_runs_to_completion_with_live_derived_variable)'
slow-timeout = { period = "30s", terminate-after = 3 }

# See the default-profile note: the randomized-conditions proptest can approach
# the 30s termination ceiling under full parallel load. CI hosts may be slower
# still, so the same generous leash applies. Full module path required (see the
# default-profile note: a bare-leaf filter matches no lib unit test).
[[profile.ci.overrides]]
filter = 'test(=markdown::compose::preflight::acceptance_tests::execution_subset_of_approval_across_randomized_conditions)'
slow-timeout = { period = "30s", terminate-after = 3 }

# See the default-profile note: headless-Chrome teardown exceeds the 100ms leak
# window. CI hosts may be slower still, so the same generous grace applies.
[[profile.ci.overrides]]
filter = 'test(/browser_/)'
leak-timeout = { period = "5s", result = "fail" }

# See the default-profile note: the no-subprocess `preflight_graph_*` acceptance
# tests draw spurious LEAK-FAILs under parallel load. CI hosts may be slower, so
# the same 1s grace applies; `result = "fail"` still catches a genuine leak.
[[profile.ci.overrides]]
filter = 'test(/markdown::compose::preflight::acceptance_tests::preflight_graph_/)'
leak-timeout = { period = "1s", result = "fail" }

# See the default-profile note: spurious LEAK-FAILs on worktree's fast,
# no-child tests under parallel load. CI hosts may be slower, so the same 1s
# grace applies; `result = "fail"` still catches a genuine runaway child.
[[profile.ci.overrides]]
filter = 'package(worktree) + package(worktree-cli)'
leak-timeout = { period = "1s", result = "fail" }

# See the default-profile note: biscuit-speaks-cli's TTS/audio children draw
# spurious LEAK-FAILs under parallel load. The `tts-audio` test-group caps
# concurrency (root cause); the 1s grace absorbs residual lag. `result = "fail"`
# still catches a genuinely runaway child.
[[profile.ci.overrides]]
filter = 'package(biscuit-speaks-cli)'
test-group = 'tts-audio'
leak-timeout = { period = "1s", result = "fail" }

# See the default-profile note: claudine-cli's parallel self-spawn L2 tier
# draws spurious LEAK-FAILs from concurrent tmux/PTY/child teardown. CI hosts
# may be slower, so the same 1s grace applies; `result = "fail"` still catches
# a genuine leak.
[[profile.ci.overrides]]
filter = 'package(claudine-cli) & test(/level2_/)'
leak-timeout = { period = "1s", result = "fail" }

# See the default-profile note: the idle-flush pane test stalls ~80s by
# construction, well past CI's 30s termination ceiling.
[[profile.ci.overrides]]
filter = 'test(=level2_prompt_idle_flush_keeps_the_task_bar_in_tmux)'
slow-timeout = { period = "30s", terminate-after = 6 }

# See the default-profile note: the error-propagation characterization baseline
# spawns the real claudine binary per route and draws spurious LEAK-FAILs from
# child teardown lag under parallel load. CI hosts may be slower, so the same 1s
# grace applies; `result = "fail"` still catches a genuine leak.
[[profile.ci.overrides]]
filter = 'package(claudine-cli) & binary(characterization_error_routes)'
leak-timeout = { period = "1s", result = "fail" }
