[package]
name = "biscuit-browser-harness"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
description = "Shared headless-browser test harness for the Rusty Biscuit workspace"

[dependencies]
async-trait = "0.1"
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
futures-util = "0.3"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
serial_test = "3"
test-toolkit = { path = "../tools/test-toolkit" }

# Opt-out of benchmarking: this crate has no algorithmic hot paths.
[package.metadata.benchmarks]
required = false
reason = "Test/dev infrastructure crate; no measurable hot paths."

# CI exclusion: 6 L1 tests plus 7 browser-tier tests that currently run in no
# CI job. Promotion is blocked on the canonical just recipe set.
[package.metadata.ci]
gates = false
exclusion-class = "promotion-pending"
owner = "@yankeeinlondon"
reason = "6 L1 tests plus 7 browser-tier tests that currently run in NO CI job. Promotion is blocked on the canonical just recipe set (check-canonical) for biscuit-browser-harness/, and on deciding whether it also gates the browser tier."
expiry = "2026-10-31"
