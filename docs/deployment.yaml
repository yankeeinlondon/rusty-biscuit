$schema:
    packages: record(string,mapper)
types:
    pm: |-
        string(default(false);suggest(true,false,some-unique-name))
        -> indicates whether the package manager is being published to:
            - if `false` then this package manager is not being published to
            - if `true` that means that it IS being published to the package manager _and_ using the same name as the crate
            - if a string name is provided then that means it is being published but under the name provided (not the crate name)
    mapper:
        crate: string(required) -> the crate name for this package (when and/or if it is published)
        approved: boolean(default(false)) -> whether this crate has been approved to be published/released publicly
        brew: pm
        uv: pm
        apt: pm
        nixpkgs: pm
        winget: pm
        chocolatey: pm
        npm: pm
        dnf: pm
        scoop: pm
        aur: pm -> available on
        binstall: pm -> works with `cargo binstall`
        install: pm -> work with `cargo install`
        snap: pm
