# `claudine::CompositionError` is an intentionally rich public diagnostic enum.
# It is 136 bytes on 64-bit Unix and 144 on Windows, where `PathBuf` is wider;
# Windows builds of the claudine library allow the lint instead. Keep the
# threshold tight enough to catch materially larger errors without requiring
# hundreds of call-site suppressions or a public error-shape change.
large-error-threshold = 136
