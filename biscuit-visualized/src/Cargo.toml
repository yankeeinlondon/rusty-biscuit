[package]
name = "biscuit-visualized"
version = "0.1.0"
edition = "2024"
autotests = false

[lib]
name = "biscuit_visualized"
path = "src/lib.rs"

[features]
clap = ["dep:clap"]
# Enables SVG rasterization and Mermaid diagram rendering (both require resvg).
image = ["dep:resvg", "dep:mermaid-rs-renderer"]
# The diagram components (`components::{MermaidDiagram, GraphExpression,
# GitGraph}`) and the render-tree diagram hook. This crate depends on
# `biscuit-terminal`, never the reverse, so no feature here may make
# `biscuit-terminal` depend back on it.
terminal = ["image", "dep:biscuit-terminal", "biscuit-terminal/image", "dep:renderable"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
biscuit-hash = { path = "../../biscuit-hash/lib" }
thiserror = "2.0"
tempfile = "3"
resvg = { version = "0.45", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
# `default-features = false`: we rasterize with our own resvg, so the crate's
# `png` (a second resvg/usvg) and `cli` (clap) features are unused.
mermaid-rs-renderer = { version = "0.3.1", default-features = false, optional = true }
layout-rs = "0.1"
biscuit-terminal = { path = "../../biscuit-terminal/lib", optional = true }
renderable = { path = "../../renderable", optional = true }

[dev-dependencies]
serial_test = "3.0"
biscuit-test-harness = { path = "../../biscuit-test-harness" }
image = "0.25"
insta = "1.46"

# `autotests = false`: a `tests/` file reaches a binary only through a root
# declared here. The diagram components' integration tests need `terminal`.
[[test]]
name = "l1"
path = "tests/l1/main.rs"
required-features = ["terminal"]

# CI exclusion: 71 tests that currently run in no CI job. Promotion is blocked
# on the canonical just recipe set.
[package.metadata.ci]
gates = false
exclusion-class = "promotion-pending"
owner = "@yankeeinlondon"
reason = "71 tests that currently run in NO CI job. Promotion is blocked on the canonical just recipe set — biscuit-visualized/ defines only test and lint."
expiry = "2026-10-31"

# The package's test contract, recorded NOW so promotion cannot silently drop
# it: `image` (resvg + Mermaid) gates 56 of the 71 tests, and the only
# consumer (biscuit-terminal) enables it — so the justfile tests with
# `--all-features` throughout, and CI must too (same shape as messenger's
# `--features desktop`).
[package.metadata.ci.tests]
all-features = true
# The `l1` binary includes biscuit-terminal's parity and layout-matrix
# harnesses (`#[path]`) so the moved diagram tests run unchanged.
source-inputs = [
    "biscuit-terminal/lib/tests/l1/parity_helpers.rs",
    "biscuit-terminal/lib/tests/layout_matrix_support/mod.rs",
]
