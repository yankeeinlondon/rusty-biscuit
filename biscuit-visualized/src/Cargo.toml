[package]
name = "biscuit-visualized"
version = "0.1.0"
edition = "2024"
autotests = false

[lib]
name = "biscuit_visualized"
path = "src/lib.rs"

[features]
clap = ["dep:clap"]
# Enables SVG rasterization and Mermaid diagram rendering (both require resvg).
image = [
    "dep:resvg",
    "dep:png",
    "dep:rustybuzz",
    "dep:ttf-parser",
    "dep:unicode-bidi",
    "dep:unicode-script",
    "dep:fontique",
    "dep:merman",
    "dep:svgtypes",
]
# The diagram components (`components::{MermaidDiagram, GraphExpression,
# GitGraph}`) and the render-tree diagram hook. This crate depends on
# `biscuit-terminal`, never the reverse, so no feature here may make
# `biscuit-terminal` depend back on it.
terminal = ["image", "dep:biscuit-terminal", "biscuit-terminal/image", "dep:renderable"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
biscuit-hash = { path = "../../biscuit-hash/lib" }
thiserror = "2.0"
tempfile = "3"
resvg = { version = "0.47", optional = true }
# The PNG encoder resvg's tiny-skia already uses, configured for smaller output
# (see `raster::png::encode_png`); keep it on tiny-skia's major version.
png = { version = "0.18", optional = true }
# Shapes labels for text measurement, so the measured face is the drawn face;
# keep on the version usvg uses, so the lock holds one copy.
rustybuzz = { version = "0.20.1", optional = true }
# Reads font tables (names, OS/2 class, cmap) for font resolution; keep on the
# version usvg uses, so the lock holds one copy.
ttf-parser = { version = "0.25.1", optional = true }
# Bidi runs and script itemization for shaping, as usvg's text layout does.
unicode-bidi = { version = "0.3", optional = true }
unicode-script = { version = "0.5", optional = true }
# Parses the colors an author writes (CSS names included) for the contrast
# pass; keep on the version usvg uses, so the lock holds one copy.
svgtypes = { version = "0.16.1", optional = true }
# The OS's own generic font family (fontconfig, CoreText, DirectWrite) for
# font resolution; the version Merman pins. `fontconfig-dlopen` loads
# libfontconfig at run time, so Linux builds need no fontconfig development
# package and a host without the library skips this step instead of failing.
fontique = { version = "0.12.0", default-features = false, features = ["system", "fontconfig-dlopen"], optional = true }
# The Mermaid backend. Pinned to a commit on
# Ken's fork carrying the gitGraph `commitSpacing` key (branch
# `gitgraph-commit-spacing`, based on upstream 482fcde7). `png`,
# `native-fonts`, ELK, and `math` stay off: we rasterize and measure with our
# own usvg and font chain.
merman = { git = "https://github.com/yankeeinlondon/merman.git", rev = "6e6b1e6554e8e75d468c1f991652c1c53a85bace", default-features = false, features = ["svg", "all-diagrams", "layout-cytoscape"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
layout-rs = "0.1"
biscuit-terminal = { path = "../../biscuit-terminal/lib", optional = true }
renderable = { path = "../../renderable", optional = true }

[dev-dependencies]
base64 = "0.22"
serial_test = "3.0"
biscuit-test-harness = { path = "../../biscuit-test-harness" }
image = "0.25"
insta = "1.46"

# `autotests = false`: a `tests/` file reaches a binary only through a root
# declared here. The diagram components' integration tests need `terminal`.
[[test]]
name = "l1"
path = "tests/l1/main.rs"
required-features = ["terminal"]

# Gating: the golden SVG/PNG corpus and every other L1 test run on each CI
# environment.
[package.metadata.ci]
gates = true

# `image` (resvg + Mermaid) gates most tests, and the consumers
# (biscuit-terminal, darkmatter) enable it, so the justfile tests with
# `--all-features` throughout, and CI must too (same shape as messenger's
# `--features desktop`).
[package.metadata.ci.tests]
all-features = true
# The `l1` binary includes biscuit-terminal's parity and layout-matrix
# harnesses (`#[path]`) so the moved diagram tests run unchanged.
source-inputs = [
    "biscuit-terminal/lib/tests/l1/parity_helpers.rs",
    "biscuit-terminal/lib/tests/layout_matrix_support/mod.rs",
]
