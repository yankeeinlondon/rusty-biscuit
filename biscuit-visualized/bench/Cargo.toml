# The Mermaid render benchmark of R-V6 (`just bench` in biscuit-visualized).
#
# Standalone, NOT a member of the rusty-biscuit workspace (empty
# `[workspace]`), so CI plans no cell for it; it never runs in CI. See
# README.md for usage, the reference host, and the baseline file.
[package]
name = "biscuit-visualized-bench"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
biscuit-visualized = { path = "../src", features = ["image"] }
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = "1"
tempfile = "3"

# The wiring tests spawn the debug binary; optimized dependencies keep a
# three-iteration render run short there.
[profile.dev.package."*"]
opt-level = 2
