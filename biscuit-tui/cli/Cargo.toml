[package]
name = "biscuit-tui-cli"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
autotests = false

[[bin]]
name = "question"
path = "src/main.rs"

[features]
terminal-tests = ["dep:biscuit-test-harness"]

[dependencies]
biscuit-tui = { path = "../lib" }
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "0.8"
csv = "1.3"
heck = "0.5"
thiserror = "2"
biscuit-test-harness = { path = "../../biscuit-test-harness", optional = true }

[dev-dependencies]
assert_cmd = "2"
# The Level 1 layout gate (`tests/l1/test_layout.rs`) resolves the crate
# through `biscuit_test_harness::manifest_dir!`, which holds in an archive run.
# The optional normal dependency above only exists under `terminal-tests`.
biscuit-test-harness = { path = "../../biscuit-test-harness" }
expectrl = "0.8"
predicates = "3"
serial_test = "3"
test-toolkit = { path = "../../tools/test-toolkit" }

# One test binary per execution contract (tier × exact `required-features`),
# declared explicitly: `autotests = false` above, so a `tests/` file reaches a
# binary only through one of these roots (`2026-09-21-consolidated-test-binaries`).
[[test]]
name = "l1"
path = "tests/l1/main.rs"

[[test]]
name = "level2"
path = "tests/level2/main.rs"
required-features = ["terminal-tests"]

[[test]]
name = "level3"
path = "tests/level3/main.rs"
required-features = ["terminal-tests"]

# Test-only, target-scoped: in `tests/level2/windows_captured_stdout.rs` the F2
# boundary test self-attaches a console (`AllocConsole`), rewires the process
# std handles onto `CONOUT$`/`CONIN$` via `CreateFileW` + `SetStdHandle`, proves
# the attached-console precondition, then injects a deterministic Enter through
# the console input buffer (`WriteConsoleInputW`). Scoped to `cfg(windows)`
# dev-deps so Unix/macOS builds never pull it in. Matches the `windows` 0.62
# workspace convention (claudine / biscuit-location / sniff / playa). Only the
# feature subsets the test uses are enabled:
#   - Win32_Foundation: HANDLE, CloseHandle, GENERIC_*, BOOL/TRUE.
#   - Win32_System_Console: AllocConsole, Get/SetStdHandle, console input records.
#   - Win32_Storage_FileSystem: CreateFileW + OPEN_EXISTING/FILE_SHARE_* to open
#     CONOUT$/CONIN$.
#   - Win32_Security: CreateFileW's signature references SECURITY_ATTRIBUTES, so
#     this feature is required even though the test passes `None`.
#   - Win32_UI_Input_KeyboardAndMouse: VK_RETURN.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# Opt-out of benchmarking: thin CLI wrapper around the biscuit-tui library.
[package.metadata.benchmarks]
required = false
reason = "Thin CLI wrapper around biscuit-tui; no measurable hot paths."

# CI policy: biscuit-tui-cli owns the area's L2 (real-terminal) tier tests.
[package.metadata.ci.tests]
tiers = ["L1", "L2"]
l2-backends = ["tmux", "wezterm", "kitty"]
# The L2 tier spawns one shared terminal pane through the harness broker.
# It is a compile-time binary of another package, so the producer builds it
# as a sidecar; an archive consumer has no Cargo to build one with.
sidecars = ["backend-proof", "harness-broker"]
features = ["terminal-tests"]
local-features = []
