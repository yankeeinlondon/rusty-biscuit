[package]
name = "biscuit-tui"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tui-input = "0.15"
# Ratatui-org's maintained fork of `tui-textarea` (rhysd's crate caps at
# ratatui 0.29). API-compatible; imported as `ratatui_textarea`.
ratatui-textarea = "0.9"
thiserror = "2"
unicode-width = "0.2"
serde_yaml_ng = "0.10"
rand = "0.9"
nucleo-matcher = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# F2: Windows console redirect for captured-stdout prompts. Only the
# raw Win32 console APIs (CreateFileW, GetStdHandle, SetStdHandle,
# CloseHandle) are needed; feature subset stays minimal so the
# dependency compiles fast and stays auditable. Win32_Security is
# required because CreateFileW's signature references SECURITY_ATTRIBUTES.
# Win32_System_Pipes (CreatePipe) and GetFileType are dev-only — used by
# the in-process active-redirect test to synthesize a captured-stdout
# shape and assert the post-activation handle is the console, not the
# pipe — but feature flags are not dev-scopable, so they live here.
# Target-scoped so Unix builds never pull it in.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Pipes",
] }

# Opt-out of benchmarking: interactive TUI component library; performance
# is dominated by terminal I/O and ratatui's own rendering, neither of
# which benefit from per-crate microbenchmarks.
[package.metadata.benchmarks]
required = false
reason = "Interactive TUI component library; no measurable hot paths."
