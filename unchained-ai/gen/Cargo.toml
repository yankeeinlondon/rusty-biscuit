[package]
name = "unchained-ai-gen"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
default-run = "gen-models"

[[bin]]
name = "gen-models"
path = "src/main.rs"

[[bin]]
name = "emit-catalog"
path = "src/bin/emit_catalog.rs"

[dependencies]
unchained-ai = { path = "../lib" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.49", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
thiserror = "2.0.18"
strum = { version = "0.28", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1"

# Opt-out of benchmarking: code-generation binary; runs offline against
# provider APIs and has no runtime hot paths worth tracking.
[package.metadata.benchmarks]
required = false
reason = "Code-generation binary; no measurable hot paths."
