[package]
name = "unchained-ai"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
lazy_static = "1.5.0"
async-trait = "0.1"
rig-core = { version = "0.31.0", features = ["rayon", "image", "derive", "audio", "rmcp", "pdf"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "tracing"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
strum = { version = "0.28", features = ["derive", "strum_macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
futures = "0.3.31"
model_id = { path = "../model_id" }
url= "2.5"
scraper = "0.25"
portable-pty = { package = "xpty", version = "0.3.6" }
strip-ansi-escapes = "0.2"
sniff = { path = "../../sniff/lib" }

[dev-dependencies]
serial_test = "3.0"
wiremock = "0.6"
tracing-test = "0.2"

# Opt-out of benchmarking: this crate has no algorithmic hot paths.
[package.metadata.benchmarks]
required = false
reason = "LLM pipeline orchestration dominated by provider HTTP calls; no measurable in-process hot paths."
