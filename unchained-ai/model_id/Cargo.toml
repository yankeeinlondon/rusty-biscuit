[package]
name = "model_id"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["derive", "parsing", "full"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
trybuild = "1.0"

# Opt-out of benchmarking: proc-macro crate; compile-time only.
[package.metadata.benchmarks]
required = false
reason = "Proc-macro crate; compile-time only, no runtime hot paths."
