[package]
name = "schematic-define"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "REST API definition types for schematic code generation"

[features]
default = []
openapi = ["dep:indexmap", "dep:openapiv3", "biscuit-file"]

[dependencies]
base64 = "0.22"
biscuit-file = { path = "../../biscuit-file/lib", features = ["yaml"], optional = true }
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"
serde_json = { version = "1.0", features = ["raw_value"] }
# Pattern admission: the AST walk decides which ECMAScript patterns the
# runtime's `regex` matching can enforce; `regex` proves they compile.
regex = "1"
regex-syntax = "0.8"
schemars = "1"
url = "2"

# OpenAPI feature dependencies
indexmap = { version = "2", optional = true }
openapiv3 = { version = "2", optional = true }

[dev-dependencies]
serial_test = "3.2"
wiremock = "0.6"
# default-features = false drops reqwest's system-proxy only; see docs/dependencies.md.
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "charset", "http2"] }
tokio = { version = "1.48", features = ["full"] }

# Opt-out of benchmarking: this crate has no algorithmic hot paths.
[package.metadata.benchmarks]
required = false
reason = "API definition DSL; build-time schema authoring with no runtime hot paths."

# CI policy: the L1 suite runs with every feature enabled.
[package.metadata.ci.tests]
all-features = true
