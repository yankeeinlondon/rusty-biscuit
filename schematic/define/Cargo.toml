[package]
name = "schematic-define"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "REST API definition types for schematic code generation"

[features]
default = []
openapi = ["dep:indexmap", "dep:openapiv3", "dep:serde_yaml", "dep:serde_json"]

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"

# OpenAPI feature dependencies
indexmap = { version = "2", optional = true }
openapiv3 = { version = "2", optional = true }
serde_json = { version = "1.0", optional = true }
serde_yaml = { version = "0.9", optional = true }

[dev-dependencies]
serial_test = "3.2"
serde_json = "1.0"
wiremock = "0.6"
reqwest = "0.13"
tokio = { version = "1.48", features = ["full"] }
serde_yaml = "0.9"
