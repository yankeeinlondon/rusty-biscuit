# Every supported value-constraint keyword, in the positions a rule can sit:
# parameters and their array items, a text body root, an inline JSON array
# root, URL-encoded form fields, component properties (renamed, optional,
# nested-only, recursive, alias-typed), a component shared by two endpoints,
# and a response-only component. Bounds include OpenAPI 3.0 Boolean
# exclusive flags, `const`, an integer beyond u64, and decimal divisors that
# no f64 holds exactly.
openapi: 3.0.3
info:
  title: Constraint Preservation
  version: "1.0.0"
servers:
  - url: https://constraints.example.com
paths:
  /items:
    get:
      operationId: listItems
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 18446744073709551616
        - name: score
          in: query
          schema:
            type: number
            minimum: 0
            exclusiveMinimum: true
            maximum: 10
            exclusiveMaximum: true
            multipleOf: 0.10000000000000000001
        - name: step
          in: query
          schema:
            type: number
            multipleOf: 0.1
        - name: tags
          in: query
          schema:
            type: array
            minItems: 1
            maxItems: 5
            uniqueItems: true
            items:
              type: string
              minLength: 2
              maxLength: 12
              pattern: "^[a-z][a-z0-9-]*$"
        - name: order
          in: query
          schema:
            type: integer
            enum: [1, -1]
        - name: X-Trace
          in: header
          schema:
            type: string
            format: uuid
            minLength: 36
            maxLength: 36
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
    post:
      operationId: createItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
      responses:
        "204":
          description: Created
  /items/{id}:
    put:
      operationId: replaceItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
      responses:
        "204":
          description: Replaced
  /notes:
    post:
      operationId: createNote
      requestBody:
        content:
          text/plain:
            schema:
              type: string
              minLength: 1
              maxLength: 280
      responses:
        "204":
          description: Created
  /batches:
    post:
      operationId: createBatch
      requestBody:
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                type: integer
                minimum: 0
      responses:
        "204":
          description: Created
  /search:
    post:
      operationId: search
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 200
                mode:
                  type: string
                  enum: [fast, deep]
      responses:
        "204":
          description: Searched
components:
  schemas:
    Limit:
      type: integer
      minimum: 1
      maximum: 500
    Item:
      type: object
      required: [display-name, kind]
      properties:
        display-name:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          type: string
          const: item
        price:
          type: number
          exclusiveMinimum: true
          minimum: 0
          multipleOf: 0.01
        quantity:
          type: integer
          minimum: 0
          maximum: 9223372036854775808
        page_size:
          $ref: "#/components/schemas/Limit"
        labels:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            maxLength: 20
        root:
          $ref: "#/components/schemas/Node"
    Node:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 40
          pattern: "^[A-Za-z]+$"
        children:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/Node"
    Stats:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        ratio:
          type: number
          minimum: 0
          maximum: 1
