[package]
name = "schematic-schema"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Generated REST and WebSocket API client code from schematic definitions"

# This file was automatically generated by schematic-gen.
# Do not edit manually - changes will be overwritten.

[dependencies]
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
schematic-define = { version = "0.1.0", path = "../define" }
schematic-definitions = { version = "0.1.0", path = "../definitions" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt", "macros", "sync", "time", "net"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
urlencoding = "2.1"

[dev-dependencies]
serial_test = "3"
wiremock = "0.6"
