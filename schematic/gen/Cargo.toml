[package]
name = "schematic-gen"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Code generator for schematic REST API definitions"

[lib]
name = "schematic_gen"
path = "src/lib.rs"

[[bin]]
name = "schematic-gen"
path = "src/main.rs"

[dependencies]
biscuit-file = { path = "../../biscuit-file/lib", features = ["toml", "yaml"] }
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
thiserror = "2.0"
schematic-define = { path = "../define", features = ["openapi"] }
schematic-definitions = { path = "../definitions" }
syn = { version = "2.0", features = ["full", "parsing"] }
quote = "1.0"
proc-macro2 = "1.0"
prettyplease = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
openapiv3 = "2"
indexmap = "2"

[dev-dependencies]
tempfile = "3.15"
jsonschema = { version = "0.42", default-features = false }
# `bin_exe!`: resolves the `schematic-gen` path at run time so the capture tests
# survive execution from a relocated nextest archive (the wsl2 leg).
biscuit-test-harness = { path = "../../biscuit-test-harness" }

# Opt-out of benchmarking: this crate has no algorithmic hot paths.
[package.metadata.benchmarks]
required = false
reason = "Code-generation tool; runs at build time and has no runtime hot paths."
