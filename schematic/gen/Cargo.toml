[package]
name = "schematic-gen"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Code generator for schematic REST API definitions"
autotests = false

[lib]
name = "schematic_gen"
path = "src/lib.rs"

[[bin]]
name = "schematic-gen"
path = "src/main.rs"

[features]
terminal-tests = ["dep:biscuit-test-harness", "dep:test-toolkit"]

[dependencies]
biscuit-file = { path = "../../biscuit-file/lib", features = ["toml", "yaml"] }
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
thiserror = "2.0"
schematic-define = { path = "../define", features = ["openapi"] }
schematic-definitions = { path = "../definitions" }
syn = { version = "2.0", features = ["full", "parsing"] }
quote = "1.0"
proc-macro2 = "1.0"
prettyplease = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
openapiv3 = "2"
indexmap = "2"
biscuit-test-harness = { path = "../../biscuit-test-harness", optional = true }
test-toolkit = { path = "../../tools/test-toolkit", optional = true }

[dev-dependencies]
biscuit-test-harness = { path = "../../biscuit-test-harness" }
tempfile = "3.15"
jsonschema = { version = "0.55", default-features = false }
# The Level 1 layout gate (`tests/l1/test_layout.rs`) calls
# `test_toolkit::test_layout`. The optional normal dependency above only
# exists under `terminal-tests`.
test-toolkit = { path = "../../tools/test-toolkit" }

# One test binary per execution contract (tier × exact `required-features`),
# declared explicitly: `autotests = false` above, so a `tests/` file reaches a
# binary only through one of these roots (`2026-09-21-consolidated-test-binaries`).
[[test]]
name = "l1"
path = "tests/l1/main.rs"

[[test]]
name = "level2"
path = "tests/level2/main.rs"
required-features = ["terminal-tests"]

# Opt-out of benchmarking: this crate has no algorithmic hot paths.
[package.metadata.benchmarks]
required = false
reason = "Code-generation tool; runs at build time and has no runtime hot paths."

# The tmux capture target is L2. CI enables the feature in its reusable build;
# ordinary local L1 omits both the target and terminal harness.
[package.metadata.ci.tests]
tiers = ["L1", "L2"]
l2-backends = ["tmux"]
# The L2 tier spawns one shared terminal pane through the harness broker.
# It is a compile-time binary of another package, so the producer builds it
# as a sidecar; an archive consumer has no Cargo to build one with.
sidecars = ["backend-proof", "harness-broker"]
features = ["terminal-tests"]
local-features = []
