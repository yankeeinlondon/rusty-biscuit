[package]
name = "schematic-definitions"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "REST API definitions using schematic primitives"

[dependencies]
indexmap = "2"
openapiv3 = "2"
schematic-define = { path = "../define", features = ["openapi"] }
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }

[dev-dependencies]

# Opt-out of benchmarking: this crate has no algorithmic hot paths.
[package.metadata.benchmarks]
required = false
reason = "API definition data; build-time content, no runtime hot paths."
