[package]
name = "playa-cli"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[[bin]]
name = "playa"
path = "src/main.rs"

[features]
default = []
audio-ducking = ["playa/audio-ducking", "tokio"]
audio-ducking-macos = ["audio-ducking", "playa/audio-ducking-macos"]
audio-ducking-linux = ["audio-ducking", "playa/audio-ducking-linux"]
sfx-native = ["playa/sfx-native"]
sfx-native-macos = ["sfx-native", "playa/sfx-native-macos"]

[dependencies]
biscuit-terminal = { path = "../../biscuit-terminal/lib" }
clap = { version = "4.5.53", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
playa = { path = "../lib", features = ["sound-effects"] }
darkmatter = { path = "../../darkmatter/lib" }
sniff = { path = "../../sniff/lib" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
