[package]
name = "playa"
version = "0.1.0"
edition = "2024"

[features]
default = []  # Sound effects are NOT default - users must opt-in
async = ["tokio"]

# Audio ducking - attenuate system audio during playback
audio-ducking = ["tokio"]
audio-ducking-macos = ["audio-ducking", "coreaudio-sys"]
audio-ducking-linux = ["audio-ducking", "pulsectl-rs", "libpulse-binding", "alsa"]
audio-ducking-windows = ["audio-ducking", "windows"]

# Base native audio — SFX playback with common codecs
sfx-native = [
    "rodio",
    "rodio/symphonia-wav",
    "rodio/symphonia-mp3",
    "rodio/symphonia-vorbis",
    "rodio/symphonia-ogg",
    "rodio/symphonia-pcm",
]
# OS-native SFX routing: CoreAudio on macOS, PulseAudio on Linux, WASAPI on
# Windows. One feature covers every platform because each backing crate is an
# optional dependency of a single `[target.'cfg(target_os = "…")']` section —
# naming all three here enables only the one the build target selects.
sfx-native-audio = ["sfx-native", "coreaudio-sys", "libpulse-binding", "windows"]

# Extended native audio — general file playback with broad format support
native-playback = [
    "sfx-native",
    "rodio/symphonia-aac",
    "rodio/symphonia-alac",
    "rodio/symphonia-aiff",
    "rodio/symphonia-flac",
    "rodio/symphonia-isomp4",
    "rodio/symphonia-mkv",
]

# Umbrella feature for all effects (~30MB)
sound-effects = ["sfx-ui", "sfx-cartoon", "sfx-reactions", "sfx-scifi", "sfx-atmosphere", "sfx-motion"]

# Individual categories (users pick what they need)
sfx-ui = []         # doorbells, alerts, clicks, selections, window actions (~4MB, 43 files)
sfx-cartoon = []    # cartoon accents (~6MB, 13 files)
sfx-reactions = []  # laughs, cheers, trombone (~12MB, 9 files)
sfx-scifi = []      # phase jumps, phasers (~100KB, 11 files)
sfx-atmosphere = [] # music stings, transitions (~5MB, 5 files)
sfx-motion = []     # whooshes, air sounds (~2MB, 7 files)

[dependencies]
biscuit-hash = { path = "../../biscuit-hash/lib" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
fs4 = "0.13"
infer = "0.19"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
rodio = { version = "0.22", optional = true, default-features = false, features = ["playback"] }
sniff = { path = "../../sniff/lib" }
thiserror = "2.0"
tokio = { version = "1", features = ["process", "io-util", "fs", "rt", "time", "sync"], optional = true }
tracing = "0.1"
url = "2.5"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "ogg", "pcm", "vorbis", "wav"] }

[build-dependencies]
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "ogg", "pcm", "vorbis", "wav"] }

# Platform-specific dependencies for audio ducking
[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = { version = "0.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = { version = "2.28", optional = true }
pulsectl-rs = { version = "0.3", optional = true }
alsa = { version = "0.11", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
windows = { version = "0.62", optional = true, features = [
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    # IMMDevice::Activate's signature references PROPVARIANT, which lives behind
    # this feature; without it the Activate method is gated out entirely.
    "Win32_System_Com_StructuredStorage",
] }

[dev-dependencies]
serde_json = "1.0"
serial_test = "3.2"
tokio = { version = "1", features = ["rt", "macros"] }
tracing-test = "0.2"

# Opt-out of benchmarking: this crate has no algorithmic hot paths.
[package.metadata.benchmarks]
required = false
reason = "Audio playback dispatch dominated by OS-native player processes; no measurable in-process hot paths."

# CI policy: playa links ALSA and PulseAudio on Linux.
[package.metadata.ci.native]
ubuntu-latest = ["libasound2-dev", "libpulse-dev"]
