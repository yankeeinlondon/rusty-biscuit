[package]
name = "tree-hugger-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hug"
path = "src/main.rs"

[features]
terminal-tests = ["dep:biscuit-test-harness", "dep:test-toolkit"]

[dependencies]
biscuit-file = { path = "../../biscuit-file/lib", default-features = false, features = [
    "file-reference",
] }
biscuit-terminal = { path = "../../biscuit-terminal/lib" }
clap = { version = "4.5.54", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
ignore = "0.4"
owo-colors = { version = "4.3", features = ["supports-colors"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Git changed-file selection and structure-only stats package discovery;
# network and remote features stay disabled.
sniff = { path = "../../sniff/lib", default-features = false }
tree-hugger = { path = "../lib" }
url = "2.5"
# Reads the inline nodes of the listing's Prose markup for the Markdown and
# plain Prose exports (biscuit-terminal's `InlineProse::to_render_nodes`).
renderable = { path = "../../renderable" }
biscuit-test-harness = { path = "../../biscuit-test-harness", optional = true }
test-toolkit = { path = "../../tools/test-toolkit", optional = true }

[dev-dependencies]
biscuit-hash = { path = "../../biscuit-hash/lib", features = ["blake3"] }
biscuit-test-harness = { path = "../../biscuit-test-harness" }
assert_cmd = "2.0"
predicates = "3.1"
serial_test = "3"
tempfile = "3.15"
# `--changed` fixtures build commits, branch tips and linked worktrees
# through library APIs so no test depends on host git or signing settings.
git2 = { version = "0.20.3", default-features = false }
# Same MSVC duplicate-symbol ceiling as sniff's dev-dependency (see its
# Cargo.toml for the full analysis); keep the two pins in lockstep.
libgit2-sys = ">=0.18.3, <0.18.6"
pulldown-cmark = "0.13"

[[test]]
name = "level2_god_files"
required-features = ["terminal-tests"]

[[test]]
name = "level2_declarations"
required-features = ["terminal-tests"]

# CI policy: tree-hugger-cli owns the area's L2 (real-terminal) tier tests.
[package.metadata.ci.tests]
tiers = ["L1", "L2"]
l2-backends = ["tmux", "wezterm", "kitty"]
# The L2 tier spawns one shared terminal pane through the harness broker.
# It is a compile-time binary of another package, so the producer builds it
# as a sidecar; an archive consumer has no Cargo to build one with.
sidecars = ["backend-proof", "harness-broker"]
features = ["terminal-tests"]
local-features = []
# The library/CLI severity agreement test reads the library's shared fixture.
source-inputs = ["tree-hugger/lib/tests/fixtures/lint/undefined_symbol.py"]
