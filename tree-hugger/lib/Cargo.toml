[package]
name = "tree-hugger"
version = "0.1.0"
edition = "2024"

[lib]
name = "tree_hugger"
path = "src/lib.rs"
# Disable the default bench harness so `cargo bench` only runs Criterion targets.
bench = false

[dependencies]
biscuit-file = { path = "../../biscuit-file/lib", default-features = false, features = [
    "toml",
    "json5",
] }
biscuit-hash = { path = "../../biscuit-hash/lib", features = ["blake3"] }
ignore = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tree-sitter = "0.26.3"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.1"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-lua = "0.5.0"
tree-sitter-perl = "1.1.2"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.0"
tree-sitter-scala = "0.24.0"
tree-sitter-swift = "0.7.1"
tree-sitter-typescript = "0.23.2"
tree-sitter-zsh = "0.56.0"

[dev-dependencies]
tempfile = "3.15"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "tree_file"
harness = false
