[package]
name = "biscuit-test-harness"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[dependencies]
libc = "0.2"
serde_json = "1.0"
unicode-width = "0.2"

[dev-dependencies]
serial_test = "3"
tempfile = "3"

# Opt-out of benchmarking: this crate has no algorithmic hot paths.
[package.metadata.benchmarks]
required = false
reason = "Test/dev infrastructure crate; no measurable hot paths."

# `biscuit-harness-broker` spawns shared terminal panes once per
# `_test_l2` invocation so nextest child processes can attach instead of
# paying a 2-3 s spawn cost per test. Invoked from `just/devops.just`.
[[bin]]
name = "biscuit-harness-broker"
path = "src/bin/broker.rs"

# CI exclusion: 92 L1 tests that currently run in no CI job. Promotion is
# blocked on the canonical just recipe set (check-canonical).
[package.metadata.ci]
gates = false
exclusion-class = "promotion-pending"
owner = "@yankeeinlondon"
reason = "92 L1 tests that currently run in NO CI job. Promotion is blocked on the canonical just recipe set (check-canonical) for biscuit-test-harness/; transitive exercise by consumer packages is not the same as running these tests."
expiry = "2026-10-31"
