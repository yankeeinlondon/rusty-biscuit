# Cut verbatim from `.github/workflows/ci.yml`; see README.md for provenance.
name: mutation corpus base
on:
  workflow_dispatch:

jobs:
  preflight:
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.preflight_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.scope.outputs.head }}
          fetch-depth: 0
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Verify toolchain and required tooling
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV
          cargo -V
          just --version
          cargo nextest --version
      # Proves a fresh checkout runs Cargo with no rustc wrapper at all. The
      # repository tracks none; RUSTC_WRAPPER is cleared explicitly so a stray
      # environment value cannot mask a broken clean-checkout path.
      - name: Cargo metadata without build acceleration
        shell: bash
        env:
          RUSTC_WRAPPER: ""
        run: cargo metadata --no-deps --format-version 1 >/dev/null

  ci-gate:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v5
          with:
            ref: ${{ needs.scope.outputs.head }}
            fetch-depth: 0
        - name: Fold the blocking jobs' results
          shell: bash
          env:
            RESULTS: |
              validation:${{ needs.validation.result }}
              scope:${{ needs.scope.result }}
              preflight:${{ needs.preflight.result }}
              build:${{ needs.build.result }}
              area-ci:${{ needs.area-ci.result }}
              biscuit-tui-captured-stdout:${{ needs.biscuit-tui-captured-stdout.result }}
              ci-tooling:${{ needs.ci-tooling.result }}
          run: |
            set -euo pipefail
            blocking=""
            while IFS= read -r entry; do
              [ -n "$entry" ] || continue
              job="${entry%%:*}"
              result="${entry##*:}"
              case "$result" in
                success|skipped) echo "$job: $result" ;;
                *)
                  echo "$job: $result (blocks)"
                  blocking="${blocking} ${job}"
                  ;;
              esac
            done <<<"$RESULTS"
            if [ -n "$blocking" ]; then
              echo "ci-gate: blocked by${blocking}" >&2
              exit 1
            fi
            echo "ci-gate: every blocking job succeeded or was skipped"
