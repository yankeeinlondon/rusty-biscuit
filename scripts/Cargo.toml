[workspace]

[package]
name = "repo-deps"
version = "0.1.0"
edition = "2021"
publish = false

# `repo-deps` and `drift` link the monorepo's own crates (biscuit-terminal,
# sniff) plus cargo_metadata; `ci-rollup` links none of them. Cargo compiles the
# union of a package's dependencies regardless of which bin is selected, so
# without this split the CI job whose entire purpose is to be the fast,
# always-runs required check would pay for gix, duckdb, and the terminal
# renderer. CI builds it as:
#     cargo run --manifest-path scripts/Cargo.toml --no-default-features --bin ci-rollup
[features]
default = ["local-tools"]
local-tools = [
    "dep:biscuit-terminal",
    "dep:cargo_metadata",
    "dep:ctrlc",
    "dep:sniff",
]

[[bin]]
name = "repo-deps"
path = "repo-deps.rs"
required-features = ["local-tools"]

[[bin]]
name = "drift"
path = "drift.rs"
required-features = ["local-tools"]

[[bin]]
name = "ci-rollup"
path = "ci-rollup.rs"

[dependencies]
anyhow = "1.0"
quick-xml = "0.38"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"

biscuit-terminal = { path = "../biscuit-terminal/lib", optional = true }
cargo_metadata = { version = "0.18", optional = true }
ctrlc = { version = "3.4", optional = true }
sniff = { path = "../sniff/lib", optional = true }

[dev-dependencies]
rstest = "0.23"
