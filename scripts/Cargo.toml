[package]
name = "repo-deps"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

# Cargo compiles the union of a package's enabled dependencies regardless of
# which bin is selected, so the bins are split across three feature levels by
# how much they are allowed to cost.
#
# `ci-rollup` links none of the monorepo's crates: it is the fast, always-runs
# merge-gate binary and must never pay for gix, duckdb, or the terminal
# renderer. CI builds it as:
#     cargo run -p repo-deps --no-default-features --bin ci-rollup
#
# `build-tools` is the middle level, for the two binaries the *planner* depends
# on. `affected_scope.py` computes every planned build key through `ci-build`,
# so that binary is now on the critical path of every scope calculation —
# including the pre-push hook's. Putting it behind `local-tools` would make
# resolving a plan compile sniff's duckdb and gix closure to answer a hash:
#     cargo run -p repo-deps \
#       --no-default-features --features build-tools --bin ci-build
#
# `local-tools` adds the workspace-inspecting crates `repo-deps`, `drift`,
# `feature-attribution`, `slow-tests`, and `ci-push` need. `slow-tests` runs after every
# canonical test recipe, and it is here because it keys each run on sniff's
# working-tree state; its first recording on a fresh tree pays for sniff.
[features]
default = ["local-tools"]
build-tools = ["dep:biscuit-hash", "dep:biscuit-terminal", "dep:object", "dep:find-msvc-tools"]
local-tools = [
    "build-tools",
    "dep:cargo_metadata",
    "dep:chrono",
    "dep:ctrlc",
    "dep:dirs",
    "dep:git2",
    "dep:gix",
    "dep:libc",
    "dep:libgit2-sys",
    "dep:sniff",
    "dep:tempfile",
    "dep:windows-sys",
]

# The library holds the code more than one binary calls in-process:
# `ci_plan_render` (`build-tools`), the resolved-plan renderer `ci-plan` and
# `ci-push` share, and `ci_push` (`local-tools`), whose decisions are tested
# through `ci_push::run`. `[lib]` cannot declare `required-features`, so
# `lib.rs` gates each module itself and compiles empty for `ci-rollup`.
[lib]
path = "lib.rs"

[[bin]]
name = "repo-deps"
path = "repo-deps.rs"
required-features = ["local-tools"]

[[bin]]
name = "drift"
path = "drift.rs"
required-features = ["local-tools"]

[[bin]]
name = "feature-attribution"
path = "feature-attribution.rs"
required-features = ["local-tools"]

[[bin]]
name = "ci-plan"
path = "ci-plan.rs"
required-features = ["build-tools"]

[[bin]]
name = "ci-build"
path = "ci-build.rs"
required-features = ["build-tools"]

[[bin]]
name = "slow-tests"
path = "slow-tests.rs"
required-features = ["local-tools"]

[[bin]]
name = "ci-rollup"
path = "ci-rollup.rs"

[[bin]]
name = "ci-push"
path = "ci-push.rs"
required-features = ["local-tools"]

# Test fixture only: the gh/just/python/cargo stand-ins `ci-push`'s tests copy
# under each tool's name. A `[[bin]]` because a test can locate a built binary
# portably (archives included) only through `CARGO_BIN_EXE_*`, which Cargo
# sets for integration tests alone; hence the `ci-push` test target below.
[[bin]]
name = "ci-push-test-tool"
path = "ci-push-test-tool.rs"
required-features = ["local-tools"]

# `ci-push`'s tests that drive a compiled executable. Its decision tests stay
# lib unit tests (`ci_push::tests`).
[[test]]
name = "ci-push"
path = "ci-push/integration/main.rs"
required-features = ["local-tools"]

[dependencies]
anyhow = "1.0"
quick-xml = "0.38"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"

# `blake3` is the archive/sidecar checksum: an artifact that crosses a machine
# boundary needs a cryptographic digest, while `xx_hash` (the default feature)
# stays the fast identity hash for plan keys and counter event files.
biscuit-hash = { path = "../biscuit-hash/lib", optional = true, features = ["blake3"] }
biscuit-terminal = { path = "../biscuit-terminal/lib", optional = true }
cargo_metadata = { version = "0.18", optional = true }
ctrlc = { version = "3.4", optional = true }
sniff = { path = "../sniff/lib", optional = true }

object = { version = "0.37.3", default-features = false, features = ["read", "std"], optional = true }

find-msvc-tools = { version = "0.1.12", optional = true }

# `ci-push` (local-tools). Repository reads go through gix, at sniff's pinned
# version. git2 covers the two writes gix 0.90 has no API for: creating a
# detached linked worktree for a committed-tree review, and attaching a scope
# note. Remote transport (ls-remote, fetch, push) stays on the Git CLI.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
dirs = { version = "6", optional = true }
git2 = { version = "0.20", default-features = false, optional = true }
gix = { version = "=0.90.0", default-features = false, features = [
    "sha1",
    "revision",
    "status",
    "blob-diff",
    "dirwalk",
    "excludes",
    "parallel",
], optional = true }
# libgit2-sys >= 0.18.6 bundles PCRE2 with unprefixed symbols that collide at
# MSVC link time with pcre2-sys, which sniff's `hyperpolyglot` already links
# (LNK2005 -> LNK1169). The same ceiling sniff and tree-hugger carry.
libgit2-sys = { version = ">=0.18.3, <0.18.6", optional = true }
tempfile = { version = "3", optional = true }

# `ci-push` owns its children's process tree: a process group and `sigaction`
# on Unix, a kill-on-close Job Object and console control on Windows.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
biscuit-test-harness = { path = "../biscuit-test-harness" }
rstest = "0.23"
test-toolkit = { path = "../tools/test-toolkit" }

# The L1 suite covers `ci-rollup`, `ci-plan`, `ci-build`, `drift`, `slow-tests`, and
# `feature-attribution`, all of which need the default `local-tools` feature;
# declaring no `features` here is what selects it.
#
# The planner's Python contracts are this package's companion suites: they test
# `scripts/ci/`, they are not reachable through `cargo nextest`, and every one
# is registered to `repo-deps` in `scripts/ci/affected_scope.py`'s
# `SUITE_REGISTRY`. They run on the one environment that registry declares.
[package.metadata.ci.tests]
tiers = ["L1"]
companion-suites = [
    "artifact-publisher",
    "distribution",
    "test_affected_scope.py",
    "test_build_key.py",
    "test_build_status.py",
    "test_ci_local.py",
    "test_completion.py",
    "test_constraints.py",
    "test_cross_check.py",
    "test_evidence_reuse.py",
    "test_hosted_observations.py",
    "test_local_evidence.py",
    "test_publish_gaps.py",
    "test_resolved_plan.py",
    "test_reuse_validation.py",
    "test_runner_loss.py",
    "test_schema.py",
    "test_seed.py",
    "test_storage_sample.py",
]
# `ci-rollup`'s round-trip test runs the real planner, and the planner opens the
# workspace with `cargo metadata`. Environments without a toolchain render a
# governed ACCEPTED GAP instead of a red cell.
requires-toolchain = true
