[package]
name = "worktree-cli"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[[bin]]
name = "wt"
path = "src/main.rs"

[features]
terminal-tests = ["dep:test-toolkit"]

[dependencies]
biscuit-terminal = { path = "../../biscuit-terminal/lib", features = ["image"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
dirs = "6"
inquire = "0.9"
sniff = { path = "../../sniff/lib" }
worktree = { path = "../lib" }
test-toolkit = { path = "../../tools/test-toolkit", optional = true }

[dev-dependencies]
worktree = { path = "../lib", features = ["count-git"] }
assert_cmd = "2"
biscuit-test-harness = { path = "../../biscuit-test-harness" }
predicates = "3"
serial_test = "3"
tempfile = "3"

[[test]]
name = "level2_dirty_tree"
required-features = ["terminal-tests"]

[[test]]
name = "level2_list_verbose"
required-features = ["terminal-tests"]

# CI policy: worktree-cli owns the area's L2 (real-terminal) tier tests.
[package.metadata.ci.tests]
tiers = ["L1", "L2"]
l2-backends = ["tmux", "kitty"]
features = ["terminal-tests"]
local-features = []
