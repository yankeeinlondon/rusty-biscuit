[package]
name = "worktree"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "worktree"
path = "src/lib.rs"
# Disable the default bench harness so `cargo bench` only runs Criterion targets.
bench = false

[dependencies]
# `file-reference` supplies `home_dir()`, the env-first absolute home lookup
# used for `~/.worktree.json` and setup candidates.
biscuit-file = { path = "../../biscuit-file/lib", default-features = false, features = ["file-reference"] }
biscuit-hash = { path = "../../biscuit-hash/lib", features = ["blake3"] }
cap-std = "4"
# The start time of a process using a checkout, shown in local time in
# `wt remove`'s question (`remove::facts`).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
fs4 = "0.13"
getrandom = "0.4"
# In-process reads of local repository metadata (`git_metadata`) and of the
# graph's commit history (`graph::topology::commits`, shared by the gather's
# threads, hence `parallel`); the same pinned version and features `sniff`
# builds, so no second copy is compiled.
gix = { version = "=0.84.0", default-features = false, features = ["sha1", "revision", "parallel"] }
reflink-copy = "0.1.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `remote` supplies the blocking PR lookup behind `wt remove`'s Safe tier.
sniff = { path = "../../sniff/lib", features = ["remote"] }
thiserror = "2.0"
which = "8.0"

[target.'cfg(unix)'.dependencies]
# `geteuid` for the owner check on removal recovery records, and the
# no-replacement renames (`renameat2`, `renamex_np`) for the quarantine move.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The quarantine move's no-replacement rename (`SetFileInformationByHandle`)
# and its `FileIdInfo` directory identity, `wt remove`'s deletion by handle
# (`CreateFileW`, which needs `Win32_Security`, and
# `SetFileInformationByHandle`), and the mount table (volume mount points).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[features]
count-git = []

[dev-dependencies]
serial_test = "3"
test-toolkit = { path = "../../tools/test-toolkit" }
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "list_status"
harness = false
