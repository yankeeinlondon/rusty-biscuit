[package]
name = "worktree"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "worktree"
path = "src/lib.rs"
# Disable the default bench harness so `cargo bench` only runs Criterion targets.
bench = false

[dependencies]
biscuit-file = { path = "../../biscuit-file/lib", default-features = false }
biscuit-hash = { path = "../../biscuit-hash/lib", features = ["blake3"] }
dirs = "6"
getrandom = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `remote` supplies the blocking PR lookup behind `wt remove`'s Safe tier.
sniff = { path = "../../sniff/lib", features = ["remote"] }
thiserror = "2.0"
which = "8.0"

[features]
count-git = []

[dev-dependencies]
serial_test = "3"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "list_status"
harness = false
