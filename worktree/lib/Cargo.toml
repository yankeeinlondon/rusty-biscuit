[package]
name = "worktree"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "worktree"
path = "src/lib.rs"
# Disable the default bench harness so `cargo bench` only runs Criterion targets.
bench = false

[dependencies]
biscuit-hash = { path = "../../biscuit-hash/lib" }
dirs = "6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sniff = { path = "../../sniff/lib" }
thiserror = "2.0"
which = "8.0"

[features]
count-git = []

[dev-dependencies]
serial_test = "3"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "list_status"
harness = false
