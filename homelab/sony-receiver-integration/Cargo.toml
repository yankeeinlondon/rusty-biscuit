[package]
name = "sony-receiver-integration"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sony-receiver-integration"
path = "src/main.rs"

[dependencies]
homelab = { path = "../lib" }
schematic-schema = { path = "../../schematic/schema" }
unfolded-integration-helper = { path = "../unfolded-integration-helper", features = ["mdns"] }
tokio = { version = "1.48", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tokio-tungstenite = "0.28"
futures-util = "0.3"
tempfile = "3.15"
