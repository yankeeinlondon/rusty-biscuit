[package]
name = "homelab"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6.0"
reqwest = { version = "0.13.2", features = ["json", "brotli", "gzip", "deflate"] }
schematic-schema = { path = "../../schematic/schema" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }

[dev-dependencies]
tempfile = "3.15"

# Opt-out of benchmarking: this crate has no algorithmic hot paths.
[package.metadata.benchmarks]
required = false
reason = "Home-automation control library dominated by device network I/O; no measurable in-process hot paths."
