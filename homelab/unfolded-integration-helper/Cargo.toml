[package]
name = "unfolded-integration-helper"
version = "0.1.0"
edition = "2024"

[features]
mdns = ["dep:mdns-sd", "dep:tracing"]

[dependencies]
schematic-schema = { path = "../../schematic/schema" }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
futures-util = "0.3"
get_if_addrs = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["rt", "sync", "time"] }
tracing = { version = "0.1", optional = true }
mdns-sd = { version = "0.12", optional = true }

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync"] }
tempfile = "3.15"

# Opt-out of benchmarking: device-integration helper library; no measurable
# hot paths.
[package.metadata.benchmarks]
required = false
reason = "Device-integration helper; no measurable hot paths."
