services:
  arcam-amp-integration:
    build:
      context: ../..
      dockerfile: homelab/arcam-amp-integration/Dockerfile
    network_mode: host
    environment:
      - UCR_INTEGRATION_TOKEN=${UCR_INTEGRATION_TOKEN:-}
      - RUST_LOG=${RUST_LOG:-info}
    command:
      - --host=${ARCAM_HOST:?Set ARCAM_HOST to your Arcam amplifier IP}
      - --port=${ARCAM_PORT:-50000}
      - --listen=0.0.0.0:${LISTEN_PORT:-9090}
      - --device-name=${DEVICE_NAME:-amp}
      - --timeout=${TIMEOUT:-5}
    restart: unless-stopped
