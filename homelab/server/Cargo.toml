[package]
name = "homelab-server"
version = "0.1.0"
edition = "2024"

[lib]
name = "homelab_server"
path = "src/lib.rs"

[[bin]]
name = "homelab-server"
path = "src/main.rs"

[dependencies]
homelab = { path = "../lib" }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tokio = { version = "1.48", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }
petname = "2.0"
dirs = "6.0"
get_if_addrs = "0.5"
rust-embed = "8"
mime_guess = "2"

[dev-dependencies]
axum-test = "18"
tempfile = "3.15"
serial_test = "3.2"

# Opt-out of benchmarking: HTTP/REST server glue around the homelab library.
[package.metadata.benchmarks]
required = false
reason = "HTTP server glue around homelab; no measurable hot paths."

# CI policy: homelab-server owns the Vue + Vitest frontend companion suite
# (homelab/server/frontend), which needs Node 22 and pnpm 10 on the runner.
[package.metadata.ci.tests]
runner-tools = ["node-22", "pnpm-10"]
companion-suites = ["homelab-frontend"]
