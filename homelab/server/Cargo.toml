[package]
name = "homelab-server"
version = "0.1.0"
edition = "2024"

[lib]
name = "homelab_server"
path = "src/lib.rs"

[[bin]]
name = "homelab-server"
path = "src/main.rs"

[dependencies]
homelab = { path = "../lib" }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tokio = { version = "1.48", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
petname = "2.0"
dirs = "6.0"

[dev-dependencies]
axum-test = "17"
tempfile = "3.15"
serial_test = "3.2"
