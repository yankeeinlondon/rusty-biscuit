[package]
name = "homelab-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "homey"
path = "src/main.rs"

[dependencies]
biscuit-terminal = { path = "../../biscuit-terminal/lib" }
homelab = { path = "../lib" }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
tokio = { version = "1.48", features = ["full"] }
color-eyre = "0.6"
serde_json = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
