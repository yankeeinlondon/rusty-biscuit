kind: yaml-schema
description: |-
    The definition of a `kind: schema` document: a YAML file that exports a
    document schema (`$schema`), reusable named types (`types`), or both.
$schema:
    # a schema must define the `$schema` or `types` property but optionally can do both
    - kind: literal(schema; required) -> the document kind that claims this definition
      description: string(not-empty) -> what the schema is for
      categories: string[](not-empty) -> the category names `category(...)` constraints in `types` may use, each `Name` or `Name -> description`
      $schema: schema(required) -> the exported document schema (an inline mapping or union, or a reference to a schema file)
      types: schema(mapping; not-empty) -> reusable named types; these names are not document properties
      $constraints: { closed: true }
    # the types-only form: only a library that exports no `$schema` may carry a `name`
    - kind: literal(schema; required) -> the document kind that claims this definition
      name: string(pattern('^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$')) -> a kebab-case display label shown beside the file's path; unique within its schema root; never a reference
      description: string(not-empty) -> what the schema is for
      categories: string[](not-empty) -> the category names `category(...)` constraints in `types` may use, each `Name` or `Name -> description`
      $schema: null -> a types-only library exports no document schema
      types: schema(mapping; required; not-empty) -> reusable named types; these names are not document properties
      $constraints: { closed: true }
