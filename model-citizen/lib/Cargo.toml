[package]
name = "model-citizen"
version = "0.1.0"
edition = "2024"
description = "Local LLM model management across Ollama, LM Studio, and Llama.cpp"
license = "MIT"

[dependencies]
# Error handling
thiserror = "2.0"

# Async
tokio = { version = "1.48", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File format utilities (TOML parsing via biscuit-file)
biscuit-file = { path = "../../biscuit-file/lib", features = ["toml"] }

# HTTP
reqwest = { version = "0.13", features = ["json", "stream"] }
urlencoding = "2.1"

# Platform-specific directories
dirs = "6.0"

# OS detection (workspace dependency)
sniff = { path = "../../sniff/lib" }

# GGUF file parsing for metadata extraction
gguf-rs-lib = "0.2"

# API type definitions (Ollama, LM Studio)
schematic-definitions = { path = "../../schematic/definitions" }

# HuggingFace API client
schematic-schema = { path = "../../schematic/schema" }

[dev-dependencies]
serial_test = { version = "3.4", features = ["file_locks"] }
tempfile = "3.26"

# Opt-out of benchmarking: this crate has no algorithmic hot paths.
[package.metadata.benchmarks]
required = false
reason = "Local LLM model management dominated by GGUF metadata reads and provider HTTP calls; no measurable in-process hot paths."
