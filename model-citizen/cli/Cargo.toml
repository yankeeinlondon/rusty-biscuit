[package]
name = "model-citizen-cli"
version = "0.1.0"
edition = "2024"
description = "CLI for managing local LLM models"
license = "MIT"

[[bin]]
name = "model"
path = "src/main.rs"

[dependencies]
# Core library
model-citizen = { path = "../lib" }

# CLI framework
clap = { version = "4.5", features = ["derive"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }

# Terminal rendering
biscuit-terminal = { path = "../../biscuit-terminal/lib" }

# Error reporting
color-eyre = "0.6"

# Interactive prompts
inquire = "0.9"

# Progress bars
indicatif = "0.18"

# Serialization for JSON output
serde_json = "1.0"

# Async runtime
tokio = { version = "1.48", features = ["full"] }

[dev-dependencies]
assert_cmd = "2.0"
insta = "1"
predicates = "3.1"

# Opt-out of benchmarking: thin CLI wrapper around the model-citizen library.
[package.metadata.benchmarks]
required = false
reason = "Thin CLI wrapper around model-citizen; no measurable hot paths."
