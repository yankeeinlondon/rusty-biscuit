    "biscuit-clipboard/service",
    "biscuit-contract/lib",
    "reaper/lib",
    "reaper/cli",
    "biscuit-file/cli",
    "biscuit-file/lib",
    "biscuit-hash/cli",
    "biscuit-hash/lib",
    "biscuit-icon/cli",
    "biscuit-icon/lib",
    "biscuit-location/cli",
    "biscuit-location/lib",
    "biscuit-speaks/cli",
    "biscuit-speaks/lib",
    "biscuit-terminal/cli",
    "biscuit-terminal/lib",
    "claudine/catalog-types",
    "claudine/cli",
    "claudine/contract",
    "claudine/gen",
    "claudine/lib",
    "darkmatter/cli",
    "darkmatter/lib",
    "homelab/arcam-amp-integration",
    "homelab/cli",
    "homelab/eversolo-integration",
    "homelab/lib",
    "homelab/server",
    "homelab/sony-receiver-integration",
    "homelab/unfolded-integration-helper",
    "model-citizen/cli",
    "model-citizen/lib",
    "unchained-ai/cli",
    "unchained-ai/contract",
    "unchained-ai/gen",
    "unchained-ai/lib",
    "unchained-ai/model_id",
    "playa/cli",
    "messenger/cli",
    "messenger/lib",
    "biscuit-visualized/src",
    "worktree/lib",
    "worktree/cli",
    "darkmatter/dmls",
    "tools/test-toolkit",
    "biscuit-browser-harness",
    "claudine/rendezvous/core",
    "claudine/rendezvous/daemon",
    "claudine/rendezvous/client",
    "visualizer/src-tauri",
    "sniff/lib",
    "sniff/cli",
    "renderable",
    "biscuit-tui/lib",
    "biscuit-tui/cli",
    "playa/lib",
    "queue/lib",
    "queue/cli",
    "research/lib",
    "research/cli",
    "tree-hugger/lib",
    "tree-hugger/cli",
    "tabby",
    "tabby/ui",
    "schematic/define",
    "schematic/definitions",
    "schematic/gen",
    "schematic/oauth",
    "agent-sandbox/cli",
]
exclude = ["schematic/schema", "darkmatter/dmls/zed-dmls"]

[profile.dev]
# Keep panic/backtrace line numbers but drop full DWARF (variables/types) -- the bulk of
# debug-build artifact size. Shrinks target/ substantially and speeds linking. Switch to
# `debug = true` if you need a step-debugger (lldb/gdb) with variable inspection.
debug = "line-tables-only"

# Dependency frames do not need source locations in workspace backtraces.
# Workspace members retain the line tables configured above.
[profile.dev.package."*"]
debug = 0

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
