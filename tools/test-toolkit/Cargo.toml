[package]
name = "test-toolkit"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Shared test lifecycle helpers for the Rusty Biscuit workspace"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# `spool` takes Playa's cross-process worker/queue locks. Kept unconditional
# rather than feature-gated like `clap`/`sysinfo` below: `fs4` resolves to
# `rustix`/`windows-sys`, which every dev-dependent already builds, so it adds
# no crate to the graph, and gating it would force `required-features` on this
# crate's own tests.
fs4 = "0.13"

# `manifest_dir!` — the run-time checkout lookup an archived consumer needs.
# A regular rather than dev dependency because `evidence::workspace_root` is
# library code this crate's dependents call. Its own graph is libc, serde_json,
# tempfile, and unicode-width, all of which every dev-dependent already builds.
biscuit-test-harness = { path = "../../biscuit-test-harness" }

# `archive_guard` reads the CI planner's canonical resolved plan, which is
# library code the guard's test target and (in time) other consumers call, so
# this moved up from `[dev-dependencies]`. It adds nothing to the graph:
# `biscuit-test-harness` above already builds it.
serde_json = "1"

# Pulled in only for the `leak-sweep` binary (feature-gated) so the many crates
# that depend on this crate as a dev-dependency do not inherit them.
clap = { version = "4", features = ["derive"], optional = true }
sysinfo = { version = "0.38", default-features = false, features = ["system"], optional = true }

[features]
# Enables the cross-platform `leak-sweep` post-run orphan detector binary.
leak-sweep = ["dep:clap", "dep:sysinfo"]
# Enables the `backend-proof` post-run L2 execution-evidence checker binary.
backend-proof = ["dep:clap"]

[[bin]]
name = "leak-sweep"
required-features = ["leak-sweep"]

[[bin]]
name = "backend-proof"
required-features = ["backend-proof"]

[dev-dependencies]
serial_test = "3"
tempfile = "3"

# Opt-out of benchmarking: this crate has no algorithmic hot paths.
[package.metadata.benchmarks]
required = false
reason = "Test helper crate; no measurable hot paths."

# `tools/test-audit` is this package's TypeScript half: the JUnit gates and
# inventory reconciliation the Rust helpers are the other side of. Neither is
# reachable through `cargo nextest`, so both are registered companion suites
# owned here (`SUITE_REGISTRY` in `scripts/ci/affected_scope.py`).
#
# `archive-path-guard` is registered LINT-ONLY: it scans repository source for
# compile-time paths, so the planner selects it from the files it checks rather
# than from this package, and an L1 half would run the same scan a second time
# under this package's evidence rules instead of the scan's own.
[package.metadata.ci.tests]
tiers = ["L1"]
companion-suites = ["archive-path-guard", "test-audit-typecheck", "test-audit-vitest"]
# These contracts read the workspace through `cargo metadata` and drive the
# real `just` recipes in a scratch tree, so the suite needs a live toolchain
# and not merely a compiled archive. Environments without one render a
# governed ACCEPTED GAP instead of a red cell.
requires-toolchain = true
