version = 99
revision = 3
requires-python = ">=3.9"

[manifest]
members = [
    "alpha",
    "beta",
    "fixture-root",
    "hidden-tool",
]

[[package]]
name = "alpha"
version = "0.1.0"
source = { editable = "packages/alpha" }
dependencies = [
    { name = "beta" },
]

[package.metadata]
requires-dist = [{ name = "beta", editable = "packages/beta" }]

[[package]]
name = "beta"
version = "0.1.0"
source = { editable = "packages/beta" }

[[package]]
name = "fixture-root"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "alpha" },
    { name = "local-lib" },
]

[package.metadata]
requires-dist = [
    { name = "alpha", editable = "packages/alpha" },
    { name = "local-lib", directory = "local-lib" },
]

[[package]]
name = "hidden-tool"
version = "0.1.0"
source = { editable = ".tools/hidden" }

[[package]]
name = "local-lib"
version = "0.1.0"
source = { directory = "local-lib" }
