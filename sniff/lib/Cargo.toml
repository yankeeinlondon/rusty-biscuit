[package]
name = "sniff"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
biscuit-file = { path = "../../biscuit-file/lib", features = ["toml", "yaml"] }
biscuit-hash = { path = "../../biscuit-hash/lib" }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
ec4rs = "1"
futures = { version = "0.3", optional = true }
getifaddrs = "0.6.0"
globset = "0.4"
# Production git access is pure-Rust gix. git2 (libgit2) is retained ONLY as a
# dev-dependency, and only for the fixture operations gix has no write API for —
# worktree-snapshot commits, checkout, and linked-worktree creation — plus the
# libgit2 differential-parity oracle. Everything gix can do uses gix.
gix = { version = "=0.84.0", default-features = false, features = [
    "sha1",
    "revision",
    "status",
    "blob-diff",
    "dirwalk",
    "excludes",
    "parallel",
    # Needed for the worktree merge-conflict probe (R5): unmerged worktree
    # branches are merged in-memory (no repository writes) to detect conflicts.
    "merge",
] }
hyperpolyglot = "0.1.7"
ignore = "0.4"
libc = "0.2"
metrics = { version = "0.24", optional = true }
rayon = "1.11.0"
regex = "1.11"
reqwest = { version = "0.13", features = ["json", "blocking"], default-features = false, optional = true }
schematic-schema = { path = "../../schematic/schema" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
sysinfo = "0.38.2"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1", features = ["rt"], optional = true }
url = "2"
urlencoding = "2.1"
walkdir = "2.5"
which = { version = "8.0.0", default-features = false, features = ["real-sys"] }

[features]
default = []
bench-internals = []
metrics = ["dep:metrics"]
network = ["dep:reqwest", "dep:tokio", "dep:futures", "reqwest/rustls", "biscuit-file/fetch"]
remote = ["network"]

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = { version = "0.2", default-features = false, features = ["core_audio"] }
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Services",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }
winreg = "0.55"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# Fixture writes gix has no API for (worktree-snapshot commits, checkout,
# linked-worktree creation) + the libgit2 parity oracle. See note above.
git2 = { version = "0.20.3", default-features = false }
# 0.18.6+ bundles PCRE2, which collides on MSVC with hyperpolyglot's pcre2-sys.
# This is test-only, with network transports disabled; keep it on the last
# non-PCRE2 release until upstream isolates its bundled symbols.
libgit2-sys = "=0.18.5"
proptest = "1"
serial_test = "3"
tempfile = "3"
test-toolkit = { path = "../../tools/test-toolkit" }
tokio = { version = "1", features = ["rt", "macros"] }
wiremock = "0.6"

[[bench]]
name = "perf"
harness = false
