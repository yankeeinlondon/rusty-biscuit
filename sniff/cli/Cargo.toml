[package]
name = "sniff-cli"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[[bin]]
name = "sniff"
path = "src/main.rs"

# Test-only helper rendered inside a real terminal by the Level 2 styling test.
# Gated behind `test-fixtures` so it stays out of default builds and `cargo install`.
[[bin]]
name = "render_cicd_fixture"
path = "src/bin/render_cicd_fixture.rs"
required-features = ["test-fixtures"]

# Test-only helper rendered inside a real terminal by the Level 2 git-status
# styling test (double-underline headers, worktree hyperlinks, blank-row layout).
[[bin]]
name = "render_git_status_fixture"
path = "src/bin/render_git_status_fixture.rs"
required-features = ["test-fixtures"]

[features]
test-fixtures = []

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
dirs = "6"
futures = "0.3"
inquire = "0.9"
rayon = "1.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
biscuit-terminal = { path = "../../biscuit-terminal/lib", features = ["image"] }
darkmatter = { path = "../../darkmatter/lib" }
sniff = { path = "../lib", features = ["network", "remote"] }
strum = { version = "0.28", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
url = "2"

[dev-dependencies]
assert_cmd = "2"
biscuit-test-harness = { path = "../../biscuit-test-harness" }
expectrl = "0.8"
# Only to snapshot worktrees into commits when building CLI test repos —
# gix has no worktree-staging write API. See sniff-lib's dev-dep note.
git2 = "0.20"
# PCRE2 symbol clash with pcre2-sys breaks the MSVC link. See sniff-lib's dev-dep note.
libgit2-sys = ">=0.18.3, <0.18.6"
insta = { version = "1", features = ["json"] }
predicates = "3"
serial_test = "3"
tempfile = "3"
test-toolkit = { path = "../../tools/test-toolkit" }
