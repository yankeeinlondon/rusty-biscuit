[package]
name = "visualizer"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
# Tauri convention: the application logic lives in a library so it can be shared
# with mobile targets; the binary in `main.rs` is a thin entry point.
name = "visualizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri's default `compression` feature pulls brotli's encoder via tauri-codegen.
# brotli 8.0.3 pins alloc-no-stdlib ^2.0 while alloc-stdlib 0.2.3+ widened to
# `<4` (resolves 3.0.0), so the encoder fails to compile against two Allocator
# traits. The committed root Cargo.lock pins alloc-stdlib=0.2.2 and
# brotli-decompressor=5.0.1 to keep the whole graph on alloc-no-stdlib 2.0.4.
# Drop those pins (and this note) once brotli unifies on alloc-no-stdlib 3.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
