[package]
name = "darkmatter"
description = "Markdown parsing, rendering, and Mermaid diagram support for terminal and HTML output."
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/yankeeinlondon/dockhand"
keywords = ["markdown", "terminal", "syntax-highlighting", "mermaid", "themes"]
categories = ["text-processing", "visualization"]

[lib]
name = "darkmatter"
path = "src/lib.rs"
# The crate has no `#[bench]` functions; disabling bench harness here keeps
# `cargo bench` from running the unit-test harness (and printing a large
# "N ignored" block) before the Criterion `[[bench]]` targets.
bench = false

[features]
default = []
# Test-only instrumentation. Enables process-wide counters that let downstream
# test suites assert a documentation-only code path constructs no `EffectEngine`
# and attempts no network access. Off by default; production builds carry no
# counter state and expose none of the instrumentation API.
effects-instrumentation = []

[dependencies]
# Tracing
tracing = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2", features = ["serde"] }
biscuit-file = { path = "../../biscuit-file/lib", features = ["yaml", "file-reference", "fetch"] }

# Error handling
thiserror = "2.0"

# Parallelism
rayon = "1.10"
dashmap = "6.1"

# Utilities
lazy_static = "1.5"
regex = "1.11"
# Exact multi-pattern (leftmost-longest) automaton for `replace:` text
# replacement (Finding 13). Already compiled transitively via `regex`, so no
# added build cost.
aho-corasick = "1.1"
tempfile = "3.8"
globset = "0.4"
# Blocking child-process wait that stays killable from another thread, so shell
# directives wait on an OS event instead of a 10ms poll loop (Finding 17).
# `default-features = false` drops the `timeout` feature: its `wait_timeout` is
# built on a process-wide SIGCHLD handler (via `sigchld`/`signal-hook`), and
# Darkmatter is a library that must not hijack a host's signal disposition. The
# ungated `wait`/`kill` core we use is `waitid`-based and installs nothing.
shared_child = { version = "1.1", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "now"] }
which = "7"
dirs = "6"

# HTTP and URLs
reqwest = { version = "0.13", features = ["json", "gzip"] }
url = "2.5"

# Async runtime
tokio = { version = "1.48", features = ["time", "macros", "rt-multi-thread", "sync"] }

# Syntax highlighting
syntect = "5.2"
two-face = "0.5"

# CSS parsing
cssparser = "0.37"

# Type-safe CSS stylesheet declarations (shared, render-target agnostic)
renderable = { path = "../../renderable" }

# Markdown parsing and rendering
pulldown-cmark = "0.13"
pulldown-cmark-to-cmark = "22"
markdown = { version = "1.0.0-alpha.22", features = ["serde"] }
html-escape = "0.2"
similar = { version = "2.6", features = ["inline"] }

# SVG sanitization for promoted Mermaid static <svg> before raw-HTML emission.
# Pinned to the version `syntect`/`plist` already pull in so cargo unifies on a
# single copy rather than compiling a second quick-xml.
quick-xml = "0.39"

# Terminal image rendering and mermaid diagrams (via biscuit-terminal)
biscuit-terminal = { path = "../../biscuit-terminal/lib", features = ["image"] }

# Hashing (for Mermaid diagram caching and markdown TOC)
biscuit-hash = { path = "../../biscuit-hash/lib" }

# System detection (OS, hardware, repo, docs)
sniff = { path = "../../sniff/lib" }
serde_yaml_ng = "0.10"

# Unicode Script lookup for cleanup's join-separator decision (spaceless scripts
# such as Han/Thai join without a space; space-delimited scripts keep one).
# Already resolved transitively via biscuit-terminal, so no added build cost.
unicode-script = "0.5"

# JSON Schema validation
jsonschema = { version = "0.42", default-features = false }
# Backtracking regex engine for SimplifiedSchema pattern-key literal precedence
# (Feature C emits negative-lookahead `patternProperties`, which the linear
# `regex` engine rejects). Already compiled transitively via `jsonschema`, so no
# added build cost; used both to select `jsonschema`'s fancy-regex pattern engine
# for such schemas and to validate emitted patterns at conversion time.
fancy-regex = "0.17"

[dev-dependencies]
# Re-declares the renderable path dep with the test-only `hint-access-counter`
# feature so the structural performance gate (`render_tree::structural_gate`)
# can observe the `NodeAttrs::data` hint-access counter while folding a styled
# corpus through the real Darkmatter entry points. Cargo unifies this with the
# `[dependencies]` declaration for the test build.
renderable = { path = "../../renderable", features = ["hint-access-counter"] }
tokio = { version = "1.48", features = ["full", "test-util"] }
tracing-test = "0.2"
insta = "1.41"
serial_test = "3.0"
# Only used to `init` a throwaway repo in transclusion tests; pure-Rust, no libgit2.
gix = { version = "=0.84.0", default-features = false, features = ["sha1"] }
# Builds committed branch-tip fixtures for `predict_conflicts()` integration tests.
git2 = "0.20.3"
proptest = "1.6"
criterion = { version = "0.5", features = ["html_reports"] }
biscuit-test-harness = { path = "../../biscuit-test-harness" }
biscuit-browser-harness = { path = "../../biscuit-browser-harness" }
test-toolkit = { path = "../../tools/test-toolkit" }
tempfile = "3"
# Encodes the distinctive-fill probe image and decodes the screen capture in the
# Level-2 terminal-image paint test (`level2_render_tree_terminal`).
image = "0.25"
# Used by the `html_to_png` example for direct visual inspection. The browser
# *tests* go through biscuit-browser-harness; the example reaches for the
# chromiumoxide screenshot API directly because the harness intentionally
# doesn't expose `full_page` screenshots.
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
futures-util = "0.3"
wiremock = "0.6"

[[bench]]
name = "schema_validation"
harness = false

[[bench]]
name = "effective_schema_ownership"
harness = false

[[bench]]
name = "render_tree"
harness = false

[[bench]]
name = "compose_pipeline"
harness = false

[[bench]]
name = "render_pipeline"
harness = false

[[bench]]
name = "prose_highlighter"
harness = false

[[bench]]
name = "render_pipeline_steps"
harness = false

[[bench]]
name = "compose_schema_transclusion"
harness = false

[[bench]]
name = "render_code_heavy"
harness = false

[[bench]]
name = "reference_graph"
harness = false

[[bench]]
name = "phase6_interpolation"
harness = false

[[bench]]
name = "phase8_render"
harness = false

[[bench]]
name = "phase9_remote"
harness = false

[[bench]]
name = "phase10_residuals"
harness = false

[[bench]]
name = "phase11_evidence"
harness = false
