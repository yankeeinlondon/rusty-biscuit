[package]
name = "darkmatter"
description = "Markdown parsing, rendering, and Mermaid diagram support for terminal and HTML output."
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/yankeeinlondon/dockhand"
keywords = ["markdown", "terminal", "syntax-highlighting", "mermaid", "themes"]
categories = ["text-processing", "visualization"]

[lib]
name = "darkmatter"
path = "src/lib.rs"
# The crate has no `#[bench]` functions; disabling bench harness here keeps
# `cargo bench` from running the unit-test harness (and printing a large
# "N ignored" block) before the Criterion `[[bench]]` targets.
bench = false

[dependencies]
# Tracing
tracing = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2", features = ["serde"] }
biscuit-file = { path = "../../biscuit-file/lib", features = ["yaml", "file-reference"] }

# Error handling
thiserror = "2.0"

# Parallelism
rayon = "1.10"
dashmap = "6.1"

# Utilities
lazy_static = "1.5"
regex = "1.11"
tempfile = "3.8"
globset = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "now"] }
which = "7"
dirs = "6"

# HTTP and URLs
reqwest = { version = "0.13", features = ["json", "gzip"] }
url = "2.5"

# Async runtime
tokio = { version = "1.48", features = ["time", "macros", "rt-multi-thread"] }

# Syntax highlighting
syntect = "5.2"
two-face = "0.5"

# CSS parsing
cssparser = "0.37"

# Type-safe CSS stylesheet declarations (shared, render-target agnostic)
renderable = { path = "../../renderable" }

# Markdown parsing and rendering
pulldown-cmark = "0.13"
pulldown-cmark-to-cmark = "22"
markdown = { version = "1.0.0-alpha.22", features = ["serde"] }
html-escape = "0.2"
similar = { version = "2.6", features = ["inline"] }

# Terminal image rendering and mermaid diagrams (via biscuit-terminal)
biscuit-terminal = { path = "../../biscuit-terminal/lib" }

# Hashing (for Mermaid diagram caching and markdown TOC)
biscuit-hash = { path = "../../biscuit-hash/lib" }

# System detection (OS, hardware, repo, docs)
sniff = { path = "../../sniff/lib" }
serde_yaml_ng = "0.10"

# JSON Schema validation
jsonschema = { version = "0.42", default-features = false }
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1.48", features = ["full", "test-util"] }
tracing-test = "0.2"
insta = "1.41"
serial_test = "3.0"
git2 = "0.20"
proptest = "1.6"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "schema_validation"
harness = false

[[bench]]
name = "render_tree"
harness = false

[[bench]]
name = "compose_pipeline"
harness = false

[[bench]]
name = "render_pipeline"
harness = false
