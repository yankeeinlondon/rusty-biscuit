kind: schema
description: copy of the shipped `claudine/docs/research/sandboxing/providers/sandboxing.yaml` shape, written with the schema-relative `load_data` slot spelling
$schema:
    schema_revision: literal(5; required)
    has_native_support: boolean(required) -> a boolean flag indicating whether the provider does or does not provide native sandboxing features
    os_support: os[](required) -> which OS's provide this native sandboxing feature?
types:
    os: enum({{ load_data("../../../os.yaml", "string[]") }}; required) -> the list of supported operating systems that Claudine supports
