# The recursive-schema golden corpus: every entry names one frozen input under
# `inputs/` and how it is resolved; `golden/<id>.json` (or `<id>.digest`) holds
# its lowered JSON Schema. Read by `darkmatter/lib/tests/l1/recursive_schema_golden.rs`.
#
# kind:
#   schema-file           `$schema: ./<file>` from the file's own directory (a `kind: schema` document)
#   pure-schema-document  the same, for a non-kinded `$schema` envelope or a raw JSON Schema file
#   inline-root           the `key` (default `$schema`) mapping of a YAML file or Markdown frontmatter
#   root-union            the `key` (default `$schema`) sequence of a YAML file or Markdown frontmatter
#   trigger-payload       a `kind: schema-trigger` file's `$schema` payload, from its own directory,
#                         with that directory as the only schema root
#   embedded-baseline     Darkmatter's compiled-in baseline; no input
#   effective             the document's effective schema (`DarkmatterSchemas::effective_for`)
#                         with the `baseline` and the `bundle` of embedded trigger files
#
# `group` gives an entry that lowers to megabytes a test of its own (`GROUP_TESTS`),
# keeping each test inside the L1 time budget.
#
# `source` is the repository path the input was copied from, byte for byte, on
# 2026-10-23 at e5976e3f0, and equals `input`; `authored` marks an input written
# for this corpus.
