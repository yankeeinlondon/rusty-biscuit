# Shipped or fixture inputs deliberately left out, with the reason.
skipped:
    - source: darkmatter/schemas/partials/functions.yaml
      reason: function catalog; a document schema can never hold a function type
    - source: darkmatter/schemas/partials/mutations.yaml
      reason: function catalog; a document schema can never hold a function type
    - source: darkmatter/lib/tests/fixtures/schema_enhancements_matrix/categories.documented.yaml
      reason: function catalog; a document schema can never hold a function type
    - source: darkmatter/schemas/partials/function-examples/
      reason: "`kind: example` artifacts with no schema body"
    - source: darkmatter/docs/schemas/schema-definition.yaml
      reason: empty placeholder
    - source: darkmatter/docs/schemas/err.yaml `$schema`
      reason: names the empty placeholder `./schema-definition.yaml`; its `types` body is an entry
    - source: claudine/docs/schemas/claudine.yaml, compose.yaml, inline-compose.yaml, partials/sequence.yaml
      reason: empty placeholders
    - source: claudine/docs/schemas/partials/loop.yaml
      reason: draft spelling its catalog `typed:`; it has no `$schema` or `types` body
    - source: claudine/docs/schemas/action.yaml, partials/flow-control.yaml, partials/stack.yaml, partials/lifecycle.yaml
      reason: drafts whose definitions do not parse
    - source: darkmatter/docs/research/parsing/_fleet_future.md
      reason: its inline `$schema` names `crate`, which the document defines only under `$types:`, so it fails with an unknown named type
    - source: darkmatter/lib/tests/fixtures/schema_enhancements_matrix/frontmatter.md-get.yaml
      reason: a document whose `$schema` is the string `./frontmatter.schema.yaml`, which is an entry
    - source: darkmatter/lib/tests/fixtures/validate/{json_schema_ref,missing_required,simple_required_present}/doc.md
      reason: each `$schema` is a string naming its sibling schema file, which is an entry
    - source: messenger/features/2026-09-17-research-metadata-pipeline/spikes/schema-pilots/probes/p14_multiline_import.md
      reason: "a parser probe: its types file spans one expression over several YAML lines, which resolution rejects (could not project SimplifiedSchema expression spans through YAML source)"
    - source: messenger/features/2026-09-17-research-metadata-pipeline/spikes/schema-pilots/probes/p15_single_quoted.md
      reason: "a parser probe: its types file single-quotes an expression, which resolution rejects (could not project SimplifiedSchema expression spans through YAML source)"
    - source: darkmatter/lib/tests/fixtures/triggers/feature-review-incident.yaml
      reason: "not valid YAML to the schema loader: an unquoted `: ` inside a plain scalar on line 17 (mapping values are not allowed in this context)"
