$schema:
    mode: enum(compute,diff,save,directory;required)
    file: string -> the file as given; null for stdin
    kind: enum(fm,body,simple,structured,detailed) -> null when nothing was computed
    computed: hash-value
    stored: hash-value -> the hash stored in the document, when it has one
    comparison: comparison -> present for --diff against a stored hash
    saved: boolean(required) -> whether the file was written
    outcome: enum(success,failure;required)
    diagnostics: diagnostic[](required)
types:
    hash-value:
        kind: enum(fm,body,simple,structured,detailed;required)
        value: unknown(required) -> the flat string; a detailed hash's nested object
        ignored: string[] -> the extra properties a stored hash ignored; absent from a computed one
    comparison:
        kind: enum(fm,body,simple,structured,detailed;required) -> the stored hash's kind
        frontmatter_changed: boolean(required)
        body_changed: boolean(required)
        detail: comparison-detail(required)
        ignore_policy: ignore-policy -> a changed ignore-set, never a content change
    comparison-detail:
        level: enum(coarse,structured,detailed;required)
        fm_keys_changed: boolean
        body_structure_changed: boolean
        preamble_changed: boolean
        sections_changed: boolean
    ignore-policy:
        now_ignoring: string[](required)
        previously: string[](required)
    diagnostic:
        code: string(required) -> stable code, e.g. dm.output.fractional_width
        severity: enum(info,warning,error;required)
        message: string(required)
        source: source -> null when no position is known
        expected_type: string
        actual_type: string
        span: span
        iteration_path: iteration-step[](required)
        reason: string -> e.g. "file not found"
        construct: string -> e.g. "hyperlink", "::code"
        reference: string -> the reference as written
        failure: string -> file-reference failure class, e.g. no-match
        included_via: trail-step[] -> outermost first
    source:
        file: string -> null for stdin
        line: number -> 1-based authored line; null when unknown
        column: number -> 1-based authored column, in characters; null when unknown
        section: string -> composed anchor slug of the innermost heading at or before the problem
        inserted: boolean -> true when an expression, shell step, or replace value created the reference
    span:
        start: number(required)
        end: number(required)
    iteration-step:
        collection: string(required)
        position: unknown(required) -> a number for an index, a string for a key
    trail-step:
        file: string(required)
        line: number -> authored line of the directive; null when the parent was built in memory
