$schema:
    files: file-record[](required) -> one per file argument, in order; empty when the baseline could not be loaded
    outcome: enum(success,failure) -> present when the run failed or has run diagnostics
    diagnostics: diagnostic[] -> present with outcome
types:
    file-record:
        file: string(required) -> the file as given
        valid: boolean(required)
        schema: string -> the document's schema reference or definition
        problems: problem[](required)
        defaults: applied-default[] -> absent required properties the verdict accepted through their schema default, in validator order; absent when none
        layers: layers -> absent when no validation ran
        error: enum(file_reference,frontmatter_parse,yaml_parse,schema,slots) -> why validation could not run; slots means the schema is a template whose slots did not resolve for this run
        failure: string -> the file-reference failure class
        message: string -> the error's message
        code: string -> with error schema, the diagnostic code of a slot written where none may appear, e.g. dm.schema.slot_not_allowed_in_kind, dm.host.trigger_conflict, or dm.schema.callable_catalog
        related: (string | related-location)[] -> with code dm.host.trigger_conflict, the two conflicting trigger files; with code dm.schema.callable_catalog, the other locations the failure involves
        line: number -> with error yaml_parse or code dm.schema.callable_catalog, the 1-based line of the failure
        column: number -> as line, the 1-based column in characters
        span: span -> with code dm.schema.callable_catalog, the byte range of the failing declaration in the file
        warnings: warning[] -> discovery findings, then schema advisories
        diagnostics: diagnostic[] -> with error slots, each slot's own record at the slot
        grants_needed: grant-needed[] -> with error slots, the grants any one of which would allow an unapproved read, each once
    problem:
        path: string(required)
        property: string
        message: string(required)
        kind: enum(missing,type,invalid,kind_check;required)
        line: number
        column: number
        arm_index: number
        description: string
        default: applied-default -> the schema default that supplied the value, whose line and column are then null; absent for an authored value
        hint: string -> the next step that fixes the problem, e.g. a removed key's replacement or the declared keys an unknown key could be; absent when the schema proves none
    applied-default:
        path: string(required) -> dotted property path from the document root
        value: unknown -> the default the property stands in for
        schema_location: string(required) -> JSON Pointer of the default keyword in the lowered schema, e.g. /properties/doc/default
        schema_file: string -> the schema file declaring the default (the imported file for a Name@file type); absent for an inline or compiled-in schema
    layers:
        document: layer
        triggers: string[](required)
        baseline: layer
    layer:
        form: string(required)
        reference: string
    warning:
        source: string(required)
        code: string(required)
        path: string
        message: string(required)
    diagnostic:
        code: string(required) -> stable code, e.g. dm.reference.missing_hyperlink
        severity: enum(info,warning,error;required)
        message: string(required)
        source: source -> null when no file is known
        expected_type: string
        actual_type: string
        span: span
        iteration_path: iteration-step[](required) -> the trail's iteration frames, outermost first; [] when none
        reason: string -> e.g. "file not found"
        construct: string -> e.g. "hyperlink", "::code"
        reference: string -> the reference as written
        failure: string -> file-reference failure class, e.g. no-match
        included_via: trail-step[] -> the trail's included frames, outermost first; [] for the root document; reference records only
        base: string -> the file or directory a missing document's reference was resolved against
        resolved: string -> the one path a missing document's reference resolved to
        searched: string[] -> every path checked, in search order, when there was more than one
        suggestions: string[] -> up to three existing files near the reference's file name; never used automatically
        data_location: data-location -> where in a loaded data file the problem is; dm.data.malformed, dm.data.contract_mismatch, and a schema problem on a property whose value is one load_data call's result
        grants_needed: grant-needed[] -> any one of these grants would allow the read; dm.schema.slot_approval_required only
        schema_default: schema-default -> the schema default that supplied the problem's value; schema problems with an inserted default only
        related: related-diagnostic[] -> other locations involved in the finding, e.g. the other declarations of a conflict
        hint: string -> the next step that fixes the problem
        notes: string[] -> supporting lines with no location of their own, shown under the message
        trail: trail-frame[] -> how the problem was reached, outermost first; omitted when empty, and written by commands other than md compose and md render only when a host frame is in it
    related-diagnostic:
        message: string(required)
        source: source(required)
    source:
        file: string -> null for stdin
        line: number -> 1-based authored line; null when no authored position is proven
        column: number -> 1-based authored column, in characters; null when no authored position is proven
        section: string -> composed anchor slug of the innermost heading at or before the problem
        inserted: boolean -> true when an expression, shell step, or replace value created the reference
    related-location:
        message: string(required) -> what is at the location, e.g. the earlier declaration a name collides with
        file: string(required) -> the file as given for the validated document itself; otherwise the file read, or a built-in catalog's repository path when no copy of it could be read
        line: number -> 1-based line; null when the file could not be read
        column: number -> 1-based column, in characters; null as for line
        span: span -> byte range in the file's text
    span:
        start: number(required)
        end: number(required)
    iteration-step:
        collection: string(required)
        position: unknown(required) -> a number for an index, a string for a key
    trail-step:
        file: string(required)
        line: number -> authored line of the directive; null when the parent was built in memory
    trail-frame:
        kind: enum(host,included,iteration;required)
        host: string -> host frames only; the host's noun for the construct, e.g. task
        label: string -> host frames only; the construct's display label
        property: string -> host frames only; the authored property path, e.g. sequence[1].prompt
        source: source -> host frames only; where the construct is authored, when proven
        file: string -> included frames only; the including document
        line: number -> included frames only; authored line of the directive, when proven
        collection: string -> iteration frames only; the source reference as written
        position: unknown -> iteration frames only; a number for an index, a string for a key
    data-location:
        file: string(required) -> the resolved data file (portable path) or URL
        pointer: string -> JSON Pointer of the offending value, e.g. /0; absent when the parser proves none
        line: number -> 1-based line in the data
        column: number -> 1-based column in the data, in characters
        byte_offset: number -> zero-based byte offset of invalid UTF-8; no line or column accompanies it
    grant-needed:
        kind: enum(file,url;required) -> what the approval covers (one file or one exact URL)
        target: string(required) -> the file path or exact URL the approval covers
        scope: enum(once,persisted;required) -> once for this run; persisted saves the file to the user's permissions.file-read
    schema-default:
        path: string(required) -> dotted property path the default stands in for
        schema_location: string(required) -> JSON Pointer of the default keyword in the lowered schema, e.g. /properties/doc/default
        schema_file: string -> the schema file declaring the default (the imported file for a Name@file type); absent for an inline or compiled-in schema
