[package]
name = "darkmatter-cli"
description = "A themed markdown renderer for both console (escape-codes) and the browser (HTML)."
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
readme = "../README.md"
repository = "https://github.com/yankeeinlondon/dockhand"
keywords = ["markdown", "terminal", "cli", "syntax-highlighting", "themes"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "darkmatter_cli"
path = "src/lib.rs"

[[bin]]
name = "md"
path = "src/main.rs"

[dependencies]
darkmatter = { path = "../lib" }
renderable = { path = "../../renderable" }
biscuit-file = { path = "../../biscuit-file/lib", features = ["json5", "yaml", "toml", "file-reference"] }
biscuit-terminal = { path = "../../biscuit-terminal/lib" }
biscuit-hash = { path = "../../biscuit-hash/lib", features = ["xx_hash"] }
sniff = { path = "../../sniff/lib" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
color-eyre = "0.6"
rayon = "1.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_yaml_ng = "0.10"
open = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
biscuit-test-harness = { path = "../../biscuit-test-harness" }
serial_test = "3"
test-toolkit = { path = "../../tools/test-toolkit" }
tracing-test = "0.2"
syntect = "5.2"
