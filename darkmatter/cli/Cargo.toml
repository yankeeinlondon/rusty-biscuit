[package]
name = "darkmatter-cli"
description = "A themed markdown renderer for both console (escape-codes) and the browser (HTML)."
version = "0.1.0"
edition = "2024"
autotests = false
license = "AGPL-3.0-only"
readme = "../README.md"
repository = "https://github.com/yankeeinlondon/dockhand"
keywords = ["markdown", "terminal", "cli", "syntax-highlighting", "themes"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "darkmatter_cli"
path = "src/lib.rs"

[[bin]]
name = "md"
path = "src/main.rs"

# Test-only native executable that records its argv, for the shell template
# tests (`tests/l1/compose_shell_template.rs`). A built target because an
# archived CI run has no compiler to build one at test time; gated so `md`'s
# install never ships it.
[[bin]]
name = "darkmatter-argv-recorder"
path = "tests/bin/argv_recorder/main.rs"
required-features = ["test-fixtures"]

[features]
terminal-tests = ["dep:biscuit-test-harness"]
test-fixtures = ["dep:test-toolkit"]

[dependencies]
darkmatter = { path = "../lib" }
renderable = { path = "../../renderable" }
biscuit-file = { path = "../../biscuit-file/lib", features = ["json5", "yaml", "toml", "file-reference"] }
biscuit-terminal = { path = "../../biscuit-terminal/lib" }
# `clap` supplies the shared `--feature` names for the Mermaid fallback policy.
biscuit-visualized = { path = "../../biscuit-visualized/src", features = ["clap"] }
biscuit-hash = { path = "../../biscuit-hash/lib", features = ["xx_hash"] }
sniff = { path = "../../sniff/lib" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
color-eyre = "0.6"
rayon = "1.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_yaml_ng = "0.10"
open = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt"] }
biscuit-test-harness = { path = "../../biscuit-test-harness", optional = true }
test-toolkit = { path = "../../tools/test-toolkit", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serial_test = "3"
test-toolkit = { path = "../../tools/test-toolkit" }
tracing-test = "0.2"
# The shared path lookup guard reads target roots from `Cargo.toml`.
toml = "1.0"
syntect = "5.2"
# Unconditional for every test target, not just the `terminal-tests` ones: the
# ungated targets resolve fixtures through `manifest_dir!()`, which the optional
# `[dependencies]` entry above cannot supply without the feature.
biscuit-test-harness = { path = "../../biscuit-test-harness" }
# The process-global broken-pass hook, so an in-process `run_clean` can prove
# a refused body is never saved; a dev-dependency feature, so no non-test
# build of `md` compiles it.
darkmatter = { path = "../lib", features = ["cleanup-test-hooks"] }

# One test binary per execution contract (tier × exact `required-features`),
# declared explicitly: `autotests = false` above, so a `tests/` file reaches a
# binary only through one of these roots (`2026-09-21-consolidated-test-binaries`).
[[test]]
name = "l1"
path = "tests/l1/main.rs"

[[test]]
name = "level2"
path = "tests/level2/main.rs"
required-features = ["terminal-tests"]

# CI policy: darkmatter's L1 contract keeps `slow_` tests, and the CLI owns L2
# (render-tree terminal) tier tests.
[package.metadata.ci.tests]
# The entry-point parity runner and the clean parity suite include
# darkmatter's shared matrices, the union-reference suites its union fixtures,
# and the diagnostic-position suite its position fixtures, by `#[path]`; each
# test spells the file it reads.
source-inputs = [
    "darkmatter/lib/tests/common/clean_parity/mod.rs",
    "darkmatter/lib/tests/common/entry_point_parity/mod.rs",
    "darkmatter/lib/tests/content_policy_fixtures/mod.rs",
    "darkmatter/lib/tests/position_fixtures/mod.rs",
    "darkmatter/lib/tests/union_fixtures/mod.rs",
]
tiers = ["L1", "L2"]
features = ["terminal-tests", "test-fixtures"]
local-features = ["test-fixtures"]
l2-backends = ["tmux", "wezterm"]
# The L2 tier spawns one shared terminal pane through the harness broker.
# It is a compile-time binary of another package, so the producer builds it
# as a sidecar; an archive consumer has no Cargo to build one with.
sidecars = ["backend-proof", "harness-broker"]
l1-include-slow = true
