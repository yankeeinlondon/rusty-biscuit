# Baseline SimplifiedSchema for Darkmatter-owned Markdown frontmatter.
# This is the authored source of truth for the darkmatter base schema; the
# library loads it via include_str! and the docs transclude it verbatim.
$schema:
  '$schema': "any -> Declares an inline schema, referenced schema file, root union, or raw JSON Schema for this document. Document schemas override baseline properties on conflict."

  title: "string -> Human-readable document title. Used by markdown_title(), reports, diagnostics, and downstream tools that need a display name."
  description: "string -> Human-readable document summary. Used by reports and diagnostics when identifying a document."
  tags: "string[] -> Freeform document tags."
  draft: "boolish -> Author-controlled draft marker. Darkmatter does not use this for compose control but commonly ignores it during hash workflows."
  last_updated: "date -> Managed content-change date in YYYY-MM-DD form. Hash save and downstream tools may update it when content changes."
  metadata: "object -> Arbitrary author metadata. Darkmatter preserves it and leaves interpretation to downstream tools."

  hash:
    - "string -> Stored shorthand hash. The simple form is '<frontmatter>-<body>' with 16 hexadecimal characters per segment."
    - kind: "enum(fm, body, simple, structured, detailed; default(simple)) -> Hash resolution stored in longhand form."
      value: "any -> Stored hash payload. A string is used for fm, body, simple, and structured hashes; detailed hashes use a nested object."
      ignored: "string[] -> Extra frontmatter keys ignored during hash computation. The managed hash key and last_updated are always ignored and should not be listed."

  # Render style configuration. Modeled as a broad `object` in v1 per Non-Goal
  # 2: the darkmatter::style runtime parser is the authoritative validator and
  # the shape is still moving. See style::descriptor::SCHEMA for the canonical
  # leaf catalog and style::parse::ACTIVE_STYLE_WIRING_SUB_SPEC for the active
  # wiring phase.
  style: "object -> Render style configuration. Runtime validation and application remain authoritative in darkmatter::style."

  change: "any -> Change metadata used by Darkmatter workflows. The v1 baseline accepts all shapes until the public change contract is finalized."
  replace: "object -> Literal text replacement map applied during compose. Keys are source strings and values are replacement strings."
  ctx:
    now: "string(generated; required) -> Local date and time in ISO-8601 format."
    now_utc: "string(generated; required) -> UTC date and time in ISO-8601 format."
    today: "date(generated; required) -> Local date in ISO-8601 format."
    today_utc: "date(generated; required) -> UTC date in ISO-8601 format."
    yesterday: "date(generated; required) -> Local date for yesterday in ISO-8601 format."
    yesterday_utc: "date(generated; required) -> UTC date for yesterday in ISO-8601 format."
    tomorrow: "date(generated; required) -> Local date for tomorrow in ISO-8601 format."
    tomorrow_utc: "date(generated; required) -> UTC date for tomorrow in ISO-8601 format."
    day: "string(generated; required) -> Full day of week name, local time."
    day_utc: "string(generated; required) -> Full day of week name, UTC."
    day_abbr: "string(generated; required) -> Abbreviated day of week name, local time."
    day_abbr_utc: "string(generated; required) -> Abbreviated day of week name, UTC."
    year: "string(generated; required) -> Current year, local time."
    year_utc: "string(generated; required) -> Current year, UTC."
    month: "string(generated; required) -> Current month as a zero-padded number, local time."
    month_name: "string(generated; required) -> Current month name, local time."
    month_name_abbr: "string(generated; required) -> Abbreviated current month name, local time."
    day_of_month: "string(generated; required) -> Current day of month."
    day_of_month_suffixed: "string(generated; required) -> Current day of month with ordinal suffix."
    time: "string(generated; required) -> Local time."
    time_military: "string(generated; required) -> Local time in 24-hour format."
    time_utc: "string(generated; required) -> UTC time."
    time_military_utc: "string(generated; required) -> UTC time in 24-hour format."
    timezone: "string(generated) -> Local timezone abbreviation, or null when unavailable."
    timezone_offset: "string(generated; required) -> Local UTC offset."
    timezone_iana: "string(generated) -> Local IANA timezone name, or null when unavailable."
    start_of_week_sun: "date(generated; required) -> Start of the current Sunday-based week, local time."
    end_of_week_sun: "date(generated; required) -> End of the current Sunday-based week, local time."
    start_of_week_mon: "date(generated; required) -> Start of the current Monday-based week, local time."
    end_of_week_mon: "date(generated; required) -> End of the current Monday-based week, local time."
    start_of_week_sun_utc: "date(generated; required) -> Start of the current Sunday-based week, UTC."
    end_of_week_sun_utc: "date(generated; required) -> End of the current Sunday-based week, UTC."
    start_of_week_mon_utc: "date(generated; required) -> Start of the current Monday-based week, UTC."
    end_of_week_mon_utc: "date(generated; required) -> End of the current Monday-based week, UTC."
    season: "string(generated; required) -> Current meteorological season."
    timestamp: "number(integer; generated; required) -> Current Unix timestamp in seconds."
    timestamp_ms: "number(integer; generated; required) -> Current Unix timestamp in milliseconds."
    utc: "string(generated; required) -> Alias for now_utc."
    dow: "string(generated; required) -> Alias for day."
    dow_abbr: "string(generated; required) -> Alias for day_abbr."
    repo: "string(generated) -> Repository name, or null when unavailable."
    repo_root: "string(generated) -> Absolute repository root path, or null when unavailable."
    is_monorepo: "boolean(generated; required) -> Whether the current repository is a monorepo."
    package_root: "string(generated) -> Absolute current package root path, or null when unavailable."
    package_area_root: "string(generated) -> Absolute current package area root path, or null when unavailable."
    packages: "string(generated) -> Comma-separated package names, or null when unavailable."
    packages_list: "string(generated) -> Markdown list of package names, or null when unavailable."
    package_areas: "string(generated) -> Comma-separated package area names, or null when unavailable."
    package_areas_list: "string(generated) -> Markdown list of package area names, or null when unavailable."
    current_package: "string(generated) -> Current package name, or null when unavailable."
    current_package_area: "string(generated) -> Current package area, or null when unavailable."
    area: "string(generated; required) -> Scoped area name."
    area_description: "string(generated; required) -> Human-readable scoped area description."
    area_root: "string(generated; required) -> Absolute scoped area root path."
    current_packages: "string(generated; required) -> Markdown list of packages under the current directory."
    depends_on: "string(generated; required) -> Markdown list of workspace-internal package dependencies."
    used_by: "string(generated; required) -> Markdown list of workspace-internal package reverse dependencies."
    dirty_files: "string(generated; required) -> Comma-separated dirty file paths."
    dirty_files_list: "string(generated; required) -> Markdown list of dirty file paths."
    dirty_source_code_files: "string(generated; required) -> Comma-separated dirty source-code file paths."
    dirty_source_code_files_list: "string(generated; required) -> Markdown list of dirty source-code file paths."
    staged_files: "string(generated; required) -> Comma-separated staged file paths."
    staged_files_list: "string(generated; required) -> Markdown list of staged file paths."
    untracked_files: "string(generated; required) -> Comma-separated untracked file paths."
    untracked_files_list: "string(generated; required) -> Markdown list of untracked file paths."
    dirty_packages: "string(generated; required) -> Comma-separated dirty package names."
    dirty_packages_list: "string(generated; required) -> Markdown list of dirty package names."
    dirty_package_areas: "string(generated; required) -> Comma-separated dirty package area names."
    dirty_package_areas_list: "string(generated; required) -> Markdown list of dirty package area names."
    staged_packages: "string(generated; required) -> Comma-separated staged package names."
    staged_packages_list: "string(generated; required) -> Markdown list of staged package names."
    staged_package_areas: "string(generated; required) -> Comma-separated staged package area names."
    staged_package_areas_list: "string(generated; required) -> Markdown list of staged package area names."
    current_package_has_staged_files: "boolean(generated; required) -> Whether the current package has staged files."
    current_package_area_has_staged_files: "boolean(generated; required) -> Whether the current package area has staged files."
    current_package_has_dirty_files: "boolean(generated; required) -> Whether the current package has dirty files."
    current_package_area_has_dirty_files: "boolean(generated; required) -> Whether the current package area has dirty files."
    programming_languages_in_repo: "string(generated) -> Comma-separated programming languages in the repository, or null when unavailable."
    programming_language: "string(generated) -> Context-sensitive primary programming language, or null when unavailable."
    package_manager: "string(generated) -> Context-sensitive package manager, or null when unavailable."
    docs_readme: "string(generated; required) -> Comma-separated README paths, scope-filtered."
    docs_blast_radius: "string(generated; required) -> Comma-separated docs with blast_radius frontmatter, scope-filtered."
    docs_drift: "string(generated; required) -> Comma-separated docs at risk of drift from source changes."
    docs_skill: "string(generated) -> Repo-relative path to the best matching skill file, or null when unavailable."
    os: "string(generated) -> Operating system name, or null when unavailable."
    os_distro: "string(generated; required) -> Linux distribution name, empty on macOS and Windows."
    os_package_manager: "string(generated) -> Primary system package manager, or null when unavailable."
    os_version: "string(generated; required) -> Operating system version."
    memory_total: "string(generated) -> Total system memory in bytes, or null when unavailable."
    memory_used: "string(generated) -> Percentage of memory currently used, or null when unavailable."
    memory_avail: "string(generated) -> Available system memory in bytes, or null when unavailable."
    cpu_cores: "number(integer; generated) -> Number of logical CPU cores, or null when unavailable."
    cpu_arch: "string(generated) -> CPU architecture, or null when unavailable."
    gpu: "string(generated) -> GPU device names, or null when unavailable."
    agent: "string(generated; required) -> Executing agentic CLI name."
    model: "string(generated; required) -> Active model identifier."

  prologue:
    - "string(default(null)) -> File reference, inline text, or bare filename inserted before the body during transclusion."
    - "string[] -> Ordered prologue references inserted before the body during transclusion."
  epilogue:
    - "string(default(null)) -> File reference, inline text, or bare filename inserted after the body during transclusion."
    - "string[] -> Ordered epilogue references inserted after the body during transclusion."
  ignore_invalid: "boolish -> Allows invalid transclusion references to be left in place as warnings instead of aborting composition."
  interpolate_code_blocks: "boolish -> Enables interpolation inside fenced code blocks. Disabled by default so code examples stay literal."
