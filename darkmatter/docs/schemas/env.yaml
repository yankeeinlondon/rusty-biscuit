kind: schema
types:
    AGENT: string(required;generated) -> The agent the Claudine is using
    MODEL: string(generated) -> The model being used by the agent that Claudine wrapping
    YOLO: boolish(required;generated) -> Whether Claudine has been asked to run in YOLO mode or not
    PID: numberlike(required;generated) -> The PID id for the Claudine process
    PROMPT: string(required;generated) -> The prompt string (fully composed) that was used
    PROMPT_FILE: file(generated) -> The prompt file that was _composed_ to generate the prompt
    PANE: string(generated) -> a unique ID for the PANE in your terminal app this session was executed from
