# Reusable SimplifiedSchema types for Claudine-owned frontmatter.
# `claudine.yaml` imports these definitions without exposing helper names as
# document properties.
$schema:
    # A lifecycle event (and `loop.gate`, task `setup`/`teardown`) is an
    # ordered list of items or one dictionary of verbs. These types describe
    # the first two conditional levels; deeper `then`/`else` bodies are
    # accepted loosely. Claudine's parser enforces the five-level limit,
    # canonical bundle order, verb names, and parameter shapes.
    lifecycle-event:
        - "lifecycle-entry[]@this -> Ordered lifecycle actions and conditionals."
        - "lifecycle-bundle@this -> A dictionary of verbs, run in canonical order (never `when`)."

    lifecycle-entry:
        - "string -> A bare zero-argument verb such as `stop` or `skip`."
        - "lifecycle-stack-item@this"

    lifecycle-stack-item:
        when: "expression -> Darkmatter condition expression evaluated once when the event fires."
        then: "lifecycle-branch@this -> Actions run when `when` is true; requires `when`."
        else: "lifecycle-branch@this -> Actions run when `when` is false; requires `then`."
        no_error: "boolean -> Suppresses dispatch failures for every eligible action of this dictionary item. Never suppresses expression errors, `set`, or the prohibition on shells before preflight."
        "<string>": "any -> A lifecycle verb: a short-form value, or named parameters when it is the item's only verb."
        $constraints:
            min-keys: 1

    lifecycle-bundle:
        "<string>": "any -> A lifecycle verb and its short-form value."

    lifecycle-branch:
        - "lifecycle-branch-entry[](min(1))@this -> Ordered actions and nested conditionals."
        - "lifecycle-branch-bundle@this -> A dictionary of verbs, run in canonical order."

    lifecycle-branch-entry:
        - "string -> A bare zero-argument verb such as `stop` or `skip`."
        - "lifecycle-branch-item@this"

    lifecycle-branch-item:
        when: "expression -> Darkmatter condition expression for a nested conditional."
        then: "any -> A nested body; Claudine's parser checks its shape and depth."
        else: "any -> A nested body; Claudine's parser checks its shape and depth."
        no_error: "boolean -> Suppresses dispatch failures for every eligible action of this dictionary item."
        "<string>": "any -> A lifecycle verb: a short-form value, or named parameters when it is the item's only verb."
        $constraints:
            min-keys: 1

    lifecycle-branch-bundle:
        "<string>": "any -> A lifecycle verb and its short-form value."
        $constraints:
            min-keys: 1

    loop-action:
        op: "enum(increment, decrement, set, append, prepend, merge; required) -> Frontmatter mutation operation."
        prop: "string(not-empty; required) -> Frontmatter property to mutate."
        value: "any -> Value used by set, append, prepend, and merge."

    loop-event:
        while: "expression -> Boolean expression evaluated before each iteration; mutually exclusive with until."
        until: "expression -> Boolean expression evaluated before each iteration; mutually exclusive with while."
        action:
            - "string -> Frontmatter mutation in op(...) form; mutually exclusive with actions."
            - "loop-action@this -> Structured frontmatter mutation; mutually exclusive with actions."
        actions:
            - "string -> Frontmatter mutation in op(...) form; mutually exclusive with action."
            - "loop-action@this -> Structured frontmatter mutation; mutually exclusive with action."
            - "any[] -> Ordered string or structured frontmatter mutations; mutually exclusive with action."
        max: "number(integer; min(1); default(100)) -> Maximum iteration count."
        fail_fast: "boolean(default(true)) -> Per-loop failure policy; when set to `true` any failure will immediately stop the transaction and the error will be sent to the `failure` event."
        on_rate_limit: "enum(pause, abort, continue; default(pause)) -> Rate-limit handling policy."
        gate: "lifecycle-entry[]@this -> Ordered lifecycle concerns run on every gate pass. Cannot be mixed with loose verb keys."
        "<string>": "any -> A loose lifecycle verb, read as a dictionary of verbs run on every gate pass."

    exit-expression:
        pattern: "string(not-empty) -> Literal or regular-expression pattern that ends a run; mutually exclusive with patterns."
        patterns: "string(not-empty)[](min(1)) -> Patterns sharing one kind and scope; mutually exclusive with pattern."
        kind: "enum(literal, regex; default(literal)) -> Pattern interpretation."
        ignore_case: "boolean(default(false)) -> Enables case-insensitive literal matching."
        scope: "string -> Optional agent or agent/model selector."

    exit-expression-layer:
        mode: "enum(merge, override) -> How this layer combines with lower-precedence rules."
        rules: "exit-expression[]@this -> Exit-expression rules in this layer."
