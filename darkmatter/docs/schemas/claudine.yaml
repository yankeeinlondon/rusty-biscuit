# Baseline SimplifiedSchema for Claudine-owned Markdown frontmatter.
# This file intentionally uses the proposed nested object syntax described in
# claudine/features/2026-07-05-claudine-base-schema/spec.md.
$schema:
  '$schema': "any -> Declares a document-local schema. Claudine validates this through Darkmatter before Claudine-specific interpretation."

  title: "string -> Human-readable prompt title used in dry-run output, diagnostics, and reports."
  description: "string -> Human-readable prompt summary used in dry-run output and missing-property diagnostics."
  last_updated: "date -> Auto-managed date stamp updated by inline-compose closure."
  hash: "any -> Darkmatter content hash auto-stamped by inline-compose closure."
  metadata: "object -> Arbitrary metadata preserved for linking, documentation, and downstream tools."

  prompt: "string -> Inline composition prompt. Required for inline-compose; composed through Darkmatter before being sent to the provider."
  agent:
    - "string -> Preferred agentic CLI provider."
    - "string[] -> Ordered provider preference list; the first installed provider wins in non-interactive mode."
  model:
    - "string -> Preferred model for the selected provider."
    - "string[] -> Ordered model preference list."
  interactive: "boolish -> Default interactive session mode for compose and inline-compose. Rejected for sequence automation."
  fail_fast: "boolish(default(true)) -> Sequence and loop error policy. true stops after the first failure; false runs all steps and returns failure if any step failed."
  sequence:
    - "string -> File reference to external sequence state."
    - "any[] -> Inline sequence steps. Each step may be a scalar or object state value."

  # `loop` is both a lifecycle event and the repeated-execution configuration
  # object. The effective parser distinguishes by fields.
  loop:
    - while: "string -> Boolean expression evaluated before each iteration; loop continues while truthy."
      until: "string -> Boolean expression evaluated before each iteration; loop continues until truthy."
      action: "any -> Single frontmatter mutation action applied after each successful iteration."
      actions: "any -> One or more frontmatter mutation actions applied after each successful iteration."
      max: "number(integer; min(1); default(100)) -> Maximum iteration count."
      fail_fast: "boolish(default(true)) -> Per-loop failure policy."
      on_rate_limit: "enum(pause, abort, continue; default(pause)) -> Rate-limit handling policy."
    - &lifecycle-event
      say: "string -> Text spoken with TTS when the lifecycle event fires. Mutually exclusive with say_first."
      say_first: "string -> Text spoken before sound effects. Mutually exclusive with say."
      effect: "string -> Built-in sound effect name."
      message: "string -> Message sent through the configured messenger route."
      stderr: "string -> Statusless text written to stderr."
      stdout: "string -> Statusless text written to stdout."
      info: "string -> Info status line written to stderr."
      warn: "string -> Warning status line written to stderr."
      success: "string -> Success status line written to stderr."
      notify: "string -> Desktop notification title."
      stack: "any[] -> Ordered lifecycle action stack. Detailed action validation is owned by Claudine's lifecycle parser."

  operation: "string -> Composition operation label supplied by the caller or CLI."
  output: "enum(json, text, stream) -> Requested machine/user output mode where supported."
  yolo: "boolish -> Explicitly allow high-trust execution mode when the caller has opted into it."

  initialize: *lifecycle-event
  start: *lifecycle-event
  blocked: *lifecycle-event
  success: *lifecycle-event
  failure: *lifecycle-event
  finalize: *lifecycle-event

  timeout: "string(not-empty) -> Optional wall-clock timeout duration for the provider run."
  step_timeout: "string(not-empty) -> Stream-silence timeout duration. Defaults to 30m when not otherwise configured."
  timeout_warn: "string(not-empty) -> Warning threshold before the wall-clock timeout."
  step_timeout_warn: "string(not-empty) -> Warning threshold before the step timeout."
  stall_timeout: "string(not-empty) -> OpenCode stalled-generation timeout. 0s disables the OpenCode-specific guard."

  exit_expressions:
    - "any[] -> Bare array of exit-expression entries; frontmatter array shorthand merges with lower layers."
    - mode: "enum(merge, override) -> Combine mode for this exit-expression layer."
      rules: "any[] -> Exit-expression rule entries. Each entry supports pattern or patterns, kind, ignore_case, and scope."

  guard_settings:
    repetition:
      enabled: "boolish(default(true)) -> Enables repeated-output cycle detection."
      max_repeats: "number(integer; min(1)) -> Maximum repeated cycles before aborting."
      max_cycle_length: "number(integer; min(1)) -> Maximum cycle length considered by repetition detection."
    volume:
      enabled: "boolish(default(true)) -> Enables runaway output volume detection."
      max_lines: "number(integer; min(1)) -> Maximum output lines before aborting."
      max_bytes: "number(integer; min(1)) -> Maximum output bytes before aborting."

  name: "string -> Resource name for linked skills, commands, and agents."
  allowed-tools:
    - "string -> Provider-specific allowed tools expression."
    - "string[] -> Provider-specific allowed tools list."
  tools: "any -> Provider-specific agent/tool declaration. Shape varies across providers."
  skills: "any -> Provider-specific skill references. Shape varies across providers."
  license: "string -> SPDX license identifier for linked skills."
  compatibility: "any -> Skill or resource compatibility metadata."
  user-invocable: "boolish -> Provider-specific flag controlling direct user invocation."
  disable-model-invocation: "boolish -> Provider-specific flag preventing model-initiated invocation."
  argument-hint: "string -> Slash-command argument hint."
  max_turns: "number(integer; min(1)) -> Maximum turns for providers that use snake_case frontmatter."
  maxTurns: "number(integer; min(1)) -> Maximum turns for providers that use camelCase frontmatter."

  verbosity: "enum(silent, quiet, verbose) -> Prompt-reporting verbosity for system-prompt documents."
  mode: "string -> Context-specific mode. System-prompt discovery narrows this to append or replace; slash-command providers may use other values."

  state: "any -> Current sequence step state injected as a reserved frontmatter override."
  previous_state: "any -> Previous sequence step state, or null for the first step."
  next_state: "any -> Next sequence step state, or null for the last step."
  is_first: "boolean -> true when the current sequence step is first."
  is_last: "boolean -> true when the current sequence step is last."
  step: "number(integer; min(1)) -> 1-based sequence step index."
  total_steps: "number(integer; min(1)) -> Total number of sequence steps."

  _loop_count: "number(integer; min(1)) -> 1-based loop iteration counter."
  _loop_is_first: "boolean -> true on the first loop iteration."
  _loop_is_last: "boolean -> true when the current loop iteration is expected to be final."
  _loop_last_output: "string -> Captured output from the previous loop iteration. Empty on the first iteration."
  _loop_last_exit_code: "number(integer) -> Exit code from the previous loop iteration. 0 on the first iteration."
