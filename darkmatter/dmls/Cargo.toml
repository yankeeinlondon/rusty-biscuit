[package]
name = "dmls"
description = "Darkmatter Language Server"
version = "0.1.0"
edition = "2024"

[lib]
name = "dmls"
path = "src/lib.rs"

[[bin]]
name = "dmls"
path = "src/main.rs"

[dependencies]
# LSP protocol stack (stdio framing + LSP 3.17 types)
lsp-server = "0.8"
lsp-types = "0.97"
# Same channel family lsp-server's Connection exposes; also the worker-pool
# channel for later phases.
crossbeam-channel = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
toml = "1.0"

# Error handling
thiserror = "2.0"

# Tracing (stderr / file only; stdout is reserved for LSP framing)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Line/offset index behind the source_map module (rust-analyzer's crate;
# never exposed outside `source_map`).
line-index = "0.1"

# Position-aware YAML parse behind the FrontmatterAst facade (AD-4 / R-3):
# lossless byte spans on every node, comment/anchor preservation, no panics on
# malformed input. Never exposed outside `overlay::frontmatter`.
rlsp-yaml-parser = "0.11"

# File-URI <-> path conversion (battle-tested `to_file_path` handling for
# Windows drive letters and percent-encoding; lsp-types 0.97's `Uri` has none).
url = "2.5"

# Workspace discovery (gitignore-aware walk) and include/exclude globs.
ignore = "0.4"
globset = "0.4"

# Wiki-link resolution (R-8): NFC normalization so the same vault resolves
# identically on macOS/Windows/Linux. Already in the tree via `url`/`idna`.
unicode-normalization = "0.1"

# Semantic authorities
darkmatter = { path = "../lib" }
biscuit-file = { path = "../../biscuit-file/lib", default-features = false, features = ["file-reference"] }
# xxHash content-hash identity for invalidation (design "Invalidation").
biscuit-hash = { path = "../../biscuit-hash/lib" }

[dev-dependencies]
tempfile = "3"
# Level-2 editor tests (tests/level2_editor_neovim.rs): tier gating and the
# tmux terminal harness for real-rendering SGR capture.
test-toolkit = { path = "../../tools/test-toolkit" }
biscuit-test-harness = { path = "../../biscuit-test-harness" }

# CI policy: darkmatter's L1 contract keeps `slow_` tests, and dmls owns the
# language-server L2 (real-terminal) tier tests — neovim semantic-token
# rendering under tmux. The old area recipe enumerated L2 only for the library
# and CLI, so these were never run as L2; the tier-contract test surfaced them.
[package.metadata.ci.tests]
tiers = ["L1", "L2"]
l2-backends = ["tmux", "wezterm"]
l1-include-slow = true
