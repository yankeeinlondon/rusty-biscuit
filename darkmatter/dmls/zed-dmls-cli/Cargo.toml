[package]
name = "zed-dmls-cli"
description = "Stable staging and diagnostics for the DMLS Zed extension"
version = "0.1.0"
edition = "2024"

[lib]
name = "zed_dmls_cli"
path = "src/lib.rs"

[[bin]]
name = "zed-dmls"
path = "src/main.rs"

[dependencies]
biscuit-terminal = { path = "../../../biscuit-terminal/lib" }
# Regular, not dev: `checked_in_extension_dir` is library code, and `tests/cli.rs`
# reaches it by spawning the `zed-dmls` binary, so the run-time manifest lookup
# has to be linked into the binary itself.
biscuit-test-harness = { path = "../../../biscuit-test-harness" }
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
dirs = "6"
sniff = { path = "../../../sniff/lib" }
thiserror = "2"
toml = "1"
wait-timeout = "0.2"

[build-dependencies]
toml = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[package.metadata.ci.tests]
tiers = ["L1"]
features = []
local-features = []
l2-backends = []
runner-tools = []
l1-include-slow = true
