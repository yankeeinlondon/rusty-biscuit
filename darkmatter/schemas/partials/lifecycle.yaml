# Darkmatter's neutral lifecycle action definitions: the shape of every verb
# Darkmatter's lifecycle parser knows, including the verbs only a host
# provides a service for (`say`, `retry`, `proxy`, `prep`, `break`, ...), and
# the four action categories built from them. Types only: this file never
# applies to a document. Host profiles select from it; the `md` profile is
# md-lifecycle.yaml, and a host's own schemas reference these types with the
# reserved namespace (`communicate@darkmatter:lifecycle`).
#
# Each verb has a short form (`<verb>-short`) and, except `set` and the
# generated verbs, a closed long form (`<verb>-long`). A category type holds
# exactly one verb, whose value is its short or long form. A bundle holds
# several verbs in short form only, plus `when` and `no_error`. The
# side-effect and expression-function verbs are listed one key per name with
# untyped values; the lifecycle parser checks their arguments. Tests keep the
# keys aligned with the parser's verb inventory and Darkmatter's catalogs.
#
# `initialize-bundle` has no `shell`: initialization is shell-free under every
# host.
kind: schema
types:
    interpolation: "string(pattern(^\\s*\\x7b\\x7b[\\s\\S]*\\x7d\\x7d\\s*$)) -> a whole-value {{ … }} interpolation"
    count:
        - "number(integer; min(0)) -> a count"
        - interpolation
    say-short: "string -> speak the text aloud through text-to-speech"
    say-long: "{ text: string(required), no_error: boolean }"
    speak-short: "string -> alias of say"
    speak-long: "{ text: string(required), no_error: boolean }"
    effect-short: "string -> play the named sound effect from the effect catalog"
    effect-long: "{ text: string(required), no_error: boolean }"
    message-short: "string -> send the text to the configured messaging routes"
    message-long: "{ text: string(required), no_error: boolean }"
    notify-short: "string -> show the text as a desktop notification"
    notify-long: "{ text: string(required), no_error: boolean }"
    stderr-short: "string -> write the text to standard error"
    stderr-long: "{ text: string(required), no_error: boolean }"
    stdout-short: "string -> write the text to standard output"
    stdout-long: "{ text: string(required), no_error: boolean }"
    info-short: "string -> print the text as an informational status line"
    info-long: "{ text: string(required), no_error: boolean }"
    warn-short: "string -> print the text as a warning status line"
    warn-long: "{ text: string(required), no_error: boolean }"
    success-short: "string -> print the text as a success status line"
    success-long: "{ text: string(required), no_error: boolean }"
    stop-short:
        - null
        - "unknown[](max(0)) -> stop the remaining actions of this stack"
    stop-long: "{ no_error: boolean }"
    skip-short:
        - null
        - "unknown[](max(0)) -> skip the provider run (the parser allows skip only in initialize)"
    skip-long: "{ no_error: boolean }"
    error-short:
        - null
        - "unknown[](max(0))"
        - "string -> fail the run with this reason"
    error-long: "{ reason: string, no_error: boolean }"
    proxy-short: "string -> hand the run to the target prompt: a file reference such as @prompts/next.md or a whole-value interpolation"
    proxy-long: "{ target: string(required), with: object, no_error: boolean }"
    retry-short:
        - null
        - "unknown[](max(0))"
        - "count -> re-read and re-run the document at most this many times"
    retry-long: "{ max_attempts: count, delay: string, backoff: enum(fixed, exponential), with: object, no_error: boolean }"
    resume-short: "string -> send this follow-up message into the live session"
    resume-long: "{ message: string(required), max_attempts: count, no_error: boolean }"
    defer-short: "string -> planned: defer the run by this delay; the parser accepts it but the runtime does not run it yet"
    defer-long: "{ delay: string(required), reason: string, no_error: boolean }"
    break-short:
        - null
        - "unknown[](max(0))"
        - "string -> end the nearest enclosing loop with this reason (an empty string is an empty reason); a break outside every loop fails its event"
    break-long: "{ reason: string, code: number(integer; min(0); max(255)), no_error: boolean }"
    prep-short: "string(not-empty) -> run the target (a file reference such as @prompts/setup.md or a whole-value interpolation), then continue with the next action; a target that fails fails this event"
    prep-long: "{ target: string(not-empty; required), with: object, no_error: boolean }"
    shell-short: "shell -> run a shell command (never in initialize)"
    shell-long: "{ command: shell(required), on_error: string, no_error: boolean }"
    set-short: "object -> assign runtime values: a mapping of destinations to values (no long form, no no_error)"
    side-effect-verb: "unknown -> Darkmatter side effect; the parser checks its arguments"
    expression-function-verb: "unknown -> Darkmatter expression function; the parser checks its arguments"
    communicate:
        say:
            - say-short
            - say-long
        speak:
            - speak-short
            - speak-long
        effect:
            - effect-short
            - effect-long
        message:
            - message-short
            - message-long
        notify:
            - notify-short
            - notify-long
        stderr:
            - stderr-short
            - stderr-long
        stdout:
            - stdout-short
            - stdout-long
        info:
            - info-short
            - info-long
        warn:
            - warn-short
            - warn-long
        success:
            - success-short
            - success-long
        $constraints:
            min-keys: 1
            max-keys: 1
    flow:
        stop:
            - stop-short
            - stop-long
        skip:
            - skip-short
            - skip-long
        error:
            - error-short
            - error-long
        proxy:
            - proxy-short
            - proxy-long
        retry:
            - retry-short
            - retry-long
        resume:
            - resume-short
            - resume-long
        defer:
            - defer-short
            - defer-long
        break:
