# Darkmatter's neutral lifecycle action definitions: the shape of every verb
# Darkmatter's lifecycle parser knows, including the verbs only a host
# provides a service for (`say`, `retry`, `proxy`, `prep`, `break`, ...), and
# the four action categories built from them. Types only: this file never
# applies to a document. Host profiles select from it; the `md` profile is
# md-lifecycle.yaml, and a host's own schemas reference these types with the
# reserved namespace (`communicate@darkmatter:lifecycle`).
#
# Each verb has a short form (`<verb>-short`) and, except `set` and the
# variadic verbs (`and`, `or`), a closed long form (`<verb>-long`). A category
# type is a single-action dictionary: exactly one verb, whose value is its
# short or long form, plus `when` and `no_error`, which `uncounted-keys` leaves
# out of the one-key count. A bundle holds several verbs in short form only,
# plus `when` and `no_error`.
#
# Every verb type that can hold a string carries `operands(<verb>-short)` or
# `operands(<verb>-long)` (one arm of a union is enough). Schema validation
# then reads the value as the lifecycle parser does: a `{{ … }}` span that
# does not parse is a positioned problem even where the type accepts text.
# `stop` and `skip` hold no string and carry none.
#
# The side-effect and expression-function verbs are generated from
# Darkmatter's typed catalogs (functions.yaml, mutations.yaml): their types
# and their keys in `expression`, `bundle`, and `initialize-bundle` sit
# between `# BEGIN GENERATED <region>` and `# END GENERATED <region>` lines,
# which `just regen-lifecycle-schema` rewrites. Do not edit those lines by
# hand; a drift test compares them with the catalogs. Every operand is the
# catalog parameter's type marked `deferred`, so a `{{ … }}` template is
# accepted there and checked when the event runs. The catalog helper types
# the parameters use are copied into the generated region. The catalog's
# `set(key, value)` is not generated: lifecycle `set` owns the name.
#
# `side-effect-verb` and `expression-function-verb` are the former untyped
# values. No shipped host names them; they are retained only because frozen
# measurement fixtures reference them and must stay byte-equal.
#
# `initialize-bundle` has no `shell`: initialization is shell-free under every
# host.
kind: schema
types:
    interpolation: "string(pattern(^\\s*\\x7b\\x7b[\\s\\S]*\\x7d\\x7d\\s*$)) -> a whole-value {{ … }} interpolation"
    count:
        - "number(integer; min(0)) -> a count"
        - interpolation
    say-short: "string(operands(say-short)) -> speak the text aloud through text-to-speech"
    say-long: "{ text: string(required), no_error: boolean }(operands(say-long))"
    speak-short: "string(operands(speak-short)) -> alias of say"
    speak-long: "{ text: string(required), no_error: boolean }(operands(speak-long))"
    effect-short: "string(operands(effect-short)) -> play the named sound effect from the effect catalog"
    effect-long: "{ text: string(required), no_error: boolean }(operands(effect-long))"
    message-short: "string(operands(message-short)) -> send the text to the configured messaging routes"
    message-long: "{ text: string(required), no_error: boolean }(operands(message-long))"
    notify-short: "string(operands(notify-short)) -> show the text as a desktop notification"
    notify-long: "{ text: string(required), no_error: boolean }(operands(notify-long))"
    stderr-short: "string(operands(stderr-short)) -> write the text to standard error"
    stderr-long: "{ text: string(required), no_error: boolean }(operands(stderr-long))"
    stdout-short: "string(operands(stdout-short)) -> write the text to standard output"
    stdout-long: "{ text: string(required), no_error: boolean }(operands(stdout-long))"
    info-short: "string(operands(info-short)) -> print the text as an informational status line"
    info-long: "{ text: string(required), no_error: boolean }(operands(info-long))"
    warn-short: "string(operands(warn-short)) -> print the text as a warning status line"
    warn-long: "{ text: string(required), no_error: boolean }(operands(warn-long))"
    success-short: "string(operands(success-short)) -> print the text as a success status line"
    success-long: "{ text: string(required), no_error: boolean }(operands(success-long))"
    stop-short:
        - null
        - "unknown[](max(0)) -> stop the remaining actions of this stack"
    stop-long: "{ no_error: boolean }"
    skip-short:
        - null
        - "unknown[](max(0)) -> skip the provider run (the parser allows skip only in initialize)"
    skip-long: "{ no_error: boolean }"
    error-short:
        - null
        - "unknown[](max(0))"
        - "string(operands(error-short)) -> fail the run with this reason"
    error-long: "{ reason: string, no_error: boolean }(operands(error-long))"
    proxy-short: "string(operands(proxy-short)) -> hand the run to the target prompt: a file reference such as @prompts/next.md or a whole-value interpolation"
    proxy-long: "{ target: string(required), with: object, no_error: boolean }(operands(proxy-long))"
    retry-short:
        - null
        - "unknown[](max(0); operands(retry-short))"
        - "count -> re-read and re-run the document at most this many times"
    retry-long: "{ max_attempts: count, delay: string, backoff: enum(fixed, exponential), with: object, no_error: boolean }(operands(retry-long))"
    resume-short: "string(operands(resume-short)) -> send this follow-up message into the live session"
    resume-long: "{ message: string(required), max_attempts: count, no_error: boolean }(operands(resume-long))"
    defer-short: "string(operands(defer-short)) -> planned: defer the run by this delay; the parser accepts it but the runtime does not run it yet"
    defer-long: "{ delay: string(required), reason: string, no_error: boolean }(operands(defer-long))"
    break-short:
        - null
        - "unknown[](max(0))"
        - "string(operands(break-short)) -> end the nearest enclosing loop with this reason (an empty string is an empty reason); a break outside every loop fails its event"
    break-long: "{ reason: string, code: number(integer; min(0); max(255)), no_error: boolean }(operands(break-long))"
    prep-short: "string(not-empty; operands(prep-short)) -> run the target (a file reference such as @prompts/setup.md or a whole-value interpolation), then continue with the next action; a target that fails fails this event"
    prep-long: "{ target: string(not-empty; required), with: object, no_error: boolean }(operands(prep-long))"
    shell-short: "shell(operands(shell-short)) -> run a shell command (never in initialize)"
    shell-long: "{ command: shell(required), on_error: string, no_error: boolean }(operands(shell-long))"
    set-short: "object(operands(set-short)) -> assign runtime values: a mapping of destinations to values (no long form, no no_error)"
    side-effect-verb: "unknown -> Darkmatter side effect; the parser checks its arguments"
    expression-function-verb: "unknown -> Darkmatter expression function; the parser checks its arguments"
    # BEGIN GENERATED types
    template-operand: "string(pattern([^\\s\\S]);deferred) -> a whole-value {{ … }} template supplying a list or mapping; no literal matches"
    agentic-cli: "enum(claude,codex,gemini,goose,kimi,kimicode,kimi_code,kimi-code,opencode,open_code,open-code,qwen,qwencode,qwen_code,qwen-code,pi,kilo,antigravity) -> An agentic CLI name accepted by `has_agentic_cli`: a Claudine\nprovider roster slug or one of its aliases."
    ip-address: "string(pattern('^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\\\\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|(([0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,7}:|([0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,5}(:[0-9a-fA-F]{1,4}){1,2}|([0-9a-fA-F]{1,4}:){1,4}(:[0-9a-fA-F]{1,4}){1,3}|([0-9a-fA-F]{1,4}:){1,3}(:[0-9a-fA-F]{1,4}){1,4}|([0-9a-fA-F]{1,4}:){1,2}(:[0-9a-fA-F]{1,4}){1,5}|[0-9a-fA-F]{1,4}:(:[0-9a-fA-F]{1,4}){1,6}|:((:[0-9a-fA-F]{1,4}){1,7}|:)|([0-9a-fA-F]{1,4}:){6}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\\\\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|::([0-9a-fA-F]{1,4}:){0,5}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\\\\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|([0-9a-fA-F]{1,4}:){1,5}:([0-9a-fA-F]{1,4}:){0,4}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\\\\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3})(%[^%/\\\\s]+)?)$')) -> An IP address literal: IPv4 (`192.168.1.1`), IPv6 (`2001:db8::10`), or\nscoped IPv6 (`fe80::1%en0`). A host name is never an address; nothing\nresolves DNS."
    append_frontmatter-short: "tuple([string(deferred), string(deferred), unknown | null]; operands(append_frontmatter-short))"
