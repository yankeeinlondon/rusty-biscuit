# The `md` host profile's lifecycle stacks: the types Darkmatter's baseline
# (fm.yaml) gives `initialize`, `composed`, `failed`, `cancelled`, and
# `finalize`. Types only: this file never applies to a document. Every verb
# shape comes from lifecycle.yaml; this profile selects the verbs md provides.
#
# An action md does not provide (`say`, `retry`, a verb of another host, or an
# unknown name) passes untyped and unsuggested, because `md compose` ignores
# it with a warning. The open arm (`md-unknown-action`) and the open key of
# the md bundles exclude every verb md provides, including those an event
# forbids, and the conditional keys, so a malformed `info` long form or a
# `shell` in `initialize` cannot escape typing through them. md's side-effect
# and expression-function verbs are typed with one pattern key: literal keys
# would add about 125 properties to every typed level of every event of the
# baseline every document is validated against.
#
# Stacks are typed three conditional levels deep (host profiles such as
# Claudine's are recursive instead): a
# `then`/`else` body inside a level-3 conditional is accepted loosely, and the
# lifecycle parser still checks it. `md-initialize-*` excludes shells.
#
# Named types are inlined, and this baseline is prepared, lowered, and
# compiled for every document. A conditional therefore types `then` and
# `else` with one pattern key: two
# literal keys would inline each body twice per level and make the baseline
# about twice as large. The cost is that the parser alone requires `then`,
# and the editor does not complete `then`/`else`.
#
# The two long pattern keys use YAML's explicit-key form (`? key`), since an
# implicit key may not exceed 1024 characters.
kind: schema
types:
    md-communicate:
        stdout:
            - stdout-short@./lifecycle.yaml
            - stdout-long@./lifecycle.yaml
        stderr:
            - stderr-short@./lifecycle.yaml
            - stderr-long@./lifecycle.yaml
        info:
            - info-short@./lifecycle.yaml
            - info-long@./lifecycle.yaml
        warn:
            - warn-short@./lifecycle.yaml
            - warn-long@./lifecycle.yaml
        success:
            - success-short@./lifecycle.yaml
            - success-long@./lifecycle.yaml
        message:
            - message-short@./lifecycle.yaml
            - message-long@./lifecycle.yaml
        $constraints:
            min-keys: 1
            max-keys: 1
    md-flow:
        stop:
            - stop-short@./lifecycle.yaml
            - stop-long@./lifecycle.yaml
        skip:
            - skip-short@./lifecycle.yaml
            - skip-long@./lifecycle.yaml
        error:
            - error-short@./lifecycle.yaml
            - error-long@./lifecycle.yaml
        $constraints:
            min-keys: 1
            max-keys: 1
    md-expression:
        set: set-short@./lifecycle.yaml
        ? "<pattern::^(?:append_frontmatter|append_jsonl|append_line|decrement_frontmatter|delete_frontmatter|ensure_dir|ensure_file|http_post|increment_frontmatter|merge_frontmatter|prepend_frontmatter|set_frontmatter|abs|absolute|and|as_csv|as_json|as_json5|as_line_separated|as_markdown|as_ordered_list|as_space_separated|as_tsv|as_unordered_list|basename|basename_without_index|branch_exists_on_remote|camel_case|can_execute|capitalize|cicd|cicd_list|code_link|contains|date|date_delta|decrement_file_index|dir_leading|dirname|ends_with|ensure_leading|ensure_trailing|ext|file_exists|file_index|file_trailing|find_files|find_first_index|find_last_index|first|frontmatter|has_agentic_cli|has_alias|has_binary|has_builtin_function|has_command|has_key|has_local_skill|has_skill|has_user_function|increment_file_index|ipv4|ipv6|is_array|is_date|is_date_time|is_date_time_utc|is_date_utc|is_empty|is_indexed_file|is_integer|is_negative|is_null|is_number|is_object|is_positive|is_string|is_this_month|is_this_month_utc|is_this_year|is_this_year_utc|is_today|is_today_utc|is_tomorrow|is_tomorrow_utc|is_yesterday|is_yesterday_utc|join|kebab_case|keys|last|length|link|lower|markdown_body_empty|markdown_title|max|min|newer_than|number|older_than|or|package|package_area|parent_dir|pascal_case|ping|ping_under|pr|pr_list|predict_conflicts|recent_commits|relative|remote_vendor|replace|replace_first|replace_last|round|snake_case|starts_with|terminal|title_case|trim|try_frontmatter|upper|validate_schema|values|without_date)$>"
        : "unknown -> a Darkmatter side effect or expression function; the parser checks its arguments"
        $constraints:
            min-keys: 1
            max-keys: 1
    md-bundle:
        stdout: stdout-short@./lifecycle.yaml
        stderr: stderr-short@./lifecycle.yaml
        info: info-short@./lifecycle.yaml
        warn: warn-short@./lifecycle.yaml
        success: success-short@./lifecycle.yaml
        message: message-short@./lifecycle.yaml
        stop: stop-short@./lifecycle.yaml
        skip: skip-short@./lifecycle.yaml
        error: error-short@./lifecycle.yaml
        shell: shell-short@./lifecycle.yaml
        set: set-short@./lifecycle.yaml
        when: "expression -> run the bundle only when this condition holds"
        no_error: "boolean -> keep the stack running when one of these actions fails"
        "<pattern::^(?!(?:then|else)$)>": "unknown -> a side effect, an expression function, or an action md does not provide"
    md-initialize-bundle:
        stdout: stdout-short@./lifecycle.yaml
        stderr: stderr-short@./lifecycle.yaml
        info: info-short@./lifecycle.yaml
        warn: warn-short@./lifecycle.yaml
        success: success-short@./lifecycle.yaml
        message: message-short@./lifecycle.yaml
        stop: stop-short@./lifecycle.yaml
        skip: skip-short@./lifecycle.yaml
        error: error-short@./lifecycle.yaml
        set: set-short@./lifecycle.yaml
        when: "expression -> run the bundle only when this condition holds"
        no_error: "boolean -> keep the stack running when one of these actions fails"
        "<pattern::^(?!(?:shell|then|else)$)>": "unknown -> a side effect, an expression function, or an action md does not provide"
    md-unknown-action:
        ? "<pattern::^(?!(?:stdout|stderr|info|warn|success|message|stop|skip|error|shell|set|append_frontmatter|append_jsonl|append_line|decrement_frontmatter|delete_frontmatter|ensure_dir|ensure_file|http_post|increment_frontmatter|merge_frontmatter|prepend_frontmatter|set_frontmatter|abs|absolute|and|as_csv|as_json|as_json5|as_line_separated|as_markdown|as_ordered_list|as_space_separated|as_tsv|as_unordered_list|basename|basename_without_index|branch_exists_on_remote|camel_case|can_execute|capitalize|cicd|cicd_list|code_link|contains|date|date_delta|decrement_file_index|dir_leading|dirname|ends_with|ensure_leading|ensure_trailing|ext|file_exists|file_index|file_trailing|find_files|find_first_index|find_last_index|first|frontmatter|has_agentic_cli|has_alias|has_binary|has_builtin_function|has_command|has_key|has_local_skill|has_skill|has_user_function|increment_file_index|ipv4|ipv6|is_array|is_date|is_date_time|is_date_time_utc|is_date_utc|is_empty|is_indexed_file|is_integer|is_negative|is_null|is_number|is_object|is_positive|is_string|is_this_month|is_this_month_utc|is_this_year|is_this_year_utc|is_today|is_today_utc|is_tomorrow|is_tomorrow_utc|is_yesterday|is_yesterday_utc|join|kebab_case|keys|last|length|link|lower|markdown_body_empty|markdown_title|max|min|newer_than|number|older_than|or|package|package_area|parent_dir|pascal_case|ping|ping_under|pr|pr_list|predict_conflicts|recent_commits|relative|remote_vendor|replace|replace_first|replace_last|round|snake_case|starts_with|terminal|title_case|trim|try_frontmatter|upper|validate_schema|values|without_date|when|then|else|no_error)$)>"
        : "unknown -> an action md does not provide; md compose ignores it with a warning"
        $constraints:
            min-keys: 1
            max-keys: 1
    md-bare-verb: "string(suggest(stop, skip, error, and, or, branch_exists_on_remote, ipv4, ipv6, remote_vendor)) -> a zero-argument verb written as a bare list item"
    md-loose-body:
        - "unknown[] -> a list of actions, checked only by the lifecycle parser"
        - "{ <string>: unknown } -> a dictionary of verbs, checked only by the lifecycle parser"
    md-stack:
        - md-item-1[]
        - md-bundle
    md-item-1:
        - md-communicate
        - md-flow
        - shell@./lifecycle.yaml
        - md-expression
        - md-bundle
        - md-conditional-1
        - md-bare-verb
        - md-unknown-action
    md-conditional-1:
        when: "expression(required) -> the condition choosing then or else"
        "<pattern::^(?:then|else)$>": "md-stack-2 -> the actions to run when the condition holds (then) or when it does not (else)"
        $constraints:
            min-keys: 2
    md-stack-2:
        - md-item-2[]
        - md-bundle
    md-item-2:
        - md-communicate
        - md-flow
        - shell@./lifecycle.yaml
        - md-expression
        - md-bundle
        - md-conditional-2
        - md-bare-verb
        - md-unknown-action
    md-conditional-2:
        when: "expression(required) -> the condition choosing then or else"
        "<pattern::^(?:then|else)$>": "md-stack-3 -> the actions to run when the condition holds (then) or when it does not (else)"
        $constraints:
            min-keys: 2
    md-stack-3:
        - md-item-3[]
        - md-bundle
    md-item-3:
        - md-communicate
        - md-flow
        - shell@./lifecycle.yaml
        - md-expression
        - md-bundle
        - md-conditional-3
        - md-bare-verb
        - md-unknown-action
    md-conditional-3:
        when: "expression(required) -> the condition choosing then or else"
        "<pattern::^(?:then|else)$>": "md-loose-body -> the actions to run when the condition holds (then) or when it does not (else)"
        $constraints:
            min-keys: 2
    md-initialize-stack:
        - md-initialize-item-1[]
        - md-initialize-bundle
    md-initialize-item-1:
        - md-communicate
        - md-flow
        - md-expression
        - md-initialize-bundle
        - md-initialize-conditional-1
        - md-bare-verb
        - md-unknown-action
    md-initialize-conditional-1:
        when: "expression(required) -> the condition choosing then or else"
        "<pattern::^(?:then|else)$>": "md-initialize-stack-2 -> the actions to run when the condition holds (then) or when it does not (else)"
        $constraints:
            min-keys: 2
    md-initialize-stack-2:
        - md-initialize-item-2[]
        - md-initialize-bundle
    md-initialize-item-2:
        - md-communicate
        - md-flow
        - md-expression
        - md-initialize-bundle
        - md-initialize-conditional-2
        - md-bare-verb
        - md-unknown-action
    md-initialize-conditional-2:
        when: "expression(required) -> the condition choosing then or else"
        "<pattern::^(?:then|else)$>": "md-initialize-stack-3 -> the actions to run when the condition holds (then) or when it does not (else)"
        $constraints:
            min-keys: 2
    md-initialize-stack-3:
        - md-initialize-item-3[]
        - md-initialize-bundle
    md-initialize-item-3:
        - md-communicate
        - md-flow
        - md-expression
        - md-initialize-bundle
        - md-initialize-conditional-3
        - md-bare-verb
        - md-unknown-action
    md-initialize-conditional-3:
        when: "expression(required) -> the condition choosing then or else"
        "<pattern::^(?:then|else)$>": "md-loose-body -> the actions to run when the condition holds (then) or when it does not (else)"
        $constraints:
            min-keys: 2
