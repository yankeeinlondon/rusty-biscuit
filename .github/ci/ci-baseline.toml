# ---------------------------------------------------------------------------
# Approved skip budget
#
# Keyed by package, environment, tier, and backend. `tests` carries EXACT test
# identities (`<testsuite>::<testcase>`), not a count: comparing counts cannot
# see a one-for-one swap where an approved skip is resolved and a different
# test starts skipping in the same run.
#
# A skip identity comes from two places:
#   1. an explicit `<skipped/>` in the JUnit report, and
#   2. a test present in that environment's expected-test manifest that
#      produced no result at all.
#
# (2) requires `--expected-manifest`, generated ON the target environment. No
# producer for it is wired yet (see `fixes/2026-07-27-refactor/ci-verdict-job.md`),
# so today only (1) is observed and the verdict records
# `skip_evidence_degraded` for every cell with a budget entry.
#
# EMPTY ON PURPOSE. The area-keyed baseline recorded no skips, and inventing
# entries from an un-measured guess would defeat the mechanism. Populate it
# from the first full-scope run whose rollup was produced by `ci-rollup`.
#
# Shape:
#
#   [[skip]]
#   package = "biscuit-terminal-cli"
#   environment = "ubuntu-latest"
#   tier = "L2"
#   backend = "wezterm"
#   tests = [
#     "biscuit-terminal-cli::level2_renders_table_in_wezterm",
#   ]
#   owner = "@yankeeinlondon"
#   reason = "WezTerm needs WEZTERM_UNIX_SOCKET, i.e. a live GUI session; a headless runner cannot host it"
#   source_run = "30791562395"
#   expiry = "2026-10-31"
# ---------------------------------------------------------------------------
