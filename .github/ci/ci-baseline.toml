# CI baseline — known-red legs and the approved skip budget.
#
# Keyed by stable identity (`package`, `environment`, `tier`), never by a
# GitHub display name or a shard. Enforced by `ci-rollup verdict`, which is the
# single required branch-protection check.
#
# Why TOML: this file is hand-edited policy. An owner adds an entry, explains
# why, and dates its expiry — all of which want comments and readable
# multi-line strings. The machine-generated rollup (`results.json`) goes the
# other way, for the same reason: nothing hand-edits it.
#
# Rules enforced by `ci-rollup verdict`:
#
#   - a failure NOT listed here blocks
#   - a listed entry that is scheduled and PASSES blocks, forcing cleanup
#   - an entry outside the run's affected scope is ignored — never counted as
#     a pass
#   - a scheduled entry that is cancelled, missing, or emits no result stays
#     blocking; it cannot be accepted as a known test failure
#   - an entry past its `expiry` blocks
#
# Every entry needs `owner`, `reason`, and `source_run`. `expiry` is optional
# but strongly encouraged.
#
# POLICY GAPS ARE NOT BASELINED HERE. A tier a package owns tests for that an
# environment cannot host is governed once in `.github/ci/environments.json`,
# and `ci-rollup verdict` applies the same shape of rule to it: a governed,
# unexpired gap is accepted as a `note` and does not block, while an
# ungoverned, unowned, undated, or expired one blocks. Do not add a `[[failure]]`
# entry to paper over a POLICY GAP cell — it would not work anyway, because a
# baselined entry is only accepted against a `FAIL`.
#
# ---------------------------------------------------------------------------
# RE-KEY STATUS — READ BEFORE TRUSTING THIS FILE
# ---------------------------------------------------------------------------
# schema_version 2 keyed every identity on the package. This file was re-keyed
# from the area-keyed v1 baseline by attributing each entry to the package the
# recorded *example failing test* names (every JUnit-backed failing test carries
# a `<package>::<module>::test` identity), with the shard dimension collapsed.
#
# Two entries are SYNTHETIC identities, not Cargo packages (`claudine-gen-drift`
# and `coverage`): they stay here, never in any package scope, reported
# `baseline-out-of-scope` until their specialized producers join the result
# contract. They are carried forward without being renamed or dropped.
#
# Every entry below is a CANDIDATE pending the Phase 4 bridging run — the first
# full-scope run that produces package-keyed results. `ci-rollup verdict` will
# report `baseline-no-result` for a candidate whose package did not actually
# fail on that environment, and `baseline-now-passing` for one whose failure no
# longer reproduces. Both block, which is the intended way to retire a wrong
# guess. Correct each against the bridging run's rollup before the cutover
# merge; an unmatched scheduled entry blocks.
#
# Sources:
#   - run 30791562395 (2026-08-03): entries with example failing tests, so the
#     owning package is read directly off the test identity.
#   - run 30323254931: the older area-keyed migration, unverified — candidates
#     attributed by the owning area's known package shape, and marked so.
#
# `tier` values: `L1`, `L2`, `browser` (JUnit-producing test tiers) and `lint`
# (a producer-status job that emits no JUnit; its cell comes from the
# `status-<package>-lint` artifact).

schema_version = 2

