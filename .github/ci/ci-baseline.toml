# CI baseline — known-red legs and the approved skip budget.
#
# Replaces `baseline-failures.txt`, which listed 31 GitHub *display names* and
# had zero consumers. Entries here are keyed by stable identity
# (`area`, `environment`, `tier`, `shard`) and are enforced by
# `ci-rollup verdict`, which is the single required branch-protection check.
#
# Why TOML: this file is hand-edited policy. An owner adds an entry, explains
# why, and dates its expiry — all of which want comments and readable
# multi-line strings. The machine-generated rollup (`results.json`) goes the
# other way, for the same reason: nothing hand-edits it.
#
# Rules enforced by `ci-rollup verdict`:
#
#   - a failure NOT listed here blocks
#   - a listed entry that is scheduled and PASSES blocks, forcing cleanup
#   - an entry outside the run's affected scope is ignored — never counted as
#     a pass
#   - a scheduled entry that is cancelled, missing, or emits no result stays
#     blocking; it cannot be accepted as a known test failure
#   - an entry past its `expiry` blocks
#
# Every entry needs `owner`, `reason`, and `source_run`. `expiry` is optional
# but strongly encouraged.
#
# POLICY GAPS ARE NOT BASELINED HERE. A tier an area owns tests for that an
# environment cannot host is declared in `areas.json` under `policy_gaps`, and
# `ci-rollup verdict` applies the same shape of rule to it: an owned, unexpired
# gap is accepted as a `note` and does not block, while an undeclared, unowned,
# undated, expired, or now-executing one blocks. Do not add a `[[failure]]`
# entry to paper over a POLICY GAP cell — it would not work anyway, because a
# baselined entry is only accepted against a `FAIL`.
#
# ---------------------------------------------------------------------------
# MIGRATION STATUS — READ BEFORE TRUSTING THIS FILE
# ---------------------------------------------------------------------------
# Every `failure` entry below was carried over mechanically from
# `baseline-failures.txt` and is **unverified**. That file was measured to be
# stale in both directions (see `fixes/2026-07-27-refactor/measurement-2026-07-27.md`):
#
#   - `biscuit-speaks / lint` and `biscuit-terminal / lint` both PASS in run
#     30323254931 despite being listed. They are carried across anyway rather
#     than silently dropped; the verdict will report `baseline-now-passing` and
#     block, which is the intended way to retire them.
#   - the old file listed 7 lint blockers; only 5 areas were actually blocked.
#   - it recorded nothing about `sniff`'s per-shard behaviour, and `darkmatter`
#     is not uniformly red across its 4 shards.
#
# Counts in the old file were per *job*, never per *test*. This file cannot be
# trusted until it is re-measured against a full-scope run whose rollup was
# produced by `ci-rollup rollup`.
#
# `tier` values: `L1`, `L2`, `browser` (JUnit-producing test tiers) and `lint`
# (a producer-status job that emits no JUnit; its cell comes from the
# `status-<area>-lint` artifact).

schema_version = 1

