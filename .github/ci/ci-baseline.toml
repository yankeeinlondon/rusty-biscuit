# CI baseline — approved exact-test skip budget.
#
# Keyed by stable identity (`package`, `environment`, `tier`), never by a
# GitHub display name or a shard. Enforced twice, for two different cells. A
# cell the plan EXECUTES is judged by its own producer: the plan carries a
# snapshot of this file (`skip_policy`), and `scripts/ci/completion.py` refuses
# to certify a cell whose observed skip no unexpired entry approves. Every
# other cell — reused, or rolled up without a plan — is judged by
# `ci-rollup verdict`, which runs once per selected area inside
# `_area-ci.yml`'s `coverage-audit` job (`--area`) when the area's producer
# call succeeded or was never needed. The required branch-protection
# check, `ci.yml`'s `ci-gate`, folds the area workflows' job results and never
# reads this file.
#
# AREA GROUPS, PACKAGE IDENTIFIES. Nothing here is re-keyed by area. An entry
# is applied by the area that owns its `package`, and by no other: another
# area's coverage audit can neither block on it nor be excused by it.
#
# Why TOML: this file is hand-edited policy. An owner adds an entry, explains
# why, and dates its expiry — all of which want comments and readable
# multi-line strings. The machine-generated rollup (`results.json`) goes the
# other way, for the same reason: nothing hand-edits it.
#
# Test, lint, and compile failures always block and cannot be listed here.
# Schema version 3 removed `[[failure]]`: producer jobs now fail visibly, so a
# downstream rollup could not pardon a hosted failure without contradicting
# the merge gate. Every skip entry needs `owner`, `reason`, and `source_run`;
# `expiry` is optional but strongly encouraged.
#
# POLICY GAPS ARE NOT BASELINED HERE. A tier a package owns tests for that an
# environment cannot host is governed once in `.github/ci/environments.json`,
# and `ci-rollup verdict` applies the same shape of rule to it: a governed,
# unexpired gap is accepted as a `note` and does not block, while an
# ungoverned, unowned, undated, or expired one blocks.
#
# `tier` values: `L1`, `L2`, `browser` (JUnit-producing test tiers) and `lint`
# / `check` (producer-status jobs that emit no JUnit; their cells come from the
# `status-<package>-lint` and `status-<package>-check-<os>` artifacts). Those
# two are therefore always CI-origin — no local receipt can supply them — and a
# `check` cell exists for a package declaring `example` or `bench` targets
# (L1 already covers the `lib`, `bin`, and `test` kinds) and, on
# `ubuntu-latest` only, for a package whose unchanged direct reverse
# dependencies are compiled inside its own check.

schema_version = 3

# ---------------------------------------------------------------------------
# Approved skip budget
#
# Keyed by package, environment, tier, and backend. `tests` carries EXACT test
# identities (`<testsuite>::<testcase>`), not a count: comparing counts cannot
# see a one-for-one swap where an approved skip is resolved and a different
# test starts skipping in the same run.
#
# A skip identity comes ONLY from an observed `<skipped/>` in the JUnit report.
# An expected test that reported no result at all is a FAILURE, not a skip: the
# producer compares its reports with the listing taken on its own target and
# refuses it as `completion-test-missing`, and no entry here can excuse it — an
# observed skip is a decision, silence is a lost test. An entry naming no
# `tests` approves any observed skip in its cell.
#
# For a cell its producer certified, the audit reports each observed skip
# (`skip-certified`) rather than re-judging it, and still blocks an entry that
# no longer skips (`skip-resolved`), so a stale approval cannot linger as a
# standing permission. Only a legacy cell can still be `skip_evidence_degraded`.
#
# EMPTY ON PURPOSE. The area-keyed baseline recorded no skips, and inventing
# entries from an un-measured guess would defeat the mechanism. Populate it
# from the first full-scope run whose rollup was produced by `ci-rollup`.
#
# Shape:
#
#   [[skip]]
#   package = "biscuit-terminal-cli"
#   environment = "ubuntu-latest"
#   tier = "L2"
#   backend = "wezterm"
#   tests = [
#     "biscuit-terminal-cli::level2_renders_table_in_wezterm",
#   ]
#   owner = "@yankeeinlondon"
#   reason = "WezTerm needs WEZTERM_UNIX_SOCKET, i.e. a live GUI session; a headless runner cannot host it"
#   source_run = "30791562395"
#   expiry = "2026-10-31"
# ---------------------------------------------------------------------------
