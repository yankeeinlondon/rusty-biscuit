name: rust-latest-stable

# Advisory (NON-required) compatibility check (D5). It tests the current latest
# stable toolchain against a representative slice of the workspace, overriding
# the pinned rust-toolchain.toml via RUSTUP_TOOLCHAIN=stable. Failures here are
# informational — they never gate a merge. When the repository deliberately
# advances the pin in rust-toolchain.toml, this workflow's clippy/rustfmt
# diagnostics are the review input for that bump.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Override the pinned toolchain with floating latest stable for this run only.
  # RUSTUP_TOOLCHAIN takes precedence over rust-toolchain.toml.
  RUSTUP_TOOLCHAIN: stable

jobs:
  latest-stable:
    name: latest stable advisory
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install latest stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Report the toolchain under test
        run: rustc -vV
      # Read-only formatting check — never write-mode. This surfaces rustfmt
      # drift between the pin and latest stable before a bump is attempted.
      - name: Read-only formatting check
        run: cargo fmt --all --check
      # Representative build/test/lint gates: a pure-Rust area and a heavy area.
      # Kept intentionally small so this weekly advisory stays cheap; expand the
      # set when advancing the pin needs broader evidence.
      - name: Advisory gates (biscuit-hash)
        run: cd biscuit-hash && just build && just test && just lint
      - name: Advisory gates (darkmatter)
        run: cd darkmatter && just build && just lint
