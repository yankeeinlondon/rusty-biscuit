name: evidence-store-demo

# MANUAL-ONLY. Submits one explicitly named, already retained nightly CI cell
# to the evidence store, authenticating with this job's GitHub OIDC token. It is
# the only OIDC workflow the service trusts (`oidc.trusted_workflows` in the
# service configuration names this file on `refs/heads/main`), so it runs
# from `main` and nothing else may call it.
#
# It runs no tests, imports no history, and adds no publication hook: it
# downloads the cell's retained observation, junit, and completion artifacts,
# assembles them into a one-observation collection (keeping the original
# observation ID), ingests it, and stages the report and proof files it cites. A producer identity cannot publish staged bytes,
# so the job uploads its resume state (no token) as an artifact, and the
# operator finalizes from a host with a verifier credential through the
# service's `evidence-finalize` recipe.
#
# Dispatch it with the service's `demo-hosted` recipe, which refuses to run
# until this file is on `main`.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of the nightly ci.yml run that retained the cell"
        required: true
        type: string
      observation:
        description: "The cell's observation artifact: observation-<package>-<gate>-<environment>"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: evidence-store-demo
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ingest:
    name: evidence-store / demo ingest / ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Inputs reach every script through `env`, never by `${{ }}`
      # interpolation into the script text, so no input can inject shell.
      - name: Check the inputs and the service endpoint
        shell: bash
        env:
          EVIDENCE_STORE_ENDPOINT: ${{ vars.EVIDENCE_STORE_ENDPOINT }}
          RUN_ID: ${{ inputs.run_id }}
          OBSERVATION: ${{ inputs.observation }}
        run: |
          set -euo pipefail
          if [ -z "${EVIDENCE_STORE_ENDPOINT}" ]; then
            echo "::error::The repository variable EVIDENCE_STORE_ENDPOINT is unset; set it to the deployed service URL."
            exit 1
          fi
          if ! [[ "${RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::run_id must be a numeric workflow run ID."
            exit 1
          fi
          if ! [[ "${OBSERVATION}" =~ ^observation-[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::observation must name an observation-<package>-<gate>-<environment> artifact."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install the evidence-store dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --filter @rusty-biscuit/evidence-store...

      # The junit and completion artifact names are derived from the
      # observation's, as `scripts/ci/hosted_observations.py` derives them. A
      # failing cell has no completion artifact; the assembler requires one
      # only when the observation's proof cites a completion record.
      - name: Download the cell's retained artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          OBSERVATION: ${{ inputs.observation }}
        run: |
          set -euo pipefail
          cell="${OBSERVATION#observation-}"
          cells="${RUNNER_TEMP}/cell"
          gh run download "${RUN_ID}" -n "${OBSERVATION}" -D "${cells}/observation"
          gh run download "${RUN_ID}" -n "junit-${cell}" -D "${cells}/junit"
          if ! gh run download "${RUN_ID}" -n "completion-${cell}" -D "${cells}/completion"; then
            echo "::notice::run ${RUN_ID} has no completion-${cell} artifact."
          fi

      # The envelope carries the head but not its tree, which the collection
      # needs. The checkout keeps no credentials, so the tree is read through
      # the API with the job token instead of a `git fetch`.
      - name: Assemble the collection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cells="${RUNNER_TEMP}/cell"
          head="$(jq -r '.head' "${cells}/observation/observation.json")"
          if ! [[ "${head}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the observation envelope names no commit head."
            exit 1
          fi
          tree="$(gh api "repos/${GH_REPO}/git/commits/${head}" --jq '.tree.sha')"
          args=(
            --observation "${cells}/observation"
            --junit "${cells}/junit"
            --tree "${tree}"
            --out "${RUNNER_TEMP}/collection"
          )
          if [ -d "${cells}/completion" ]; then
            args+=(--completion "${cells}/completion")
          fi
          node tools/evidence-store/node_modules/tsx/dist/cli.mjs tools/evidence-store/cli/hosted-collection.ts "${args[@]}"

      - name: Request the OIDC token
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${RUNNER_TEMP}/oidc"
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rusty-biscuit-evidence-store" | jq -r '.value')"
          if [ -z "${token}" ] || [ "${token}" = "null" ]; then
            echo "::error::GitHub issued no OIDC token for the evidence-store audience."
            exit 1
          fi
          echo "::add-mask::${token}"
          printf '%s\n' "${token}" >"${RUNNER_TEMP}/oidc/token"
          chmod 600 "${RUNNER_TEMP}/oidc/token"

      - name: Ingest the collection
        shell: bash
        env:
          EVIDENCE_STORE_ENDPOINT: ${{ vars.EVIDENCE_STORE_ENDPOINT }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ingest"
          args=(
            "${RUNNER_TEMP}/collection/collection.json"
            --endpoint "${EVIDENCE_STORE_ENDPOINT}"
            --repo "${REPOSITORY_ID}"
            --token-file "${RUNNER_TEMP}/oidc/token"
            --state "${RUNNER_TEMP}/ingest/state.json"
            --proof-dir "${RUNNER_TEMP}/collection/files"
          )
          node tools/evidence-store/node_modules/tsx/dist/cli.mjs tools/evidence-store/cli/ingest.ts ingest "${args[@]}"

      # The token lives outside the uploaded directory; it is removed anyway so
      # nothing later in the job can read it.
      - name: Remove the OIDC token
        if: ${{ always() }}
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/oidc"

      # Uploaded even after a failed ingestion: the state is what resumes it.
      - name: Upload the resume state
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: evidence-store-demo-state-${{ github.run_id }}
          path: ${{ runner.temp }}/ingest
          if-no-files-found: warn
          retention-days: 14
