name: fuzz-nightly

# Nightly scheduled fuzz run for all targets.
# Requires nightly Rust. Opens an issue on new crash.
# Not a PR gate — fuzzing is advisory only.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: fuzz-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  biscuit-file:
    name: Fuzz biscuit-file targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: fuzz-biscuit-file

      - name: Run PDF extract fuzz target
        run: |
          cd biscuit-file/lib/fuzz
          cargo +nightly fuzz run pdf_extract -- -runs=10000 -max_total_time=300

      - name: Run TOML roundtrip fuzz target
        run: |
          cd biscuit-file/lib/fuzz
          cargo +nightly fuzz run toml_roundtrip -- -runs=10000 -max_total_time=300

      - name: Run YAML roundtrip fuzz target
        run: |
          cd biscuit-file/lib/fuzz
          cargo +nightly fuzz run yaml_roundtrip -- -runs=10000 -max_total_time=300

      - name: Run JSON5 roundtrip fuzz target
        run: |
          cd biscuit-file/lib/fuzz
          cargo +nightly fuzz run json5_roundtrip -- -runs=10000 -max_total_time=300

      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-biscuit-file
          path: biscuit-file/lib/fuzz/artifacts/**
          if-no-files-found: ignore

      - name: Open issue on fuzz crash
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `fuzz-nightly: biscuit-file crash on ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              `Nightly fuzz job \`biscuit-file\` failed.`,
              ``,
              `- Workflow run: ${runUrl}`,
              `- Commit: \`${context.sha}\``,
              `- Crash artifacts: download \`fuzz-crashes-biscuit-file\` from the run.`,
              ``,
              `Reproduce locally:`,
              `\`\`\`bash`,
              `cd biscuit-file/lib/fuzz`,
              `cargo +nightly fuzz run <target> artifacts/<target>/<crash-id>`,
              `\`\`\``,
              ``,
              `Minimize and commit the input under \`fuzz/crashes/<target>/\` per the corpus policy.`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['fuzz', 'bug'],
            });

  darkmatter:
    name: Fuzz darkmatter target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: fuzz-darkmatter

      - name: Run markdown parser fuzz target
        run: |
          cd darkmatter/lib/fuzz
          cargo +nightly fuzz run markdown_parser -- -runs=10000 -max_total_time=300

      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-darkmatter
          path: darkmatter/lib/fuzz/artifacts/**
          if-no-files-found: ignore

      - name: Open issue on fuzz crash
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `fuzz-nightly: darkmatter crash on ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              `Nightly fuzz job \`darkmatter\` failed.`,
              ``,
              `- Workflow run: ${runUrl}`,
              `- Commit: \`${context.sha}\``,
              `- Crash artifacts: download \`fuzz-crashes-darkmatter\` from the run.`,
              ``,
              `Reproduce locally:`,
              `\`\`\`bash`,
              `cd darkmatter/lib/fuzz`,
              `cargo +nightly fuzz run markdown_parser artifacts/markdown_parser/<crash-id>`,
              `\`\`\``,
              ``,
              `Minimize and commit the input under \`fuzz/crashes/markdown_parser/\` per the corpus policy.`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['fuzz', 'bug'],
            });
