name: darkmatter-tests

# Path-filtered test workflow for the Darkmatter library and CLI.
# Runs whenever files under `darkmatter/` or workspace-level Cargo
# manifests change.

on:
  push:
    paths:
      - "darkmatter/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/darkmatter-tests.yml"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: darkmatter-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Darkmatter tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: darkmatter-tests

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run Darkmatter tests
        run: just test darkmatter
