name: darkmatter-tests

# Path-filtered test workflow for the Darkmatter library and CLI.
# Runs whenever files under `darkmatter/` or workspace-level Cargo
# manifests change.

on:
  push:
    paths:
      - "darkmatter/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "just/**"
      - ".github/workflows/darkmatter-tests.yml"
  pull_request:
    paths:
      - "darkmatter/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "just/**"
      - ".github/workflows/darkmatter-tests.yml"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Force biscuit-terminal's `color_depth()` to report TrueColor on a
  # headless runner. The darkmatter terminal renderer routes through
  # `biscuit_terminal::discovery::detection::color_depth()`, which under
  # the default GitHub Actions environment (TERM=dumb, no COLORTERM)
  # resolves to `ColorDepth::None` and strips the truecolor escape
  # sequences that the committed insta snapshots assert on (e.g.
  # `layout_snapshots__zero_config_prose_snapshot.snap`). Setting
  # COLORTERM=truecolor is the upstream-recommended override.
  COLORTERM: truecolor

concurrency:
  group: darkmatter-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Darkmatter tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: darkmatter-tests

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run Darkmatter tests
        run: just test darkmatter
