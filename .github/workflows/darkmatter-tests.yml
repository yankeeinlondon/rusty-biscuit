name: darkmatter-tests

# Path-filtered CI for the Darkmatter area. Delegates to the shared
# `_area-ci.yml` reusable workflow (macOS compile-check, full L1 on Linux +
# Windows, sharded 4-ways, kache-cached) so platform behavior matches every
# other area. See docs/testing-strategy.md → "Platform Coverage (CI)".

on:
  push:
    paths:
      - "darkmatter/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "just/**"
      - ".github/workflows/darkmatter-tests.yml"
      - ".github/workflows/_area-ci.yml"
  pull_request:
    paths:
      - "darkmatter/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "just/**"
      - ".github/workflows/darkmatter-tests.yml"
      - ".github/workflows/_area-ci.yml"
  workflow_dispatch: {}

concurrency:
  group: darkmatter-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: "-D warnings"

jobs:
  ci:
    uses: ./.github/workflows/_area-ci.yml
    with:
      area: darkmatter
      check-args: "-p darkmatter -p darkmatter-cli -p dmls"
      full-os: '["ubuntu-latest", "windows-latest"]'
      check-os: '["macos-latest"]'
      # darkmatter's L1 suite is the largest in the repo; partition it 4 ways so
      # the run stays well under the 30-minute ceiling it was breaching.
      shards: '["1/4", "2/4", "3/4", "4/4"]'
      soft-os: '[]'
      l2: true
      browser: true
    secrets: inherit

  # Area-specific regression guard (kept out of the shared workflow): the local
  # pre-push hook runs `just test darkmatter` and previously broke for developers
  # exporting NO_COLOR=1, because biscuit-terminal honors NO_COLOR before
  # COLORTERM and the color-depth tests asserted truecolor. This exercises those
  # tests under NO_COLOR=1 to keep them hermetic.
  no-color-hermeticity:
    name: color-depth tests hermetic under NO_COLOR=1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: area-ci-darkmatter-test-ubuntu-latest
      - run: cargo test -p darkmatter --lib terminal::tests::test_color_depth
