name: test

# PR gate: full canonical tier run across all curated areas.
# Runs `just all` (sanity → lint → doctest → test → test-l2 → test-browser).
# Tiers that skip cleanly when their resource is absent do not fail the run.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Backstop for the vendored protoc in rendezvous-core's build.rs:
      # a system protoc if the vendored binary is ever unavailable.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: test

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Validate canonical recipe set
        run: just check-canonical

      - name: Run all canonical tiers
        run: just all

  sniff-cross-platform:
    name: Sniff cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: sniff-cross-platform-${{ matrix.os }}

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Compile guard: the cross-platform fixes in this plan are about test
      # *code* compiling everywhere. `--all-targets` builds the test, bench, and
      # example targets so a Unix-only import or a macOS-only helper fails here
      # even when the offending test never runs on this OS.
      - name: Check sniff library (all targets)
        run: cargo check --color=never -p sniff --all-targets

      # `remote` (and the `network` feature it implies) is NOT a default
      # feature, so the step above compiles none of `sniff::remote` — not the
      # provider client, and not the `focused_provider` / `remote_observation`
      # Wiremock test binaries, which are `cfg`-gated down to empty targets
      # without it. Selecting it explicitly is what makes this job a compile
      # guard for the provider surface rather than a guard for everything
      # except the provider surface.
      #
      # `--all-targets` matters here beyond the test binaries: the `perf` bench
      # and the profiling examples are `network`-gated and are built by no other
      # cross-platform step (`just test` runs nextest, which does not build
      # benches).
      - name: Check sniff library with remote provider surface (all targets)
        run: cargo check --color=never -p sniff --all-targets --features remote

      # sniff-cli depends on the library as
      # `features = ["network", "remote"]`, so this step already compiles the
      # library's provider *source* on every OS. It does not build sniff's own
      # test/bench targets — that is the step above.
      - name: Check sniff CLI (all targets)
        run: cargo check --color=never -p sniff-cli --all-targets

      # `just test` is the repository's existing nextest setup: it runs
      # `cargo nextest run` for both `sniff` and `sniff-cli` with the canonical
      # filter that excludes the L2/L3/browser/real/slow tiers. This is the
      # sniff-cli nextest decision (plan Phase 4): the host-independent
      # (L1) CLI tests run in the full macOS/Linux/Windows matrix here.
      #
      # The `sniff` half of that recipe passes `--features remote`, so the
      # provider Wiremock suites are executed — not merely compiled — on all
      # three OSes. Keep it that way: dropping the flag from `sniff/justfile`
      # would silently reduce those suites to empty binaries.
      - name: Run sniff library and CLI tests
        run: cd sniff && just test

      # The sniff-cli real-terminal (L2) tier needs a tmux/WezTerm harness that
      # the Windows runner image does not provide, so it stays on the Unix legs.
      # `require_level!` already skips it cleanly where the harness is absent;
      # gating the step keeps the Windows leg focused on portable coverage.
      - name: Run sniff CLI real-terminal (L2) tests
        if: runner.os != 'Windows'
        run: cd sniff && just test-l2
