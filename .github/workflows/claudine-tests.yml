name: claudine-tests

# Path-filtered test workflow for the Claudine library, contract adapter, and CLI.
# Runs whenever files under `claudine/` or workspace-level Cargo
# manifests change.

on:
  push:
    paths:
      - "claudine/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "just/**"
      - ".github/workflows/claudine-tests.yml"
  pull_request:
    paths:
      - "claudine/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "just/**"
      - ".github/workflows/claudine-tests.yml"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Force biscuit-terminal's color_depth() to report TrueColor on a
  # headless runner so any Prose/owo styling emitted by the claudine CLI
  # under test matches what developers see locally. The runner's default
  # TERM is "dumb", which otherwise maps to ColorDepth::None.
  COLORTERM: truecolor

concurrency:
  group: claudine-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Claudine library
            recipe: test-library
            cache-key: claudine
          - name: Claudine contract
            recipe: test-contract
            cache-key: claudine-contract
          - name: Claudine CLI
            recipe: test-cli
            cache-key: claudine-cli
          - name: Claudine gen + signals
            recipe: test-gen
            cache-key: claudine-gen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Backstop for the vendored protoc in rendezvous-core's build.rs:
      # a system protoc if the vendored binary is ever unavailable.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: claudine-tests-${{ matrix.cache-key }}

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install AI-CLI provider stubs
        if: matrix.cache-key == 'claudine-cli'
        # Several claudine-cli integration tests (`argv_normalization` etc.)
        # call the real `claudine compose ... --dry-run` binary, which
        # enumerates installed AI provider CLIs via `sniff` and refuses to
        # plan a run when the set is empty ("no runnable providers
        # available"). The runners do not have the real provider CLIs
        # installed, so we drop in inert PATH stubs that satisfy the
        # is-installed check. Dry-run never actually invokes them.
        run: |
          set -euo pipefail
          stubdir="$RUNNER_TEMP/ai-cli-stubs"
          mkdir -p "$stubdir"
          for bin in claude opencode roo gemini aider codex goose kimi qwen; do
            cat >"$stubdir/$bin" <<'STUB'
          #!/usr/bin/env bash
          # Inert CI stub for an AI provider CLI. Satisfies sniff's
          # PATH-based installed-program detection; never invoked by
          # dry-run code paths.
          echo "ci-stub $0 $*" >&2
          exit 0
          STUB
            chmod +x "$stubdir/$bin"
          done
          echo "$stubdir" >>"$GITHUB_PATH"

      - name: Run Claudine tests
        working-directory: claudine
        run: just ${{ matrix.recipe }}

  # Compile-only coverage for the two OSes the `test` job above does not run on.
  # Claudine is a downstream consumer of the sniff provider surface (via
  # `darkmatter`, which depends on `sniff` with `features = ["remote"]`), so a
  # provider-side type or enum change that breaks on Windows or macOS has, until
  # now, had nowhere to fail. See docs/testing-strategy.md → "Platform Coverage
  # (CI)".
  #
  # Deliberately a compile check and not a full `just test` leg. The CLI test
  # jobs depend on PATH stubs written as `#!/usr/bin/env bash` scripts with no
  # extension, which Windows PATHEXT resolution will not execute, and claudine's
  # Windows Ctrl+C handling is a known unimplemented gap with its own dedicated
  # workflow (`claudine-windows-ctrl-c.yml`). A full Windows test leg would be
  # red for reasons unrelated to the code it is supposed to be guarding.
  cross-platform-check:
    name: Claudine compile check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Matches the `soft-os` convention in `_area-ci.yml`: the Windows leg
    # publishes evidence but does not gate merges, so it can be lit up before
    # the latent cross-platform backlog it reveals has been burned down.
    # Promoting it to a required check is a separate, deliberate decision.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: claudine-tests-check-${{ matrix.os }}

      - name: cargo check --all-targets
        run: cargo check --color=never --all-targets -p claudine -p claudine-cli

  # Continuous Level-2 (real-terminal) gate. Kept as a dedicated job — not a row
  # in the L1 matrix above — so a tmux/harness failure is distinguishable from an
  # ordinary L1 regression. The claudine L2 suite self-spawns tmux panes, so the
  # runner must actually have tmux (ubuntu-latest does not guarantee it).
  # BISCUIT_TEST_LEVEL_REQUIRED=2 turns a genuinely missing harness into a hard
  # failure instead of a silent skip, so a typed-channel regression (e.g. an
  # unreachable proxy handoff) cannot slip through as "0 tests run".
  test-l2:
    name: Claudine CLI (L2 real terminal)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BISCUIT_TEST_LEVEL_REQUIRED: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: claudine-tests-l2

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run Claudine L2 tests
        working-directory: claudine
        run: just test-l2
