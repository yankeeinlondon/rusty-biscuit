name: claudine-tests

# Path-filtered test workflow for the Claudine library and CLI.
# Runs whenever files under `claudine/` or workspace-level Cargo
# manifests change.

on:
  push:
    paths:
      - "claudine/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "just/**"
      - ".github/workflows/claudine-tests.yml"
  pull_request:
    paths:
      - "claudine/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "just/**"
      - ".github/workflows/claudine-tests.yml"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Force biscuit-terminal's color_depth() to report TrueColor on a
  # headless runner so any Prose/owo styling emitted by the claudine CLI
  # under test matches what developers see locally. The runner's default
  # TERM is "dumb", which otherwise maps to ColorDepth::None.
  COLORTERM: truecolor

concurrency:
  group: claudine-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Claudine tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Backstop for the vendored protoc in rendezvous-core's build.rs:
      # a system protoc if the vendored binary is ever unavailable.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: claudine-tests

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install AI-CLI provider stubs
        # Several claudine-cli integration tests (`argv_normalization` etc.)
        # call the real `claudine compose ... --dry-run` binary, which
        # enumerates installed AI provider CLIs via `sniff` and refuses to
        # plan a run when the set is empty ("no runnable providers
        # available"). The runners do not have the real provider CLIs
        # installed, so we drop in inert PATH stubs that satisfy the
        # is-installed check. Dry-run never actually invokes them.
        run: |
          set -euo pipefail
          stubdir="$RUNNER_TEMP/ai-cli-stubs"
          mkdir -p "$stubdir"
          for bin in claude opencode roo gemini aider codex goose kimi qwen; do
            cat >"$stubdir/$bin" <<'STUB'
          #!/usr/bin/env bash
          # Inert CI stub for an AI provider CLI. Satisfies sniff's
          # PATH-based installed-program detection; never invoked by
          # dry-run code paths.
          echo "ci-stub $0 $*" >&2
          exit 0
          STUB
            chmod +x "$stubdir/$bin"
          done
          echo "$stubdir" >>"$GITHUB_PATH"

      - name: Run Claudine tests
        run: just test claudine
