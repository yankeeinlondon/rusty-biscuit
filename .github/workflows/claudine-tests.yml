name: claudine-tests

# Native coverage for the Claudine library, contract adapter, CLI, catalog
# types, and generator. The shared area workflow owns the common platform
# matrix; the generator/signals drift gate remains explicit here.

on:
  push:
    paths:
      - "claudine/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "just/**"
      - ".github/workflows/claudine-tests.yml"
      - ".github/workflows/_area-ci.yml"
  pull_request:
    paths:
      - "claudine/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "just/**"
      - ".github/workflows/claudine-tests.yml"
      - ".github/workflows/_area-ci.yml"
  workflow_dispatch: {}

env:
  RUSTFLAGS: "-D warnings"

concurrency:
  group: claudine-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_area-ci.yml
    with:
      area: claudine
      check-args: >-
        -p claudine-catalog-types
        -p claudine
        -p claudine-contract
        -p claudine-cli
        -p claudine-gen
      full-os: '["ubuntu-latest", "windows-latest"]'
      check-os: '["macos-latest"]'
      soft-os: '[]'
      l2: true
      ai-provider-stubs: true
    secrets: inherit

  generator-signals:
    name: Claudine generator and signals drift
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: claudine-generator-signals
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Verify generator output and signal fixtures
        run: cd claudine && just test-gen
