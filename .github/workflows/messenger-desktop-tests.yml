name: messenger-desktop-tests

# Cross-platform test matrix for the messenger desktop notification helpers.
# Runs unit tests and the stub-binary integration tests on Linux, Windows, and
# macOS to ensure helper election, fallback, and platform-specific edge cases
# remain green on every supported OS.
#
# `messenger` is not yet a curated CI area (see `.github/ci/exemptions.json`), so
# this workflow IS its CI ownership. Orchestrated by `ci.yml` when a messenger
# package is in the affected scope (D12); no longer self-triggers on pushes/PRs.
# Also dispatchable manually.
#
# Its Linux system packages are installed inline rather than through
# `just _ensure-native-libs`, because that recipe provisions from `areas.json`
# and messenger has no area record to declare them in. Promoting messenger to a
# curated area should move them there.

on:
  workflow_call: {}
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  desktop-tests:
    name: messenger / desktop / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up the pinned Rust toolchain
        run: rustup show

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: messenger-desktop-${{ matrix.os }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev

      - name: Cargo check (--all-features)
        run: cargo check -p messenger --all-features

      - name: Build desktop helper stubs
        run: cargo build -p messenger --features desktop --bins

      - name: Run messenger lib unit tests (desktop feature)
        run: cargo test -p messenger --features desktop --lib

      - name: Run messenger CLI tests
        run: cargo test -p messenger-cli

  wsl-tests:
    name: messenger / desktop / WSL2 ubuntu
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup WSL
        uses: Vampire/setup-wsl@v4
        with:
          distribution: Ubuntu-24.04
          wsl-version: 1
          set-as-default: true
          update: true
          additional-packages: pkg-config, libssl-dev, libdbus-1-dev

      - name: Install Rust in WSL
        shell: wsl-bash {0}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

      - name: Cargo check in WSL (--all-features)
        shell: wsl-bash {0}
        run: |
          source ~/.cargo/env
          cargo check -p messenger --all-features

      - name: Build desktop helper stubs in WSL
        shell: wsl-bash {0}
        run: |
          source ~/.cargo/env
          cargo build -p messenger --features desktop --bins

      - name: Run messenger lib unit tests in WSL (desktop feature)
        shell: wsl-bash {0}
        run: |
          source ~/.cargo/env
          cargo test -p messenger --features desktop --lib

      - name: Run messenger CLI tests in WSL
        shell: wsl-bash {0}
        run: |
          source ~/.cargo/env
          cargo test -p messenger-cli
