name: messenger-desktop-tests

# Cross-platform test matrix for the messenger desktop notification helpers.
# Runs unit tests and the stub-binary integration tests on Linux, Windows, and
# macOS to ensure helper election, fallback, and platform-specific edge cases
# remain green on every supported OS.

on:
  pull_request:
    paths:
      - "messenger/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/messenger-desktop-tests.yml"
  push:
    branches:
      - main
    paths:
      - "messenger/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/messenger-desktop-tests.yml"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: messenger-desktop-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-tests:
    name: Desktop helpers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: messenger-desktop-${{ matrix.os }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev

      - name: Cargo check (--all-features)
        run: cargo check -p messenger --all-features

      - name: Build desktop helper stubs
        run: cargo build -p messenger --features desktop --bins

      - name: Run messenger lib unit tests (desktop feature)
        run: cargo test -p messenger --features desktop --lib

      - name: Run messenger CLI tests
        run: cargo test -p messenger-cli
