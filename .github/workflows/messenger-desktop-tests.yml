name: messenger-desktop-tests

# Cross-platform test matrix for the messenger desktop notification helpers.
# Runs unit tests and the stub-binary integration tests on Linux, Windows, and
# macOS to ensure helper election, fallback, and platform-specific edge cases
# remain green on every supported OS.
#
# `messenger` is a non-gating area (`ci: false` in `.github/ci/areas.json`), so
# this workflow IS its CI ownership. Orchestrated by `ci.yml` when a messenger
# package is in the affected scope (D12); no longer self-triggers on pushes/PRs.
# Also dispatchable manually.
#
# Its Linux system packages are still installed inline even though the area
# record now declares them, because this workflow does not run
# `just _ensure-native-libs`. Switching it over is deliberate follow-up work.
#
# The bespoke `wsl-tests` job was deleted on 2026-07-27. It pinned
# `wsl-version: 1` (no WSLg, so `messenger`'s desktop-notification paths took
# their no-capability fallback and a green leg would have misreported them),
# installed rustup and compiled inside the guest, built over `/mnt/c`, and used
# `cargo test` rather than the canonical `just` recipes — so it was outside the
# "same canonical recipe" objective entirely. It had also been failing during
# provisioning (`dpkg` error, `wsl.exe` exit 100) since 2026-06-17, before any
# Rust ran. `.github/workflows/_wsl-ci.yml` is the one shared `wsl2-ubuntu`
# mechanism now; messenger picks it up when it is promoted out of
# `"ci": false` and gains `wsl2-ubuntu` in its `environments`.

on:
  workflow_call: {}
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  desktop-tests:
    name: messenger / desktop / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up the pinned Rust toolchain
        run: rustup show

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: messenger-desktop-${{ matrix.os }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev

      - name: Cargo check (--all-features)
        run: cargo check -p messenger --all-features

      - name: Build desktop helper stubs
        run: cargo build -p messenger --features desktop --bins

      - name: Run messenger lib unit tests (desktop feature)
        run: cargo test -p messenger --features desktop --lib

      - name: Run messenger CLI tests
        run: cargo test -p messenger-cli

