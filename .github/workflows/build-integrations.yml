name: Build UC Integrations

# A published Release builds an archive only for the integration its exact
# `{package}-v{semver}` tag names, from that tag's commit, and uploads it to
# that Release. Any other Release selects nothing and no build starts. The
# selection is made by `scripts/ci/integration_release.py`; no event value is
# interpolated into shell code. The operational guide is `docs/releases.md`.
on:
  release:
    types: [published]

env:
  # The repository tracks no rustc wrapper; cleared explicitly so a stray
  # environment value cannot silently intercept this workflow's builds.
  RUSTC_WRAPPER: ""
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  select:
    name: Select the released integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      matrix: ${{ steps.select.outputs.matrix }}
      commit: ${{ steps.select.outputs.commit }}
    steps:
      - name: Checkout the selector
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Select
        id: select
        shell: bash
        run: python3 scripts/ci/integration_release.py select

  build:
    name: Build aarch64 integration binary
    needs: select
    if: needs.select.outputs.selected == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      PACKAGE: ${{ matrix.package }}
      PACKAGE_DIR: ${{ matrix.package_dir }}
      TAG: ${{ matrix.tag }}
      COMMIT: ${{ needs.select.outputs.commit }}
    steps:
      - name: Checkout the tag's commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.select.outputs.commit }}
          persist-credentials: false

      - name: Assert the checkout is the tag's commit
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "${head}" != "${COMMIT}" ]; then
            echo "::error title=integration release::HEAD is ${head}, expected ${TAG} at ${COMMIT}"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --locked

      - name: Build
        shell: bash
        run: cross build -p "${PACKAGE}" --release --target aarch64-unknown-linux-musl

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "pkg/${PACKAGE}"
          cp "target/aarch64-unknown-linux-musl/release/${PACKAGE}" "pkg/${PACKAGE}/"
          if [ -f "${PACKAGE_DIR}/driver.json" ]; then
            cp "${PACKAGE_DIR}/driver.json" "pkg/${PACKAGE}/"
          fi
          cd pkg && tar czf "${PACKAGE}-aarch64.tar.gz" "${PACKAGE}"

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" "pkg/${PACKAGE}-aarch64.tar.gz" --repo "${GITHUB_REPOSITORY}"
