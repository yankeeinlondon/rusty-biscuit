name: Build UC Integrations

on:
  release:
    types: [published]

env:
  # kache is not installed in this workflow; build wrapper-free by overriding
  # the tracked .cargo/config.toml rustc-wrapper (docs/kache-strategy.md).
  RUSTC_WRAPPER: ""
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    name: Build aarch64 integration binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: arcam-amp-integration
            package_dir: homelab/arcam-amp-integration
          - package: eversolo-integration
            package_dir: homelab/eversolo-integration
          - package: sony-receiver-integration
            package_dir: homelab/sony-receiver-integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --locked

      - name: Build ${{ matrix.package }}
        run: cross build -p "${{ matrix.package }}" --release --target aarch64-unknown-linux-musl

      - name: Package archive
        run: |
          mkdir -p "pkg/${{ matrix.package }}"
          cp "target/aarch64-unknown-linux-musl/release/${{ matrix.package }}" "pkg/${{ matrix.package }}/"
          cp "${{ matrix.package_dir }}/driver.json" "pkg/${{ matrix.package }}/" 2>/dev/null || true
          cd pkg && tar czf "${{ matrix.package }}-aarch64.tar.gz" "${{ matrix.package }}"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "pkg/${{ matrix.package }}-aarch64.tar.gz"
