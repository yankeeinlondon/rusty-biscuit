name: area-drift

# AC15 makes `sniff` the authority on package areas: the planner replicates
# sniff's rule and owns no mapping of its own. The three contracts that prove
# it live in `scripts/ci/test_resolved_plan.py` and need the real binary —
# asking the other tool is the whole point, so no fixture can stand in for it.
#
# THE MERGE PATH OWNS ENFORCEMENT. `ci.yml`'s `area-drift` job runs the same
# class, behind the planner's own `area_drift` flag, and `ci-gate` folds its
# result like every other blocking job. A pull request that can move either
# side of the equivalence is therefore blocked by it, and one that cannot skips
# the job and pays nothing.
#
# THIS WORKFLOW IS THE BACKSTOP, and only that. The gate job is scheduled BY
# the planner, so a defect in `affected_scope.py`'s own flag would let a real
# drift skip its own check with nothing to report it. A daily run of the same
# contract, independent of any flag, is what catches that class of bug. It
# carries no `pull_request` trigger: on a pull request the gate job already
# runs, and a second run of the identical class is the duplication the
# repository's CI/CD test-scope discipline exists to prevent.
#
# `BISCUIT_REQUIRE_SNIFF` is what makes the run honest: with it set, an absent
# binary fails `require_sniff()` instead of skipping three tests green.

on:
  schedule:
    # Its own slot: clear of sniff-performance's 04:00 nightly.
    - cron: "40 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # The repository tracks no rustc wrapper; cleared explicitly so a stray
  # environment value cannot silently intercept this workflow's builds.
  RUSTC_WRAPPER: ""

concurrency:
  group: area-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sniff-area-drift:
    name: planner areas match sniff (AC15)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up the pinned Rust toolchain
        run: rustup show
      # No `just _ensure-native-libs` step: nothing in sniff-cli's build
      # closure declares `[package.metadata.ci.native]`, and `ci.yml`'s build
      # owner compiles every package on this runner from that same union.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: area-drift
      - name: Build the area authority
        run: cargo build -p sniff-cli --release
      # The class holds the three sniff contracts plus the four pure-planner
      # area fixtures; running the class rather than the file keeps this job's
      # red confined to area derivation.
      - name: Enforce the planner's area mapping against sniff
        env:
          BISCUIT_REQUIRE_SNIFF: "1"
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/target/release:${PATH}"
          sniff --version
          python3 scripts/ci/test_resolved_plan.py AreaGroupingTests
