name: area-drift

# AC15 makes `sniff` the authority on package areas: the planner replicates
# sniff's rule and owns no mapping of its own. The three contracts that prove
# it live in `scripts/ci/test_resolved_plan.py` and need the real binary —
# asking the other tool is the whole point, so no fixture can stand in for it.
#
# They cannot run in the two jobs that already run that suite. `ci-tooling` and
# `preflight` provision neither sniff nor a Cargo cache, and a release
# `sniff-cli` costs 4m25s cold / 1m39s with a warm dependency cache (measured
# on a 16-core M4 at four Cargo jobs with the host compiler cache bypassed;
# `reviews/2026-09-15-python-test-code/spike-4-results.md`) against a 2-minute
# job-delta budget. `preflight` would pay it three times, Windows included.
# Building a workspace package inside the CI-infrastructure gate would also
# turn `ci-tooling` red for a sniff compile error, which that gate does not
# exist to report.
#
# So enforcement lives here, off the merge path: nothing in `ci-gate` folds
# this workflow's result. The pull-request trigger is the half that matters
# most — `affected_scope.py`'s `ci_tooling` flag follows `scripts/`,
# `.github/ci/`, `.github/workflows/` and `tools/test-audit/` only, so a change
# to sniff's own detection rule schedules the suite NOWHERE. Watching `sniff/**`
# here is what closes that direction; the schedule catches the rest.
#
# `BISCUIT_REQUIRE_SNIFF` is what makes the run honest: with it set, an absent
# binary fails `require_sniff()` instead of skipping three tests green.

on:
  pull_request:
    paths:
      - "sniff/**"
      - "scripts/ci/affected_scope.py"
      - "scripts/ci/test_resolved_plan.py"
      - ".github/workflows/area-drift.yml"
  schedule:
    # Its own slot: clear of sniff-performance's 04:00 nightly.
    - cron: "40 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # The repository tracks no rustc wrapper; cleared explicitly so a stray
  # environment value cannot silently intercept this workflow's builds.
  RUSTC_WRAPPER: ""

concurrency:
  group: area-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sniff-area-drift:
    name: planner areas match sniff (AC15)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up the pinned Rust toolchain
        run: rustup show
      # No `just _ensure-native-libs` step: nothing in sniff-cli's build
      # closure declares `[package.metadata.ci.native]`, and `ci.yml`'s build
      # owner compiles every package on this runner from that same union.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: area-drift
      - name: Build the area authority
        run: cargo build -p sniff-cli --release
      # The class holds the three sniff contracts plus the four pure-planner
      # area fixtures; running the class rather than the file keeps this job's
      # red confined to area derivation.
      - name: Enforce the planner's area mapping against sniff
        env:
          BISCUIT_REQUIRE_SNIFF: "1"
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/target/release:${PATH}"
          sniff --version
          python3 scripts/ci/test_resolved_plan.py AreaGroupingTests
