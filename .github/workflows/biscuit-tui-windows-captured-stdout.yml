name: biscuit-tui-windows-captured-stdout

# Opt-in Windows-host runtime verification for biscuit-tui F2: `question` with
# stdout captured to a pipe while a console is attached must deliver ONLY the
# submitted value (no TUI/ANSI bytes) to the captured stream. This runs the
# ignored, deterministic console-boundary integration test that needs a Windows
# host. The test self-attaches a console (`AllocConsole`) and PROVES the
# precondition (`stderr.is_terminal()` + `CONOUT$` usable) before spawning,
# failing loudly otherwise — so a green run here is real evidence the
# attached-console contract held, not merely that the binary compiled. Actions
# captures stdout to a pipe, so the test cannot rely on an ambient console;
# `--nocapture` is kept only so the `F2 precondition HELD` line is recorded in
# the log.

on:
  pull_request:
    paths:
      - ".github/workflows/biscuit-tui-windows-captured-stdout.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "biscuit-tui/**"
      - "just/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/biscuit-tui-windows-captured-stdout.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "biscuit-tui/**"
      - "just/**"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: never

concurrency:
  group: biscuit-tui-windows-captured-stdout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows captured-stdout runtime verification
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: biscuit-tui-windows-captured-stdout

      - name: Run Windows captured-stdout verification test
        shell: cmd
        run: cargo test -p biscuit-tui-cli --test windows_captured_stdout -- --ignored captured_stdout_receives_only_value_no_tui_bytes --nocapture
