name: ci

# Dependency-aware CI for pull requests and pushes to main. A main push reuses
# successful PR validation only with an identical tested tree and integration
# base; missing evidence falls back to the normal grid. Source-changed workspace
# packages receive every gate; an unchanged direct reverse dependency receives
# no area, no job, and no result cell, and is reported by name instead. The
# result is fanned out one caller identity per selected package AREA, with each
# area's packages underneath it, policy read from each manifest's
# `[package.metadata.ci]`, and environment capabilities from
# `.github/ci/environments.json`. Package stays the stored identity of every
# artifact, baseline entry, and receipt; area is a derived grouping.
#
# `pull_request` carries NO `branches:` filter on purpose. Restricting it to
# `main` meant a stacked pull request — one targeting another feature branch —
# created no `ci` run at all, so its changes reached `main` having never been
# validated on their own. Measured on PR #22, which targeted PR #21 and ran
# nothing but `pr-health` and Socket.
#
# This does not multiply work: `affected_scope.py` computes scope from the
# event's own base and head, so a stacked PR validates only its delta, and the
# concurrency group cancels superseded runs. `pr-health.yml` mirrors this
# applicability rule and a workflow-contract test keeps the two from drifting.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Check reusable PR validation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.reuse.outcome == 'success' && steps.reuse.outputs.reuse || 'false' }}
      run_id: ${{ steps.reuse.outputs.run_id }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify prior PR validation
        id: reuse
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/reuse_validation.py check

  scope:
    name: Determine affected scope
    needs: validation
    # PR/manual runs and failed lookups fall back to normal scope calculation.
    if: ${{ !cancelled() && needs.validation.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      scheduled_areas: ${{ steps.scope.outputs.scheduled_areas }}
      area_matrix: ${{ steps.scope.outputs.area_matrix }}
      area_slugs: ${{ steps.scope.outputs.area_slugs }}
      gap_areas: ${{ steps.scope.outputs.gap_areas }}
      has_packages: ${{ steps.scope.outputs.has_packages }}
      packages: ${{ steps.scope.outputs.packages }}
      package_names: ${{ steps.scope.outputs.package_names }}
      full_scope: ${{ steps.scope.outputs.full_scope }}
      sniff: ${{ steps.scope.outputs.sniff }}
      biscuit_tui: ${{ steps.scope.outputs.biscuit_tui }}
      preflight_os: ${{ steps.scope.outputs.preflight_os }}
      preflight_reason: ${{ steps.scope.outputs.preflight_reason }}
      change_class: ${{ steps.scope.outputs.change_class }}
      job_estimate: ${{ steps.scope.outputs.job_estimate }}
      ci_tooling: ${{ steps.scope.outputs.ci_tooling }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch local test evidence
        continue-on-error: true
        run: git fetch origin '+refs/notes/ci-local/*:refs/notes/ci-local/*'
      # No toolchain step here on purpose: the receipt path is Python and jq
      # end to end, and the calculate step materializes the pinned toolchain
      # itself, only when selection (and so `cargo metadata`) is about to run.
      - name: Calculate package and area scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          scope_args=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # A manual full run has no diff range. Its plan records the
            # all-zero "no such object" ID as the base, the same identity a
            # branch-creating push carries in `github.event.before`, and the
            # tested head; no receipt is verified against that pair.
            base="0000000000000000000000000000000000000000"
            head="$PUSH_HEAD"
            scope_args=(--all)
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$PR_BASE"
              head="$PR_HEAD"
            else
              base="$PUSH_BASE"
              head="$PUSH_HEAD"
            fi

            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              scope_args=(--all)
            else
              mapfile -d '' changed_files < <(git diff --name-only -z "$base" "$head")
              scope_args=(-- "${changed_files[@]}")
            fi
          fi

          # Ahead of the file list: after its `--` argparse reads everything,
          # options included, as a path.
          scope_args=(--plan-out resolved-plan.json --base "$base" --head "$head" "${scope_args[@]}")

          # A scope receipt on refs/notes/ci-local/scope that binds this
          # event's exact {base, head, tree} IS the plan: selection never runs
          # again for it, with or without validation evidence. Any miss — no
          # note, another schema, head, tree, or base, or a malformed document
          # — calculates scope exactly as before. A manual run and a
          # branch-creating push carry no comparison base and never consult
          # the note.
          local_scope=0
          scope_source="CI (no comparison base)"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            scope_source="CI (workflow_dispatch ignores local scope)"
          elif [[ -n "$base" && ! "$base" =~ ^0+$ ]]; then
            if python3 scripts/ci/local_evidence.py scope-verify \
                --base "$base" --head "$head" \
                --plan-out resolved-plan.json --scope-out scope.json \
                --reason-out scope-reason.txt; then
              local_scope=1
              scope_source="local (refs/notes/ci-local/scope @ ${head:0:9})"
            else
              reason="$(cat scope-reason.txt 2>/dev/null || true)"
              scope_source="CI fallback (${reason:-scope-verify failed})"
            fi
          fi
          if (( local_scope )); then
            scope_json="$(cat scope.json)"
          else
            # Selection reads `cargo metadata`, so this is the one place the
            # scope job needs Rust: a runner without the pinned toolchain
            # installs it here and nowhere else. A receipt hit never reaches
            # this branch — scope-verify, verify --cells, --apply-to, jq, and
            # the summary need no toolchain (R9: the valid-receipt path pays
            # for no Rust it does not use).
            rustup show
            scope_json="$(python3 scripts/ci/affected_scope.py "${scope_args[@]}")"
          fi
          evidence_failure=""
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            # Per CELL, across every environment's notes ref at once: a macOS
            # receipt and a prior WSL cross-check receipt both contribute.
            # Each accepted cell has its EXECUTION omitted while staying a
            # cell, so the rollup expects a local-origin result for it rather
            # than reporting MISSING (the PR #76 regression). Every refusal
            # carries a coded reason and is published with the plan.
            #
            # Evidence PROCESSING adds work, never removes it (R8): a verifier
            # that crashes or prints anything but a JSON list, or an overlay
            # that fails, leaves the plan in hand — the receipt's on a hit,
            # this run's calculation on a miss — exactly as it was, reuses no
            # cell, and says so in the summary and a warning annotation. The
            # overlay writes its result beside the plan and replaces it only
            # on success, so a crash mid-write cannot leave a half-written
            # resolved-plan.json for the fan-out.
            verifier_status=0
            python3 scripts/ci/local_evidence.py verify --cells \
              --plan resolved-plan.json \
              --base "$base" \
              --head "$head" \
              --rejections evidence-rejections.json > accepted-cells.json \
              || verifier_status=$?
            if (( verifier_status != 0 )); then
              evidence_failure="verifier failed (exit ${verifier_status})"
            elif ! jq -e 'type == "array"' accepted-cells.json >/dev/null 2>&1; then
              evidence_failure="verifier output is not a JSON list"
            elif [[ "$(jq -r 'length' accepted-cells.json)" != "0" ]] \
                || jq -e 'type == "array" and length > 0' evidence-rejections.json >/dev/null 2>&1; then
              # One evidence path for both scope sources: the accepted set is
              # overlaid on the plan already in hand and the projection is
              # re-derived from the result. `--apply-to` performs no
              # selection and reads nothing from the checkout, so a receipt's
              # areas, packages, gates, targets, features, and environment
              # policy reach the fan-out exactly as the hook resolved them.
              # A refusal with nothing accepted takes the same path, so an
              # all-rejected verification still publishes its coded reasons
              # as `evidence_rejections`; only a verification that saw no
              # evidence at all leaves the plan, and the planner, untouched.
              overlay_status=0
              overlaid_json="$(
                python3 scripts/ci/affected_scope.py \
                  --apply-to resolved-plan.json \
                  --accepted-cells accepted-cells.json \
                  --evidence-rejections evidence-rejections.json \
                  --plan-out applied-plan.json
              )" || overlay_status=$?
              if (( overlay_status == 0 )); then
                mv applied-plan.json resolved-plan.json
                scope_json="$overlaid_json"
              else
                evidence_failure="overlay failed (exit ${overlay_status})"
              fi
            fi
            if [[ -n "$evidence_failure" ]]; then
              # Nothing downstream may read a partial accepted set.
              printf '[]' > accepted-cells.json
              rm -f applied-plan.json
              echo "::warning title=CI scope::local evidence ${evidence_failure}; the plan runs unmodified and no cell is reused"
            fi
          fi
          packages="$(jq -c '.packages' <<<"$scope_json")"

          # The full scope document is also the rollup's policy source: it
          # carries every impacted package's resolved `[package.metadata.ci]`
          # policy (gating and `gates = false` alike). Uploaded as an artifact
          # so each area's rollup judges exactly what this run scheduled.
          printf '%s' "$scope_json" > scope.json

          # One caller identity per selected AREA, each carrying its own
          # ready-made package matrix. Grouping happens in the planner, not
          # here, so the shape has test coverage. There is no canary stage: the
          # compile check that gates each package's own tests is a cheaper and
          # strictly better predictor than a sample of two other packages, and
          # it cannot stall the fan-out because it runs inside it.

          {
            echo "scheduled_areas=$(jq -c '.scheduled_areas' <<<"$scope_json")"
            echo "area_matrix=$(jq -c '.area_matrix' <<<"$scope_json")"
            echo "area_slugs=$(jq -c '.area_slugs' <<<"$scope_json")"
            # The areas carrying an accepted policy gap, read from the PLAN
            # (the authority on cell state, receipt-carried or calculated)
            # so each area can decide whether to spend a runner on its gap
            # publisher. A skip hint only: the publisher reselects the cells
            # from the same plan, so a wrong `true` publishes nothing.
            echo "gap_areas=$(jq -c '[.cells[] | select(.state == "accepted-gap") | .area] | unique' resolved-plan.json)"
            echo "packages=$packages"
            echo "package_names=$(jq -c '.packages' <<<"$scope_json")"
            # Derived from the MATRIX, not the impacted list: a change touching
            # only `gates = false` packages impacts packages but schedules none,
            # and an empty area matrix under `has_packages=true` fails the
            # fan-out at strategy evaluation. `scheduled_areas` is a regrouping
            # of the same matrix, so the two can never disagree.
            echo "has_packages=$(jq -r '.matrix | length > 0' <<<"$scope_json")"
            echo "full_scope=$(jq -r '.full_scope' <<<"$scope_json")"
            echo "sniff=$(jq -r '.flags.sniff' <<<"$scope_json")"
            echo "biscuit_tui=$(jq -r '.flags."biscuit-tui"' <<<"$scope_json")"
            echo "ci_tooling=$(jq -r '.flags.ci_tooling' <<<"$scope_json")"
            echo "job_estimate=$(jq -r '.job_estimate' <<<"$scope_json")"
            echo "preflight_os=$(jq -c '.preflight_os' <<<"$scope_json")"
            echo "preflight_reason=$(jq -r '.preflight_reason' <<<"$scope_json")"
            echo "change_class=$(jq -r '.change_class' <<<"$scope_json")"
          } >>"$GITHUB_OUTPUT"

          # Evidence provenance, read from the WRITTEN plan (the authority on
          # what was reused) rather than from the verifier's transient files,
          # so the rows describe exactly what the fan-out will see — on an
          # evidence-processing failure that is the unmodified plan, and the
          # rows honestly read `none`. The verifier does not report which
          # refs it walked; it walks every fetched `refs/notes/ci-local/<env>`
          # ref, so those are the environments listed as consulted, and the
          # reused cells' environments are the ones that matched. A rejection
          # names one candidate note (or one cell of it), not a plan cell, so
          # the retained row counts them by code; the full texts ride in the
          # plan artifact's `evidence_rejections`.
          reuse_row='def cells(f): [.cells[] | select(f)
            | "\(.package)/\(.environment)/\(.gate)"]
            | if length == 0 then "none" else "\(length): \(join(", "))" end;'
          reused_passing="$(jq -r "$reuse_row"' cells(.execution == "reuse" and .evidence.outcome == "pass")' resolved-plan.json)"
          reused_failing="$(jq -r "$reuse_row"' cells(.execution == "reuse" and .evidence.outcome == "fail")' resolved-plan.json)"
          retained="$(jq -r '(.evidence_rejections // []) as $rejections
            | if ($rejections | length) == 0 then "none"
              else "\($rejections | length) rejection(s): \(
                [$rejections[] | split(":")[0]] | group_by(.) | map("\(.[0]) (\(length))") | join(", "))"
              end' resolved-plan.json)"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            validation_environments="n/a (workflow_dispatch runs no verifier)"
          else
            consulted="$(git for-each-ref --format='%(refname:strip=3)' 'refs/notes/ci-local/' \
              | jq -Rrs '[split("\n")[] | select(length > 0 and . != "scope")] | join(", ")')"
            matched="$(jq -r '[.cells[] | select(.execution == "reuse") | .environment] | unique | join(", ")' resolved-plan.json)"
            if [[ -z "$consulted" ]]; then
              validation_environments="none"
            else
              validation_environments="consulted: ${consulted}; matched: ${matched:-none}"
            fi
          fi

          # One actionable scope summary (D15).
          {
            echo "## CI scope"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| event | ${EVENT_NAME} |"
            echo "| scope source | ${scope_source} |"
            if [[ -n "$evidence_failure" ]]; then
              echo "| evidence processing | ${evidence_failure}; no cell reused |"
            fi
            echo "| validation environments | ${validation_environments} |"
            echo "| reused passing cells | ${reused_passing} |"
            echo "| reused failing cells | ${reused_failing} |"
            echo "| cells retained (evidence incomplete or rejected) | ${retained} |"
            echo "| change class | $(jq -r '.change_class' <<<"$scope_json") |"
            echo "| full scope | $(jq -r '.full_scope' <<<"$scope_json") |"
            echo "| full-scope gates | $(jq -rc '.full_scope_gates | join(", ")' <<<"$scope_json") |"
            echo "| reason | $(jq -r '.preflight_reason' <<<"$scope_json") |"
            echo "| preflight OS | $(jq -rc '.preflight_os | join(", ")' <<<"$scope_json") |"
            echo "| selected areas | $(jq -rc '[.areas[].area] | join(", ")' <<<"$scope_json") |"
            echo "| areas that fan out | $(jq -rc '.scheduled_areas | join(", ")' <<<"$scope_json") |"
            echo "| affected packages | $(jq -r '.packages | length' <<<"$scope_json") |"
            echo "| source-changed packages | $(jq -rc '.source_packages | join(", ")' <<<"$scope_json") |"
            echo "| reported (unselected) reverse dependencies | $(jq -rc '.reverse_dependencies | join(", ")' <<<"$scope_json") |"
            echo "| gating packages (matrix) | $(jq -r '.matrix | length' <<<"$scope_json") |"
            echo "| expanded job estimate | $(jq -r '.job_estimate' <<<"$scope_json") |"
            echo "| toolchain | $(grep '^channel' rust-toolchain.toml | cut -d'"' -f2) |"
          } >>"$GITHUB_STEP_SUMMARY"
      # The policy artifact the rollup reads. Small, and retention is short:
      # it describes one run's scope, nothing else.
      - name: Upload the resolved package policy
        uses: actions/upload-artifact@v6
        with:
          name: ci-scope
          path: scope.json
          retention-days: 3
          if-no-files-found: error

      # The canonical plan, beside the legacy projection derived from it.
      # `ci-rollup` reads it: it is the only document that says which cells a
      # receipt already satisfied, and expecting a CI result for one of those
      # is the PR #76 seven-cell MISSING regression. The projection still
      # carries the area fan-out this workflow consumes, so it stays until
      # those consumers read `cells[]` directly.
      - name: Upload the resolved execution plan
        uses: actions/upload-artifact@v6
        with:
          name: ci-resolved-plan
          path: resolved-plan.json
          retention-days: 3
          if-no-files-found: error

      - name: Record the tested PR merge
        id: receipt
        if: github.event_name == 'pull_request'
        run: python3 scripts/ci/reuse_validation.py record
      - name: Upload PR validation receipt
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.receipt.outputs.receipt }}
          path: ci-validation.txt
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  # Bootstrap preflight (D3). Verifies a clean runner can initialize the shared
  # toolchain, discover scope, and pass the canonical-recipe and scope-calc
  # guards on every selected OS BEFORE any package fans out. Matrix breadth
  # scales with change class: a package-local change runs the scope host plus
  # the runner OSes its environments land on; a global CI/tooling change runs
  # all three. Package jobs depend on this, so a broken bootstrap produces one
  # actionable failure per selected OS instead of dozens of package failures.
  # No `name:`. GitHub labels a matrix job it EXPANDS from the matrix values
  # (`preflight (ubuntu-latest)`) but never evaluates the matrix context for a
  # job it SKIPS, so a declared `name:` carrying `${{ matrix.os }}` reaches the
  # Checks tab as raw expression text. The default label degrades to the static,
  # human-readable job id instead (AC10).
  preflight:
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.preflight_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Verify toolchain and required tooling
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV
          cargo -V
          just --version
          cargo nextest --version
      # Proves a fresh checkout runs Cargo with no rustc wrapper at all. The
      # repository tracks none; RUSTC_WRAPPER is cleared explicitly so a stray
      # environment value cannot mask a broken clean-checkout path.
      - name: Cargo metadata without build acceleration
        shell: bash
        env:
          RUSTC_WRAPPER: ""
        run: cargo metadata --no-deps --format-version 1 >/dev/null
      - name: Validate canonical area recipes
        run: just check-canonical
      - name: Test the CI contract schemas
        run: python3 scripts/ci/test_schema.py
      - name: Test affected-scope calculation
        run: python3 scripts/ci/test_affected_scope.py
      - name: Test the resolved execution plan
        run: python3 scripts/ci/test_resolved_plan.py
      - name: Test local validation evidence
        run: python3 scripts/ci/test_local_evidence.py
      - name: Test multi-environment evidence reuse
        run: python3 scripts/ci/test_evidence_reuse.py
      - name: Test the execution-constraint store
        run: python3 scripts/ci/test_constraints.py
      - name: Test the accepted-gap publisher
        run: python3 scripts/ci/test_publish_gaps.py
      - name: Test PR validation reuse
        run: python3 scripts/ci/test_reuse_validation.py
      - name: Test runner-loss attribution and retry decision
        run: python3 scripts/ci/test_runner_loss.py

  # One caller identity per selected AREA — the top-level entry a reader sees
  # for the tested half of the run (AC2). The area's packages, their gates, and
  # its own rollup all live inside `_area-ci.yml` and render underneath it.
  #
  # No `name:`, for the reason `preflight` has none: this job carries `needs:`
  # and can therefore be skipped as a whole, and a skipped matrix job never has
  # its matrix context evaluated. The default label is `area-ci` when skipped
  # and `area-ci (claudine)` when it runs.
  #
  # No stage sits in front of the fan-out. A sampled canary was tried and
  # removed: gating on it erased 20 areas' evidence for one unrelated failure,
  # and un-gating it left a `needs:` edge that stalled the whole fan-out
  # whenever its scarcest leg could not get a runner. Each package now gates its
  # own tests on its own compile check, inside `_package-ci.yml`, where the
  # predictor is exact and cannot block anything it is unrelated to.
  area-ci:
    needs: [scope, preflight]
    if: >-
      !cancelled() &&
      needs.scope.outputs.has_packages == 'true'
    # A reusable workflow's GITHUB_TOKEN cannot exceed its CALLER's, so the
    # area rollup's `actions: read` (artifact overlay, jobs listing) and the
    # gap publisher's `checks: write` (accepted-gap check runs) have to be
    # granted here. This is a CAP, not a grant: it is the most any job in
    # `_area-ci.yml` may hold, and that workflow hands `checks: write` to its
    # `accepted-gaps` job alone while `package-ci` and `rollup` declare
    # read-only sets of their own.
    permissions:
      contents: read
      actions: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        # A plain vector, not `include:`. GitHub builds a skipped-and-then-run
        # job's label from the matrix values, and an `include:` of whole package
        # records would render that label as the record. The per-area package
        # matrix is looked up below instead.
        area: ${{ fromJSON(needs.scope.outputs.scheduled_areas) }}
    uses: ./.github/workflows/_area-ci.yml
    with:
      area: ${{ matrix.area }}
      slug: ${{ fromJSON(needs.scope.outputs.area_slugs)[matrix.area] }}
      packages: ${{ toJSON(fromJSON(needs.scope.outputs.area_matrix)[matrix.area]) }}
      accepted-gaps: ${{ contains(fromJSON(needs.scope.outputs.gap_areas), matrix.area) }}
    secrets: inherit

  # Specialized runtime contract (D12): orchestrated by the primary workflow,
  # selected from affected scope, so there is one CI run per commit instead of a
  # separate wall of path-triggered workflows. It preserves its unique runtime
  # evidence; shared bootstrap lives in the reusable workflow it calls.
  biscuit-tui-captured-stdout:
    name: biscuit-tui-captured-stdout
    needs: [scope, preflight]
    if: >-
      !cancelled() &&
      needs.scope.outputs.biscuit_tui == 'true'
    uses: ./.github/workflows/biscuit-tui-windows-captured-stdout.yml
    secrets: inherit

  # CI's own tooling — the merge-gate binary (`scripts/ci-rollup*.rs`), the
  # scope calculator (`scripts/ci/`), and the policy store (`.github/ci/`) —
  # is not a Cargo package, so a change to it selects nothing and would
  # otherwise exercise nothing. This leg runs their own test suites. Its
  # selection flag is derived by `affected_scope.py`, not hardcoded here.
  ci-tooling:
    name: ci-tooling (rollup + scope tests)
    needs: [scope, preflight]
    if: >-
      !cancelled() &&
      needs.scope.outputs.ci_tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@just
      - name: Test PR validation reuse
        run: python3 scripts/ci/test_reuse_validation.py
      - name: Test the CI contract schemas
        run: python3 scripts/ci/test_schema.py
      - name: Test the scope calculator
        run: python3 scripts/ci/test_affected_scope.py
      - name: Test the resolved execution plan
        run: python3 scripts/ci/test_resolved_plan.py
      - name: Test concurrency policy and local L2 routing
        run: python3 scripts/ci/test_ci_local.py
      - name: Test local validation evidence
        run: python3 scripts/ci/test_local_evidence.py
      - name: Test multi-environment evidence reuse
        run: python3 scripts/ci/test_evidence_reuse.py
      - name: Test the execution-constraint store
        run: python3 scripts/ci/test_constraints.py
      - name: Test the accepted-gap publisher
        run: python3 scripts/ci/test_publish_gaps.py
      # The workflow-contract suite is the evidence behind the workflow
      # invariants, but `test-toolkit` is `gates = false` (promotion pending),
      # so no area job schedules it. Run exactly that binary here; the flag
      # above also fires on workflow edits and on this file so a regression
      # the suite would catch cannot merge on a run that never invoked it.
      - name: Test the workflow contracts
        run: |
          export NEXTEST_TEST_THREADS="${NEXTEST_TEST_THREADS:-$(just _test_threads)}"
          cargo nextest run -p test-toolkit --test ci_workflow_contracts
      # `--no-default-features` deselects the crates the other two bins in
      # `scripts/` need and this one does not. Same shape as the area rollup's build.
      - name: Test the rollup and verdict
        run: |
          export NEXTEST_TEST_THREADS="${NEXTEST_TEST_THREADS:-$(just _test_threads)}"
          cargo nextest run \
            --manifest-path scripts/Cargo.toml \
            --no-default-features --bin ci-rollup
      # The plan renderer is `local-tools`-gated, so this one DOES link
      # biscuit-terminal and sniff. It runs here, in the leg that only fires
      # when CI tooling changed, and never in the always-runs rollup build.
      - name: Test the resolved-plan renderer
        run: |
          export NEXTEST_TEST_THREADS="${NEXTEST_TEST_THREADS:-$(just _test_threads)}"
          cargo nextest run --manifest-path scripts/Cargo.toml --bin ci-plan

  # THE single required branch-protection check: a policy-free fold.
  #
  # Every selected area already owns its outcome in `_area-ci.yml`'s `rollup`
  # job, which applies that area's baseline, governed gaps, and missing-cell
  # rule and nobody else's. This job re-evaluates NOTHING: its only step reads
  # `needs.*.result` for the jobs whose failure must block a merge and fails
  # unless every one is `success` or `skipped`. No `ci-rollup`, no baseline,
  # no plan, no artifact download — a second whole-run policy evaluation is
  # the global verdict specification section 5 removes, and it could
  # contradict a green area.
  #
  # The fold's semantics were proven in a scratch repository
  # (`fixes/2026-09-11-cicd-cleanup/fixtures/scratch-2026-09-12.md`):
  #
  #   - `skipped` is accepted BY DESIGN: an unselected area's job is skipped
  #     through its `if:` and must not hang the pull request. The same holds
  #     for every job downstream of a reused validation.
  #   - `failure` and `cancelled` block. A cancellation that interrupts a
  #     producer reaches this fold as `cancelled`; `if: always()` is what lets
  #     the fold run at all in that case, and when every producer failed.
  #   - MISSING (a cell the plan scheduled and no job produced) cannot be seen
  #     here: `needs` names static job ids, and a matrix that never created an
  #     area's job reads as `skipped`. The per-area rollup owns MISSING.
  #   - `continue-on-error` turns a failed job's `needs.<job>.result` into
  #     `success`, so it hides that failure from this fold. It is reserved for
  #     advisory jobs; no job listed below may carry it.
  #   - A failed TEST, LINT, or COMPILE COMMAND never reaches this fold as a
  #     red job. `_package-ci.yml` and `_wsl-ci.yml` run each gate command as
  #     a step-level `continue-on-error` and fold its outcome into the cell's
  #     status artifact, so `area-ci` stays green and the area's `rollup` is
  #     the ONLY job that can turn that failure into a block — after applying
  #     the area's baseline (review 6, finding 1). A producer job is still red,
  #     and `area-ci` with it, for setup, provisioning, upload, or
  #     cancellation, which no baseline may excuse.
  #
  # Ruleset `protect-your-bacon` (id 19747338) still names the context
  # `ci-verdict`. Until Ken switches it to `ci-gate` (Validation and Rollout
  # step 6, after this change's own run is green) every pull request shows
  # `ci-verdict — Expected` and cannot merge. Nothing here edits the ruleset.
  ci-gate:
    name: ci-gate
    # Every top-level job whose failure must block. Each package's gates are
    # nested inside `area-ci`'s `_area-ci.yml` → `_package-ci.yml` fan-out and
    # reach this list through their area's rollup. The advisory `summary` is
    # deliberately absent.
    needs:
      - validation
      - scope
      - preflight
      - area-ci
      - biscuit-tui-captured-stdout
      - ci-tooling
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fold the blocking jobs' results
        shell: bash
        env:
          RESULTS: |
            validation:${{ needs.validation.result }}
            scope:${{ needs.scope.result }}
            preflight:${{ needs.preflight.result }}
            area-ci:${{ needs.area-ci.result }}
            biscuit-tui-captured-stdout:${{ needs.biscuit-tui-captured-stdout.result }}
            ci-tooling:${{ needs.ci-tooling.result }}
        run: |
          set -euo pipefail
          blocking=""
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            job="${entry%%:*}"
            result="${entry##*:}"
            case "$result" in
              success|skipped) echo "$job: $result" ;;
              *)
                echo "$job: $result (blocks)"
                blocking="${blocking} ${job}"
                ;;
            esac
          done <<<"$RESULTS"
          if [ -n "$blocking" ]; then
            echo "ci-gate: blocked by${blocking}" >&2
            exit 1
          fi
          echo "ci-gate: every blocking job succeeded or was skipped"

  # Navigation aid for the jobs no area rollup can see, and ONLY those.
  #
  # `ci-rollup` covers every package in the run's resolved policy. It cannot
  # cover the bootstrap stages or the specialized workflows: those emit no
  # `manifest.jsonl`, and can never appear in an affected scope, so their
  # migrated baseline entries are reported `baseline-out-of-scope` and ignored
  # (plan 3.5 is what closes this). Without a line here they would fail
  # invisibly beside green areas.
  #
  # It deliberately makes NO run-level claim. The old "No gate reported a
  # failure" line was a green verdict computed from job results alone, which
  # cannot see a MISSING cell, a cancelled producer, or a baselined entry that
  # started passing — so it could and would contradict an area's rollup. Plan
  # success criterion 1 asks for a single view; that view is each area's
  # rollup grid.
  #
  # ADVISORY. This job always succeeds, and `continue-on-error: true` makes
  # that structural rather than a property of its script: `ci-gate` folds
  # `needs.*.result`, and `continue-on-error` is exactly what keeps a
  # reporting job's failure out of that fold. Every job that is allowed to
  # block is either a tested area's rollup or a named infrastructure gate.
  #
  # Two notes the retired whole-run verdict used to write live here now,
  # because both are reporting rather than judgement: the link to reused PR
  # validation, and the statement that a run scheduled no package. That is why
  # this job also runs on reuse, when every other downstream job is skipped.
  summary:
    name: infrastructure summary (advisory)
    needs:
      - validation
      - scope
      - preflight
      - biscuit-tui-captured-stdout
      - ci-tooling
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Reuse successful PR validation
        if: ${{ needs.validation.result == 'success' && needs.validation.outputs.reuse == 'true' }}
        shell: bash
        env:
          VALIDATED_RUN: ${{ needs.validation.outputs.run_id }}
        run: |
          {
            echo "## Reused PR validation"
            echo ""
            echo "**CLEAR** — this push has the same Git tree and integration base as successful PR validation, so every area job was skipped and \`ci-gate\` folds only skipped and successful jobs."
            echo ""
            echo "[Original validation]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$VALIDATED_RUN)"
          } >>"$GITHUB_STEP_SUMMARY"
      # Success criterion 7: a docs-only change schedules no test leg anywhere,
      # so no area rollup runs and nothing renders a grid. Stated out loud
      # rather than left as a silently green run.
      - name: No package was scheduled
        if: ${{ needs.validation.outputs.reuse != 'true' && needs.scope.result == 'success' && needs.scope.outputs.has_packages != 'true' }}
        shell: bash
        run: |
          {
            echo "## No package was scheduled"
            echo ""
            echo "The affected-scope calculation selected no package, so this run scheduled no test leg: there is no area rollup and no baseline comparison. \`ci-gate\` still folds the bootstrap jobs above."
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Classify the first actionable failure
        if: ${{ needs.validation.outputs.reuse != 'true' }}
        shell: bash
        env:
          # Listed in dependency order: an earlier stage's failure is the root
          # cause, and later stages were skipped or would only repeat it.
          # `area-ci` is absent on purpose — every package gate is a cell in its
          # own area's rollup.
          RESULTS: |
            bootstrap (scope calculation):${{ needs.scope.result }}
            bootstrap (preflight):${{ needs.preflight.result }}
            biscuit-tui Windows captured stdout:${{ needs.biscuit-tui-captured-stdout.result }}
            ci tooling (rollup and scope):${{ needs.ci-tooling.result }}
        run: |
          set -euo pipefail
          {
            echo ""
            echo "## Jobs outside the rollup"
            echo ""
          } >>"$GITHUB_STEP_SUMMARY"

          first=""
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            if [ "${entry##*:}" = "failure" ]; then
              first="${entry%:*}"
              break
            fi
          done <<<"$RESULTS"

          if [ -z "$first" ]; then
            echo "No bootstrap or specialized workflow failed. **The run's gate is \`ci-gate\`, not this line** — it folds every blocking job's result, and package results live in each area's rollup grid." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "**First actionable failure class: ${first}**"
            echo ""
            echo "This stage emits no result artifacts, so no area rollup can see it; \`ci-gate\` blocks on its result directly. Open that job first — later red jobs are usually the same root cause."
          } >>"$GITHUB_STEP_SUMMARY"
