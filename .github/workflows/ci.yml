name: ci

# Dependency-aware CI for pull requests and pushes to main. A main push reuses
# successful PR validation only with an identical tested tree and integration
# base; missing evidence falls back to the normal grid. Source-changed workspace
# packages receive every gate; an unchanged direct reverse dependency receives
# no area, no job, and no result cell, and is reported by name instead. The
# result is fanned out one caller identity per selected package AREA, with each
# area's packages underneath it, policy read from each manifest's
# `[package.metadata.ci]`, and environment capabilities from
# `.github/ci/environments.json`. Package stays the stored identity of every
# artifact, baseline entry, and receipt; area is a derived grouping.
#
# `pull_request` carries NO `branches:` filter on purpose. Restricting it to
# `main` meant a stacked pull request — one targeting another feature branch —
# created no `ci` run at all, so its changes reached `main` having never been
# validated on their own. Measured on PR #22, which targeted PR #21 and ran
# nothing but `pr-health` and Socket.
#
# This does not multiply work: `affected_scope.py` computes scope from the
# event's own base and head, so a stacked PR validates only its delta, and the
# concurrency group cancels superseded runs. `pr-health.yml` mirrors this
# applicability rule and a workflow-contract test keeps the two from drifting.
on:
  pull_request:
  push:
    branches: [main]
  # `measure-compiler-work` is the Phase 1 baseline switch of
  # `fixes/2026-09-12-single-os-compile/plan.md`. It is OFF for every ordinary
  # run — pull request, push, and an unattended dispatch alike — because it
  # builds one extra tool in each measured job and this repository tracks no
  # rustc wrapper. On, it sets `RUSTC_WRAPPER` on the measured Cargo/Nextest
  # command ALONE and publishes the compiler-work counts beside that cell's
  # existing status. It changes no cell, no artifact name, and no gate.
  workflow_dispatch:
    inputs:
      measure-compiler-work:
        description: "Count actual rustc invocations around each measured test command. Baseline collection only."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# THE tested revision, for the two jobs that run before a plan exists.
#
# `pull_request` checks out GitHub's MERGE branch by default — a commit GitHub
# recreates and never guarantees to be stable — while the plan is labelled with
# `github.event.pull_request.head.sha`. `ci-build` binds an archive to
# `plan.head` and refuses any other checkout (`build-source-mismatch`), so the
# default merge checkout left the owner unable to produce and every consumer
# unable to verify, and scope read `cargo metadata` from a revision the plan
# did not name. The PR head is immutable and is the revision the plan already
# names, so that is the one this run tests end to end. `github.sha` covers
# `push` and `workflow_dispatch`, which carry no pull-request payload;
# `_area-ci.yml` resolves its check-run SHA the same way.
#
# Once the plan exists this expression is not evaluated again: every later job
# checks out `needs.scope.outputs.head`, and every reusable workflow receives
# it as `tested-revision`. The document decides which checkout may produce and
# verify its archives, so the document is what downstream jobs read.
env:
  TESTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validation:
    name: Check reusable PR validation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.reuse.outcome == 'success' && steps.reuse.outputs.reuse || 'false' }}
      run_id: ${{ steps.reuse.outputs.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_REVISION }}
      - name: Verify prior PR validation
        id: reuse
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/reuse_validation.py check

  scope:
    name: Determine affected scope
    needs: validation
    # PR/manual runs and failed lookups fall back to normal scope calculation.
    if: ${{ !cancelled() && needs.validation.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      scheduled_areas: ${{ steps.scope.outputs.scheduled_areas }}
      area_matrix: ${{ steps.scope.outputs.area_matrix }}
      area_slugs: ${{ steps.scope.outputs.area_slugs }}
      gap_areas: ${{ steps.scope.outputs.gap_areas }}
      has_packages: ${{ steps.scope.outputs.has_packages }}
      packages: ${{ steps.scope.outputs.packages }}
      package_names: ${{ steps.scope.outputs.package_names }}
      full_scope: ${{ steps.scope.outputs.full_scope }}
      sniff: ${{ steps.scope.outputs.sniff }}
      preflight_os: ${{ steps.scope.outputs.preflight_os }}
      preflight_reason: ${{ steps.scope.outputs.preflight_reason }}
      change_class: ${{ steps.scope.outputs.change_class }}
      job_estimate: ${{ steps.scope.outputs.job_estimate }}
      area_drift: ${{ steps.scope.outputs.area_drift }}
      has_builds: ${{ steps.scope.outputs.has_builds }}
      build_artifacts: ${{ steps.scope.outputs.build_artifacts }}
      build_producers: ${{ steps.scope.outputs.build_producers }}
      build_owner_runners: ${{ steps.scope.outputs.build_owner_runners }}
      build_runners: ${{ steps.scope.outputs.build_runners }}
      # The plan's own `head`. Every job downstream of this one checks this
      # revision out, so a consumer's tree is the tree its archive was bound
      # to and `ci-build` has nothing to refuse.
      head: ${{ steps.scope.outputs.head }}
      # When the plan became available. Every owner leg's queue time is measured
      # against it: an owner cannot start before the plan that names it exists,
      # so this — not the run's own creation — is the moment it became
      # schedulable.
      plan_epoch: ${{ steps.plan_published.outputs.epoch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_REVISION }}
          fetch-depth: 0
      - name: Fetch local test evidence
        continue-on-error: true
        run: git fetch origin '+refs/notes/ci-local/*:refs/notes/ci-local/*'
      # No toolchain step here on purpose: the receipt path is Python and jq
      # end to end, and the calculate step materializes the pinned toolchain
      # itself, only when selection (and so `cargo metadata`) is about to run.
      - name: Calculate package and area scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          scope_args=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # A manual full run has no diff range. Its plan records the
            # all-zero "no such object" ID as the base, the same identity a
            # branch-creating push carries in `github.event.before`, and the
            # tested head; no receipt is verified against that pair.
            base="0000000000000000000000000000000000000000"
            head="$PUSH_HEAD"
            scope_args=(--all)
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$PR_BASE"
              head="$PR_HEAD"
            else
              base="$PUSH_BASE"
              head="$PUSH_HEAD"
            fi

            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              scope_args=(--all)
            else
              mapfile -d '' changed_files < <(git diff --name-only -z "$base" "$head")
              scope_args=(-- "${changed_files[@]}")
            fi
          fi

          # Ahead of the file list: after its `--` argparse reads everything,
          # options included, as a path.
          scope_args=(--plan-out resolved-plan.json --base "$base" --head "$head" "${scope_args[@]}")

          # A scope receipt on refs/notes/ci-local/scope that binds this
          # event's exact {base, head, tree} IS the plan: selection never runs
          # again for it, with or without validation evidence. Any miss — no
          # note, another schema, head, tree, or base, or a malformed document
          # — calculates scope exactly as before. A manual run and a
          # branch-creating push carry no comparison base and never consult
          # the note.
          local_scope=0
          scope_source="CI (no comparison base)"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            scope_source="CI (workflow_dispatch ignores local scope)"
          elif [[ -n "$base" && ! "$base" =~ ^0+$ ]]; then
            if python3 scripts/ci/local_evidence.py scope-verify \
                --base "$base" --head "$head" \
                --plan-out resolved-plan.json --scope-out scope.json \
                --reason-out scope-reason.txt; then
              local_scope=1
              scope_source="local (refs/notes/ci-local/scope @ ${head:0:9})"
            else
              reason="$(cat scope-reason.txt 2>/dev/null || true)"
              scope_source="CI fallback (${reason:-scope-verify failed})"
            fi
          fi
          if (( local_scope )); then
            scope_json="$(cat scope.json)"
          else
            # Selection reads `cargo metadata`, so this is the one place the
            # scope job needs Rust: a runner without the pinned toolchain
            # installs it here and nowhere else. A receipt hit never reaches
            # this branch — scope-verify, verify --cells, --apply-to, jq, and
            # the summary need no toolchain (R9: the valid-receipt path pays
            # for no Rust it does not use).
            rustup show
            scope_json="$(python3 scripts/ci/affected_scope.py "${scope_args[@]}")"
          fi
          evidence_failure=""
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            # Per CELL, across every environment's notes ref at once: a macOS
            # receipt and a prior WSL cross-check receipt both contribute.
            # Each accepted cell has its EXECUTION omitted while staying a
            # cell, so the rollup expects a local-origin result for it rather
            # than reporting MISSING (the PR #76 regression). Every refusal
            # carries a coded reason and is published with the plan.
            #
            # Evidence PROCESSING adds work, never removes it (R8): a verifier
            # that crashes or prints anything but a JSON list, or an overlay
            # that fails, leaves the plan in hand — the receipt's on a hit,
            # this run's calculation on a miss — exactly as it was, reuses no
            # cell, and says so in the summary and a warning annotation. The
            # overlay writes its result beside the plan and replaces it only
            # on success, so a crash mid-write cannot leave a half-written
            # resolved-plan.json for the fan-out.
            verifier_status=0
            python3 scripts/ci/local_evidence.py verify --cells \
              --plan resolved-plan.json \
              --base "$base" \
              --head "$head" \
              --rejections evidence-rejections.json > accepted-cells.json \
              || verifier_status=$?
            if (( verifier_status != 0 )); then
              evidence_failure="verifier failed (exit ${verifier_status})"
            elif ! jq -e 'type == "array"' accepted-cells.json >/dev/null 2>&1; then
              evidence_failure="verifier output is not a JSON list"
            elif [[ "$(jq -r 'length' accepted-cells.json)" != "0" ]] \
                || jq -e 'type == "array" and length > 0' evidence-rejections.json >/dev/null 2>&1; then
              # One evidence path for both scope sources: the accepted set is
              # overlaid on the plan already in hand and the projection is
              # re-derived from the result. `--apply-to` performs no
              # selection and reads nothing from the checkout, so a receipt's
              # areas, packages, gates, targets, features, and environment
              # policy reach the fan-out exactly as the hook resolved them.
              # A refusal with nothing accepted takes the same path, so an
              # all-rejected verification still publishes its coded reasons
              # as `evidence_rejections`; only a verification that saw no
              # evidence at all leaves the plan, and the planner, untouched.
              overlay_status=0
              overlaid_json="$(
                python3 scripts/ci/affected_scope.py \
                  --apply-to resolved-plan.json \
                  --accepted-cells accepted-cells.json \
                  --evidence-rejections evidence-rejections.json \
                  --plan-out applied-plan.json
              )" || overlay_status=$?
              if (( overlay_status == 0 )); then
                mv applied-plan.json resolved-plan.json
                scope_json="$overlaid_json"
              else
                evidence_failure="overlay failed (exit ${overlay_status})"
              fi
            fi
            if [[ -n "$evidence_failure" ]]; then
              # Nothing downstream may read a partial accepted set.
              printf '[]' > accepted-cells.json
              rm -f applied-plan.json
              echo "::warning title=CI scope::local evidence ${evidence_failure}; the plan runs unmodified and no cell is reused"
            fi
          fi
          packages="$(jq -c '.packages' <<<"$scope_json")"

          # The full scope document is also the rollup's policy source: it
          # carries every impacted package's resolved `[package.metadata.ci]`
          # policy (gating and `gates = false` alike). Uploaded as an artifact
          # so each area's coverage audit sees exactly what this run scheduled.
          printf '%s' "$scope_json" > scope.json

          # One caller identity per selected AREA, each carrying its own
          # ready-made package matrix. Grouping happens in the planner, not
          # here, so the shape has test coverage. There is no canary stage: the
          # compile check that gates each package's own tests is a cheaper and
          # strictly better predictor than a sample of two other packages, and
          # it cannot stall the fan-out because it runs inside it.

          {
            echo "scheduled_areas=$(jq -c '.scheduled_areas' <<<"$scope_json")"
            echo "area_matrix=$(jq -c '.area_matrix' <<<"$scope_json")"
            echo "area_slugs=$(jq -c '.area_slugs' <<<"$scope_json")"
            # The areas carrying an accepted policy gap, read from the PLAN
            # (the authority on cell state, receipt-carried or calculated)
            # so each area can decide whether to spend a runner on its gap
            # publisher. A skip hint only: the publisher reselects the cells
            # from the same plan, so a wrong `true` publishes nothing.
            echo "gap_areas=$(jq -c '[.cells[] | select(.state == "accepted-gap") | .area] | unique' resolved-plan.json)"
            echo "packages=$packages"
            echo "package_names=$(jq -c '.packages' <<<"$scope_json")"
            # Derived from the MATRIX, not the impacted list: a change touching
            # only `gates = false` packages impacts packages but schedules none,
            # and an empty area matrix under `has_packages=true` fails the
            # fan-out at strategy evaluation. `scheduled_areas` is a regrouping
            # of the same matrix, so the two can never disagree.
            echo "has_packages=$(jq -r '.matrix | length > 0' <<<"$scope_json")"
            echo "full_scope=$(jq -r '.full_scope' <<<"$scope_json")"
            echo "sniff=$(jq -r '.flags.sniff' <<<"$scope_json")"
            echo "area_drift=$(jq -r '.flags.area_drift' <<<"$scope_json")"
            echo "job_estimate=$(jq -r '.job_estimate' <<<"$scope_json")"
            echo "preflight_os=$(jq -c '.preflight_os' <<<"$scope_json")"
            echo "preflight_reason=$(jq -r '.preflight_reason' <<<"$scope_json")"
            echo "change_class=$(jq -r '.change_class' <<<"$scope_json")"
            # Scheduling is a projection of the plan's producer owners.
            echo "has_builds=$(jq -r '.build_artifacts | length > 0' <<<"$scope_json")"
            echo "build_producers=$(jq -c '[.build_owners[].environment]' <<<"$scope_json")"
            echo "build_owner_runners=$(jq -c '[.build_owners[] | {key: .environment, value: .runner}] | from_entries' <<<"$scope_json")"
            echo "build_artifacts=$(jq -c '.build_artifacts' <<<"$scope_json")"
            echo "build_runners=$(jq -c '.build_runners' <<<"$scope_json")"
            # Read back from the WRITTEN plan, not from `$head`: every later
            # checkout in this run is this value, and `ci-build` refuses any
            # checkout that is not `plan.head`.
            echo "head=$(jq -r '.head' resolved-plan.json)"
          } >>"$GITHUB_OUTPUT"

          # Evidence provenance, read from the WRITTEN plan (the authority on
          # what was reused) rather than from the verifier's transient files,
          # so the rows describe exactly what the fan-out will see — on an
          # evidence-processing failure that is the unmodified plan, and the
          # rows honestly read `none`. The verifier does not report which
          # refs it walked; it walks every fetched `refs/notes/ci-local/<env>`
          # ref, so those are the environments listed as consulted, and the
          # reused cells' environments are the ones that matched. A rejection
          # names one candidate note (or one cell of it), not a plan cell, so
          # the retained row counts them by code; the full texts ride in the
          # plan artifact's `evidence_rejections`.
          reuse_row='def cells(f): [.cells[] | select(f)
            | "\(.package)/\(.environment)/\(.gate)"]
            | if length == 0 then "none" else "\(length): \(join(", "))" end;'
          reused_passing="$(jq -r "$reuse_row"' cells(.execution == "reuse" and .evidence.outcome == "pass")' resolved-plan.json)"
          retained="$(jq -r '(.evidence_rejections // []) as $rejections
            | if ($rejections | length) == 0 then "none"
              else "\($rejections | length) rejection(s): \(
                [$rejections[] | split(":")[0]] | group_by(.) | map("\(.[0]) (\(length))") | join(", "))"
              end' resolved-plan.json)"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            validation_environments="n/a (workflow_dispatch runs no verifier)"
          else
            consulted="$(git for-each-ref --format='%(refname:strip=3)' 'refs/notes/ci-local/' \
              | jq -Rrs '[split("\n")[] | select(length > 0 and . != "scope")] | join(", ")')"
            matched="$(jq -r '[.cells[] | select(.execution == "reuse") | .environment] | unique | join(", ")' resolved-plan.json)"
            if [[ -z "$consulted" ]]; then
              validation_environments="none"
            else
              validation_environments="consulted: ${consulted}; matched: ${matched:-none}"
            fi
          fi

          # One actionable scope summary (D15).
          {
            echo "## CI scope"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| event | ${EVENT_NAME} |"
            echo "| scope source | ${scope_source} |"
            if [[ -n "$evidence_failure" ]]; then
              echo "| evidence processing | ${evidence_failure}; no cell reused |"
            fi
            echo "| validation environments | ${validation_environments} |"
            echo "| reused passing cells | ${reused_passing} |"
            echo "| cells retained (evidence incomplete or rejected) | ${retained} |"
            echo "| change class | $(jq -r '.change_class' <<<"$scope_json") |"
            echo "| full scope | $(jq -r '.full_scope' <<<"$scope_json") |"
            echo "| full-scope gates | $(jq -rc '.full_scope_gates | join(", ")' <<<"$scope_json") |"
            echo "| reason | $(jq -r '.preflight_reason' <<<"$scope_json") |"
            echo "| preflight OS | $(jq -rc '.preflight_os | join(", ")' <<<"$scope_json") |"
            echo "| selected areas | $(jq -rc '[.areas[].area] | join(", ")' <<<"$scope_json") |"
            echo "| areas that fan out | $(jq -rc '.scheduled_areas | join(", ")' <<<"$scope_json") |"
            echo "| affected packages | $(jq -r '.packages | length' <<<"$scope_json") |"
            echo "| source-changed packages | $(jq -rc '.source_packages | join(", ")' <<<"$scope_json") |"
            echo "| reported (unselected) reverse dependencies | $(jq -rc '.reverse_dependencies | join(", ")' <<<"$scope_json") |"
            echo "| gating packages (matrix) | $(jq -r '.matrix | length' <<<"$scope_json") |"
            echo "| expanded job estimate | $(jq -r '.job_estimate' <<<"$scope_json") |"
            echo "| toolchain | $(grep '^channel' rust-toolchain.toml | cut -d'"' -f2) |"
          } >>"$GITHUB_STEP_SUMMARY"
      # The policy artifact the rollup reads. Small, and retention is short:
      # it describes one run's scope, nothing else.
      - name: Upload the resolved package policy
        uses: actions/upload-artifact@v6
        with:
          name: ci-scope
          path: scope.json
          retention-days: 3
          if-no-files-found: error

      # The canonical plan, beside the legacy projection derived from it.
      # `ci-rollup` reads it: it is the only document that says which cells a
      # receipt already satisfied, and expecting a CI result for one of those
      # is the PR #76 seven-cell MISSING regression. The projection still
      # carries the area fan-out this workflow consumes, so it stays until
      # those consumers read `cells[]` directly.
      - name: Upload the resolved execution plan
        uses: actions/upload-artifact@v6
        with:
          name: ci-resolved-plan
          path: resolved-plan.json
          retention-days: 3
          if-no-files-found: error

      - name: Mark the plan as published
        id: plan_published
        shell: bash
        run: echo "epoch=$(date +%s)" >>"$GITHUB_OUTPUT"

      - name: Record the tested PR head
        id: receipt
        if: github.event_name == 'pull_request'
        run: python3 scripts/ci/reuse_validation.py record
      - name: Upload PR validation receipt
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.receipt.outputs.receipt }}
          path: ci-validation.txt
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  # Bootstrap preflight (D3). Verifies a clean runner can initialize the shared
  # toolchain, discover scope, and pass the canonical-recipe guard on every
  # selected OS BEFORE any package fans out. Prerequisites ONLY: CI's own test
  # suites are owned by `repo-deps` and `test-toolkit` and run in those
  # packages' own cells, so a suite here would be a second scheduler for work
  # the plan already placed. Matrix breadth scales with change class: a
  # package-local change runs the scope host plus the runner OSes its
  # environments land on; a full-scope request runs all three; a change that
  # selects no gating package establishes nothing and runs none. Package jobs
  # depend on this, so a broken bootstrap produces one actionable failure per
  # selected OS instead of dozens of package failures.
  #
  # The `if:` is a SCALAR guard read before matrix expansion, not a reliance on
  # GitHub's empty-matrix handling: an empty `preflight_os` resolves this job to
  # `skipped` immediately after `scope`, which `ci-gate` accepts and `area-ci`'s
  # `!cancelled()` still admits. `needs.scope.result == 'success'` restores what
  # the implicit `success()` provided before the guard existed — a skipped
  # `scope` publishes an empty string, not `[]`, and `fromJSON('')` raises.
  #
  # No `name:`. GitHub labels a matrix job it EXPANDS from the matrix values
  # (`preflight (ubuntu-latest)`) but never evaluates the matrix context for a
  # job it SKIPS, so a declared `name:` carrying `${{ matrix.os }}` reaches the
  # Checks tab as raw expression text. The default label degrades to the static,
  # human-readable job id instead (AC10).
  preflight:
    needs: scope
    if: >-
      needs.scope.result == 'success' &&
      needs.scope.outputs.preflight_os != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.preflight_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.scope.outputs.head }}
          fetch-depth: 0
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Verify toolchain and required tooling
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV
          cargo -V
          just --version
          cargo nextest --version
      # Proves a fresh checkout runs Cargo with no rustc wrapper at all. The
      # repository tracks none; RUSTC_WRAPPER is cleared explicitly so a stray
      # environment value cannot mask a broken clean-checkout path.
      - name: Cargo metadata without build acceleration
        shell: bash
        env:
          RUSTC_WRAPPER: ""
        run: cargo metadata --no-deps --format-version 1 >/dev/null
      - name: Validate canonical area recipes
        run: just check-canonical

  # One runner per producer, with separate package invocations sharing its
  # target tree. Artifact publication retains the plan's per-package names.
  build:
    needs: [scope, preflight]
    # A boolean, exactly as `area-ci` reads `has_packages`. A skipped scope job
    # (the reuse path) leaves every output EMPTY, and an emptiness test against
    # `'[]'` would read as "there are builds" and fan out over `fromJSON('')`.
    if: >-
      !cancelled() &&
      needs.scope.outputs.has_builds == 'true'
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.scope.outputs.build_producers) }}
    runs-on: ${{ fromJSON(needs.scope.outputs.build_owner_runners)[matrix.build] }}
    timeout-minutes: 60
    env:
      # The repository tracks no rustc wrapper. The producer is the one job in
      # the run that compiles the package under test, so a stray value here
      # would reach every consumer's binaries at once.
      RUSTC_WRAPPER: ""
      NEXTEST_PROFILE: ci
      COLORTERM: truecolor
    steps:
      # Queue clock. `plan_epoch` is when this leg became schedulable; the
      # difference is the time it spent waiting for a runner, which the
      # reporting contract requires apart from compile and upload.
      - name: Mark the owner's start
        id: job_start
        shell: bash
        run: echo "epoch=$(date +%s)" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.scope.outputs.head }}
      - name: Download the resolved package policy
        uses: actions/download-artifact@v7
        with:
          name: ci-scope
          path: ci-artifacts/ci-scope
      - name: Download the resolved execution plan
        uses: actions/download-artifact@v7
        with:
          name: ci-resolved-plan
          path: ci-artifacts/ci-resolved-plan
      - name: Resolve this owner's build records
        id: slice
        shell: bash
        env:
          PRODUCER: ${{ matrix.build }}
        run: |
          set -euo pipefail
          owner="$(jq -ce --arg producer "$PRODUCER" \
            '.build_owners[] | select(.environment == $producer)' \
            ci-artifacts/ci-scope/scope.json)"
          {
            echo "producer=$PRODUCER"
            echo "native=$(jq -c '.native' <<<"$owner")"
          } >>"$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install artifact transport
        run: npm ci --prefix scripts/ci/artifacts --ignore-scripts --no-audit --no-fund
      - name: Install just
        uses: extractions/setup-just@v4
      # The union of `[package.metadata.ci.native]` across this record's build
      # closure, as the planner computed it for THIS producer's runner label. A
      # consumer installs its own runtime requirements separately: what the
      # archive needs to LINK and what its tests need to RUN are not the same
      # list.
      - name: Install native prerequisites
        shell: bash
        env:
          NATIVE: ${{ steps.slice.outputs.native }}
        run: |
          set -euo pipefail
          native_args=()
          while IFS= read -r package; do
            if [ -n "$package" ]; then native_args+=("$package"); fi
          done < <(jq -r '.[]' <<<"$NATIVE")
          if [ ${#native_args[@]} -gt 0 ]; then
            just _ensure-native-libs "${native_args[@]}"
          fi
      - name: Set up the pinned Rust toolchain
        run: rustup show
      # The producer cache. Both workspaces in one entry: `scripts/` builds the
      # producer tool itself and has no cache of its own anywhere else in this
      # workflow, and a second `rust-cache` step would install a second post-job
      # save racing the first.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: build-owner-${{ steps.slice.outputs.producer }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      # `--no-default-features --features build-tools` keeps `sniff` — and so
      # duckdb and gix — out of the producer tool. Same shape as the coverage
      # audit's `ci-rollup` build.
      - name: Build the producer tool
        shell: bash
        run: |
          cargo build --release \
            -p repo-deps \
            --no-default-features --features build-tools --bin ci-build
      - name: Produce the archives
        id: produce
        shell: bash
        env:
          MEASURE: ${{ inputs.measure-compiler-work && 'true' || 'false' }}
          PRODUCER: ${{ matrix.build }}
        run: bash scripts/ci/produce-owner.sh
      - name: Publish package builds and statuses
        if: ${{ always() }}
        uses: actions/github-script@v8
        env:
          PRODUCER: ${{ matrix.build }}
          JOB_STATUS: ${{ job.status }}
          PLAN_EPOCH: ${{ needs.scope.outputs.plan_epoch }}
          JOB_EPOCH: ${{ steps.job_start.outputs.epoch }}
        with:
          script: |
            const path = require('node:path');
            const fs = require('node:fs');
            const root = process.env.GITHUB_WORKSPACE;
            const {DefaultArtifactClient} = require(path.join(root, 'scripts/ci/artifacts/node_modules/@actions/artifact'));
            const {publish} = require(path.join(root, 'scripts/ci/artifacts/publish.cjs'));
            const client = new DefaultArtifactClient();
            const ok = await publish({
              plan: JSON.parse(fs.readFileSync('ci-artifacts/ci-resolved-plan/resolved-plan.json', 'utf8')),
              producer: process.env.PRODUCER,
              out: path.join(process.env.RUNNER_TEMP, 'build'),
              verifier: path.join(root, 'target/release/ci-build' + (process.platform === 'win32' ? '.exe' : '')),
              jobStatus: process.env.JOB_STATUS,
              queueSeconds: process.env.PLAN_EPOCH && process.env.JOB_EPOCH
                ? Number(process.env.JOB_EPOCH) - Number(process.env.PLAN_EPOCH) : undefined,
              upload: (...args) => client.uploadArtifact(...args),
            });
            if (!ok) core.setFailed('One or more package builds could not be published');

  # One caller identity per selected AREA — the top-level entry a reader sees
  # for the tested half of the run (AC2). The area's packages, their gates, and
  # its own rollup all live inside `_area-ci.yml` and render underneath it.
  #
  # No `name:`, for the reason `preflight` has none: this job carries `needs:`
  # and can therefore be skipped as a whole, and a skipped matrix job never has
  # its matrix context evaluated. The default label is `area-ci` when skipped
  # and `area-ci (claudine)` when it runs.
  #
  # `has_packages` is the scalar guard, read before matrix expansion for the
  # reason `preflight_os` is: a run that schedules no area resolves this job
  # immediately after `scope` instead of expanding an empty matrix. It is
  # derived from the MATRIX rather than the impacted package list, so a change
  # touching only `gates = false` packages skips here rather than failing at
  # strategy evaluation.
  #
  # No stage sits in front of the fan-out. A sampled canary was tried and
  # removed: gating on it erased 20 areas' evidence for one unrelated failure,
  # and un-gating it left a `needs:` edge that stalled the whole fan-out
  # whenever its scarcest leg could not get a runner. Each package now gates its
  # own tests on its own compile check, inside `_package-ci.yml`, where the
  # predictor is exact and cannot block anything it is unrelated to.
  area-ci:
    # `build` is a WAIT, not a gate: a consumer must not start before its
    # archive exists, and `!cancelled()` is what keeps one failed owner leg from
    # skipping every area. A cell whose build failed reports the named build
    # record through its own verification step and its area's rollup; an area
    # whose packages are unrelated to the failed key proceeds untouched.
    needs: [scope, preflight, build]
    if: >-
      !cancelled() &&
      needs.scope.outputs.has_packages == 'true'
    # A reusable workflow's GITHUB_TOKEN cannot exceed its CALLER's, so the
    # area coverage audit's `actions: read` (artifact overlay, jobs listing) and the
    # gap publisher's `checks: write` (accepted-gap check runs) have to be
    # granted here. This is a CAP, not a grant: it is the most any job in
    # `_area-ci.yml` may hold, and that workflow hands `checks: write` to its
    # `accepted-gaps` job alone while `package-ci` and `coverage-audit` declare
    # read-only sets of their own.
    permissions:
      contents: read
      actions: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        # A plain vector, not `include:`. GitHub builds a skipped-and-then-run
        # job's label from the matrix values, and an `include:` of whole package
        # records would render that label as the record. The per-area package
        # matrix is looked up below instead.
        area: ${{ fromJSON(needs.scope.outputs.scheduled_areas) }}
    uses: ./.github/workflows/_area-ci.yml
    with:
      tested-revision: ${{ needs.scope.outputs.head }}
      area: ${{ matrix.area }}
      slug: ${{ fromJSON(needs.scope.outputs.area_slugs)[matrix.area] }}
      packages: ${{ toJSON(fromJSON(needs.scope.outputs.area_matrix)[matrix.area]) }}
      accepted-gaps: ${{ contains(fromJSON(needs.scope.outputs.gap_areas), matrix.area) }}
      # `inputs` is null on every event but `workflow_dispatch`, and
      # `null == true` is false — so this is `false` for a pull request and a
      # push without needing an event-name guard.
      measure-compiler-work: ${{ inputs.measure-compiler-work == true }}
    secrets: inherit

  # AC15 makes `sniff` the authority on package areas: `affected_scope.py`
  # replicates sniff's rule and owns no mapping of its own. Nothing but this
  # contract notices when the two diverge — a stale rule fans work out to the
  # wrong area and every other check stays green — and no fixture can stand in
  # for it, because asking the other tool is the whole point.
  #
  # It is a job of its own rather than a companion suite of `repo-deps` for two
  # reasons. A release `sniff-cli` costs 1m39s warm and 4m25s cold (measured on
  # a 16-core M4 at four Cargo jobs; `reviews/2026-09-15-python-test-code/
  # spike-4-results.md`), and `repo-deps`' own cell is an archive consumer that
  # compiles nothing; and building a workspace package inside that cell would
  # turn the planner's own gate red for a sniff compile error, which is not
  # what it reports. Its own `area_drift` flag —
  # sniff, the planner, the contract suite, and every package manifest —
  # confines the cost to the pull requests that can actually move either side
  # of the equivalence. `ci-gate` folds `skipped` as a pass, so every other
  # pull request pays nothing and is blocked by nothing.
  area-drift:
    name: area-drift (planner areas match sniff)
    needs: [scope, preflight]
    if: >-
      !cancelled() &&
      needs.scope.outputs.area_drift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The repository tracks no rustc wrapper; cleared explicitly so a stray
      # environment value cannot silently intercept this job's build.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.scope.outputs.head }}
      - name: Set up the pinned Rust toolchain
        run: rustup show
      # No native-prerequisites step: nothing in sniff-cli's build closure
      # declares `[package.metadata.ci.native]`, and this workflow's build
      # owner compiles every package on this runner from that same union.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: area-drift
      - name: Build the area authority
        run: cargo build -p sniff-cli --release
      # The class holds the three sniff contracts plus the four pure-planner
      # area fixtures; running the class rather than the file keeps this job's
      # red confined to area derivation. `BISCUIT_REQUIRE_SNIFF` is what makes
      # the run honest: with it set, an absent binary fails `require_sniff()`
      # instead of skipping three tests green.
      - name: Enforce the planner's area mapping against sniff
        env:
          BISCUIT_REQUIRE_SNIFF: "1"
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/target/release:${PATH}"
          sniff --version
          python3 scripts/ci/test_resolved_plan.py AreaGroupingTests


  # THE single required branch-protection check: a policy-free fold.
  #
  # Every selected area already owns its coverage audit in `_area-ci.yml`.
  # That job applies the area's skip baseline, governed gaps, and missing-cell
  # rule only when producers are otherwise green. This job re-evaluates
  # NOTHING: its only step reads
  # `needs.*.result` for the jobs whose failure must block a merge and fails
  # unless every one is `success` or `skipped`. No `ci-rollup`, no baseline,
  # no plan, no artifact download — a second whole-run policy evaluation is
  # the global verdict specification section 5 removes, and it could
  # contradict a green area.
  #
  # The fold's semantics were proven in a scratch repository
  # (`fixes/2026-09-11-cicd-cleanup/fixtures/scratch-2026-09-12.md`):
  #
  #   - `skipped` is accepted BY DESIGN: an unselected area's job is skipped
  #     through its `if:` and must not hang the pull request. The same holds
  #     for every job downstream of a reused validation.
  #   - `failure` and `cancelled` block. A cancellation that interrupts a
  #     producer reaches this fold as `cancelled`; `if: always()` is what lets
  #     the fold run at all in that case, and when every producer failed.
  #   - MISSING (a cell the plan scheduled and no job produced) cannot be seen
  #     here: `needs` names static job ids, and a matrix that never created an
  #     area's job reads as `skipped`. The per-area coverage audit owns MISSING.
  #   - `continue-on-error` turns a failed job's `needs.<job>.result` into
  #     `success`, so it hides that failure from this fold. It is reserved for
  #     advisory jobs; no job listed below may carry it.
  #   - A failed TEST, LINT, or COMPILE COMMAND fails its producer job. Matrix
  #     strategies disable fail-fast, and status/report steps still run when
  #     possible, so sibling OS cells finish and the coverage audit retains the
  #     detailed diagnosis. The failed reusable workflow reaches this fold as
  #     `failure` without relying on the coverage audit to reveal it.
  #
  # This job's name IS the required context on ruleset `protect-your-bacon`
  # (id 19747338), as of 2026-09-13. Renaming it silently un-gates merges:
  # branch protection would wait on a context nothing reports. Change the
  # ruleset first.
  ci-gate:
    name: ci-gate
    # Every top-level job whose failure must block. Each package's gates are
    # nested inside `area-ci`'s `_area-ci.yml` → `_package-ci.yml` fan-out and
    # reach this list through the area workflow. The advisory `ci-reporting`
    # is deliberately absent.
    needs:
      - validation
      - scope
      - preflight
      # INFRASTRUCTURE, not a cell. A build that failed to COMPILE is already
      # visible where cell outcomes live: the rollup renders every dependent
      # cell MISSING and names the record. What no cell can show is an owner
      # that never reached a compile — a lost runner, a cancellation, an
      # archive that could not be uploaded — so the owner's own result is
      # folded here. It publishes no `status-`/JUnit artifact of its own, and
      # `continue-on-error` (which would hide it) is forbidden on it.
      - build
      - area-ci
      - area-drift
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fold the blocking jobs' results
        shell: bash
        env:
          RESULTS: |
            validation:${{ needs.validation.result }}
            scope:${{ needs.scope.result }}
            preflight:${{ needs.preflight.result }}
            build:${{ needs.build.result }}
            area-ci:${{ needs.area-ci.result }}
            area-drift:${{ needs.area-drift.result }}
        run: |
          set -euo pipefail
          blocking=""
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            job="${entry%%:*}"
            result="${entry##*:}"
            case "$result" in
              success|skipped) echo "$job: $result" ;;
              *)
                echo "$job: $result (blocks)"
                blocking="${blocking} ${job}"
                ;;
            esac
          done <<<"$RESULTS"
          if [ -n "$blocking" ]; then
            echo "ci-gate: blocked by${blocking}" >&2
            exit 1
          fi
          echo "ci-gate: every blocking job succeeded or was skipped"

  # The run's reader-facing account of itself, in exactly three modes
  # (specification section 6): a reused whole-PR validation, a successful scope,
  # or a bootstrap that failed or was cancelled. Each step below belongs to one
  # of them, and the guards are exclusive AND exhaustive: for any combination of
  # the validation result, its reuse output, and the scope result, exactly one
  # mode speaks.
  #
  # It deliberately makes NO run-level claim. The old "No gate reported a
  # failure" line was a green verdict computed from job results alone, which
  # cannot see a MISSING cell, a cancelled producer, or a baselined entry that
  # started passing — so it could and would contradict an area's audit. Plan
  # success criterion 1 asks for a single view; that view is each area's
  # rollup grid.
  #
  # The successful-scope mode reads the plan and the per-area `ci-results-*`
  # slices through `ci-rollup summarize`, which is the same typed model the
  # areas wrote. Parsing the raw JUnit artifacts here would build a second
  # result model that could disagree with the area that produced them (D7).
  #
  # ADVISORY. This job always succeeds, and `continue-on-error: true` makes
  # that structural rather than a property of its script: `ci-gate` folds
  # `needs.*.result`, and `continue-on-error` is exactly what keeps a
  # reporting job's failure out of that fold. Every job that is allowed to
  # block is either a tested area's workflow or a named infrastructure gate.
  #
  # `needs` waits for the whole run, `ci-gate` included, so the report is
  # written once the decision it declines to make has been taken. `area-ci` is
  # waited on for its slices and never read as a result: each package gate is a
  # cell in its own area's coverage audit. On reuse every one of those is
  # skipped, which is why this job also runs then.
  ci-reporting:
    name: ci-reporting (advisory)
    needs:
      - validation
      - scope
      - area-ci
      - ci-gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Reuse successful PR validation
        if: ${{ needs.validation.result == 'success' && needs.validation.outputs.reuse == 'true' }}
        shell: bash
        env:
          VALIDATED_RUN: ${{ needs.validation.outputs.run_id }}
        run: |
          {
            echo "## Reused PR validation"
            echo ""
            echo "This push has the same Git tree and integration base as a successful PR validation."
            echo ""
            echo "This run executed no package cell; the authoritative results are the linked run's."
            echo ""
            echo "[Original validation]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$VALIDATED_RUN)"
          } >>"$GITHUB_STEP_SUMMARY"
      # --- mode 2: a successful scope --------------------------------------
      - name: Check out the repository
        if: ${{ needs.validation.outputs.reuse != 'true' && needs.scope.result == 'success' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.scope.outputs.head }}
      - name: Download the resolved execution plan
        if: ${{ needs.validation.outputs.reuse != 'true' && needs.scope.result == 'success' }}
        uses: actions/download-artifact@v7
        with:
          name: ci-resolved-plan
          path: ci-artifacts/ci-resolved-plan
      # A run that scheduled no package produces no slice, and a pattern that
      # matches nothing is that run's answer rather than an error — the report
      # states the absence. Every area uploads its slice under `always()`, so a
      # missing one here means the area never started.
      - name: Download this run's area result slices
        if: ${{ needs.validation.outputs.reuse != 'true' && needs.scope.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: 'ci-results-*'
          path: ci-artifacts
          merge-multiple: false
      - name: Set up the pinned Rust toolchain
        if: ${{ needs.validation.outputs.reuse != 'true' && needs.scope.result == 'success' }}
        run: rustup show
      # `--no-default-features` deselects biscuit-terminal, sniff, and
      # cargo_metadata, which this bin does not need. Measured: ~8s versus 40s+.
      - name: Build ci-rollup
        if: ${{ needs.validation.outputs.reuse != 'true' && needs.scope.result == 'success' }}
        run: |
          cargo build --release \
            -p repo-deps \
            --no-default-features --bin ci-rollup
      # One reader-facing report from the two documents the run already wrote:
      # the plan (what changed, whom it reached) and each area's own result
      # slice (what was measured). It applies no baseline, gap, missing-cell, or
      # merge policy, and it states when a run required no package test.
      - name: Render the run report
        if: ${{ needs.validation.outputs.reuse != 'true' && needs.scope.result == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r slice; do
            [ -n "$slice" ] || continue
            args+=(--results "$slice")
          done < <(find ci-artifacts -type f -path 'ci-artifacts/ci-results-*/*.json' | sort)
          ./target/release/ci-rollup summarize \
            --plan ci-artifacts/ci-resolved-plan/resolved-plan.json \
            "${args[@]}"
      # --- mode 3: a failed or cancelled bootstrap -------------------------
      # Spelled as the negation of modes 1 and 2 rather than as a condition of
      # its own, because the three modes have to be exhaustive as well as
      # exclusive and a hand-rolled third condition drops whatever neither of
      # the other two happens to cover. The previous `reuse != 'true'` did both:
      # it doubled up with mode 2 on every successful scope, and it left the run
      # with no report at all when a reuse-marked validation did not itself
      # succeed.
      - name: Classify the first actionable failure
        if: ${{ !(needs.validation.result == 'success' && needs.validation.outputs.reuse == 'true') && !(needs.validation.outputs.reuse != 'true' && needs.scope.result == 'success') }}
        shell: bash
        env:
          # Listed in dependency order: an earlier stage's failure or
          # cancellation is the root cause, and later stages were skipped or
          # would only repeat it. `area-ci` is absent on purpose — every package
          # gate is a cell in its own area's coverage audit.
          RESULTS: |
            bootstrap (reuse check):${{ needs.validation.result }}
            bootstrap (scope calculation):${{ needs.scope.result }}
        run: |
          set -euo pipefail
          {
            echo ""
            echo "## Jobs outside the rollup"
            echo ""
          } >>"$GITHUB_STEP_SUMMARY"

          first=""
          state=""
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            stage="${entry%:*}"
            result="${entry##*:}"
            echo "- ${stage}: ${result}" >>"$GITHUB_STEP_SUMMARY"
            if [ -z "$first" ]; then
              case "$result" in
                failure) first="$stage"; state="failed" ;;
                cancelled) first="$stage"; state="cancelled" ;;
              esac
            fi
          done <<<"$RESULTS"
          echo "" >>"$GITHUB_STEP_SUMMARY"

          if [ -z "$first" ]; then
            echo "No bootstrap stage failed or was cancelled, yet the scope calculation did not succeed, so this run scheduled no package cell. **The run's gate is \`ci-gate\`, not this line** — it folds every blocking job's result, including \`preflight\`, and package results live in each area's coverage-audit grid." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "**First actionable failure class: ${first} (${state})**"
            echo ""
            echo "This stage emits no result artifacts, so no area coverage audit can see it; \`ci-gate\` blocks on its result directly. Open that job first — later red jobs are usually the same root cause."
          } >>"$GITHUB_STEP_SUMMARY"
