name: area-ci

# Reusable CI building block for a single curated package area.
#
# Every per-area workflow calls this via `workflow_call` so platform behavior
# stays uniform across the monorepo instead of accreting per-area. See
# `docs/testing-strategy.md` → "Platform Coverage (CI)" for the policy this
# encodes (macOS compile-check only, full L1 on Linux + Windows, kache on the
# non-Windows legs, nextest sharding for heavy areas).

on:
  workflow_call:
    inputs:
      area:
        description: "Area directory, used for `cd` and cache keys (e.g. darkmatter)."
        type: string
        required: true
      check-args:
        description: "Args for the macOS compile-check `cargo check --all-targets` (e.g. '-p darkmatter -p darkmatter-cli')."
        type: string
        required: true
      full-os:
        description: "JSON array of OSes that run the full L1 suite."
        type: string
        default: '["ubuntu-latest", "windows-latest"]'
      check-os:
        description: "JSON array of OSes that only compile-check."
        type: string
        default: '["macos-latest"]'
      shards:
        description: 'JSON array of nextest partition specs; ["1/1"] means no sharding (e.g. ["1/4","2/4","3/4","4/4"]).'
        type: string
        default: '["1/1"]'
      soft-os:
        description: "JSON array of test-leg OSes whose failures are non-blocking (continue-on-error). Used to roll a platform in without gating merges until it is green."
        type: string
        default: '["windows-latest"]'
      l2:
        description: "Run the real-terminal (L2) tier on the Linux leg."
        type: boolean
        default: false
      browser:
        description: "Run the browser tier on the Linux leg."
        type: boolean
        default: false
      kache:
        description: "Enable the kache RUSTC_WRAPPER (GitHub Actions cache backend) on non-Windows legs."
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Force TrueColor on headless runners so styled output matches local dev.
  COLORTERM: truecolor

jobs:
  # macOS floor: compile only. macOS runner minutes bill ~10x Linux, so we catch
  # `cfg(target_os = "macos")` compile drift here without paying for a full run.
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.check-os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable kache
        if: ${{ inputs.kache && runner.os != 'Windows' }}
        uses: kunobi-ninja/kache-action@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: area-ci-${{ inputs.area }}-check-${{ matrix.os }}
      - name: cargo check --all-targets
        run: cargo check --all-targets ${{ inputs.check-args }}

  # Full L1 suite on the higher-risk platforms (Linux + Windows), optionally
  # sharded across parallel jobs via nextest `--partition`.
  test:
    name: test (${{ matrix.os }}${{ matrix.shard != '1/1' && format(' {0}', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full-os) }}
        shard: ${{ fromJSON(inputs.shards) }}
    runs-on: ${{ matrix.os }}
    # Legs listed in `soft-os` report status but do not gate merges — used to
    # light up a new platform (e.g. Windows) and burn down the revealed backlog
    # of latent cross-platform failures before promoting it to a required check.
    continue-on-error: ${{ contains(fromJSON(inputs.soft-os), matrix.os) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable kache
        if: ${{ inputs.kache && runner.os != 'Windows' }}
        uses: kunobi-ninja/kache-action@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: area-ci-${{ inputs.area }}-test-${{ matrix.os }}
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: L1 tests
        shell: bash
        run: |
          args=()
          if [ "${{ matrix.shard }}" != "1/1" ]; then
            args=(--partition "count:${{ matrix.shard }}")
          fi
          cd "${{ inputs.area }}"
          just test "${args[@]}"

  # L2 (real terminal) runs only on Linux, where the tmux harness is guaranteed.
  # BISCUIT_TEST_LEVEL_REQUIRED=2 makes a genuinely missing harness hard-fail
  # rather than skip. On Windows/macOS the tier skips cleanly via require_level!.
  l2:
    name: test-l2 (ubuntu)
    if: ${{ inputs.l2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BISCUIT_TEST_LEVEL_REQUIRED: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable kache
        if: ${{ inputs.kache }}
        uses: kunobi-ninja/kache-action@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: area-ci-${{ inputs.area }}-test-ubuntu-latest
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: L2 tests
        run: cd "${{ inputs.area }}" && just test-l2

  browser:
    name: test-browser (ubuntu)
    if: ${{ inputs.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BISCUIT_BROWSER_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable kache
        if: ${{ inputs.kache }}
        uses: kunobi-ninja/kache-action@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: area-ci-${{ inputs.area }}-test-ubuntu-latest
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Browser tests
        run: cd "${{ inputs.area }}" && just test-browser
