name: area-ci

# Reusable CI building block for a single curated package area.
#
# The dependency-aware `ci.yml` matrix calls this via `workflow_call` so
# platform behavior stays uniform across the monorepo. See
# `docs/testing-strategy.md` → "Platform Coverage (CI)" for the policy this
# encodes: macOS compile-check only; full L1 on Linux + Windows; staged so a
# build/lint failure skips the test tiers; kache on Linux/macOS runners
# (kache-action@v1 rejects win32-x64); nextest sharding for heavy areas.

on:
  workflow_call:
    inputs:
      area:
        description: "Area directory, used for `cd` and cache keys (e.g. darkmatter)."
        type: string
        required: true
      check-args:
        description: "Args for the macOS compile-check `cargo check --all-targets` (e.g. '-p darkmatter -p darkmatter-cli')."
        type: string
        required: true
      full-os:
        description: "JSON array of OSes that run the full L1 suite."
        type: string
        default: '["ubuntu-latest", "windows-latest"]'
      check-os:
        description: "JSON array of OSes that only compile-check."
        type: string
        default: '["macos-latest"]'
      shards:
        description: 'JSON array of nextest partition specs; ["1/1"] means no sharding (e.g. ["1/4","2/4","3/4","4/4"]).'
        type: string
        default: '["1/1"]'
      soft-os:
        description: "JSON array of test-leg OSes whose failures are non-blocking (continue-on-error). Used to roll a platform in without gating merges until it is green."
        type: string
        default: '["windows-latest"]'
      l2:
        description: "Run the real-terminal (L2) tier on the Linux leg."
        type: boolean
        default: false
      browser:
        description: "Run the browser tier on the Linux leg."
        type: boolean
        default: false
      kache:
        description: "Enable the kache RUSTC_WRAPPER with the GitHub Actions cache backend."
        type: boolean
        default: true
      ai-provider-stubs:
        description: "Install inert AI-provider CLI stubs for tests that require provider discovery."
        type: boolean
        default: false
      native:
        description: "JSON map of runner-OS (e.g. ubuntu-latest) -> native packages to install before build/test."
        type: string
        default: "{}"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Force TrueColor on headless runners so styled output matches local dev.
  COLORTERM: truecolor
  # Native checks must not silently accept platform-specific warning drift.
  RUSTFLAGS: "-D warnings"
  # Explicitly select the CI nextest profile (D6) — every `cargo nextest` in the
  # area recipes honors this and logs "nextest profile: ci". No reliance on
  # implicit environment detection.
  NEXTEST_PROFILE: ci

jobs:
  # macOS floor: compile only. macOS runner minutes bill ~10x Linux, so we catch
  # `cfg(target_os = "macos")` compile drift here without paying for a full run.
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.check-os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native prerequisites
        uses: ./.github/actions/install-native
        with:
          native: ${{ inputs.native }}
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable and verify kache
        uses: ./.github/actions/enable-kache
        with:
          # kache-action@v1 rejects win32-x64 ("Unsupported platform"), so the
          # cache is Linux/macOS-only. Windows builds without it (D1: a missing
          # cache must reduce performance, never make a platform's build fail).
          enabled: ${{ inputs.kache && runner.os != 'Windows' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: area-ci-${{ inputs.area }}-check-${{ matrix.os }}
      - name: cargo check --all-targets
        run: cargo check --all-targets ${{ inputs.check-args }}

  # Full L1 suite on the higher-risk platforms (Linux + Windows), optionally
  # sharded across parallel jobs via nextest `--partition`.
  test:
    name: test (${{ matrix.os }}${{ matrix.shard != '1/1' && format(' {0}', matrix.shard) || '' }})
    # Stage after build/lint (D4): a deterministic compile or lint failure blocks
    # the L1 shards so they don't recompile and re-report the same source error
    # (e.g. an unused-variable warning that fails both lint and, under
    # RUSTFLAGS=-D warnings, every test build). Other areas stay independent —
    # the ci.yml area matrix runs with fail-fast: false.
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full-os) }}
        shard: ${{ fromJSON(inputs.shards) }}
    runs-on: ${{ matrix.os }}
    # Legs listed in `soft-os` report status but do not gate merges — used to
    # light up a new platform (e.g. Windows) and burn down the revealed backlog
    # of latent cross-platform failures before promoting it to a required check.
    continue-on-error: ${{ contains(fromJSON(inputs.soft-os), matrix.os) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native prerequisites
        uses: ./.github/actions/install-native
        with:
          native: ${{ inputs.native }}
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable and verify kache
        uses: ./.github/actions/enable-kache
        with:
          # kache-action@v1 rejects win32-x64 ("Unsupported platform"), so the
          # cache is Linux/macOS-only. Windows builds without it (D1: a missing
          # cache must reduce performance, never make a platform's build fail).
          enabled: ${{ inputs.kache && runner.os != 'Windows' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: area-ci-${{ inputs.area }}-test-${{ matrix.os }}
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Install AI-provider CLI stubs
        if: ${{ inputs.ai-provider-stubs }}
        shell: bash
        run: |
          set -euo pipefail
          stubdir="$RUNNER_TEMP/ai-cli-stubs"
          mkdir -p "$stubdir"
          for bin in claude opencode roo gemini aider codex goose kimi qwen; do
            if [ "${{ runner.os }}" = "Windows" ]; then
              printf '@echo off\r\nexit /b 0\r\n' >"$stubdir/$bin.cmd"
            else
              printf '#!/usr/bin/env sh\nexit 0\n' >"$stubdir/$bin"
              chmod +x "$stubdir/$bin"
            fi
          done
          echo "$stubdir" >>"$GITHUB_PATH"
      - name: L1 tests
        shell: bash
        run: |
          # --no-fail-fast (D6/D7): a bounded shard must run ALL its tests so one
          # slow or failing test cannot suppress the rest of the shard's evidence.
          args=(--no-fail-fast)
          if [ "${{ matrix.shard }}" != "1/1" ]; then
            args+=(--partition "count:${{ matrix.shard }}")
          fi
          cd "${{ inputs.area }}"
          just test "${args[@]}"
      # Per-area/OS/shard JUnit (D7). strategy.job-index keeps the name unique
      # within this job; the area + OS prefix keeps it unique across the run, so
      # shards never overwrite each other. (Recipes that run nextest once per
      # package currently capture the last package's results — full multi-package
      # aggregation is a follow-up.)
      - name: Upload L1 JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ inputs.area }}-L1-${{ matrix.os }}-${{ strategy.job-index }}
          path: target/nextest/ci/test-results.xml
          if-no-files-found: ignore

  lint:
    name: lint (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native prerequisites
        uses: ./.github/actions/install-native
        with:
          native: ${{ inputs.native }}
      # clippy + rustfmt come from rust-toolchain.toml (the single authority).
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable and verify kache
        uses: ./.github/actions/enable-kache
        with:
          # kache-action@v1 rejects win32-x64 ("Unsupported platform"), so the
          # cache is Linux/macOS-only. Windows builds without it (D1: a missing
          # cache must reduce performance, never make a platform's build fail).
          enabled: ${{ inputs.kache && runner.os != 'Windows' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: area-ci-${{ inputs.area }}-lint-ubuntu-latest
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Lint and documentation guards
        run: cd "${{ inputs.area }}" && just lint

  # L2 (real terminal) runs only on Linux, where the tmux harness is guaranteed.
  # BISCUIT_TEST_LEVEL_REQUIRED=2 makes a genuinely missing harness hard-fail
  # rather than skip. On Windows/macOS the tier skips cleanly via require_level!.
  l2:
    name: test-l2 (ubuntu)
    # Expensive optional tier runs only after L1 passes (D4).
    needs: test
    if: ${{ inputs.l2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BISCUIT_TEST_LEVEL_REQUIRED: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Install native prerequisites
        uses: ./.github/actions/install-native
        with:
          native: ${{ inputs.native }}
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Enable and verify kache
        uses: ./.github/actions/enable-kache
        with:
          # kache-action@v1 rejects win32-x64 ("Unsupported platform"), so the
          # cache is Linux/macOS-only. Windows builds without it (D1: a missing
          # cache must reduce performance, never make a platform's build fail).
          enabled: ${{ inputs.kache && runner.os != 'Windows' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: area-ci-${{ inputs.area }}-test-ubuntu-latest
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: L2 tests
        run: cd "${{ inputs.area }}" && just test-l2
      - name: Upload L2 JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ inputs.area }}-L2-ubuntu
          path: target/nextest/ci/test-results.xml
          if-no-files-found: ignore

  browser:
    name: test-browser (ubuntu)
    # Expensive optional tier runs only after L1 passes (D4).
    needs: test
    if: ${{ inputs.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BISCUIT_BROWSER_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install native prerequisites
        uses: ./.github/actions/install-native
        with:
          native: ${{ inputs.native }}
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable and verify kache
        uses: ./.github/actions/enable-kache
        with:
          # kache-action@v1 rejects win32-x64 ("Unsupported platform"), so the
          # cache is Linux/macOS-only. Windows builds without it (D1: a missing
          # cache must reduce performance, never make a platform's build fail).
          enabled: ${{ inputs.kache && runner.os != 'Windows' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: area-ci-${{ inputs.area }}-test-ubuntu-latest
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Browser tests
        run: cd "${{ inputs.area }}" && just test-browser
      - name: Upload browser JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ inputs.area }}-browser-ubuntu
          path: target/nextest/ci/test-results.xml
          if-no-files-found: ignore
