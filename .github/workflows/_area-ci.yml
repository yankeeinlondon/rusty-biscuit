name: area-ci

# Reusable CI building block for a single curated package area.
#
# The dependency-aware `ci.yml` matrix calls this via `workflow_call` so
# platform behavior stays uniform across the monorepo.
#
# `environment` is NOT `os`. Windows, macOS, and Linux are operating systems;
# WSL2 is a distinct supported Linux environment that a Windows runner HOSTS.
# Every result identity — artifact name, JUnit manifest record, rollup cell — is
# keyed by environment. Only `runs-on` and the native-package lookup are keyed by
# runner OS. `native-environments` may therefore be fed straight into a `runs-on`
# matrix (those three environment names ARE runner labels); `wsl2-ubuntu` is
# hoisted into the separate `_wsl-ci.yml` reusable workflow precisely so it can
# never reach that matrix and silently take the Windows branch for dependency
# installation, paths, shells, caching, or artifact collection.
#
# Policy this encodes: the same canonical L1 recipe on every native environment;
# `check`, `lint`, and `test` are independent gates with `l2`/`browser` staged
# behind `test`; kache on Linux/macOS runners (kache-action@v1 rejects
# win32-x64); nextest sharding for heavy areas.
#
# Every building job first runs `just _ensure-native-libs <area>` — the same
# recipe `just init` runs on a developer host — so an area's `native` libraries
# from `.github/ci/areas.json` are present before any `-sys` crate compiles (D9).

on:
  workflow_call:
    inputs:
      area:
        description: "Area directory, used for `cd` and cache keys (e.g. darkmatter)."
        type: string
        required: true
      check-args:
        description: "Args for the compile-check `cargo check --all-targets` (e.g. '-p darkmatter -p darkmatter-cli')."
        type: string
        required: true
      native-environments:
        description: "JSON array of NATIVE environments that run the full L1 suite. Each value is also its own runner label; wsl2-ubuntu is deliberately excluded."
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      check-os:
        description: "JSON array of runner OSes that only compile-check under `-D warnings`. A compile-check emits no test results, so it has no environment identity."
        type: string
        default: '["windows-latest"]'
      l2-environments:
        description: "JSON array of environments where an L2 backend is provisioned. Empty when the area owns no L2 tests."
        type: string
        default: '[]'
      backends:
        description: "JSON array of L2 terminal backends this area's tests declare, used to report per-backend coverage."
        type: string
        default: '[]'
      shards:
        description: 'JSON array of nextest partition specs; ["1/1"] means no sharding (e.g. ["1/4","2/4","3/4","4/4"]).'
        type: string
        default: '["1/1"]'
      l2:
        description: "Run the real-terminal (L2) tier on every provisioned environment."
        type: boolean
        default: false
      browser:
        description: "Run the browser tier on the Linux leg."
        type: boolean
        default: false
      wsl:
        description: "Run the canonical L1 suite inside a WSL2 Ubuntu guest (environment `wsl2-ubuntu`)."
        type: boolean
        default: false
      kache:
        description: "Enable the kache RUSTC_WRAPPER with the GitHub Actions cache backend."
        type: boolean
        default: true
      ai-provider-stubs:
        description: "Install inert AI-provider CLI stubs for tests that require provider discovery."
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Force TrueColor on headless runners so styled output matches local dev.
  COLORTERM: truecolor
  # Explicitly select the CI nextest profile (D6) — every `cargo nextest` in the
  # area recipes honors this and logs "nextest profile: ci". No reliance on
  # implicit environment detection.
  NEXTEST_PROFILE: ci

jobs:
  # Warning-drift gate. This job used to be "the macOS floor" — compile-only,
  # because macOS runner minutes billed ~10x. The repo is public, so standard
  # runners are free and macOS now runs the real suite; the compile-check would
  # be strictly weaker than the test leg beside it.
  #
  # What survives is the ONE thing a test leg cannot do: carry
  # `RUSTFLAGS: -D warnings`. Denying warnings on a test job deletes the run's
  # test evidence over a plain rustc hint (plan 0.3), so warning enforcement
  # needs its own compile-only slot. `lint` already denies warnings on Linux and
  # macOS is the primary development host where drift is caught locally, so the
  # default `check_os` points this at Windows — nobody's dev box, and where
  # warning drift actually hides. Same job count as before, aimed better.
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.check-os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Scoped to the compile-only gate: this job exists to catch
      # platform-specific warning drift, and it runs no tests, so denying
      # warnings here cannot suppress test evidence. Deliberately NOT set at
      # workflow level — on the `test` job it made a plain rustc warning abort
      # the build so no test ran at all.
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Install native prerequisites
        shell: bash
        run: just _ensure-native-libs "${{ inputs.area }}"
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable and verify kache
        uses: ./.github/actions/enable-kache
        with:
          # kache-action@v1 rejects win32-x64 ("Unsupported platform"), so the
          # cache is Linux/macOS-only. Windows builds without it (D1: a missing
          # cache must reduce performance, never make a platform's build fail).
          enabled: ${{ inputs.kache && runner.os != 'Windows' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: area-ci-${{ inputs.area }}-check-${{ matrix.os }}
      - name: cargo check --all-targets
        run: cargo check --all-targets ${{ inputs.check-args }}
      # Producer status (plan 1.3). This job stages no JUnit, so the status
      # artifact is the ONLY evidence it ran and how it concluded — which is what
      # lets a compile-check become a rollup cell that can be baselined and can
      # still block. `always()`, so a FAILED job still reports itself; a job that
      # reports nothing is MISSING, never a pass.
      - name: Record producer status
        if: ${{ always() }}
        shell: bash
        env:
          AREA: ${{ inputs.area }}
          JOB: check
          ENVIRONMENT: ${{ matrix.os }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/status"
          printf '{"area":"%s","job":"%s","environment":"%s","result":"%s"}\n' \
            "$AREA" "$JOB" "$ENVIRONMENT" "$RESULT" \
            >"$RUNNER_TEMP/status/status.json"
      - name: Upload producer status
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ inputs.area }}-check-${{ matrix.os }}
          path: ${{ runner.temp }}/status

  # Full L1 suite on every native environment, optionally sharded across parallel
  # jobs via nextest `--partition`.
  test:
    name: test (${{ matrix.environment }}${{ matrix.shard != '1/1' && format(' {0}', matrix.shard) || '' }})
    # Deliberately depends on nothing. Lint is a parallel gate, not a
    # prerequisite: a clippy hint in one package must not delete every L1 leg's
    # evidence for the whole area. Nor does this job export
    # RUSTFLAGS=-D warnings, which re-coupled them through the back door by
    # failing the test build on any plain rustc warning. Every leg is blocking
    # — a red one is a red run, and known-red legs belong in the results
    # baseline, never in a mechanism that erases them from the verdict.
    strategy:
      fail-fast: false
      matrix:
        # Sound ONLY because every native environment name is also its own runner
        # label. `wsl2-ubuntu` is not, and never enters this matrix — it has its
        # own workflow (see the `wsl` job below).
        environment: ${{ fromJSON(inputs.native-environments) }}
        shard: ${{ fromJSON(inputs.shards) }}
    runs-on: ${{ matrix.environment }}
    timeout-minutes: 30
    env:
      # Result identity (plan 0.2/1.3). The shared `just` recipes stamp these
      # into the per-invocation JUnit manifest so a rollup cell traces back to
      # {area, environment, tier, shard} without parsing a display name — which
      # for a skipped matrix leg is not merely unstable but unresolvable.
      BISCUIT_CI_AREA: ${{ inputs.area }}
      BISCUIT_CI_ENVIRONMENT: ${{ matrix.environment }}
      BISCUIT_CI_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Install native prerequisites
        shell: bash
        run: just _ensure-native-libs "${{ inputs.area }}"
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable and verify kache
        uses: ./.github/actions/enable-kache
        with:
          # kache-action@v1 rejects win32-x64 ("Unsupported platform"), so the
          # cache is Linux/macOS-only. Windows builds without it (D1: a missing
          # cache must reduce performance, never make a platform's build fail).
          enabled: ${{ inputs.kache && runner.os != 'Windows' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: area-ci-${{ inputs.area }}-test-${{ matrix.environment }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Install AI-provider CLI stubs
        if: ${{ inputs.ai-provider-stubs }}
        shell: bash
        run: |
          set -euo pipefail
          stubdir="$RUNNER_TEMP/ai-cli-stubs"
          mkdir -p "$stubdir"
          for bin in claude opencode roo gemini aider codex goose kimi qwen; do
            if [ "${{ runner.os }}" = "Windows" ]; then
              printf '@echo off\r\nexit /b 0\r\n' >"$stubdir/$bin.cmd"
            else
              printf '#!/usr/bin/env sh\nexit 0\n' >"$stubdir/$bin"
              chmod +x "$stubdir/$bin"
            fi
          done
          echo "$stubdir" >>"$GITHUB_PATH"
      - name: L1 tests
        shell: bash
        run: |
          # --no-fail-fast (D6/D7): a bounded shard must run ALL its tests so one
          # slow or failing test cannot suppress the rest of the shard's evidence.
          args=(--no-fail-fast)
          if [ "${{ matrix.shard }}" != "1/1" ]; then
            args+=(--partition "count:${{ matrix.shard }}")
          fi
          cd "${{ inputs.area }}"
          just test "${args[@]}"
      # Per-area/environment/shard JUnit (D7). The artifact name carries the
      # ENVIRONMENT, not the runner label, so a WSL leg (which runs on
      # windows-latest) can never collide with, or be merged into, the native
      # Windows leg. strategy.job-index keeps the name unique within this job.
      #
      # The whole STAGING DIRECTORY, not `target/nextest/ci/test-results.xml`:
      # that single path is overwritten by every nextest invocation, so a
      # multi-package area uploaded only its last package's report. The staging
      # tree carries one XML per invocation plus `manifest.jsonl`, and the
      # manifest — not this artifact's name — is what gives each record its
      # {area, environment, tier, shard, package} identity.
      - name: Upload L1 JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ inputs.area }}-L1-${{ matrix.environment }}-${{ strategy.job-index }}
          path: target/nextest/ci-reports
          if-no-files-found: ignore
      # `L1`, not `test`: `ci-rollup` keys a status by TIER. A status naming a
      # test tier explains a MISSING cell downstream of it (an L2 leg deleted by
      # a failed L1, say); a status naming anything else becomes a cell in its
      # own right. `test` would manufacture a phantom `<area>/<env>/test` cell
      # beside the real L1 one and double-count the same failure.
      - name: Record producer status
        if: ${{ always() }}
        shell: bash
        env:
          AREA: ${{ inputs.area }}
          JOB: L1
          ENVIRONMENT: ${{ matrix.environment }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/status"
          printf '{"area":"%s","job":"%s","environment":"%s","result":"%s"}\n' \
            "$AREA" "$JOB" "$ENVIRONMENT" "$RESULT" \
            >"$RUNNER_TEMP/status/status.json"
      - name: Upload producer status
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ inputs.area }}-L1-${{ matrix.environment }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/status

  lint:
    name: lint (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # `just/devops.just`'s `_lint` already passes `-D warnings` to clippy for
      # each package in the area; this keeps the area's workspace dependencies
      # held to the same bar while they are compiled for that clippy run.
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Install native prerequisites
        shell: bash
        run: just _ensure-native-libs "${{ inputs.area }}"
      # clippy + rustfmt come from rust-toolchain.toml (the single authority).
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable and verify kache
        uses: ./.github/actions/enable-kache
        with:
          # kache-action@v1 rejects win32-x64 ("Unsupported platform"), so the
          # cache is Linux/macOS-only. Windows builds without it (D1: a missing
          # cache must reduce performance, never make a platform's build fail).
          enabled: ${{ inputs.kache && runner.os != 'Windows' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: area-ci-${{ inputs.area }}-lint-ubuntu-latest
      - name: Lint and documentation guards
        run: cd "${{ inputs.area }}" && just lint
      # `lint` emits no JUnit, so this artifact is the sole basis for its rollup
      # cell — and the reason `ci-baseline.toml` can carry `tier = "lint"`
      # entries at all. In run 30323254931 `claudine / lint` was CANCELLED, which
      # a job-result reading records as neither pass nor fail; an explicit status
      # makes it MISSING, which blocks.
      - name: Record producer status
        if: ${{ always() }}
        shell: bash
        env:
          AREA: ${{ inputs.area }}
          JOB: lint
          ENVIRONMENT: ubuntu-latest
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/status"
          printf '{"area":"%s","job":"%s","environment":"%s","result":"%s"}\n' \
            "$AREA" "$JOB" "$ENVIRONMENT" "$RESULT" \
            >"$RUNNER_TEMP/status/status.json"
      - name: Upload producer status
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ inputs.area }}-lint
          path: ${{ runner.temp }}/status

  # L2 (real terminal), one leg per environment where a backend is provisioned.
  # tmux/PTY is the ONLY backend headless CI can host (D8) and it installs on
  # BOTH Linux (apt) and macOS (brew), so this is a matrix rather than the old
  # hardcoded ubuntu leg. WezTerm/Kitty/Apple Terminal require running INSIDE
  # that GUI (their `available()` gates need WEZTERM_UNIX_SOCKET /
  # KITTY_LISTEN_ON / a live Terminal.app session — and
  # `AppleTerminalHarness::available()` returns false outright when CI=1), so
  # those tests skip cleanly here via require_level!. The "Report L2 backend
  # coverage" step makes that skip VISIBLE rather than silent (plan 1.1).
  #
  # We hard-require the provisioned backend by VERIFYING tmux is reachable rather
  # than setting a global BISCUIT_TEST_LEVEL_REQUIRED, which would panic the
  # GUI-backed tests this runner cannot host.
  #
  # Windows is absent by construction: `l2-environments` is derived from area
  # policy and tmux has no Windows port, so an L2 tier there is recorded as a
  # POLICY GAP in `areas.json` instead of appearing as a green 0-run cell.
  l2:
    name: test-l2 (${{ matrix.environment }})
    # Expensive optional tier runs only after L1 passes (D4).
    needs: test
    if: ${{ inputs.l2 }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.l2-environments) }}
    runs-on: ${{ matrix.environment }}
    timeout-minutes: 30
    env:
      BISCUIT_CI_AREA: ${{ inputs.area }}
      BISCUIT_CI_ENVIRONMENT: ${{ matrix.environment }}
      BISCUIT_CI_SHARD: "1/1"
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Install native prerequisites
        shell: bash
        run: just _ensure-native-libs "${{ inputs.area }}"
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Provision and verify the tmux backend
        shell: bash
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            ubuntu-latest)
              sudo apt-get update && sudo apt-get install -y tmux
              ;;
            macos-latest)
              brew list tmux >/dev/null 2>&1 || brew install tmux
              ;;
            *)
              echo "no tmux provisioning path for environment '$ENVIRONMENT'" >&2
              exit 1
              ;;
          esac
          # Verify runtime reachability (D8): a broken tmux fails this named
          # provisioning step — the hard-require for the one L2 backend CI hosts.
          # `tmux -V` needs no server, no display, and no pane, so it takes no
          # focus. CI must never steal focus.
          tmux -V
      - name: Report L2 backend coverage
        shell: bash
        env:
          AREA: ${{ inputs.area }}
          ENVIRONMENT: ${{ matrix.environment }}
          DECLARED_BACKENDS: ${{ inputs.backends }}
        run: |
          set -euo pipefail
          # A backend that cannot exist here skips silently inside require_level!.
          # Naming every declared backend and its status turns "0 run / N skipped"
          # from an invisible non-event into a readable row (plan 1.1/1.2).
          {
            echo "### L2 backends — ${AREA} on ${ENVIRONMENT}"
            echo ""
            echo "| backend | status |"
            echo "|---|---|"
            while IFS= read -r backend; do
              [ -n "$backend" ] || continue
              if [ "$backend" = "tmux" ]; then
                echo "| tmux | provisioned — its tests MUST execute |"
              elif [ "$backend" = "apple-terminal" ] && [ "$ENVIRONMENT" = "macos-latest" ]; then
                echo "| apple-terminal | unavailable — \`available()\` returns false when CI=1; its tests skip |"
              else
                echo "| ${backend} | unavailable — needs a live GUI session; its tests skip |"
              fi
            done < <(printf '%s' "$DECLARED_BACKENDS" | jq -r '.[]?')
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Enable and verify kache
        uses: ./.github/actions/enable-kache
        with:
          # kache-action@v1 rejects win32-x64 ("Unsupported platform"), so the
          # cache is Linux/macOS-only. Windows builds without it (D1: a missing
          # cache must reduce performance, never make a platform's build fail).
          enabled: ${{ inputs.kache && runner.os != 'Windows' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: area-ci-${{ inputs.area }}-test-${{ matrix.environment }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: L2 tests
        run: cd "${{ inputs.area }}" && just test-l2
      # The staging directory, so the manifest travels with the reports. See the
      # L1 upload for why the single overwritten file is not enough.
      - name: Upload L2 JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ inputs.area }}-L2-${{ matrix.environment }}
          path: target/nextest/ci-reports
          if-no-files-found: ignore
      - name: Record producer status
        if: ${{ always() }}
        shell: bash
        env:
          AREA: ${{ inputs.area }}
          JOB: L2
          ENVIRONMENT: ${{ matrix.environment }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/status"
          printf '{"area":"%s","job":"%s","environment":"%s","result":"%s"}\n' \
            "$AREA" "$JOB" "$ENVIRONMENT" "$RESULT" \
            >"$RUNNER_TEMP/status/status.json"
      - name: Upload producer status
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ inputs.area }}-L2-${{ matrix.environment }}
          path: ${{ runner.temp }}/status

  browser:
    name: test-browser (ubuntu-latest)
    # Expensive optional tier runs only after L1 passes (D4).
    needs: test
    if: ${{ inputs.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BISCUIT_BROWSER_REQUIRED: "1"
      BISCUIT_CI_AREA: ${{ inputs.area }}
      BISCUIT_CI_ENVIRONMENT: ubuntu-latest
      BISCUIT_CI_SHARD: "1/1"
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Install native prerequisites
        shell: bash
        run: just _ensure-native-libs "${{ inputs.area }}"
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable and verify kache
        uses: ./.github/actions/enable-kache
        with:
          # kache-action@v1 rejects win32-x64 ("Unsupported platform"), so the
          # cache is Linux/macOS-only. Windows builds without it (D1: a missing
          # cache must reduce performance, never make a platform's build fail).
          enabled: ${{ inputs.kache && runner.os != 'Windows' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: area-ci-${{ inputs.area }}-test-ubuntu-latest
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Browser tests
        run: cd "${{ inputs.area }}" && just test-browser
      # The staging directory, so the manifest travels with the reports. See the
      # L1 upload for why the single overwritten file is not enough.
      - name: Upload browser JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ inputs.area }}-browser-ubuntu-latest
          path: target/nextest/ci-reports
          if-no-files-found: ignore
      - name: Record producer status
        if: ${{ always() }}
        shell: bash
        env:
          AREA: ${{ inputs.area }}
          JOB: browser
          ENVIRONMENT: ubuntu-latest
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/status"
          printf '{"area":"%s","job":"%s","environment":"%s","result":"%s"}\n' \
            "$AREA" "$JOB" "$ENVIRONMENT" "$RESULT" \
            >"$RUNNER_TEMP/status/status.json"
      - name: Upload producer status
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ inputs.area }}-browser-ubuntu-latest
          path: ${{ runner.temp }}/status

  # WSL2 is a supported Linux environment, not a runner label. Delegating to a
  # dedicated reusable workflow is the whole point: that job runs on
  # `windows-latest` and executes through `wsl-bash`, so if it shared the matrix
  # above, every `runner.os == 'Windows'` branch — kache gating, native package
  # installation, path handling, shell selection, cache keys, artifact names —
  # would silently apply to a Linux guest.
  wsl:
    name: wsl2
    # Same staging as the native legs: nothing expensive before L1 is known good.
    needs: test
    if: ${{ inputs.wsl }}
    uses: ./.github/workflows/_wsl-ci.yml
    with:
      area: ${{ inputs.area }}
      check-args: ${{ inputs.check-args }}
      shards: ${{ inputs.shards }}
    secrets: inherit

  # THERE IS NO `classify` JOB HERE ANY MORE (retired D15 — see ci.yml's
  # `ci-verdict`).
  #
  # It existed because a reusable workflow's matrix legs cannot report an output
  # back to the caller (matrix outputs are last-writer-wins), so the only way to
  # surface "which gate of this area failed" was a per-area job writing a line to
  # the shared run summary. Every producer job now uploads an explicit
  # `status-<area>-<job>` artifact, which carries the same fact per
  # {area, environment, tier} — a resolution `classify` never had, since its one
  # line was environment-blind and could not distinguish a Windows-only failure
  # from a Linux-only one.
  #
  # Keeping both would leave two reporters that can disagree in the same summary:
  # a baselined known-red gate makes this workflow fail, so `classify` would
  # print a failure line under a verdict that correctly reads CLEAR. Plan
