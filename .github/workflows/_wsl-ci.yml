name: wsl-ci

# The `wsl2-ubuntu` environment: one Cargo package's canonical L1 suite, run
# inside a WSL2 Ubuntu guest hosted by a `windows-latest` runner.
#
# WHY THIS IS A SEPARATE WORKFLOW
#
# WSL2 cannot be another entry in `_package-ci.yml`'s `runs-on` matrix. The job
# still runs on `windows-latest` and every command executes through `wsl-bash`,
# so a shared job would evaluate `runner.os == 'Windows'` and take the Windows
# branch for native-package installation, path handling, shell
# selection, cache keys, and artifact collection — while the code under test is
# actually running on Linux. Isolating it here makes that impossible by
# construction rather than by review discipline.
#
# WSL2, NOT WSL1
#
# `Vampire/setup-wsl` defaults to version 2 and GitHub's Windows runners have had
# nested virtualization since the Dadsv5 move in January 2024, so no version pin
# appears below. WSL1 is not an acceptable fallback: WSLg (GUI, audio, clipboard,
# D-Bus) is WSL2-only, so under WSL1 `playa`, `messenger`, `biscuit-clipboard`,
# `biscuit-visualized`, and `renderable` all take their no-capability fallback
# branches and a green leg would misreport those packages for every real user.
# Networking differs too — WSL1 shares the Windows stack, WSL2 is NAT'd — which
# is material for `sniff`, `homelab`, and `rendezvous`.
#
# EXT4, NOT /mnt/c
#
# The repo is cloned into the guest filesystem rather than built over
# `GITHUB_WORKSPACE`, which is a 9p mount. The 9p boundary
# penalty is severe for a build tree, and ext4 is also where real WSL developers
# keep their repos, so this is the configuration worth testing.
#
# THERE IS NO ARCHIVE JOB HERE ANY MORE
#
# This workflow used to own a `ubuntu-latest` job that built a package-local
# `cargo nextest archive` for the guest alone — a second compile of binaries the
# native Linux L1 leg had already produced. The archive now comes from the
# run's single Linux build owner (`ci.yml`'s `build` job), and the guest
# downloads the SAME artifact, checksum, and realized digest that the native
# Linux L1, L2, and browser cells consume. `wsl2-ubuntu` stays its own result
# cell: one build, two environments, two cells.
#
# No rustup, no toolchain, no compile inside WSL — the guest only *runs* the
# archived binaries. L1 ONLY: the L2 tier needs a live tmux server, and the
# environment capability table (`.github/ci/environments.json`) records
# `wsl2-ubuntu` as archive-only with no tmux, so the rollup renders the
# package's L2 cell there as a POLICY GAP.

on:
  workflow_call:
    inputs:
      tested-revision:
        description: "The resolved plan's `head`: the one revision this whole run tests, and the only checkout `ci-build` will verify an archive against. The guest clone below inherits it from the runner checkout. Required, and never recomputed here — see the `env:` comment in `ci.yml`."
        type: string
        required: true
      package:
        description: "Cargo package name; the unit of selection, execution, and result identity (e.g. sniff-cli)."
        type: string
        required: true
      builds:
        description: "JSON array of the package's build records from the resolved plan. The record whose consumers name `{wsl2-ubuntu, L1}` is the artifact this guest downloads; it is the same record the native Linux tiers consume."
        type: string
        required: true
      test-args:
        description: "Extra args forwarded to the canonical test recipe (declared feature flags; dropped in archive mode, where they are already baked in)."
        type: string
        default: ""
      l1-include-slow:
        description: "Keep `slow_` tests inside the L1 selection (darkmatter's declared L1 contract). Forwarded to the guest or its L1 suite silently narrows relative to every other leg."
        type: boolean
        default: false
      runner-tools:
        description: "JSON array from the closed runner-tool vocabulary. Compile-time tools reach the guest as verified build sidecars, never as a guest-side build."
        type: string
        default: '[]'
      native:
        description: "JSON map of runner OS -> system packages, the union of `native` requirements across this package's dependency closure. The guest consumes the ubuntu-latest list: an archived binary that dynamically links a library the guest lacks fails here, not in the producer."
        type: string
        default: '{}'
      distribution:
        description: "WSL distribution to provision."
        type: string
        default: Ubuntu-24.04

env:
  # No rustc wrapper is tracked by the repository; cleared explicitly so a stray
  # environment value cannot reach anything this workflow runs. Nothing here
  # compiles, so this is belt and braces.
  RUSTC_WRAPPER: ""
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  COLORTERM: truecolor
  NEXTEST_PROFILE: ci
  # Used for both the host and guest so they run the same recipes. The guest
  # downloads this exact release without querying GitHub's latest-release API.
  JUST_VERSION: "1.58.0"

jobs:
  # A static name: this job carries `needs:` nothing but is still skippable
  # through its caller, so a skip would otherwise reach the Checks tab as the
  # raw `${{ inputs.package }}` expression (AC10). The package comes from the
  # caller's job label.
  wsl:
    name: test (wsl2-ubuntu)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Result identity, declared once. The environment is `wsl2-ubuntu` even
      # though the runner label is `windows-latest`; stamping the label here
      # would silently merge this leg into the native Windows rollup cell.
      BISCUIT_CI_ENVIRONMENT: wsl2-ubuntu
      # The package's declared L1 contract (`l1-include-slow` in
      # `[package.metadata.ci.tests]`), re-exported inside the guest below so
      # darkmatter's `slow_` tests run here exactly as on the native legs.
      BISCUIT_L1_INCLUDE_SLOW: ${{ inputs.l1-include-slow && '1' || '' }}
      # Where the archive, its manifest, and the verifier land in the guest —
      # deliberately NOT inside the checkout, so nothing about the extraction
      # can be confused with the source tree.
      GUEST_BUILD: /home/biscuit/build
      # Where the source lands in the guest. A path of this leg's own choosing,
      # unrelated to the producer's: `--workspace-remap` rewrites the run-time
      # `CARGO_MANIFEST_DIR`, and no archive-executed target reads the
      # compile-time one any more (`tools/test-toolkit/tests/archive_path_guard.rs`
      # is what keeps that true). Picking a path that cannot coincide with a
      # hosted runner's workspace is the point: if a baked producer path ever
      # returns, it resolves to nothing here and the cell fails.
      GUEST_ROOT: /home/biscuit/checkout
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tested-revision }}
      # Which build record this cell consumes. The answer is the same artifact
      # name the native Linux L1 leg downloads; the two environments share one
      # compile and publish two result cells.
      - name: Resolve this cell's build record
        id: build
        shell: bash
        run: |
          set -euo pipefail
          record="$(jq -ce '[.[] | select(any(.consumers[]; .environment == "wsl2-ubuntu" and .gate == "L1"))] | first' <<<'${{ inputs.builds }}')"
          {
            echo "artifact=$(jq -r '.artifact' <<<"$record")"
            echo "key=$(jq -r '.key' <<<"$record")"
            echo "producer=$(jq -r '.producer' <<<"$record")"
          } >>"$GITHUB_OUTPUT"
      # Inside the workspace, not RUNNER_TEMP: the guest reaches these through
      # the 9p mount by resolving `pwd`, which needs no environment forwarding.
      - name: Download the resolved execution plan
        uses: actions/download-artifact@v7
        with:
          name: ci-resolved-plan
          path: ${{ github.workspace }}/ci-resolved-plan
      # Transfer clock. An artifact download is an action, not a command, so its
      # cost can only be observed between two steps; the manifest read below
      # closes the window.
      - name: Mark the build transfer start
        id: transfer
        shell: bash
        run: echo "epoch=$(date +%s)" >>"$GITHUB_OUTPUT"
      - name: Download this cell's build
        uses: actions/download-artifact@v7
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: ${{ github.workspace }}/ci-build-artifact
      # Read on the HOST, not in the guest. `wsl-bash` forwards only WSLENV-
      # listed variables and `$GITHUB_OUTPUT` is a Windows path the guest cannot
      # write, so every value a later guest step needs is resolved here and
      # reaches it through GitHub expression interpolation.
      - name: Read the producer's manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="ci-build-artifact/${{ steps.build.outputs.artifact }}.manifest.json"
          [ -f "$manifest" ] || { echo "the build artifact carries no manifest at $manifest" >&2; exit 1; }
          {
            echo "digest=$(jq -er '.digest' "$manifest")"
            echo "archive_name=$(jq -er '.archive.file' "$manifest")"
            echo "download_seconds=$(( $(date +%s) - ${{ steps.transfer.outputs.epoch }} ))"
          } >>"$GITHUB_OUTPUT"
      # No `wsl-version:` pin — the action already defaults to 2, and pinning 1
      # would be an explicit downgrade to an environment without WSLg.
      #
      # WHY v7 AND NOT v4 — THIS IS WHAT STOPS THE 403
      #
      # v4 issued `wsl.exe --update` unconditionally whenever WSLv2 was to be
      # used, and that call is what failed: `Forbidden (403)`,
      # `Wsl/UpdatePackage/0x80190193`, returned by Microsoft's update endpoint.
      # It took out `biscuit-contract` and `biscuit-tui` in run 30755610413 —
      # both attempts below, so no guest existed and the cells reported MISSING.
      #
      # The action cannot be told to skip that call, and retrying does not fix
      # it: upstream already retries ten times internally and the maintainer
      # closed Vampire/setup-wsl#66 concluding there is nothing more the action
      # can do, pending actions/runner-images#10563.
      #
      # v5.0.0 changed the behaviour instead of the retry count: the update is
      # now issued ONLY for GitHub-hosted `windows-2022`, because the newer
      # images already ship it. These legs run `windows-latest`, which is
      # `windows-2025-vs2026` (Windows Server 2025, 10.0.26100) — so on v5+ the
      # call is not made at all and the 403 has no surface to appear on.
      # v6 additionally retries Debian's apt step; v7 moves to Node 24, which
      # these runs are already forced onto by `FORCE_JAVASCRIPT_ACTIONS_TO_NODE24`.
      #
      # WHY A SECOND ATTEMPT SURVIVES
      #
      # Provisioning can still fail for reasons unrelated to `--update` — the
      # distribution download crosses the network. `continue-on-error` on the
      # first attempt is what makes the second reachable; the second is NOT
      # `continue-on-error`, because a guest that cannot be provisioned twice
      # must still turn the cell red.
      #
      # The 90s wait is retained but no longer rests on the contention theory it
      # was written for. Run 30755610413 does not support that theory: claudine's
      # four shards started within two seconds of each other and all provisioned
      # cleanly, while the two 403s hit isolated legs 28 minutes apart. Treat the
      # wait as ordinary backoff against a flaky endpoint, not as de-racing.
      # `timeout-minutes` on both attempts: provisioning takes ~1 minute when it
      # works (63 s measured across today's passing legs), and a `wsl.exe` that
      # wedges with the runner still alive would otherwise sit until the job
      # timeout. Ten minutes covers a slow 300 MB distribution download and
      # turns that hang into a retry. It cannot reach the other failure shape —
      # the hosted runner itself dying ("lost communication with the server",
      # three times on 2026-08-27/28, again on 2026-09-18 in run 35308326156) —
      # which `ci-infra-retry.yml` handles by rerunning the failed jobs once
      # from outside the run.
      #
      # WHY THE ACTION REGISTERS THE DISTRIBUTION AND NOTHING MORE
      #
      # A lost runner leaves no log; the only record GitHub keeps is which step
      # was in progress. With `additional-packages` set, one step covered three
      # different operations — the image download, `wsl --install --no-launch`
      # (registration, no VM), and the guest's first boot to run apt — so every
      # loss so far reads "Provision the WSL2 guest" and says nothing about
      # which of them the host did not survive. The first boot and the package
      # install are therefore their own steps below, and the action is asked
      # only for registration and the `wsl-bash` wrapper, which it generates
      # regardless and which resolves the default distribution at call time.
      - name: Provision the WSL2 guest
        id: provision
        continue-on-error: true
        timeout-minutes: 10
        uses: Vampire/setup-wsl@v7
        with:
          distribution: ${{ inputs.distribution }}
          set-as-default: true
      - name: Let the endpoint settle before a second attempt
        if: ${{ steps.provision.outcome == 'failure' }}
        shell: bash
        run: sleep 90
      - name: Provision the WSL2 guest (second attempt)
        id: provision_retry
        if: ${{ steps.provision.outcome == 'failure' }}
        timeout-minutes: 10
        uses: Vampire/setup-wsl@v7
        with:
          distribution: ${{ inputs.distribution }}
          set-as-default: true
      # The first `wsl-bash` call after `--no-launch` registration is what starts
      # the guest VM. It is its own step so a runner lost here is attributed to
      # the boot, not to the download or registration before it. No second
      # attempt: a boot that fails with the runner still alive has not been
      # observed, and a lost runner cannot be retried from inside the job.
      - name: Boot the guest and verify it is WSL2
        timeout-minutes: 10
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          uname -a
          # WSL2 runs a real Linux kernel and says so; WSL1's syscall translation
          # layer reports a Microsoft build instead. A silent downgrade to WSL1
          # would make every WSLg-dependent package (playa, messenger,
          # biscuit-clipboard, biscuit-visualized, renderable) report its
          # no-capability fallback, and NAT'd networking would stop applying to
          # sniff, homelab, and rendezvous.
          case "$(uname -r)" in
            *microsoft-standard-WSL2*) ;;
            *)
              echo "guest is not WSL2 (kernel: $(uname -r)); refusing to report a result" >&2
              exit 1
              ;;
          esac
      # Previously the action's `additional-packages`, run inside its single
      # step. jq is NOT optional: the guest's native-prerequisites step parses
      # the scope-computed package list with it, for every package, before any
      # recipe that could bootstrap it has run. The retry loop keeps the
      # tolerance for a flaky mirror that the action's second attempt used to
      # provide for this phase.
      - name: Install guest packages
        timeout-minutes: 10
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          for attempt in 1 2 3; do
            if apt-get update && apt-get install --yes --no-install-recommends \
                ca-certificates curl git xz-utils jq; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying in 30s" >&2
            sleep 30
          done
          echo "guest package installation failed three times" >&2
          exit 1
      # The default wsl-bash user is root, and root ignores file permissions —
      # which silently inverts every permission-denial test fixture (a readonly
      # file that must fail validation validates; a copy rigged to fail
      # succeeds). Real WSL2 development happens as an ordinary user, so the
      # tests run as one. Provisioning steps stay root; only the test step
      # drops privileges.
      - name: Create the unprivileged test user
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          id -u biscuit >/dev/null 2>&1 || useradd -m -s /bin/bash biscuit
          # Passwordless sudo so recipes that self-elevate (apt installs in
          # `_ensure-native-libs`) keep working if ever invoked as the user.
          echo 'biscuit ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/biscuit
          chmod 0440 /etc/sudoers.d/biscuit
      # Source and build go to INDEPENDENT guest paths: the archive, its
      # manifest, and the verifier live under `$GUEST_BUILD`, never inside the
      # checkout, so nothing about the extraction can be mistaken for source.
      - name: Place the source and the build in the guest
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          # `wsl-bash` starts in the translated workspace directory, so `pwd` is
          # the one workspace path that needs no WSLENV forwarding to be correct.
          workspace="$(pwd)"
          git config --global --add safe.directory '*'
          revision="$(git -C "$workspace" rev-parse HEAD)"

          guest_root='${{ env.GUEST_ROOT }}'
          rm -rf "$guest_root" '${{ env.GUEST_BUILD }}'
          # `git clone` creates the leaf but not the intervening directories, and
          # the guest has no such path until something makes it.
          mkdir -p "$(dirname "$guest_root")" '${{ env.GUEST_BUILD }}'
          # Building over the workspace pays the 9p boundary penalty on every
          # file access; ext4 is both faster and where real WSL developers keep
          # their repositories, so it is the configuration worth testing.
          git clone --no-hardlinks "$workspace" "$guest_root"
          git -C "$guest_root" checkout --detach "$revision"

          cp -R "$workspace/ci-build-artifact/." '${{ env.GUEST_BUILD }}/'
          cp "$workspace/ci-resolved-plan/resolved-plan.json" '${{ env.GUEST_BUILD }}/'
          # The test step runs as `biscuit` (see the user-creation step); every
          # tree it touches must be writable by that user, not root.
          chown -R biscuit:biscuit "$guest_root" '${{ env.GUEST_BUILD }}' /home/biscuit
      - name: Install just and cargo-nextest in the guest
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          # Deliberately NOT rustup: the guest only RUNS prebuilt test binaries
          # from the archive, so a Rust toolchain would add minutes and buy
          # nothing. cargo-nextest executes an archive without Cargo or rustc.
          curl_get() {
            curl --proto '=https' --tlsv1.2 -sSfL \
              --retry 5 --retry-delay 5 --retry-all-errors \
              --connect-timeout 15 "$@"
          }
          # A retried download must target a file: stdout cannot be rewound, so
          # streaming a partial response into tar would preserve corrupt bytes.
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          curl_get --output "$download_dir/just.tar.gz" \
            'https://github.com/casey/just/releases/download/${{ env.JUST_VERSION }}/just-${{ env.JUST_VERSION }}-x86_64-unknown-linux-musl.tar.gz'
          tar xzf "$download_dir/just.tar.gz" -C /usr/local/bin just
          curl_get --output "$download_dir/nextest.tar.gz" \
            https://get.nexte.st/latest/linux
          tar xzf "$download_dir/nextest.tar.gz" -C /usr/local/bin
          just --version
          cargo-nextest nextest --version
      - name: Install native prerequisites in the guest
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          # A WSL2 guest IS Linux, so it consumes the `ubuntu-latest` package
          # list — the same dependency-closure union the producer installed.
          # Satisfying only the producer is insufficient when an archived binary
          # dynamically links a library the guest lacks.
          #
          # Interpolated, NOT read from `env:`: step env lives on the Windows
          # host process, and `wsl-bash` forwards only WSLENV-listed variables
          # into the guest — an `env:`-sourced $NATIVE is unbound here.
          cd '${{ env.GUEST_ROOT }}'
          packages="$(jq -r '."ubuntu-latest" // [] | .[]' <<<'${{ inputs.native }}')"
          native_args=()
          while IFS= read -r package; do
            if [ -n "$package" ]; then native_args+=("$package"); fi
          done <<<"$packages"
          if [ ${#native_args[@]} -gt 0 ]; then
            just _ensure-native-libs "${native_args[@]}"
          fi
      # STRICT VERIFICATION, IN THE GUEST, BEFORE ANYTHING IS EXTRACTED.
      #
      # It runs here rather than on the Windows host because the predicates that
      # matter are the GUEST's: architecture, ABI, libc, and the dynamic
      # libraries the archived binaries will actually resolve against. A
      # verifier executed on the host would report `msvc` and prove nothing
      # about the machine that runs the tests. The verifier is the Linux
      # `ci-build` the producer shipped inside the artifact — the guest has no
      # Cargo and could not build one.
      - name: Verify the build in the guest
        id: verified
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          # The 9p workspace, before the `cd`: `$GITHUB_OUTPUT` is a Windows
          # path this guest cannot write, so every measurement the host needs
          # crosses back as a file the status step reads (the same reason the
          # manifest is read on the host).
          workspace="$(pwd)"
          mkdir -p "$workspace/wsl-timing"
          cd '${{ env.GUEST_ROOT }}'
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          started="$(date +%s)"
          status=0
          just _ci_build_verify \
            '${{ env.GUEST_BUILD }}' \
            '${{ steps.build.outputs.artifact }}' \
            wsl2-ubuntu \
            '${{ env.GUEST_BUILD }}/resolved-plan.json' || status=$?
          echo "$(( $(date +%s) - started ))" >"$workspace/wsl-timing/verify.seconds"
          # Written whether or not the build was accepted: a refused cell's
          # transfer and verification cost is exactly what a reader wants.
          cp '${{ env.GUEST_BUILD }}/${{ steps.build.outputs.artifact }}.verdict.json' \
            "$workspace/wsl-timing/verdict.json" 2>/dev/null || true
          exit "$status"
      # DIAGNOSTIC ONLY — nothing below changes what runs or how it is reported.
      #
      # THE CONFIRMED FAILURE, AND WHY THE CENSUS RUNS *BEFORE* EXTRACTION
      #
      # Extracting a large archive into the guest exhausts the WINDOWS RUNNER's
      # disk, not the guest's. Run 30605643702, all four claudine shards, ~3
      # minutes after `Extracting 153 binaries`:
      #
      #   ##[error]There is not enough space on the disk. :
      #     'C:\actions-runner\cached\2.336.0\_diag\blocks\...'
      #
      # That path is the runner's OWN diagnostic writer. Once it cannot write,
      # the runner is finished: every remaining step is abandoned, including the
      # `always()` producer status. That is why claudine published no
      # `status-claudine-L1-wsl2-ubuntu-*` artifact at all while darkmatter — same
      # run, same shard count — published all four.
      #
      # In run 30595280027 the same exhaustion surfaced one layer down as SIGBUS
      # (signal 7, exit 135): a page mapped from a VHDX that could no longer grow
      # cannot be backed, and an unbacked mapped page is a bus error rather than
      # an `ENOSPC` return. Same cause, different symptom depending on which
      # write hits the wall first.
      #
      # It is a capacity threshold, not a code question — claudine's archive was
      # 6.4 GiB when it carried five packages, darkmatter's 3.9 GiB and its
      # guests survive. Per-package archives are far smaller, but the census
      # stays: it is cheap, and the next capacity cliff is unknowable in advance.
      #
      # Hence the ordering below. A post-mortem cannot run on a runner that has
      # already died, so the measurement that matters is taken BEFORE extraction,
      # where it is guaranteed to reach the log.
      - name: Census the Windows host before extraction
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: |
          # Headroom on the volume the guest's VHDX grows into. This number is
          # the whole diagnosis: compare it against the extracted size of the
          # package's archive.
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}},
                                @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} |
            Format-Table | Out-String | Write-Host
      - name: Census the guest before the archive is extracted
        if: ${{ !cancelled() }}
        shell: wsl-bash {0}
        run: |
          set -uo pipefail
          workspace="$(pwd)"
          mkdir -p "$workspace/wsl-diag"
          {
            echo "=== $(date -u +%FT%TZ) guest census ==="
            uname -a
            echo "--- filesystem backing each path extraction touches ---"
            for path in /tmp / /home; do
              # -T resolves the mount for a PATH, so this is correct whether or
              # not the directory is itself a mount point.
              findmnt -T "$path" -o TARGET,SOURCE,FSTYPE,SIZE,AVAIL 2>&1 || echo "$path: findmnt failed"
            done
            echo "--- df ---"
            df -h / /tmp /home 2>&1
            echo "--- memory ---"
            free -m
            swapon --show 2>&1 || true
          } 2>&1 | tee "$workspace/wsl-diag/guest-census.txt"
      # Gate command: a failed suite fails this producer visibly. The status
      # and report steps below still run when the job was not cancelled, so
      # the area rollup can render the cell-level diagnosis.
      - name: L1 tests from the archive
        id: l1
        shell: wsl-bash {0}
        env:
          GUEST_ROOT: ${{ env.GUEST_ROOT }}
        run: |
          set -euo pipefail
          # Drop to the unprivileged user: root ignores file permissions, which
          # inverts permission-denial fixtures (claudine's readonly-file and
          # shadow-home-copy tests, sniff's worktree-registry test). `env`
          # preserves the wrapper environment while giving the user its own
          # HOME, which tests that write under HOME rely on.
          # `-u XDG_RUNTIME_DIR`: the preserved environment carries root's
          # `/run/user/0`, and `just` dies with EACCES trying to use it as the
          # unprivileged user — which took out every guest leg on run
          # 31415404872. Unset, it falls back to a user-writable location.
          if [ "$(id -u)" -eq 0 ]; then
            exec runuser -u biscuit -- env -u XDG_RUNTIME_DIR HOME=/home/biscuit USER=biscuit LOGNAME=biscuit bash "$0"
          fi
          # Re-exported from the job-level `env:` block through GitHub expression
          # interpolation rather than read from the guest environment: whether
          # `wsl-bash` forwards a given variable depends on WSLENV, and the
          # result identity is far too consequential to leave to that. A missing
          # or wrong BISCUIT_CI_ENVIRONMENT does not fail — it silently files
          # these results under the native Windows cell.
          export BISCUIT_CI_ENVIRONMENT='${{ env.BISCUIT_CI_ENVIRONMENT }}'
          export NEXTEST_PROFILE='${{ env.NEXTEST_PROFILE }}'
          export COLORTERM='${{ env.COLORTERM }}'
          export BISCUIT_L1_INCLUDE_SLOW='${{ env.BISCUIT_L1_INCLUDE_SLOW }}'
          guest_root='${{ env.GUEST_ROOT }}'
          # WSL appends the Windows host PATH by default. On hosted runners that
          # adds dozens of /mnt/c entries, so every intentionally missing binary
          # probe crosses the 9p boundary dozens of times. Claudine performs many
          # such discovery probes; the inherited PATH turned sub-second tests
          # into 20-second tests and made this serial, archive-only lane take
          # hours. The guest is intentionally self-contained and installs every
          # required executable under the standard Linux prefixes above.
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          # Every compile-time tool the package declared reaches the guest as a
          # VERIFIED build sidecar. Nothing is built here, and the guest proves
          # it has no toolchain to build one with.
          sidecars='${{ env.GUEST_BUILD }}/${{ steps.build.outputs.artifact }}-sidecars'
          if [ -d "$sidecars" ]; then
            export PATH="$sidecars:$PATH"
            if [ -x "$sidecars/stub_dunstify" ]; then
              export MESSENGER_STUB_BIN_DIR="$sidecars"
            fi
          fi
          if command -v cargo >/dev/null 2>&1 || command -v rustc >/dev/null 2>&1; then
            echo "the wsl2-ubuntu cell requires a toolchain-free unprivileged guest" >&2
            exit 1
          fi
          # No Cargo in the guest, so the canonical recipe must reach nextest as
          # a standalone binary and stage its JUnit report without shelling out
          # to `cargo metadata`. See fixes/2026-07-27-refactor/wsl-archive-requirements.md.
          export BISCUIT_NEXTEST_BIN='cargo-nextest nextest'
          export BISCUIT_JUNIT_WORKSPACE_ROOT="$guest_root"
          export BISCUIT_JUNIT_TARGET_DIR="$guest_root/target"
          # insta finds the workspace root by running `cargo metadata`; with no
          # cargo in the guest its manifest-dir fallback DOUBLES the snapshot
          # path (darkmatter/lib/darkmatter/lib/...), every .snap looks absent,
          # and each snapshot test fails while rendering correct output — 165
          # phantom failures on run 30791562395. Pin the root explicitly.
          export INSTA_WORKSPACE_ROOT="$guest_root"
          export BISCUIT_JUNIT_STAGE_DIR="$guest_root/target/nextest/ci-reports"

          archive='${{ env.GUEST_BUILD }}/${{ steps.manifest.outputs.archive_name }}'
          [ -f "$archive" ] || { echo "the verified archive is missing at $archive" >&2; exit 1; }

          # DIAGNOSTIC ONLY. Started HERE rather than in its own step so it is
          # unambiguously alive across extraction — a background process from an
          # earlier `wsl-bash` invocation would depend on surviving that
          # invocation's exit, which is exactly the assumption a dying guest
          # breaks. It writes across the 9p mount, ON PURPOSE: a log on ext4 is
          # unreachable from the Windows host once the VM is gone, and a VM that
          # is gone is the case being diagnosed. Self-limiting so nothing outlives
          # the job's own ceiling.
          workspace="$(pwd)"
          mkdir -p "$workspace/wsl-diag"
          cat >/tmp/biscuit-sampler.sh <<'SAMPLER'
          #!/bin/bash
          out="$1"
          for _ in $(seq 1 400); do
            {
              printf '%s' "$(date -u +%FT%TZ)"
              df -BM --output=target,avail /tmp / /home 2>/dev/null | tail -n +2 | tr -s ' \n' ' '
              printf '| memAvailMiB=%s' "$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)"
              printf ' | %s\n' "$(tr '\n' ' ' </proc/pressure/memory 2>/dev/null)"
            } >>"$out"
            sleep 10
          done
          SAMPLER
          chmod +x /tmp/biscuit-sampler.sh
          setsid nohup /tmp/biscuit-sampler.sh \
            "$workspace/wsl-diag/guest-resources.log" >/dev/null 2>&1 &

          # --workspace-remap is not optional: the archive records the PRODUCER's
          # source paths, and the guest checkout is its own clone. Declared
          # feature flags are passed along and dropped by
          # `_archive_drop_build_flags` — they were baked into the archive.
          cd "$guest_root"
          started="$(date +%s)"
          status=0
          just _test "${{ inputs.package }}" \
            --no-fail-fast \
            --archive-file "$archive" \
            --workspace-remap "$guest_root" \
            ${{ inputs.test-args }} || status=$?
          # The gate's own window, recorded whether it passed or failed and
          # carried back across the 9p mount for the host's status step. It
          # contains the extraction nextest performs inside the run, which is
          # why the verifier reports its own extraction separately.
          mkdir -p "$workspace/wsl-timing"
          echo "$(( $(date +%s) - started ))" >"$workspace/wsl-timing/l1.seconds"
          exit "$status"
      - name: Stage the JUnit reports for upload
        id: stage_junit
        if: ${{ !cancelled() }}
        shell: wsl-bash {0}
        run: |
          set -uo pipefail
          # The upload runs on the Windows host, which cannot read ext4, so the
          # reports cross the 9p mount once, at the end, rather than per test.
          workspace="$(pwd)"
          rm -rf "$workspace/wsl-junit"
          mkdir -p "$workspace/wsl-junit"
          # The CONTENTS of the staging root, so `manifest.jsonl` lands at the
          # artifact root. `ci-rollup` reads the manifest only from there;
          # copying `target/nextest/` instead would bury it one level down.
          cp -R '${{ env.GUEST_ROOT }}/target/nextest/ci-reports/.' \
            "$workspace/wsl-junit/" 2>/dev/null || true
          # Staging must never change the tier's outcome.
          exit 0
      - name: Upload wsl2-ubuntu L1 JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: junit-${{ inputs.package }}-L1-wsl2-ubuntu
          path: wsl-junit
          if-no-files-found: ignore
      # DIAGNOSTIC ONLY, and deliberately `continue-on-error`: if the guest is
      # dead this step cannot run, and that failure is itself the finding — it
      # must not be allowed to overwrite the tier's real outcome.
      - name: Guest post-mortem
        id: guest_postmortem
        if: ${{ !cancelled() && steps.l1.outcome == 'failure' }}
        continue-on-error: true
        shell: wsl-bash {0}
        run: |
          set -uo pipefail
          workspace="$(pwd)"
          mkdir -p "$workspace/wsl-diag"
          {
            echo "=== $(date -u +%FT%TZ) guest post-mortem ==="
            df -h / /tmp /home 2>&1
            free -m
            # An OOM kill or an ext4 I/O error — the two ways a backing store
            # failure becomes a signal — are both recorded here and nowhere else.
            echo "--- dmesg tail ---"
            dmesg -T 2>&1 | tail -120
          } 2>&1 | tee "$workspace/wsl-diag/guest-postmortem.txt"
      - name: Host post-mortem
        if: ${{ !cancelled() && steps.l1.outcome == 'failure' }}
        continue-on-error: true
        shell: pwsh
        run: |
          # The VHDX only ever grows, so a Windows volume that is full HERE was
          # full when the guest died. This is the measurement that separates "the
          # guest filled its own filesystem" from "the guest's disk could not grow
          # because the host had nothing left to give it".
          $ErrorActionPreference = 'Continue'
          # wsl.exe emits UTF-16 by default, which is why it renders as spaced-out
          # characters in the raw Actions logs. WSL_UTF8 makes it emit UTF-8
          # instead. Reaching for [Console]::OutputEncoding would be the wrong
          # lever: it also governs what pwsh WRITES, so it would garble this
          # step's own output to fix someone else's.
          $env:WSL_UTF8 = '1'
          New-Item -ItemType Directory -Force -Path wsl-diag | Out-Null
          $report = @("=== host post-mortem $(Get-Date -Format o) ===")
          $report += Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}},
                                @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} |
            Out-String
          $report += "--- wsl --status ---"
          $report += (wsl.exe --status 2>&1 | Out-String)
          $report += "--- wsl --list --verbose ---"
          $report += (wsl.exe --list --verbose 2>&1 | Out-String)
          $report += "--- backing VHDX ---"
          # Bounded depth: a recursive sweep of the whole profile would cost
          # minutes on a Windows runner for a file whose location is well known.
          $roots = @("$env:LOCALAPPDATA\Packages", "$env:LOCALAPPDATA\wsl") |
            Where-Object { Test-Path $_ }
          if ($roots) {
            # No backtick continuations anywhere in this step: a single trailing
            # space after one silently turns it into a syntax error, and this
            # script cannot be parse-checked on a macOS or Linux host.
            $vhdx = Get-ChildItem -Path $roots -Recurse -Depth 3 -Filter 'ext4.vhdx' -ErrorAction SilentlyContinue
            $report += $vhdx |
              Select-Object FullName, @{n='SizeGB';e={[math]::Round($_.Length/1GB,2)}} |
              Out-String
          }
          $report | Tee-Object -FilePath wsl-diag/host-postmortem.txt
      - name: Upload WSL2 diagnostics
        # A refused build skips the test step, so the verdict document — the
        # only machine-readable record of WHY the guest refused — has to ride
        # along on a verification failure too. The status artifact carries
        # only the outcome.
        if: ${{ !cancelled() && (steps.l1.outcome == 'failure' || steps.verified.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          # A prefix `ci-rollup` does not walk: this is evidence for a human
          # reading a failure, never an input to a cell's verdict.
          name: wsl-diag-${{ inputs.package }}-wsl2-ubuntu
          path: |
            wsl-diag
            wsl-timing/verdict.json
          if-no-files-found: ignore
          retention-days: 3
      # `L1`, not `wsl`: `ci-rollup` keys a status by TIER, and this job produces
      # the wsl2-ubuntu L1 evidence. A non-tier name would manufacture a phantom
      # cell beside the real one.
      - name: Record producer status
        if: ${{ always() }}
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          JOB: L1
          ENVIRONMENT: wsl2-ubuntu
          JOB_STATUS: ${{ job.status }}
          # Provisioning is two steps, so its outcome is the SECOND attempt's
          # unless the first already succeeded — otherwise a guest that came up
          # on the retry would still be reported as never having provisioned.
          PROVISION: ${{ steps.provision.outcome == 'success' && 'success' || steps.provision_retry.outcome }}
          PROVISION_FIRST: ${{ steps.provision.outcome }}
          L1: ${{ steps.l1.outcome }}
          STAGED: ${{ steps.stage_junit.outcome }}
          VERIFIED: ${{ steps.verified.outcome }}
          BUILD_KEY: ${{ steps.build.outputs.key }}
          BUILD_PRODUCER: ${{ steps.build.outputs.producer }}
          BUILD_DIGEST: ${{ steps.manifest.outputs.digest }}
          DOWNLOAD_SECONDS: ${{ steps.manifest.outputs.download_seconds }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/status"
          # `result` is the CELL's conclusion. The test step fails the producer
          # directly; folding L1 remains defensive and keeps the status format
          # correct if GitHub reports a healthy job during an `always()` step.
          result="$JOB_STATUS"
          if [ "$result" = "success" ] && [ "$L1" = "failure" ]; then
            result=failure
            echo "::error title=${PACKAGE} ${JOB} (${ENVIRONMENT}) failed::the L1 suite failed in the WSL2 guest."
          fi
          # Name WHY no evidence exists, when that is the case.
          #
          # A guest that dies takes the staging step with it, `wsl-junit` stays
          # empty, and `if-no-files-found: ignore` uploads nothing successfully —
          # so the rollup could only say "produced no report at all", which reads
          # identically to a tier that ran and had no tests. Only the producer
          # can tell those apart, so it says which.
          #
          # A failing TEST needs no detail: the guest stays healthy, staging
          # succeeds, and the report the rollup reads is uploaded normally.
          detail=""
          if [ "$PROVISION" != "success" ]; then
            detail="the WSL2 guest failed to provision (attempt 1: ${PROVISION_FIRST}, attempt 2: ${PROVISION}); no test could run"
          elif [ "$VERIFIED" != "success" ]; then
            detail="build ${BUILD_KEY} produced on ${BUILD_PRODUCER} was refused by the guest's verification (${VERIFIED}); no test was started and nothing was compiled to replace it"
          elif [ "$STAGED" != "success" ]; then
            detail="the WSL2 guest became unreachable after the test step (L1: ${L1}, staging: ${STAGED}); its reports could not be collected"
          fi
          # This cell's stages. The guest cannot write `$GITHUB_OUTPUT`, so each
          # window it measured crossed the 9p mount as a file; a guest that died
          # leaves none, and the stage reports 0 rather than a fabricated
          # duration. Reporting only — the cell's identity stays
          # {package, environment, gate}.
          # Anything that is not a plain count reports 0. This step runs under
          # `always()` and is the cell's only evidence: instrumentation must not
          # be able to lose it.
          number() {
            case "${1:-}" in
              ''|*[!0-9]*) echo 0 ;;
              *) echo "$1" ;;
            esac
          }
          read_seconds() {
            if [ -f "wsl-timing/$1" ]; then
              number "$(tr -cd '0-9' <"wsl-timing/$1")"
            else
              echo 0
            fi
          }
          extract_ms=0
          if [ -f wsl-timing/verdict.json ]; then
            extract_ms="$(jq -r '.timings.extract_ms // 0' wsl-timing/verdict.json 2>/dev/null || echo 0)"
          fi
          timings="$(jq -cn \
            --argjson download "$(number "${DOWNLOAD_SECONDS:-}")" \
            --argjson verify "$(read_seconds verify.seconds)" \
            --argjson extract "$(number "$extract_ms")" \
            --argjson execute "$(read_seconds l1.seconds)" \
            '{download_seconds: $download, verify_seconds: $verify,
              extract_ms: $extract, execute_seconds: $execute}')"
          jq -cn \
            --arg package "$PACKAGE" --arg job "$JOB" --arg environment "$ENVIRONMENT" \
            --arg result "$result" --arg detail "$detail" \
            --arg key "${BUILD_KEY:-}" --arg producer "${BUILD_PRODUCER:-}" \
            --arg digest "${BUILD_DIGEST:-}" \
            --argjson timings "$timings" \
            '{package: $package, job: $job, environment: $environment, result: $result}
             + (if $detail == "" then {} else {detail: $detail} end)
             + (if $key == "" then {}
                else {build: {key: $key, producer: $producer, digest: $digest}} end)
             + {timings: $timings}' \
            >"$RUNNER_TEMP/status/status.json"
      - name: Upload producer status
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: status-${{ inputs.package }}-L1-wsl2-ubuntu
          path: ${{ runner.temp }}/status
