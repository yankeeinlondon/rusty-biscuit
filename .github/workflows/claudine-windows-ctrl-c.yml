name: claudine-windows-ctrl-c

# Reusable Windows-host runtime verification for Claudine's wrapper Ctrl+C
# parity. Orchestrated by `ci.yml` when Claudine is in the affected scope (D12),
# so it no longer self-triggers on pushes/PRs. Runs the ignored Windows
# console-control integration test that needs a Windows host and an attached
# console. Also dispatchable manually.

on:
  workflow_call: {}
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: never
  RUSTFLAGS: "-D warnings"

jobs:
  verify:
    name: claudine / L3 windows Ctrl+C
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up the pinned Rust toolchain
        run: rustup show

      # Backstop for the vendored protoc in rendezvous-core's build.rs:
      # a system protoc if the vendored binary is ever unavailable.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: claudine-windows-ctrl-c

      - name: Run Windows Ctrl+C verification test
        shell: cmd
        run: cargo test -p claudine-cli --test level3_wrap_ctrl_c -- --ignored windows_ctrl_c_verification_record --nocapture
