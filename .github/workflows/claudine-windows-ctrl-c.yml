name: claudine-windows-ctrl-c

# Opt-in Windows-host runtime verification for Claudine's wrapper Ctrl+C parity.
# This runs the ignored Windows console-control integration test that needs a
# Windows host and an attached console.

on:
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: never

concurrency:
  group: claudine-windows-ctrl-c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows Ctrl+C runtime verification
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: claudine-windows-ctrl-c

      - name: Run Windows Ctrl+C verification test
        shell: cmd
        run: cargo test -p claudine-cli --test level3_wrap_ctrl_c -- --ignored windows_ctrl_c_verification_record --nocapture
