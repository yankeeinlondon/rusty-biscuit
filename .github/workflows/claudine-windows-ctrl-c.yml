name: claudine-windows-ctrl-c

# Opt-in Windows-host runtime verification for Claudine's wrapper Ctrl+C parity.
# This runs the ignored Windows console-control integration test that needs a
# Windows host and an attached console.

on:
  pull_request:
    paths:
      - ".github/workflows/claudine-windows-ctrl-c.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "claudine/**"
      - "just/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/claudine-windows-ctrl-c.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "claudine/**"
      - "just/**"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: never
  RUSTFLAGS: "-D warnings"

concurrency:
  group: claudine-windows-ctrl-c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows Ctrl+C runtime verification
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Backstop for the vendored protoc in rendezvous-core's build.rs:
      # a system protoc if the vendored binary is ever unavailable.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: claudine-windows-ctrl-c

      - name: Run Windows Ctrl+C verification test
        shell: cmd
        run: cargo test -p claudine-cli --test level3_wrap_ctrl_c -- --ignored windows_ctrl_c_verification_record --nocapture
