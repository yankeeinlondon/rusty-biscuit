name: pr-health

# Guards against a pull request that schedules NO workflow run at all.
#
# `pull_request` workflows run against the merge commit `refs/pull/N/merge`.
# When a PR conflicts with its base, GitHub cannot create that ref and so
# creates no workflow run — silently. No check suite, no annotation, nothing in
# the Actions tab. The PR renders exactly like one whose CI has not started yet,
# and `ci-verdict` never reports, so nothing blocks and nothing explains why.
#
# That is the same defect class the cross-platform CI refactor exists to remove
# (see `fixes/2026-07-27-refactor/plan.md` §0.2/§1.3): absence of evidence must
# be loud, and must never be mistakable for success. Measured on PR #19, where a
# conflicted `baseline-failures.txt` suppressed the entire matrix undetected.
#
# Two triggers, because neither alone is sufficient:
#
#   `pull_request_target` runs in the context of the BASE branch, so it needs no
#   merge commit and fires even while the PR conflicts. It covers open/reopen.
#
#   `push` covers the case where a PR already exists and a later push
#   introduces the conflict, and is a backstop in case a future GitHub change
#   makes `pull_request_target` depend on the merge ref after all.
#
# SECURITY: `pull_request_target` runs with a token that can be write-scoped and
# is a known footgun. This workflow NEVER checks out pull-request code and never
# executes anything from the head branch — it only reads the PR's mergeability
# through the API. Keep it that way; do not add `actions/checkout` of the head
# ref here.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mergeable:
    name: PR schedules a CI run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assert the merge commit can be created
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          pr="${EVENT_PR:-}"
          if [ -z "$pr" ]; then
            # push event: find an open PR for this branch. No PR yet is the
            # normal case for a freshly pushed branch and is not a failure.
            pr="$(gh api "repos/${REPO}/pulls" -f state=open -f head="${REPO%%/*}:${BRANCH}" \
                    --jq '.[0].number // empty' 2>/dev/null || true)"
            if [ -z "$pr" ]; then
              echo "No open pull request for '${BRANCH}' — nothing to check."
              exit 0
            fi
          fi

          # `mergeable` is computed asynchronously and reads `null` until the
          # background job finishes. Polling is required; a single read races
          # and would report a healthy PR as unknown.
          state="null"
          for _ in $(seq 1 15); do
            state="$(gh api "repos/${REPO}/pulls/${pr}" --jq '.mergeable // "null"')"
            [ "$state" != "null" ] && break
            sleep 4
          done

          if [ "$state" = "null" ]; then
            # Never seen in practice, but failing here would gate merges on a
            # GitHub background job rather than on the repository's state.
            echo "::warning::GitHub did not finish computing mergeability for #${pr} within 60s."
            exit 0
          fi

          if [ "$state" = "false" ]; then
            reason="$(gh api "repos/${REPO}/pulls/${pr}" --jq '.mergeable_state')"
            echo "::error title=PR #${pr} conflicts with its base::No CI run will be scheduled."
            {
              echo "## ❌ PR #${pr} conflicts with its base branch"
              echo
              echo "\`mergeable=false\`, \`mergeable_state=${reason}\`."
              echo
              echo "**Consequence: \`ci.yml\` will not run at all, and will not report an error.**"
              echo "\`pull_request\` workflows execute against the merge commit"
              echo "\`refs/pull/${pr}/merge\`, which GitHub cannot create while the PR"
              echo "conflicts. No check suite is created, so the pull request looks"
              echo "identical to one whose CI has simply not started yet, and"
              echo "\`ci-verdict\` never reports a verdict either way."
              echo
              echo "Merge or rebase the base branch into this one, resolve the"
              echo "conflicts, and push. This check will clear once"
              echo "\`refs/pull/${pr}/merge\` exists."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "PR #${pr} is mergeable (${state}); the merge ref exists and CI can be scheduled."
