name: coverage

# Generates one full-workspace LCOV report on the nightly schedule or by
# explicit request. Pull requests use the affected-package coverage job in
# `ci.yml`; pushes to main do not repeat coverage already generated for a PR.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      # Backstop for the vendored protoc in rendezvous-core's build.rs:
      # a system protoc if the vendored binary is ever unavailable.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate one workspace coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov-workspace.info

      - name: Upload workspace LCOV artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-workspace
          path: lcov-workspace.info
