name: coverage

# Generates one full-workspace LCOV report on the nightly schedule or by
# explicit request. Pull requests use the affected-package coverage job in
# `ci.yml` (artifact `lcov-affected`); pushes to main do not repeat coverage
# already generated for a PR.
#
# Deliberately distinct from required validation (D14): its own workflow name,
# its own schedule slot, its own artifact name, and its own summary, so a
# coverage failure can never be read as an L1 regression. Scheduled at 05:00 UTC
# to keep every scheduled workflow in its own slot — bench-nightly 00:00,
# fuzz-nightly 02:00, sniff-performance 04:00, coverage 05:00,
# maintenance-audit Mondays 07:00.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

env:
  # The repository tracks no rustc wrapper; cleared explicitly so a stray
  # environment value cannot silently intercept this workflow's builds.
  RUSTC_WRAPPER: ""
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: coverage / workspace / ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      # Instrumenting the whole workspace compiles every area, so every area's
      # declared system libraries must be present first (D9).
      - name: Install native prerequisites
        run: just _ensure-native-libs

      - name: Set up the pinned toolchain with coverage components
        run: |
          rustup show
          rustup component add llvm-tools-preview

      # Backstop for the vendored protoc in rendezvous-core's build.rs:
      # a system protoc if the vendored binary is ever unavailable.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate one workspace coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov-workspace.info

      - name: Upload workspace LCOV artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-workspace
          path: lcov-workspace.info

      - name: Summarize
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Scheduled coverage"
            echo ""
            echo "Full-workspace LCOV, artifact \`lcov-workspace\`."
            echo "Not a required check — pull-request coverage is the"
            echo "\`lcov-affected\` artifact from the \`ci\` workflow."
          } >>"$GITHUB_STEP_SUMMARY"
