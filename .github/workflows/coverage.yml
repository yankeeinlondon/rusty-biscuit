name: coverage

# Generates per-package LCOV coverage reports and a workspace-aggregated
# report. Uploads artifacts for review. Report-only — no PR gating.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: coverage

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Generate per-package coverage
        run: just coverage

      - name: Collect per-package LCOV reports
        run: |
          mkdir -p coverage-reports
          # Per-package recipes drop `lcov-<pkg>.info` next to each package
          # area; gather them for upload.
          find . -type f -name 'lcov-*.info' \
            -not -path './coverage-reports/*' \
            -not -path './target/*' \
            -print -exec cp {} coverage-reports/ \;

      - name: Upload per-package LCOV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lcov-per-package
          path: coverage-reports/

      - name: Generate workspace coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov-workspace.info

      - name: Upload workspace LCOV artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-workspace
          path: lcov-workspace.info
