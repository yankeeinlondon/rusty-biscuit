name: package-ci

# One package AREA's execution workflow: it expands the dispatch rows the
# planner derived for that area, one hosted job per executing cell.
#
# THE FILENAME IS HISTORICAL (ruling R5). This workflow is called once per
# AREA, not once per package, but it is named in `GLOBAL_PATHS_ALL_GATES` and
# `ORCHESTRATION_PATHS` — the pairing that keeps a workflow edit from
# invalidating every published local cell — and in `runner_loss.py`, the
# four-level depth contract, the CI README, and two skills. Renaming it would
# move all of that for a cosmetic gain.
#
# THE ROW IS THE ONLY INPUT THAT VARIES
#
# A row carries dispatch identity alone — `{package, gate, environment,
# runner}` — because GitHub builds a matrix job's label from every value in it
# (ruling R1), so `test (homelab-server, L1, ubuntu-latest, ubuntu-latest)` is
# a readable label AND the whole key. Everything else each job needs it
# resolves from the run's `ci-resolved-plan` artifact through
# `scripts/ci/cell_contract.py`, which refuses an unknown, duplicated,
# non-executing, or mismatched row with a coded reason before anything runs.
# No job here reads `.github/ci/environments.json`, a Cargo manifest, or a
# package policy block: the plan is the one document that decides what runs,
# and a run that carried a scope receipt has no checkout to re-derive it from.
#
# `environment` is NOT `os`. Windows, macOS, and Linux are operating systems;
# WSL2 is a distinct supported Linux environment that a Windows runner HOSTS.
# Every result identity — artifact name, JUnit manifest record, rollup cell —
# is keyed by {package, environment, gate}. Only `runs-on` reads the row's
# `runner`, and the WSL2 rows are dispatched through `_wsl-ci.yml` precisely so
# they can never take a `runner.os == 'Windows'` branch for dependency
# installation, paths, shells, caching, or artifact collection.
#
# Policy this encodes: the canonical per-package recipes (`_test`, `_test_l2`,
# `_test_browser`, `_lint`) on exactly the cells the plan resolved to hosted
# execution; `check`, `lint`, and `test` are independent gates and NO test job
# waits on another (ruling R3 — the old `needs: test` staging was resource
# ordering, and the specification forbids an L1 prerequisite that can suppress
# required L2 or browser work); no sharding anywhere (compilation is ~85% of a
# shard and every shard pays it in full — see fixes/2026-08-06-cicd/spec.md
# § Sharding). Cargo artifacts are cached by `Swatinem/rust-cache` only, keyed
# per package — see docs/kache-strategy.md for why the kache rustc-wrapper was
# removed from CI. Only `check` and `lint` have a cache here: a test tier
# consumes a verified archive, so it installs no toolchain and has nothing to
# cache.
#
# A PRODUCER PROVES ITSELF. A failed gate command fails its job, and so does a
# producer that ran fewer tests than it expected to: `_expected_manifest` lists
# what this cell must produce before the gate runs, `completion.py` compares
# that listing against the staged reports as identities afterwards, and the
# completion record is written and uploaded ONLY when every check holds (ruling
# R10). A green status whose completion artifact is absent is an audit failure.
# The gate command keeps an `id:` so `Record producer status` can publish the
# cell outcome even after failure; JUnit/status uploads use explicit status
# predicates for the same reason. Every matrix has `fail-fast: false`, so a red
# producer does not cancel the other cells that still lack qualifying evidence.

on:
  workflow_call:
    inputs:
      tested-revision:
        description: "The resolved plan's `head`: the one revision this whole run tests, and the only checkout `ci-build` will produce or verify an archive against. Required, and never recomputed here — see the `env:` comment in `ci.yml`."
        type: string
        required: true
      test-rows:
        description: "JSON array of this area's NATIVE test rows (L1, L2, and browser cells on a runner that is its own environment). Each row is `{package, gate, environment, runner}`; the job resolves the rest from the plan."
        type: string
        default: '[]'
      check-rows:
        description: "JSON array of this area's `check` rows. Each row is `{package, gate, environment, runner}`."
        type: string
        default: '[]'
      lint-rows:
        description: "JSON array of this area's `lint` rows. Each row is `{package, gate, environment, runner}`."
        type: string
        default: '[]'
      wsl-rows:
        description: "JSON array of this area's `wsl2-ubuntu` rows, each delegated whole to `_wsl-ci.yml`. Kept apart from `test-rows` so a guest cell can never reach a `runs-on` matrix."
        type: string
        default: '[]'
      measure-compiler-work:
        description: "Count actual rustc invocations around each measured test command. Baseline collection only; defaults off so an ordinary run is byte-identical to the uninstrumented one."
        type: boolean
        required: false
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The repository tracks no rustc wrapper; cleared explicitly so a stray
  # environment value cannot silently intercept a package's builds.
  #
  # The Phase 1 compiler-work counter does NOT change this. When
  # `measure-compiler-work` is on, each measured gate step sets `RUSTC_WRAPPER`
  # in its OWN `env:` block, so the wrapper covers exactly one command; every
  # other build in the job — native prerequisites, runner-tool stubs, the
  # counter's own build — still sees the empty value here. Mixing wrapped and
  # unwrapped builds in one `target/` is a documented repository hazard, and a
  # job-level or workflow-level wrapper is what would cause it.
  RUSTC_WRAPPER: ""
  # Force TrueColor on headless runners so styled output matches local dev.
  COLORTERM: truecolor
  # Explicitly select the CI nextest profile (D6) — every `cargo nextest` in the
  # canonical recipes honors this and logs "nextest profile: ci". No reliance on
  # implicit environment detection. The plan carries the same value on every
  # executing test cell, and `completion.py` refuses a disagreement.
  NEXTEST_PROFILE: ci

jobs:
  # Compile gate for the target kinds no test gate builds, and for the seam
  # with the package's unchanged direct reverse dependencies. The test leg
  # compiles only lib/bins/tests, so the planner credits L1 with those kinds
  # and gives this gate a row on every native environment for a package
  # declaring `example` or `bench` targets, and on `ubuntu-latest` alone for a
  # package whose only reason is its dependents. `check_args` carries the
  # explicit `--examples`/`--benches` selectors; the command adds no target
  # flag of its own, so a blanket `--all-targets` would recompile what L1
  # already covered and mislabel the cell's coverage.
  #
  # It deliberately does NOT carry `RUSTFLAGS: -D warnings`. This gate answers
  # "does it COMPILE on this environment", and promoting warnings destroyed that
  # distinction three ways:
  #
  #   1. It lied. Dead code reported as `error: could not compile <crate>` when
  #      the crate compiled perfectly well.
  #   2. It blamed the wrong package. `playa`'s Windows leg went red for dead
  #      code in `biscuit-terminal`, compiled as a dependency.
  #   3. It had no local reproduction. `just check` sets no RUSTFLAGS, so no
  #      canonical recipe could reproduce the failure.
  #
  # Platform-conditional dead code is the normal shape of cross-platform Rust.
  # `lint` still denies warnings, through clippy inside `_lint`, so `just lint`
  # enforces the same bar off CI.
  #
  # No `name:`, here and in every other job below. GitHub labels an EXPANDED
  # matrix job from its matrix values (`check (sniff, check, windows-latest,
  # windows-latest)`) but never evaluates the matrix context for a job it
  # SKIPS, so a declared `name:` carrying `${{ matrix.* }}` reaches the Checks
  # tab as raw expression text — 63 such labels in run 34638047631. The default
  # label degrades to the static, human-readable job id instead (AC10). The
  # area half of the identity comes from the caller: a called workflow's jobs
  # render as `<caller job name> / <called job name>`, so this reads
  # `area-ci (sniff) / package-ci / check (sniff, check, windows-latest,
  # windows-latest)`.
  #
  # The guard is a SCALAR comparison of the input, read before matrix
  # expansion: an area with no check rows resolves this job immediately instead
  # of expanding an empty matrix, which is a strategy-evaluation error.
  check:
    if: ${{ inputs.check-rows != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        # `include:` and nothing else, so each row's four values become the
        # job's matrix context AND its label, in the order the planner emitted
        # them (ruling R1).
        include: ${{ fromJSON(inputs.check-rows) }}
    runs-on: ${{ matrix.runner }}
    # 45, not 30 — shared by `check`, `test`, and `lint` below.
    #
    # Measured on run 30562649123: completing cells for the heaviest packages
    # cluster at 19-29 minutes. The old 30-minute ceiling sat inside the normal
    # distribution rather than above it, and GitHub reports a timed-out step as
    # `cancelled`, so the rollup recorded MISSING evidence rather than a
    # timeout — indistinguishable, from the rollup's side, from a leg that
    # never ran.
    timeout-minutes: 45
    steps:
      - name: Mark the job start
        id: job_start
        if: ${{ inputs.measure-compiler-work }}
        shell: bash
        run: echo "epoch=$(date +%s)" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tested-revision }}
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Download the resolved execution plan
        uses: actions/download-artifact@v7
        with:
          name: ci-resolved-plan
          path: ci-artifacts/ci-resolved-plan
      - name: Resolve this cell's execution contract
        id: cell
        shell: bash
        env:
          ROW: ${{ toJSON(matrix) }}
        run: |
          set -euo pipefail
          python3 scripts/ci/cell_contract.py \
            --plan ci-artifacts/ci-resolved-plan/resolved-plan.json \
            --row "$ROW" \
            --head '${{ inputs.tested-revision }}' \
            --github-output "$GITHUB_OUTPUT"
      - name: Install native prerequisites
        shell: bash
        env:
          NATIVE: ${{ steps.cell.outputs.native_packages }}
          DEPENDENTS_NATIVE: ${{ steps.cell.outputs.dependents_native }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          # The dependent closure's prerequisites are installed only in the one
          # cell that compiles it (Linux, below), and the union is deduplicated
          # before it reaches the recipe.
          dependents='[]'
          if [ "${ENVIRONMENT:-}" = "ubuntu-latest" ]; then
            dependents="${DEPENDENTS_NATIVE:-[]}"
          fi
          native_args=()
          while IFS= read -r package; do
            if [ -n "$package" ]; then native_args+=("$package"); fi
          done < <(jq -r -n --argjson native "${NATIVE:-[]}" --argjson dependents "$dependents" \
            '($native + $dependents) | unique | .[]')
          if [ ${#native_args[@]} -gt 0 ]; then
            just _ensure-native-libs "${native_args[@]}"
          fi
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: package-ci-${{ matrix.package }}-check-${{ matrix.environment }}
      - name: Prepare the compiler-work counter
        id: counter
        if: ${{ inputs.measure-compiler-work }}
        shell: bash
        run: |
          set -euo pipefail
          just _ci_build_counter "check ${{ matrix.environment }}"
      # Gate command. Its outcome is both the producer and cell outcome.
      - name: cargo check (declared example/bench kinds)
        id: check
        env:
          # COMMAND-SCOPED, exactly as each test tier binds it. `check` is its
          # own compile CONFIGURATION — example and bench target kinds, its own
          # feature selection, and no archive — so its compiler work is counted
          # under that name. Without the label a post-cutover measurement would
          # show a second compile beside the one archive and give no reason for
          # it (specification section 6).
          RUSTC_WRAPPER: ${{ steps.counter.outputs.wrapper }}
          BISCUIT_CI_BUILD_WRAP: ${{ steps.counter.outputs.wrap }}
          BISCUIT_CI_BUILD_COUNTER_DIR: ${{ steps.counter.outputs.counter_dir }}
          BISCUIT_CI_BUILD_PACKAGE: ${{ matrix.package }}
          BISCUIT_CI_BUILD_CONFIGURATION: check ${{ matrix.environment }}
        run: cargo check ${{ steps.cell.outputs.check_args }}
      # The second half of the same cell: this package's UNCHANGED direct
      # reverse dependencies, compiled against its new public API (Open
      # Question 1, ruled Option B 2026-09-12). Linux only, and inside THIS
      # package's cell: the consumer's area gets no job, entry, or cell, and a
      # break lands on the area that caused it. The planner spells the same
      # environment (`DEPENDENTS_ENVIRONMENT` in `affected_scope.py`) when it
      # gives a package this cell; `ci_workflow_contracts.rs` pins that the two
      # agree. On any other OS, or with nothing attributed, the step skips and
      # its `skipped` outcome folds as a pass below.
      - name: Compile unchanged dependents
        id: dependents
        if: ${{ !cancelled() && matrix.environment == 'ubuntu-latest' && steps.cell.outputs.dependents_check_args != '' }}
        env:
          # The other half of the same cell, and of the same configuration: one
          # `check <environment>` count covers both `cargo check` invocations.
          RUSTC_WRAPPER: ${{ steps.counter.outputs.wrapper }}
          BISCUIT_CI_BUILD_WRAP: ${{ steps.counter.outputs.wrap }}
          BISCUIT_CI_BUILD_COUNTER_DIR: ${{ steps.counter.outputs.counter_dir }}
          BISCUIT_CI_BUILD_PACKAGE: ${{ matrix.package }}
          BISCUIT_CI_BUILD_CONFIGURATION: check ${{ matrix.environment }}
        run: cargo check ${{ steps.cell.outputs.dependents_check_args }}
      # ADVISORY, and structurally so: `continue-on-error` keeps a broken
      # measurement out of `ci-gate`'s fold of this job's result.
      - name: Report compiler work
        if: ${{ !cancelled() && inputs.measure-compiler-work }}
        continue-on-error: true
        shell: bash
        env:
          BISCUIT_CI_JOB_STARTED_EPOCH: ${{ steps.job_start.outputs.epoch }}
          BISCUIT_CI_STAGE_SECONDS: >-
            {"counter_setup_seconds":${{ steps.counter.outputs.setup_seconds || 0 }}}
        run: |
          set -euo pipefail
          just _ci_build_report \
            "${{ steps.counter.outputs.wrapper }}" \
            "${{ steps.counter.outputs.counter_dir }}" \
            "$RUNNER_TEMP/measurement/measurement.json" \
            "${{ matrix.package }}" "${{ matrix.environment }}" check
      - name: Upload the compiler-work measurement
        if: ${{ !cancelled() && inputs.measure-compiler-work }}
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: measurement-${{ matrix.package }}-check-${{ matrix.environment }}
          path: ${{ runner.temp }}/measurement
          if-no-files-found: ignore
      # Producer status. This job stages no JUnit, so the status artifact is
      # the ONLY evidence it ran and how it concluded — which is what lets a
      # compile-check become a rollup cell that can still block. It is also why
      # a check cell can never come from a local receipt:
      # with no report to attribute, the gate is always CI-origin. `always()`,
      # so a FAILED job still reports itself; a job that reports nothing is
      # MISSING, never a pass. `dependents` names what the second step compiled
      # and `detail` says which half broke, so the rollup can render both.
      - name: Record producer status
        if: ${{ always() }}
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          JOB: check
          ENVIRONMENT: ${{ matrix.environment }}
          JOB_STATUS: ${{ job.status }}
          GATE: ${{ steps.check.outcome }}
          DEPENDENTS_GATE: ${{ steps.dependents.outcome }}
          DEPENDENTS: ${{ steps.cell.outputs.dependents }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/status"
          # `result` is the CELL's conclusion, not the job's (see the header).
          result="$JOB_STATUS"
          detail=""
          if [ "$result" = "success" ]; then
            if [ "$GATE" = "failure" ] && [ "$DEPENDENTS_GATE" = "failure" ]; then
              detail="both halves failed to compile: the package's own example/bench kinds and its unchanged dependents"
            elif [ "$GATE" = "failure" ]; then
              detail="the package's own example/bench kinds failed to compile (the unchanged dependents did not fail)"
            elif [ "$DEPENDENTS_GATE" = "failure" ]; then
              detail="an unchanged dependent failed to compile against this package's public API (the package's own targets compiled)"
            fi
          fi
          if [ -n "$detail" ]; then
            result=failure
            echo "::error title=${PACKAGE} ${JOB} (${ENVIRONMENT}) failed::${detail}."
          fi
          # jq, not printf: dependent names come from the plan and belong in a
          # JSON array, and `detail` is present only when there is one.
          jq -cn \
            --arg package "$PACKAGE" --arg job "$JOB" --arg environment "$ENVIRONMENT" \
            --arg result "$result" --arg detail "$detail" --argjson dependents "${DEPENDENTS:-[]}" \
            '{package: $package, job: $job, environment: $environment, result: $result, dependents: $dependents}
             + (if $detail == "" then {} else {detail: $detail} end)' \
            >"$RUNNER_TEMP/status/status.json"
      - name: Upload producer status
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.cell.outputs.status_artifact }}
          path: ${{ runner.temp }}/status
      # A check cell drives no nextest, so it publishes no expected listing;
      # `completion.py` certifies it on the gate's own outcome and the cell's
      # binding instead. Required, and after the status upload: the record is
      # this cell's proof, and a green status without one is an audit failure.
      - name: Certify this cell's completeness
        id: completion
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/completion.py \
            --plan ci-artifacts/ci-resolved-plan/resolved-plan.json \
            --cell '${{ steps.cell.outputs.cell }}' \
            --artifacts ci-artifacts \
            --target '${{ steps.cell.outputs.target }}' \
            --run "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --out "$RUNNER_TEMP/completion/completion.json"
      - name: Upload this cell's completion record
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.cell.outputs.completion_artifact }}
          path: ${{ runner.temp }}/completion

  # Every NATIVE test row of this area — L1, L2, and browser — in one job.
  #
  # One job, not three: the row is the unit of dispatch, and three jobs over
  # the same row set would have to partition it a second time. The tiers branch
  # only where execution genuinely differs (backend provisioning and proof,
  # browser requirement, toolchain and Node provisioning, and the canonical
  # recipe), and NOTHING here waits on another test job — ruling R3. The old
  # `needs: test` ordering was resource staging, and a red L1 used to suppress
  # the L2 and browser legs entirely, so the rollup recorded MISSING and one
  # failure erased the whole tier's evidence.
  #
  # No sharding: compiling the test binaries is ~85% of a shard and every shard
  # pays it in full, so partitioning cost ~3.2x the compute to save ~2.4
  # minutes (fixes/2026-08-06-cicd/spec.md § Sharding).
  test:
    if: ${{ inputs.test-rows != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        # Sound ONLY because a native environment name is also its own runner
        # label and the planner put the runner in the row. `wsl2-ubuntu` never
        # enters this set — it has its own row set and its own workflow.
        include: ${{ fromJSON(inputs.test-rows) }}
    runs-on: ${{ matrix.runner }}
    # L1 keeps the 45-minute ceiling measured for the heaviest packages; the
    # expensive tiers keep the 30 they have always had.
    timeout-minutes: ${{ matrix.gate == 'L1' && 45 || 30 }}
    env:
      # Result identity. The shared `just` recipes stamp this into the
      # per-invocation JUnit manifest so a rollup cell traces back to
      # {package, environment, gate} without parsing a display name — which
      # for a skipped matrix leg is not merely unstable but unresolvable.
      BISCUIT_CI_ENVIRONMENT: ${{ matrix.environment }}
      # A browser cell requires a real browser: a self-skip there would render
      # a green 0-run cell for work nothing performed.
      BISCUIT_BROWSER_REQUIRED: ${{ matrix.gate == 'browser' && '1' || '' }}
    steps:
      # Phase 1 measurement only: the reference point for `setup_seconds`. It
      # runs before checkout so setup — checkout, toolchain, native
      # prerequisites, cache restore — falls inside the measured window.
      - name: Mark the job start
        id: job_start
        if: ${{ inputs.measure-compiler-work }}
        shell: bash
        run: echo "epoch=$(date +%s)" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tested-revision }}
          # Shallow, like every other checkout here. The one suite that needed
          # real history — `test_build_baseline_revision.py`, which read blobs
          # out of a pre-cutover revision and skipped 8 of its 11 tests when
          # that commit was absent — was retired on 2026-09-16. A companion
          # suite that needs more than the tested revision should say so by
          # failing, not by being handed history nothing asks for.
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Download the resolved execution plan
        uses: actions/download-artifact@v7
        with:
          name: ci-resolved-plan
          path: ci-artifacts/ci-resolved-plan
      # The one reader. It names this cell's build record or refuses: a
      # consumer restores no Cargo cache and has no compiler to fall back to.
      # The one toolchain it may hold is the step below, and that is for the
      # SUITE to drive, never for the recipe to compile a replacement with.
      - name: Resolve this cell's execution contract
        id: cell
        shell: bash
        env:
          ROW: ${{ toJSON(matrix) }}
        run: |
          set -euo pipefail
          python3 scripts/ci/cell_contract.py \
            --plan ci-artifacts/ci-resolved-plan/resolved-plan.json \
            --row "$ROW" \
            --head '${{ inputs.tested-revision }}' \
            --github-output "$GITHUB_OUTPUT"
      # A `requires-toolchain` package's tests shell out to `cargo` and `rustc`
      # themselves (`cargo metadata`, fixture builds, `rustc -vV`). The archive
      # brings no toolchain, and a hosted runner's rustup proxy would otherwise
      # install the pinned one on first use — from inside however many tests
      # reach it at once, which corrupted rustup's download directory on run
      # 35326800778. Install it once, up front, where the plan says the package
      # declares `requires-toolchain` AND the environment claims
      # `cargo_toolchain`. Every other cell stays toolchain-free.
      - name: Set up the pinned Rust toolchain
        if: ${{ steps.cell.outputs.requires_toolchain == 'true' }}
        run: rustup show
      - name: Install native prerequisites
        shell: bash
        env:
          NATIVE: ${{ steps.cell.outputs.native_packages }}
        run: |
          set -euo pipefail
          native_args=()
          while IFS= read -r package; do
            if [ -n "$package" ]; then native_args+=("$package"); fi
          done < <(jq -r '.[]?' <<<"${NATIVE:-[]}")
          if [ ${#native_args[@]} -gt 0 ]; then
            just _ensure-native-libs "${native_args[@]}"
          fi
      # L2 ONLY. tmux/PTY is the only backend headless CI can host (D8) and it
      # installs on BOTH Linux (apt) and macOS (brew). WezTerm/Kitty/Apple
      # Terminal require running INSIDE that GUI, so those tests skip cleanly
      # here via require_level!; the coverage report below makes that skip
      # VISIBLE rather than silent. Windows and wsl2-ubuntu never carry an L2
      # row: the planner records those as POLICY GAPS instead.
      - name: Provision and verify the tmux backend
        if: ${{ matrix.gate == 'L2' }}
        shell: bash
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            ubuntu-latest)
              sudo apt-get update && sudo apt-get install -y tmux
              ;;
            macos-latest)
              brew list tmux >/dev/null 2>&1 || brew install tmux
              ;;
            *)
              echo "no tmux provisioning path for environment '$ENVIRONMENT'" >&2
              exit 1
              ;;
          esac
          # Verify runtime reachability (D8): a broken tmux fails this named
          # provisioning step — the hard-require for the one L2 backend CI hosts.
          # `tmux -V` needs no server, no display, and no pane, so it takes no
          # focus. CI must never steal focus.
          tmux -V
      # `neovim` runner tool: dmls's L2 suite runs a real Neovim (headless and
      # inside tmux). Without the binary every gate skips, and backend-proof
      # then rightly fails the tier for producing no tmux evidence.
      - name: Provision neovim
        if: ${{ matrix.gate == 'L2' && contains(fromJSON(steps.cell.outputs.runner_tools), 'neovim') }}
        shell: bash
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            ubuntu-latest)
              sudo apt-get update && sudo apt-get install -y neovim
              ;;
            macos-latest)
              brew list neovim >/dev/null 2>&1 || brew install neovim
              ;;
            *)
              echo "no neovim provisioning path for environment '$ENVIRONMENT'" >&2
              exit 1
              ;;
          esac
          nvim --version | head -1
      - name: Report L2 backend coverage
        if: ${{ matrix.gate == 'L2' }}
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          ENVIRONMENT: ${{ matrix.environment }}
          DECLARED_BACKENDS: ${{ steps.cell.outputs.declared_backends }}
          REQUIRED_BACKENDS: ${{ steps.cell.outputs.backends }}
        run: |
          set -euo pipefail
          # A backend that cannot exist here skips silently inside require_level!.
          # Naming every declared backend and its status turns "0 run / N skipped"
          # from an invisible non-event into a readable row. Which ones this cell
          # must prove is the plan's decision (the cell's `backends`), not a
          # name test here.
          {
            echo "### L2 backends — ${PACKAGE} on ${ENVIRONMENT}"
            echo ""
            echo "| backend | status |"
            echo "|---|---|"
            while IFS= read -r backend; do
              [ -n "$backend" ] || continue
              if [ "$(jq -r --arg b "$backend" 'index($b) != null' <<<"$REQUIRED_BACKENDS")" = "true" ]; then
                echo "| ${backend} | required by the plan — its tests MUST execute |"
              elif [ "$backend" = "apple-terminal" ] && [ "$ENVIRONMENT" = "macos-latest" ]; then
                echo "| apple-terminal | unavailable — \`available()\` returns false when CI is truthy; its tests skip |"
              else
                echo "| ${backend} | unavailable — needs a live GUI session; its tests skip |"
              fi
            done < <(printf '%s' "$DECLARED_BACKENDS" | jq -r '.[]?')
          } >>"$GITHUB_STEP_SUMMARY"
      # Runner tools are a CLOSED vocabulary, implemented here — not an
      # arbitrary command surface. Each entry preserves a package-specific
      # behavior that used to be embedded in an area-level recipe.
      - name: Install AI-provider CLI stubs
        if: ${{ contains(fromJSON(steps.cell.outputs.runner_tools), 'ai-provider-stubs') }}
        shell: bash
        run: |
          set -euo pipefail
          stubdir="$RUNNER_TEMP/ai-cli-stubs"
          mkdir -p "$stubdir"
          for bin in claude opencode roo gemini aider codex goose kimi qwen; do
            if [ "${{ runner.os }}" = "Windows" ]; then
              printf '@echo off\r\nexit /b 0\r\n' >"$stubdir/$bin.cmd"
            else
              printf '#!/usr/bin/env sh\nexit 0\n' >"$stubdir/$bin"
              chmod +x "$stubdir/$bin"
            fi
          done
          echo "$stubdir" >>"$GITHUB_PATH"
      # Node + pnpm for a package that declares a JavaScript companion suite
      # (`homelab-frontend`, `test-audit-*`). Until this provisioning existed,
      # `pnpm: command not found` killed the suite on EVERY runner while the
      # rollup — which parses Rust JUnit only — rendered the area PASS
      # 222/0/0 on three environments (measured, run 30427703024).
      #
      # Which cells qualify is DERIVED by `affected_scope.py` from the
      # environment capability table crossed with the suites that declare
      # `node`, and carried on the cell as `requires_node`; nothing here
      # decides it, and a package whose companions are Python contract suites
      # provisions nothing.
      #
      # A PROVISIONED capability hard-fails when missing, an INAPPLICABLE one
      # skips cleanly, which is what `BISCUIT_FRONTEND_REQUIRED` spells below.
      - name: Set up pnpm
        if: ${{ steps.cell.outputs.requires_node == 'true' }}
        uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Set up Node
        if: ${{ steps.cell.outputs.requires_node == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 22
      # Runtime reachability, mirroring the L2 tier's `tmux -V`: a capability
      # the package DECLARED must fail its own named provisioning step when it
      # is not actually usable, rather than surface minutes later as a suite
      # that "skipped" under a green cell.
      - name: Verify the pnpm toolchain
        if: ${{ steps.cell.outputs.requires_node == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node --version
          pnpm --version
      # Workspace dependencies, from the ROOT lockfile that owns both members
      # (`homelab/server/frontend`, `tools/test-audit`). A toolchain on PATH is
      # not a runnable suite: `tsc` and `vitest` resolve through
      # `node_modules`, so without this the first companion dies on a missing
      # binary. The job that used to own these suites paired the install with
      # the command in one step; moving them onto the registry carried the
      # suites over but not the install, and `test-audit-typecheck` failed on
      # ubuntu-latest for that reason alone.
      #
      # Not every node companion needs it — `homelab`'s frontend recipes
      # install their own subtree — but a suite whose recipe calls `pnpm`
      # directly has nowhere else to get its dependencies.
      - name: Install workspace Node dependencies
        if: ${{ steps.cell.outputs.requires_node == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      # Transfer clock. An artifact download is an action, not a command, so
      # its cost can only be observed between two steps; the verifier closes the
      # window and reports `download_seconds`. Transfer is reported apart from
      # test time, never folded into it.
      - name: Mark the build transfer start
        id: transfer
        if: ${{ steps.cell.outputs.consumes_archive == 'true' }}
        shell: bash
        run: echo "epoch=$(date +%s)" >>"$GITHUB_OUTPUT"
      - name: Download this cell's build
        if: ${{ steps.cell.outputs.consumes_archive == 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ steps.cell.outputs.build_artifact }}
          path: ${{ runner.temp }}/build
      # Strict, and BEFORE extraction: plan key, realized digest, source
      # identity, producer/execution compatibility, archive and sidecar
      # checksums, expected binaries, and the host's own runtime ABI. A
      # rejection exits non-zero and no test starts; nothing here compiles a
      # replacement.
      - name: Verify this cell's build
        id: verified
        if: ${{ steps.cell.outputs.consumes_archive == 'true' }}
        shell: bash
        env:
          BISCUIT_CI_TRANSFER_STARTED_EPOCH: ${{ steps.transfer.outputs.epoch }}
        run: |
          just _ci_build_verify \
            "$RUNNER_TEMP/build" \
            '${{ steps.cell.outputs.build_artifact }}' \
            '${{ matrix.environment }}' \
            ci-artifacts/ci-resolved-plan/resolved-plan.json
      # Every compile-time tool the package declared as a build sidecar arrives
      # verified, in one directory. On PATH for the ones tests resolve by name
      # (darkmatter's `md`), and named explicitly for the ones with their own
      # binding.
      - name: Provision the verified build sidecars
        shell: bash
        run: |
          set -euo pipefail
          sidecars='${{ steps.verified.outputs.sidecar_dir }}'
          [ -d "$sidecars" ] || exit 0
          echo "$sidecars" >>"$GITHUB_PATH"
          if [ -x "$sidecars/stub_dunstify" ] || [ -x "$sidecars/stub_dunstify.exe" ]; then
            echo "MESSENGER_STUB_BIN_DIR=$sidecars" >>"$GITHUB_ENV"
          fi
          for broker in "$sidecars/biscuit-harness-broker" "$sidecars/biscuit-harness-broker.exe"; do
            if [ -x "$broker" ]; then
              echo "BISCUIT_HARNESS_BROKER_BIN=$broker" >>"$GITHUB_ENV"
            fi
          done
          for proof in "$sidecars/backend-proof" "$sidecars/backend-proof.exe"; do
            if [ -x "$proof" ]; then
              echo "BISCUIT_BACKEND_PROOF_BIN=$proof" >>"$GITHUB_ENV"
            fi
          done
      # THE EXPECTED SET, BEFORE THE GATE AND AFTER EVERY PROVISIONING STEP.
      #
      # `nextest list` RUNS each test binary to enumerate it, so it fails for
      # the same reasons the gate would — an unprovisioned native library, a
      # missing sidecar or backend, an absent pinned toolchain. Listing here
      # therefore turns those into a fast, named failure instead of a 40-minute
      # suite followed by an unexplainable comparison. It is derived from
      # `_tier_filter`, the same expression the gate recipe reads, which is the
      # whole point: expected and observed come from ONE selection.
      - name: List this cell's expected tests
        id: expected
        shell: bash
        env:
          BISCUIT_CI_ENVIRONMENT: ${{ matrix.environment }}
          BISCUIT_L1_INCLUDE_SLOW: ${{ steps.cell.outputs.l1_include_slow }}
          BISCUIT_TEST_NARROW: ${{ steps.cell.outputs.test_filter }}
          BISCUIT_CI_COMPANION_SUITES: ${{ steps.cell.outputs.companion_suites }}
          ARCHIVE_FILE: ${{ steps.verified.outputs.archive_file }}
          ARCHIVE_WORKSPACE: ${{ steps.verified.outputs.workspace }}
          REQUIRED_BACKENDS: ${{ steps.cell.outputs.backends }}
          GATE: ${{ matrix.gate }}
        run: |
          set -euo pipefail
          # The plan's declared suites and required backends, in the spelling
          # the recipe records them as provenance. `completion.py` refuses a
          # disagreement between these and the plan rather than preferring one,
          # so the list is the cell's verbatim — never narrowed here.
          suites="$(jq -r 'join(",")' <<<"${BISCUIT_CI_COMPANION_SUITES:-[]}")"
          export BISCUIT_CI_COMPANION_SUITES="$suites"
          if [ "$GATE" = "L2" ]; then
            required="$(jq -r 'join(",")' <<<"${REQUIRED_BACKENDS:-[]}")"
            if [ -n "$required" ]; then
              export BISCUIT_TEST_REQUIRED_BACKENDS="$required"
            fi
          fi
          archive_args=()
          if [ -n "${ARCHIVE_FILE:-}" ]; then
            archive_args=(--archive-file "$ARCHIVE_FILE" --workspace-remap "$ARCHIVE_WORKSPACE")
            export BISCUIT_NEXTEST_BIN='cargo-nextest nextest'
            export BISCUIT_JUNIT_WORKSPACE_ROOT="$ARCHIVE_WORKSPACE"
            export BISCUIT_JUNIT_TARGET_DIR="$ARCHIVE_WORKSPACE/target"
          fi
          just _expected_manifest "$GATE" "${{ matrix.package }}" \
            ${archive_args[@]+"${archive_args[@]}"} ${{ steps.cell.outputs.test_args }}
      - name: Prepare the compiler-work counter
        id: counter
        if: ${{ inputs.measure-compiler-work }}
        shell: bash
        run: |
          set -euo pipefail
          just _ci_build_counter "${{ matrix.gate }} ${{ matrix.environment }}"
      # Gate command. Its outcome is both the producer and cell outcome. The
      # recipe comes from the cell contract, so the gate-to-recipe mapping
      # lives in one place rather than in three near-identical jobs.
      - name: Tests
        id: gate
        shell: bash
        env:
          # COMMAND-SCOPED. The wrapper is bound to this step alone and to no
          # other build in the job; an unmeasured run inherits the workflow's
          # empty `RUSTC_WRAPPER` and is byte-identical to the uninstrumented
          # command.
          RUSTC_WRAPPER: ${{ steps.counter.outputs.wrapper }}
          BISCUIT_CI_BUILD_WRAP: ${{ steps.counter.outputs.wrap }}
          BISCUIT_CI_BUILD_COUNTER_DIR: ${{ steps.counter.outputs.counter_dir }}
          BISCUIT_CI_BUILD_PACKAGE: ${{ matrix.package }}
          BISCUIT_CI_BUILD_CONFIGURATION: ${{ matrix.gate }} ${{ matrix.environment }}
          JOB_STARTED_EPOCH: ${{ steps.job_start.outputs.epoch }}
          ARCHIVE_FILE: ${{ steps.verified.outputs.archive_file }}
          # This checkout in the HOST's own spelling. Git Bash reports
          # `/d/a/repo` for `$PWD`, and every consumer of this value is a
          # native program: nextest's remap, insta's workspace root, and the
          # JUnit staging root. `_ci_build_verify` computes it once.
          ARCHIVE_WORKSPACE: ${{ steps.verified.outputs.workspace }}
          GATE: ${{ matrix.gate }}
          RECIPE: ${{ steps.cell.outputs.recipe }}
          RUNNER_TOOLS: ${{ steps.cell.outputs.runner_tools }}
          REQUIRED_BACKENDS: ${{ steps.cell.outputs.backends }}
          BISCUIT_L1_INCLUDE_SLOW: ${{ steps.cell.outputs.l1_include_slow }}
          BISCUIT_TEST_NARROW: ${{ steps.cell.outputs.test_filter }}
          # A PROVISIONED capability hard-fails when missing; every other cell
          # (and every developer host) skips loudly and exits 0.
          BISCUIT_FRONTEND_REQUIRED: ${{ steps.cell.outputs.requires_node == 'true' && '1' || '' }}
        run: |
          set -euo pipefail
          tier_args=()
          case "$GATE" in
            L1)
              # --no-fail-fast: run ALL of the package's tests so one slow or
              # failing test cannot suppress the rest of the suite's evidence.
              tier_args=(--no-fail-fast)
              ;;
            L2)
              # --no-fail-fast, for the same reason as L1: a truncated report
              # costs a full round-trip to learn what the second failure was,
              # and L2 is the tier whose backends the author's host may not
              # have. The shared-pane suites are safe to run on: the broker's
              # pane is torn down by `_test_l2`'s trap rather than by a test,
              # and both profiles set `retries = 0`.
              tier_args=(--no-fail-fast)
              # Execution proof, not just availability: require exactly the
              # backends the plan attached to this cell — the subset of the
              # package's declaration its environment hosts, the same list the
              # expected manifest recorded and `completion.py` will demand a
              # proof for. With BISCUIT_TEST_REQUIRED_BACKENDS set, `_test_l2`'s
              # backend-proof bracket fails the tier when a required backend
              # produced zero executed tests and writes `backend-proofs.json`
              # into the staging tree — an installed tmux plus a suite that
              # skipped everywhere must not render a green cell.
              required="$(jq -r 'join(",")' <<<"${REQUIRED_BACKENDS:-[]}")"
              if [ -n "$required" ]; then
                export BISCUIT_TEST_REQUIRED_BACKENDS="$required"
              fi
              # Only declared self-isolating suites can use the shared worker
              # budget; suites using a shared pane must remain serial.
              if [ "$(jq -r 'contains(["l2-parallel-self-spawn"])' <<<"$RUNNER_TOOLS")" = "true" ]; then
                export BISCUIT_L2_THREADS="${BISCUIT_L2_THREADS:-${NEXTEST_TEST_THREADS:-$(just _test_threads)}}"
              fi
              ;;
          esac
          # Archive mode passes the verified archive and remaps the workspace to
          # this checkout; the declared feature flags are already baked in and
          # `_archive_drop_build_flags` removes them. Nothing here is a Cargo
          # build flag, so this invocation cannot reach a compiler.
          archive_args=()
          if [ -n "${ARCHIVE_FILE:-}" ]; then
            archive_args=(--archive-file "$ARCHIVE_FILE" --workspace-remap "$ARCHIVE_WORKSPACE")
            # The knobs that keep the recipe off Cargo entirely: nextest as a
            # standalone binary, and the workspace and target directory the
            # JUnit staging would otherwise ask `cargo metadata` for. A
            # consumer's `cargo metadata` would succeed on a hosted runner and
            # fail in the toolchain-free guest — one spelling for both.
            export BISCUIT_NEXTEST_BIN='cargo-nextest nextest'
            export BISCUIT_JUNIT_WORKSPACE_ROOT="$ARCHIVE_WORKSPACE"
            export BISCUIT_JUNIT_TARGET_DIR="$ARCHIVE_WORKSPACE/target"
            export INSTA_WORKSPACE_ROOT="$ARCHIVE_WORKSPACE"
          fi
          started="$(date +%s)"
          status=0
          just "$RECIPE" "${{ matrix.package }}" \
            ${tier_args[@]+"${tier_args[@]}"} \
            ${archive_args[@]+"${archive_args[@]}"} ${{ steps.cell.outputs.test_args }} || status=$?
          # The gate's own duration, recorded whether it passed or failed. In
          # the pre-cutover schedule this window contains BOTH the compile and
          # the test run — they are one Nextest invocation — which is why the
          # compiler-work count, not this number, is the compile evidence.
          echo "seconds=$(( $(date +%s) - started ))" >>"$GITHUB_OUTPUT"
          if [ -n "${JOB_STARTED_EPOCH:-}" ]; then
            echo "setup_seconds=$(( started - JOB_STARTED_EPOCH ))" >>"$GITHUB_OUTPUT"
          fi
          exit "$status"
      # ADVISORY, and structurally so: `continue-on-error` keeps a broken
      # measurement out of `ci-gate`'s fold of this job's result. The cell's
      # outcome is the gate command above and nothing else.
      - name: Report compiler work
        if: ${{ !cancelled() && inputs.measure-compiler-work }}
        continue-on-error: true
        shell: bash
        env:
          BISCUIT_CI_JOB_STARTED_EPOCH: ${{ steps.job_start.outputs.epoch }}
          BISCUIT_CI_STAGE_SECONDS: >-
            {"counter_setup_seconds":${{ steps.counter.outputs.setup_seconds || 0 }},
             "gate_seconds":${{ steps.gate.outputs.seconds || 0 }},
             "setup_seconds":${{ steps.gate.outputs.setup_seconds || 0 }}}
        run: |
          set -euo pipefail
          just _ci_build_report \
            "${{ steps.counter.outputs.wrapper }}" \
            "${{ steps.counter.outputs.counter_dir }}" \
            "$RUNNER_TEMP/measurement/measurement.json" \
            "${{ matrix.package }}" "${{ matrix.environment }}" "${{ matrix.gate }}"
      - name: Upload the compiler-work measurement
        if: ${{ !cancelled() && inputs.measure-compiler-work }}
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: measurement-${{ matrix.package }}-${{ matrix.gate }}-${{ matrix.environment }}
          path: ${{ runner.temp }}/measurement
          if-no-files-found: ignore
      # Companion suites are non-Cargo suites OWNED by this package. The step
      # runs even when the Rust suite failed — one red crate cannot hide a red
      # frontend, exactly as the old area recipe's combined status worked —
      # and its outcome reaches the producer status below, so a green Rust
      # JUnit report can never hide a failed or skipped companion suite.
      #
      # Which suites run here is the PLAN's answer: `affected_scope.py`'s
      # `SUITE_REGISTRY` resolved each package's declared names against this
      # cell's environment at planning time and put the result on the cell. It
      # records one outcome, one count, and one command duration PER SUITE, so
      # one suite's success can never stand in for a suite that never ran.
      - name: Companion suites
        id: companion
        if: ${{ !cancelled() && steps.cell.outputs.companion_suites != '[]' }}
        shell: bash
        env:
          COMPANION_SUITES: ${{ steps.cell.outputs.companion_suites }}
          ENVIRONMENT: ${{ matrix.environment }}
          GATE: ${{ matrix.gate }}
          # A PROVISIONED capability hard-fails when missing; an INAPPLICABLE
          # one skips cleanly. The frontend suite is a COMPANION, so this has
          # to reach this step — the Rust gate above never runs it. It was a
          # job-level value before the row layout, which cannot read the cell
          # contract; declaring it twice is the price of resolving the cell in
          # a step.
          BISCUIT_FRONTEND_REQUIRED: ${{ steps.cell.outputs.requires_node == 'true' && '1' || '' }}
          # The host tools this step provisions, declared so a guard that
          # cannot find one FAILS here instead of skipping green. `just` is
          # installed above; `jq`, Bash >= 4.4, and a Cargo the gate command
          # already ran come with the environments the registry attaches these
          # suites to. Declared on the step, not the job: a declaration set
          # anywhere else never reaches the suite's process.
          BISCUIT_REQUIRE_CARGO: "1"
          BISCUIT_REQUIRE_JUST: "1"
          BISCUIT_REQUIRE_JQ: "1"
          BISCUIT_REQUIRE_BASH: "1"
        run: |
          set -euo pipefail
          python3 scripts/ci/companion_suites.py \
            --suites "$COMPANION_SUITES" \
            --environment "$ENVIRONMENT" \
            --gate "$GATE" \
            --out "$RUNNER_TEMP/companions.json"
      # Per-package/environment/gate JUnit. The artifact name carries the
      # ENVIRONMENT, not the runner label, so a WSL leg (which runs on
      # windows-latest) can never collide with, or be merged into, the native
      # Windows leg.
      #
      # The whole STAGING DIRECTORY, not `target/nextest/ci/test-results.xml`:
      # that single path is overwritten by every nextest invocation. The
      # staging tree carries one XML per invocation plus `manifest.jsonl`, and
      # the manifest — not this artifact's name — is what gives each record
      # its {package, environment, gate} identity. It also carries this cell's
      # `expected-<gate>.json`, which is what `completion.py` compares against.
      - name: Upload JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.cell.outputs.junit_artifact }}
          path: target/nextest/ci-reports
          if-no-files-found: ignore
      # The gate spelling is the TIER (`L1`, `L2`, `browser`), never `test`:
      # `ci-rollup` keys a status by gate, and a status naming anything else
      # would manufacture a phantom cell beside the real one and double-count
      # the same failure.
      - name: Record producer status
        if: ${{ always() }}
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          JOB: ${{ matrix.gate }}
          ENVIRONMENT: ${{ matrix.environment }}
          JOB_STATUS: ${{ job.status }}
          GATE: ${{ steps.gate.outcome }}
          COMPANION: ${{ steps.companion.outcome }}
          COMPANIONS_FILE: ${{ runner.temp }}/companions.json
          BUILD_KEY: ${{ steps.cell.outputs.build_key }}
          BUILD_PRODUCER: ${{ steps.cell.outputs.build_producer }}
          BUILD_DIGEST: ${{ steps.verified.outputs.digest }}
          # This consumer's stages, each measured where it actually happened:
          # the transfer between two steps, the verifier's own window and the
          # extraction inside it, and the gate command. Reporting only — the
          # cell's identity stays {package, environment, gate} and the rollup
          # keys nothing on a duration.
          TIMINGS: >-
            {"download_seconds":${{ steps.verified.outputs.download_seconds || 0 }},
             "verify_seconds":${{ steps.verified.outputs.verify_seconds || 0 }},
             "extract_ms":${{ steps.verified.outputs.extract_ms || 0 }},
             "execute_seconds":${{ steps.gate.outputs.seconds || 0 }}}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/status"
          # An unmeasured stage is absent, never zero: a job that reported no
          # timings at all must not read as one whose transfer was instant. A
          # malformed measurement is treated the same way — this step runs under
          # `always()` and is the cell's only evidence, so instrumentation must
          # not be able to lose it.
          timings="${TIMINGS:-}"
          if ! printf '%s' "$timings" | jq -e 'type == "object"' >/dev/null 2>&1; then
            timings='{}'
          fi
          # `result` is the CELL's conclusion, not the job's (see the header).
          result="$JOB_STATUS"
          if [ "$result" = "success" ] && { [ "$GATE" = "failure" ] || [ "$COMPANION" = "failure" ]; }; then
            result=failure
            echo "::error title=${PACKAGE} ${JOB} (${ENVIRONMENT}) failed::${JOB} tests: ${GATE}; companion suites: ${COMPANION}."
          fi
          # Every DECLARED companion suite records its own outcome, counts, and
          # command duration, not only on failure: a SKIPPED companion leaves no
          # other evidence, and the rollup downgrades a green Rust cell whose
          # declared companion produced no success evidence (R12).
          companions='{}'
          if [ -f "$COMPANIONS_FILE" ]; then
            companions="$(cat "$COMPANIONS_FILE")"
          fi
          detail=""
          if [ "$COMPANION" = "failure" ]; then
            failed="$(jq -r '[to_entries[] | select(.value.outcome != "success") | .key] | join(", ")' <<<"$companions")"
            detail="companion suite(s) ${failed:-unreported} FAILED; the Rust JUnit report does not cover them"
          fi
          # The build this cell executed, when it executed one. Reporting only;
          # the cell's identity stays `{package, environment, gate}` and the
          # rollup keys nothing on a build.
          jq -nc \
            --arg package "$PACKAGE" \
            --arg job "$JOB" \
            --arg environment "$ENVIRONMENT" \
            --arg result "$result" \
            --arg detail "$detail" \
            --arg key "${BUILD_KEY:-}" \
            --arg producer "${BUILD_PRODUCER:-}" \
            --arg digest "${BUILD_DIGEST:-}" \
            --argjson companions "$companions" \
            --argjson timings "$timings" \
            '{package: $package, job: $job, environment: $environment, result: $result}
             + (if $detail == "" then {} else {detail: $detail} end)
             + (if ($companions | length) == 0 then {} else {companions: $companions} end)
             + (if $key == "" then {}
                else {build: {key: $key, producer: $producer, digest: $digest}} end)
             + (if $timings == {} then {} else {timings: $timings} end)' \
            >"$RUNNER_TEMP/status/status.json"
      - name: Upload producer status
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.cell.outputs.status_artifact }}
          path: ${{ runner.temp }}/status
      # WHAT THE CELL WAS ASKED TO PROVE, COMPARED AGAINST WHAT IT REPORTED.
      #
      # A green JUnit report says what ran; only this says what SHOULD have
      # run. It compares identities — not counts — between the listing above
      # and the staged reports, refuses a missing test that no skip approval
      # may excuse, and writes the completion record only when every check
      # holds. It runs after the diagnostic uploads so a refusal still leaves
      # the JUnit and status artifacts behind to read.
      - name: Certify this cell's completeness
        id: completion
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/completion.py \
            --plan ci-artifacts/ci-resolved-plan/resolved-plan.json \
            --cell '${{ steps.cell.outputs.cell }}' \
            --expected-manifest "target/nextest/ci-reports/expected-${{ matrix.gate }}.json" \
            --artifacts target/nextest/ci-reports \
            --companions "$RUNNER_TEMP/companions.json" \
            --backend-proofs target/nextest/ci-reports/backend-proofs.json \
            --target '${{ steps.cell.outputs.target }}' \
            --run "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --out "$RUNNER_TEMP/completion/completion.json"
      # REQUIRED, and deliberately not `continue-on-error`: `complete: true`
      # that never reaches the audit is the same as no proof at all, so a
      # failed upload here fails the producer (R10).
      - name: Upload this cell's completion record
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.cell.outputs.completion_artifact }}
          path: ${{ runner.temp }}/completion

  # This area's lint rows. `lint` runs on exactly one environment per package,
  # so the row set is one row per package — but it is still a row set, because
  # the alternative is a second way of deciding what runs.
  lint:
    if: ${{ inputs.lint-rows != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.lint-rows) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # `just/devops.just`'s `_lint` already passes `-D warnings` to clippy;
      # this keeps the package's workspace dependencies held to the same bar
      # while they are compiled for that clippy run.
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Mark the job start
        id: job_start
        if: ${{ inputs.measure-compiler-work }}
        shell: bash
        run: echo "epoch=$(date +%s)" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tested-revision }}
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Download the resolved execution plan
        uses: actions/download-artifact@v7
        with:
          name: ci-resolved-plan
          path: ci-artifacts/ci-resolved-plan
      - name: Resolve this cell's execution contract
        id: cell
        shell: bash
        env:
          ROW: ${{ toJSON(matrix) }}
        run: |
          set -euo pipefail
          python3 scripts/ci/cell_contract.py \
            --plan ci-artifacts/ci-resolved-plan/resolved-plan.json \
            --row "$ROW" \
            --head '${{ inputs.tested-revision }}' \
            --github-output "$GITHUB_OUTPUT"
      - name: Install native prerequisites
        shell: bash
        env:
          NATIVE: ${{ steps.cell.outputs.native_packages }}
        run: |
          set -euo pipefail
          native_args=()
          while IFS= read -r package; do
            if [ -n "$package" ]; then native_args+=("$package"); fi
          done < <(jq -r '.[]?' <<<"${NATIVE:-[]}")
          if [ ${#native_args[@]} -gt 0 ]; then
            just _ensure-native-libs "${native_args[@]}"
          fi
      # clippy + rustfmt come from rust-toolchain.toml (the single authority).
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - name: Read the pinned Zed extension packager record
        if: ${{ contains(fromJSON(steps.cell.outputs.runner_tools), 'zed-extension') }}
        id: zed-extension-pin
        shell: bash
        run: |
          set -euo pipefail
          config=.github/ci/zed-extension.json
          test "$(jq -r '.schema_version' "$config")" = 1
          for field in zed_commit linux_x86_64_url linux_x86_64_sha256; do
            value="$(jq -er ".${field} | select(type == \"string\" and length > 0)" "$config")"
            printf '%s=%s\n' "$field" "$value" >>"$GITHUB_OUTPUT"
          done
      - name: Cache the pinned Zed extension packager
        if: ${{ contains(fromJSON(steps.cell.outputs.runner_tools), 'zed-extension') }}
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/zed-extension/${{ steps.zed-extension-pin.outputs.zed_commit }}/zed-extension
          key: zed-extension-${{ steps.zed-extension-pin.outputs.zed_commit }}-${{ steps.zed-extension-pin.outputs.linux_x86_64_sha256 }}
      - name: Provision the Zed extension verification toolchain
        if: ${{ contains(fromJSON(steps.cell.outputs.runner_tools), 'zed-extension') }}
        shell: bash
        env:
          ZED_EXTENSION_SHA: ${{ steps.zed-extension-pin.outputs.zed_commit }}
          ZED_EXTENSION_URL: ${{ steps.zed-extension-pin.outputs.linux_x86_64_url }}
          ZED_EXTENSION_SHA256: ${{ steps.zed-extension-pin.outputs.linux_x86_64_sha256 }}
        run: |
          set -euo pipefail
          rustup target add wasm32-wasip2
          tool_dir="$RUNNER_TOOL_CACHE/zed-extension/$ZED_EXTENSION_SHA"
          tool="$tool_dir/zed-extension"
          mkdir -p "$tool_dir"
          if [ ! -f "$tool" ]; then
            curl --fail --location --retry 3 --output "$tool" "$ZED_EXTENSION_URL"
          fi
          printf '%s  %s\n' "$ZED_EXTENSION_SHA256" "$tool" | sha256sum --check --strict
          chmod +x "$tool"
          "$tool" --help >/dev/null
          echo "$tool_dir" >>"$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: package-ci-${{ matrix.package }}-lint-${{ matrix.environment }}
      # A declared companion suite lints too (the homelab area recipe's `lint`
      # ran `lint-frontend` after clippy), so this job needs the same toolchain
      # the `test` job gets.
      - name: Set up pnpm
        if: ${{ steps.cell.outputs.requires_node == 'true' }}
        uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Set up Node
        if: ${{ steps.cell.outputs.requires_node == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify the pnpm toolchain
        if: ${{ steps.cell.outputs.requires_node == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node --version
          pnpm --version
      - name: Prepare the compiler-work counter
        id: counter
        if: ${{ inputs.measure-compiler-work }}
        shell: bash
        run: |
          set -euo pipefail
          just _ci_build_counter "lint ${{ matrix.environment }}"
      # Gate commands. Their outcomes are both producer and cell outcomes.
      #
      # The COMMAND is timed, not the job: the job also carries checkout,
      # toolchain setup, cache restore, and optional Node provisioning, none of
      # which the report means by "lint duration" (R14). The duration is
      # recorded whether clippy passed or failed, because a slow failing lint is
      # exactly as worth seeing as a slow passing one.
      #
      # `python3` rather than Bash's integer `SECONDS`: a package whose clippy
      # run finishes in under a second still made a measurement, and the
      # integer clock recorded `0` for it, which the report could not tell
      # apart from a step that never ran (AC13). `python3` is already a hard
      # dependency of these workflows (`scripts/ci/*.py`) and `time.monotonic`
      # is immune to a clock step; the portable alternatives are not —
      # `EPOCHREALTIME` needs Bash 5 (macOS ships 3.2) and `date +%N` is a GNU
      # extension BSD `date` does not have.
      #
      # Python fixes the reference point of `time.monotonic` only WITHIN one
      # process, so the timing process is the one that owns the child: reading
      # the two endpoints in separate interpreters subtracts unrelated origins.
      # macOS's `/usr/bin/python3` (CPython 3.9) is the counterexample that
      # broke the shipped regression — its `time.monotonic` counts from process
      # start, so two short-lived readings are both near zero and subtracting
      # them yields `-0.002`, `0`, or `0.001` at random.
      #
      # Neither the clock nor the interpreter may fail the gate: a measurement
      # this step cannot take is an unavailable MEASUREMENT, and an empty
      # `duration_s` is exactly how the status step spells that. Clippy's own
      # result is what the exit status carries either way.
      #
      # SKIPPED on a companions-only cell, and only there. The planner creates
      # that cell for a companion suite the change selected, not for the
      # package, so linting the package would be work no change asked for. The
      # step is `if`-gated rather than deleted: every ordinary lint cell — the
      # default — still runs it exactly as before, and a skipped clippy leaves
      # NO measurement, which the status step below reads as absent rather
      # than as a pass.
      - name: Lint
        id: clippy
        if: ${{ steps.cell.outputs.companions_only != 'true' }}
        env:
          # COMMAND-SCOPED. Clippy is a different compiler DRIVER with its own
          # flags (this job's `RUSTFLAGS: -D warnings` among them), so it can
          # never consume a test archive and its work is a configuration of its
          # own. Counting it under that name is what keeps a post-cutover
          # measurement from reading it as an unexplained second compile
          # (specification section 6).
          RUSTC_WRAPPER: ${{ steps.counter.outputs.wrapper }}
          BISCUIT_CI_BUILD_WRAP: ${{ steps.counter.outputs.wrap }}
          BISCUIT_CI_BUILD_COUNTER_DIR: ${{ steps.counter.outputs.counter_dir }}
          BISCUIT_CI_BUILD_PACKAGE: ${{ matrix.package }}
          BISCUIT_CI_BUILD_CONFIGURATION: lint ${{ matrix.environment }}
          # Same contract the `test` job carries, for the same capability: on
          # the cell that provisions pnpm, a missing pnpm is a PROVISIONING
          # FAILURE and `lint-frontend` must fail rather than self-skip.
          BISCUIT_FRONTEND_REQUIRED: ${{ steps.cell.outputs.requires_node == 'true' && '1' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null 2>&1; then
            status=0
            just _lint "${{ matrix.package }}" || status=$?
            echo "duration_s=" >>"$GITHUB_OUTPUT"
            exit "$status"
          fi
          python3 - "${{ matrix.package }}" <<'PY'
          import os
          import subprocess
          import sys
          import time

          started = time.monotonic()
          completed = subprocess.run(["just", "_lint", sys.argv[1]], check=False)
          elapsed = round(time.monotonic() - started, 3)
          destination = os.environ.get("GITHUB_OUTPUT")
          if destination:
              with open(destination, "a", encoding="utf-8") as output:
                  output.write(f"duration_s={elapsed}\n")
          sys.exit(completed.returncode)
          PY
      # ADVISORY, and structurally so: `continue-on-error` keeps a broken
      # measurement out of `ci-gate`'s fold of this job's result.
      - name: Report compiler work
        if: ${{ !cancelled() && inputs.measure-compiler-work }}
        continue-on-error: true
        shell: bash
        env:
          BISCUIT_CI_JOB_STARTED_EPOCH: ${{ steps.job_start.outputs.epoch }}
          BISCUIT_CI_STAGE_SECONDS: >-
            {"counter_setup_seconds":${{ steps.counter.outputs.setup_seconds || 0 }}}
        run: |
          set -euo pipefail
          just _ci_build_report \
            "${{ steps.counter.outputs.wrapper }}" \
            "${{ steps.counter.outputs.counter_dir }}" \
            "$RUNNER_TEMP/measurement/measurement.json" \
            "${{ matrix.package }}" "${{ matrix.environment }}" lint
      - name: Upload the compiler-work measurement
        if: ${{ !cancelled() && inputs.measure-compiler-work }}
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: measurement-${{ matrix.package }}-lint-${{ matrix.environment }}
          path: ${{ runner.temp }}/measurement
          if-no-files-found: ignore
      - name: Verify the Zed extension package
        id: zed
        if: ${{ !cancelled() && contains(fromJSON(steps.cell.outputs.runner_tools), 'zed-extension') }}
        shell: bash
        run: cd darkmatter && just zed-verify
      # The archive-path guard's recipe is `cargo nextest run …`, and this is the
      # one job that runs a nextest-driven suite without being a test job, so it
      # is the one job that never installed nextest. Without this step the guard
      # fails on the runner with "no such command: `nextest`" — and only there:
      # every developer host has nextest, so the local hook cannot catch it and
      # reports the ubuntu-latest execution as outstanding instead. Gated on the
      # guard being attached, so a lint cell without it does not pay the install.
      - name: Install cargo-nextest (archive-path guard)
        if: ${{ !cancelled() && contains(fromJSON(steps.cell.outputs.companion_suites), 'archive-path-guard') }}
        uses: taiki-e/install-action@nextest
      # The lint half of this package's companion suites — only the suites that
      # declare a `lint_recipe` in the registry, which is why a package whose
      # companions are test-only leaves this step with nothing to run instead
      # of a lint cell expecting evidence nobody produces.
      - name: Companion suites (lint)
        id: companion
        if: ${{ !cancelled() && steps.cell.outputs.companion_suites != '[]' }}
        shell: bash
        env:
          COMPANION_SUITES: ${{ steps.cell.outputs.companion_suites }}
          ENVIRONMENT: ${{ matrix.environment }}
          # The lint half of the same capability: `lint-frontend` must fail
          # rather than self-skip on the cell that provisioned pnpm.
          BISCUIT_FRONTEND_REQUIRED: ${{ steps.cell.outputs.requires_node == 'true' && '1' || '' }}
          # `companion_suites.py` runs every attached suite in ONE process and
          # each recipe inherits this environment, so the variable reaches the
          # other lint companions too. That is inert today and checked: the only
          # other lint-half suite is `homelab-frontend`, whose `lint-frontend`
          # recipe never reads it. A future lint companion that wants its own
          # scan scope needs a per-suite environment in the registry rather than
          # a second variable here.
          #
          # ABSOLUTE. The guard opens this path verbatim, and neither the
          # recipe (`cd tools/test-toolkit && …`) nor nextest's test binary
          # runs in the workspace directory the artifact landed in.
          #
          # A MISSING PLAN IS AN ERROR, deliberately. The job's first download
          # step fails when `ci-resolved-plan` is absent, and this variable is
          # exported unconditionally, so a file that arrived unreadable makes
          # the guard hard error instead of quietly scanning the full tree — a
          # full-tree result attributed to a run that never had a plan is
          # exactly the false evidence this cell exists to prevent.
          BISCUIT_ARCHIVE_GUARD_PLAN: ${{ github.workspace }}/ci-artifacts/ci-resolved-plan/resolved-plan.json
        run: |
          set -euo pipefail
          python3 scripts/ci/companion_suites.py \
            --suites "$COMPANION_SUITES" \
            --environment "$ENVIRONMENT" \
            --gate lint \
            --out "$RUNNER_TEMP/companions.json"
      # `lint` emits no JUnit, so this artifact is the sole basis for its
      # rollup cell — and the reason `ci-baseline.toml` can carry
      # `tier = "lint"` entries at all. The name carries no environment: lint
      # runs on exactly one, and the rollup has always keyed it that way.
      - name: Record producer status
        if: ${{ always() }}
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          JOB: lint
          ENVIRONMENT: ${{ matrix.environment }}
          JOB_STATUS: ${{ job.status }}
          GATE: ${{ steps.clippy.outcome }}
          GATE_DURATION: ${{ steps.clippy.outputs.duration_s }}
          ZED: ${{ steps.zed.outcome }}
          COMPANION: ${{ steps.companion.outcome }}
          COMPANIONS_ONLY: ${{ steps.cell.outputs.companions_only }}
          COMPANIONS_FILE: ${{ runner.temp }}/companions.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/status"
          # `result` is the CELL's conclusion, not the job's (see the header).
          #
          # INVARIANT, companions-only cell: its required work IS its companion
          # suites, so the companion step's outcome is the cell's outcome and
          # ONLY `success` passes. Clippy was `if`-gated off above, so its
          # `skipped` outcome carries no information — reading it as a failure
          # would block every pull request that touches a Rust file, and
          # reading it as a pass would let a cell that ran NOTHING go green,
          # which is the false full-tree evidence this cell exists to prevent.
          # The ordinary branch is untouched: there `skipped` still means "not
          # this cell's work" and only an explicit `failure` downgrades.
          companion_uncovered=""
          result="$JOB_STATUS"
          if [ "$COMPANIONS_ONLY" = "true" ]; then
            if [ "$result" = "success" ] && [ "$COMPANION" != "success" ]; then
              result=failure
              companion_uncovered=1
              echo "::error title=${PACKAGE} ${JOB} (${ENVIRONMENT}) failed::companion lint: ${COMPANION}. This cell runs no clippy of its own, so a companion that did not succeed leaves it with no evidence."
            fi
          elif [ "$result" = "success" ] && { [ "$GATE" = "failure" ] || [ "$ZED" = "failure" ] || [ "$COMPANION" = "failure" ]; }; then
            result=failure
            echo "::error title=${PACKAGE} ${JOB} (${ENVIRONMENT}) failed::clippy: ${GATE}; Zed extension: ${ZED}; companion lint: ${COMPANION}."
          fi
          companions='{}'
          if [ -f "$COMPANIONS_FILE" ]; then
            companions="$(cat "$COMPANIONS_FILE")"
          fi
          detail=""
          if [ "$COMPANION" = "failure" ] || [ -n "$companion_uncovered" ]; then
            failed="$(jq -r '[to_entries[] | select(.value.outcome != "success") | .key] | join(", ")' <<<"$companions")"
            if [ -n "$companion_uncovered" ]; then
              detail="companion suite(s) ${failed:-unreported} lint produced no success evidence; this cell lints nothing of its own, so nothing else covers them"
            else
              detail="companion suite(s) ${failed:-unreported} lint FAILED; clippy's result does not cover them"
            fi
          fi
          # An unmeasured duration is ABSENT: the lint step never ran (a
          # cancelled job, or a companions-only cell that skips clippy on
          # purpose) and inventing a measurement for it would be a fabrication
          # (AC13). Nothing downstream divides by it — the empty string is
          # dropped from the document here rather than coerced to a number. A
          # RECORDED duration is emitted exactly as the step measured it,
          # fraction included — `0.4` is a fast clippy run, and only the absent
          # field means "not recorded".
          jq -nc \
            --arg package "$PACKAGE" \
            --arg job "$JOB" \
            --arg environment "$ENVIRONMENT" \
            --arg result "$result" \
            --arg detail "$detail" \
            --arg duration "$GATE_DURATION" \
            --argjson companions "$companions" \
            '{package: $package, job: $job, environment: $environment, result: $result}
             + (if $detail == "" then {} else {detail: $detail} end)
             + (if $duration == "" then {} else {duration_s: ($duration | tonumber)} end)
             + (if ($companions | length) == 0 then {} else {companions: $companions} end)' \
            >"$RUNNER_TEMP/status/status.json"
      - name: Upload producer status
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.cell.outputs.status_artifact }}
          path: ${{ runner.temp }}/status
      # A lint cell drives no nextest, so it publishes no expected listing and
      # `completion.py` certifies it on the gate's own outcome, its companions,
      # and the cell's binding.
      - name: Certify this cell's completeness
        id: completion
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/completion.py \
            --plan ci-artifacts/ci-resolved-plan/resolved-plan.json \
            --cell '${{ steps.cell.outputs.cell }}' \
            --artifacts ci-artifacts \
            --companions "$RUNNER_TEMP/companions.json" \
            --target '${{ steps.cell.outputs.target }}' \
            --run "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --out "$RUNNER_TEMP/completion/completion.json"
      - name: Upload this cell's completion record
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.cell.outputs.completion_artifact }}
          path: ${{ runner.temp }}/completion

  # WSL2 is a supported Linux environment, not a runner label. Delegating one
  # row at a time to a dedicated reusable workflow is the whole point: that job
  # runs on `windows-latest` and executes through `wsl-bash`, so if it shared
  # the `test` matrix above, every `runner.os == 'Windows'` branch — native
  # package installation, path handling, shell selection, cache keys, artifact
  # names — would silently apply to a Linux guest.
  #
  # It waits on NOTHING (ruling R3): a red native L1 used to suppress this leg
  # entirely, so the rollup recorded MISSING and one failure erased the guest's
  # evidence. Absence of evidence must never be a side effect of a failure
  # elsewhere.
  wsl2:
    if: ${{ inputs.wsl-rows != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.wsl-rows) }}
    uses: ./.github/workflows/_wsl-ci.yml
    with:
      tested-revision: ${{ inputs.tested-revision }}
      # The whole row. The guest resolves its own execution contract from the
      # plan exactly as a native job does; there is no second input surface,
      # and no environment list reaches this level at all.
      row: ${{ toJSON(matrix) }}
    secrets: inherit

  # THERE IS NO `classify` JOB HERE ANY MORE (retired D15 — judgement lives in
  # `_area-ci.yml`'s per-area coverage audit; ci.yml's `ci-gate` only folds job
  # results). Every producer job uploads an explicit
  # `status-<package>-<gate>[-<environment>]` artifact and a validated
  # `completion-<package>-<gate>-<environment>` record, which together carry
  # what the job's own conclusion cannot (see the header).
