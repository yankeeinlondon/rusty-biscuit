name: package-ci

# Reusable CI building block for a single Cargo package.
#
# `_area-ci.yml` calls this via `workflow_call`, once per gating impacted
# package in its area, so platform behavior stays uniform across the
# monorepo. The package is the unit of selection, execution, and result
# identity: no result-producing job here covers more than one Cargo package.
#
# `environment` is NOT `os`. Windows, macOS, and Linux are operating systems;
# WSL2 is a distinct supported Linux environment that a Windows runner HOSTS.
# Every result identity — artifact name, JUnit manifest record, rollup cell — is
# keyed by {package, environment, tier}. Only `runs-on` and the native-package
# lookup are keyed by runner OS. `native-environments` may therefore be fed
# straight into a `runs-on` matrix (those three environment names ARE runner
# labels); `wsl2-ubuntu` is hoisted into the separate `_wsl-ci.yml` reusable
# workflow precisely so it can never reach that matrix and silently take the
# Windows branch for dependency installation, paths, shells, caching, or
# artifact collection.
#
# Policy this encodes: the canonical per-package recipes (`_test`, `_test_l2`,
# `_test_browser`, `_lint`) on every applicable environment; `check`, `lint`,
# and `test` are independent gates with `test-l2`/`test-browser` staged behind
# `test`; no sharding anywhere (compilation is ~85% of a shard and every shard pays it
# in full — see fixes/2026-08-06-cicd/spec.md § Sharding). Cargo artifacts are
# cached by `Swatinem/rust-cache` only, keyed per package — see
# docs/kache-strategy.md for why the kache rustc-wrapper was removed from CI.
#
# Every building job first runs `just _ensure-native-libs <packages...>` — the
# same recipe `just init` runs on a developer host — with the union of the
# `native` requirements across this package's dependency closure, as computed
# by the scope job from `[package.metadata.ci.native]` declarations.
#
# A FAILED GATE COMMAND DOES NOT FAIL ITS JOB. Every test, lint, and compile
# command below is a `continue-on-error` step with an `id:`, and the job's
# `Record producer status` step folds those outcomes into the cell's `result`:
# `failure` when the job is otherwise healthy but a gate command failed, else
# `job.status` unchanged. The cell's outcome is then judged ONLY by the area's
# rollup (`_area-ci.yml`), which applies the area's baseline — a failure it
# accepts leaves the area green, one it does not blocks the area and so
# `ci-gate`. A red job here would reach `ci-gate` through `area-ci`'s own
# result before that judgement and bypass the baseline (review 6, finding 1),
# which is what the normalization prevents. Setup, provisioning, the JUnit and
# status uploads, and cancellation are NOT normalized: they still fail the
# job, the area, and the gate directly. The status step annotates a
# normalized failure with `::error` so the green job still shows it.

on:
  workflow_call:
    inputs:
      package:
        description: "Cargo package name; the unit of selection, execution, and result identity (e.g. darkmatter-cli)."
        type: string
        required: true
      check-args:
        description: "Args for the compile-check `cargo check`: the package selector, an explicit selector for each declared target kind no test gate compiles (`--examples`, `--benches`), and the declared features (e.g. '-p sniff --examples --benches --features remote'). Never `--all-targets`."
        type: string
        required: true
      dependents-check-args:
        description: "Args for the `cargo check` of this package's UNCHANGED direct reverse dependencies, compiled inside its own check cell on ubuntu-latest only (Open Question 1, Option B): one `-p` per dependent plus the explicit `--lib`/`--bins`/`--tests` selectors their declared kinds need (e.g. '-p dmls -p darkmatter-cli --lib --bins --tests'). Empty when the planner attributed none, which skips the step."
        type: string
        required: true
      dependents:
        description: "JSON array of the dependents `dependents-check-args` compiles, by package name, recorded in the check cell's status so the rollup can render them. Empty when `dependents-check-args` is."
        type: string
        required: true
      test-args:
        description: "Extra args forwarded to the canonical tier recipes (the package's declared feature flags, e.g. '--features remote' or '--all-features')."
        type: string
        default: ""
      gates:
        description: "JSON array of the gates this run selected the package for, from the closed set lint, check, test. A gate absent here schedules no job: the scope calculator narrows a package reached only through a gate-scoped global input (clippy.toml, the `_lint` recipe, nextest.toml, ...) to that gate alone."
        type: string
        default: '["lint", "check", "test"]'
      l1-include-slow:
        description: "Keep `slow_` tests inside the L1 selection (darkmatter's declared L1 contract)."
        type: boolean
        default: false
      native-environments:
        description: "JSON array of NATIVE environments that run the full L1 suite. Each value is also its own runner label; wsl2-ubuntu is deliberately excluded."
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      check-os:
        description: "JSON array of native runner OSes whose `check` cell the planner resolved to hosted execution. Every native OS for a package declaring an `example` or `bench` target; `ubuntu-latest` alone when only unchanged dependents give it a check cell; empty otherwise."
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      l2-environments:
        description: "JSON array of environments where an L2 backend is provisioned. Empty when the package owns no L2 tests."
        type: string
        default: '[]'
      browser-environments:
        description: "JSON array of environments where a headless browser is provisioned. Empty when the package owns no browser tests."
        type: string
        default: '[]'
      backends:
        description: "JSON array of L2 terminal backends this package's tests declare, used to report per-backend coverage."
        type: string
        default: '[]'
      runner-tools:
        description: "JSON array from the closed runner-tool vocabulary: ai-provider-stubs, darkmatter-md-fixture, messenger-desktop-stubs, node-22, pnpm-10, l2-parallel-self-spawn, neovim, zed-extension."
        type: string
        default: '[]'
      companion-suites:
        description: "JSON array of non-Cargo suites this package owns (closed vocabulary: homelab-frontend)."
        type: string
        default: '[]'
      node-environments:
        description: "JSON array of environments where Node + pnpm are provisioned for a declared companion suite. Empty when the package declares none."
        type: string
        default: '[]'
      native:
        description: "JSON map of runner OS -> system packages, the union of `native` requirements across this package's dependency closure."
        type: string
        default: '{}'
      wsl:
        description: "Run the canonical L1 suite inside a WSL2 Ubuntu guest (environment `wsl2-ubuntu`)."
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The repository tracks no rustc wrapper; cleared explicitly so a stray
  # environment value cannot silently intercept a package's builds.
  RUSTC_WRAPPER: ""
  # Force TrueColor on headless runners so styled output matches local dev.
  COLORTERM: truecolor
  # Explicitly select the CI nextest profile (D6) — every `cargo nextest` in the
  # canonical recipes honors this and logs "nextest profile: ci". No reliance on
  # implicit environment detection.
  NEXTEST_PROFILE: ci

jobs:
  # Compile gate for the target kinds no test gate builds, and for the seam
  # with the package's unchanged direct reverse dependencies. The test leg
  # compiles only lib/bins/tests, so the planner credits L1 with those kinds
  # and schedules this job on every native environment for a package
  # declaring `example` or `bench` targets, and on `ubuntu-latest` alone for a
  # package whose only reason is its dependents — `check-os` is empty
  # otherwise. `check-args` carries the explicit `--examples`/`--benches`
  # selectors; the command adds no target flag of its own, so a blanket
  # `--all-targets` would recompile what L1 already covered and mislabel the
  # cell's coverage.
  #
  # It deliberately does NOT carry `RUSTFLAGS: -D warnings`. This gate answers
  # "does it COMPILE on this environment", and promoting warnings destroyed that
  # distinction three ways:
  #
  #   1. It lied. Dead code reported as `error: could not compile <crate>` when
  #      the crate compiled perfectly well.
  #   2. It blamed the wrong package. `playa`'s Windows leg went red for dead
  #      code in `biscuit-terminal`, compiled as a dependency.
  #   3. It had no local reproduction. `just check` sets no RUSTFLAGS, so no
  #      canonical recipe could reproduce the failure.
  #
  # Platform-conditional dead code is the normal shape of cross-platform Rust.
  # `lint` still denies warnings, through clippy inside `_lint`, so `just lint`
  # enforces the same bar off CI.
  #
  # No `name:`, here and in every other job below that can be skipped as a
  # whole. GitHub labels an EXPANDED matrix job from its matrix values
  # (`check (windows-latest)`) but never evaluates the matrix context for a job
  # it SKIPS, so a declared `name:` carrying `${{ matrix.os }}` reaches the
  # Checks tab as raw expression text — 63 such labels in run 34638047631. The
  # default label degrades to the static, human-readable job id instead (AC10).
  # The package half of the identity comes from the caller: a called workflow's
  # jobs render as `<caller job name> / <called job name>`, so this reads
  # `area-ci (claudine) / claudine-cli / check (windows-latest)`.
  check:
    if: ${{ contains(fromJSON(inputs.gates), 'check') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.check-os) }}
    runs-on: ${{ matrix.os }}
    # 45, not 30 — shared by `check`, `test`, and `lint` below.
    #
    # Measured on run 30562649123: completing cells for the heaviest packages
    # cluster at 19-29 minutes. The old 30-minute ceiling sat inside the normal
    # distribution rather than above it, and GitHub reports a timed-out step as
    # `cancelled`, so the rollup recorded MISSING evidence rather than a
    # timeout — indistinguishable, from the rollup's side, from a leg that
    # never ran.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Install native prerequisites
        shell: bash
        env:
          NATIVE: ${{ inputs.native }}
          RUNNER_KEY: ${{ matrix.os }}
        run: |
          set -euo pipefail
          packages="$(jq -r --arg k "$RUNNER_KEY" '.[$k] // [] | join(" ")' <<<"$NATIVE")"
          if [ -n "$packages" ]; then
            # Explicit list: the dependency-closure union computed by the scope
            # job. No argument would install EVERY package's libraries.
            just _ensure-native-libs $packages
          fi
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: package-ci-${{ inputs.package }}-check-${{ matrix.os }}
      # Gate command: normalized, see the header. Its outcome is the cell.
      - name: cargo check (declared example/bench kinds)
        id: check
        continue-on-error: true
        run: cargo check ${{ inputs.check-args }}
      # The second half of the same cell: this package's UNCHANGED direct
      # reverse dependencies, compiled against its new public API (Open
      # Question 1, ruled Option B 2026-09-12). Linux only, and inside THIS
      # package's cell: the consumer's area gets no job, entry, or cell, and a
      # break lands on the area that caused it. The planner spells the same
      # environment (`DEPENDENTS_ENVIRONMENT` in `affected_scope.py`) when it
      # gives a package this cell; `ci_workflow_contracts.rs` pins that the two
      # agree. On any other OS, or with nothing attributed, the step skips and
      # its `skipped` outcome folds as a pass below.
      - name: Compile unchanged dependents
        id: dependents
        if: ${{ matrix.os == 'ubuntu-latest' && inputs.dependents-check-args != '' }}
        continue-on-error: true
        run: cargo check ${{ inputs.dependents-check-args }}
      # Producer status. This job stages no JUnit, so the status artifact is
      # the ONLY evidence it ran and how it concluded — which is what lets a
      # compile-check become a rollup cell that can be baselined and can still
      # block. It is also why a check cell can never come from a local receipt:
      # with no report to attribute, the gate is always CI-origin. `always()`,
      # so a FAILED job still reports itself; a job that reports nothing is
      # MISSING, never a pass. `dependents` names what the second step compiled
      # and `detail` says which half broke, so the rollup can render both.
      - name: Record producer status
        if: ${{ always() }}
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          JOB: check
          ENVIRONMENT: ${{ matrix.os }}
          JOB_STATUS: ${{ job.status }}
          GATE: ${{ steps.check.outcome }}
          DEPENDENTS_GATE: ${{ steps.dependents.outcome }}
          DEPENDENTS: ${{ inputs.dependents }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/status"
          # `result` is the CELL's conclusion, not the job's (see the header).
          result="$JOB_STATUS"
          detail=""
          if [ "$result" = "success" ]; then
            if [ "$GATE" = "failure" ] && [ "$DEPENDENTS_GATE" = "failure" ]; then
              detail="both halves failed to compile: the package's own example/bench kinds and its unchanged dependents"
            elif [ "$GATE" = "failure" ]; then
              detail="the package's own example/bench kinds failed to compile (the unchanged dependents did not fail)"
            elif [ "$DEPENDENTS_GATE" = "failure" ]; then
              detail="an unchanged dependent failed to compile against this package's public API (the package's own targets compiled)"
            fi
          fi
          if [ -n "$detail" ]; then
            result=failure
            echo "::error title=${PACKAGE} ${JOB} (${ENVIRONMENT}) failed::${detail}. The job completes so the area rollup judges the cell against its baseline; a failure the baseline does not accept blocks there."
          fi
          # jq, not printf: dependent names come from the plan and belong in a
          # JSON array, and `detail` is present only when there is one.
          jq -cn \
            --arg package "$PACKAGE" --arg job "$JOB" --arg environment "$ENVIRONMENT" \
            --arg result "$result" --arg detail "$detail" --argjson dependents "$DEPENDENTS" \
            '{package: $package, job: $job, environment: $environment, result: $result, dependents: $dependents}
             + (if $detail == "" then {} else {detail: $detail} end)' \
            >"$RUNNER_TEMP/status/status.json"
      - name: Upload producer status
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: status-${{ inputs.package }}-check-${{ matrix.os }}
          path: ${{ runner.temp }}/status

  # Full L1 suite for one package on every native environment. No sharding:
  # compiling the test binaries is ~85% of a shard and every shard pays it in
  # full, so partitioning cost ~3.2x the compute to save ~2.4 minutes
  # (fixes/2026-08-06-cicd/spec.md § Sharding).
  test:
    if: ${{ contains(fromJSON(inputs.gates), 'test') }}
    # Deliberately depends on nothing. Lint is a parallel gate, not a
    # prerequisite: a clippy hint in one package must not delete another
    # package's L1 evidence. Nor does this job export RUSTFLAGS=-D warnings,
    # which re-coupled them through the back door by failing the test build on
    # any plain rustc warning. Every leg is blocking — a red one is a red run,
    # and known-red legs belong in the results baseline, never in a mechanism
    # that erases them from the verdict.
    strategy:
      fail-fast: false
      matrix:
        # Sound ONLY because every native environment name is also its own runner
        # label. `wsl2-ubuntu` is not, and never enters this matrix — it has its
        # own workflow (see the `wsl2` job below).
        environment: ${{ fromJSON(inputs.native-environments) }}
    runs-on: ${{ matrix.environment }}
    timeout-minutes: 45
    env:
      # Result identity. The shared `just` recipes stamp this into the
      # per-invocation JUnit manifest so a rollup cell traces back to
      # {package, environment, tier} without parsing a display name — which
      # for a skipped matrix leg is not merely unstable but unresolvable. The
      # package half of the identity is the recipe argument itself.
      BISCUIT_CI_ENVIRONMENT: ${{ matrix.environment }}
      # The package's declared L1 contract (`l1-include-slow` in
      # `[package.metadata.ci.tests]`); `_tier_filter` owns the filter strings.
      BISCUIT_L1_INCLUDE_SLOW: ${{ inputs.l1-include-slow && '1' || '' }}
      # A PROVISIONED capability hard-fails when missing, an INAPPLICABLE one
      # skips cleanly. Set only on the legs that provision pnpm, so on those
      # legs a missing pnpm is a provisioning failure the recipe must not
      # swallow, while every other leg (and every developer host) skips loudly
      # and exits 0.
      BISCUIT_FRONTEND_REQUIRED: ${{ contains(fromJSON(inputs.node-environments), matrix.environment) && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Install native prerequisites
        shell: bash
        env:
          NATIVE: ${{ inputs.native }}
          RUNNER_KEY: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          packages="$(jq -r --arg k "$RUNNER_KEY" '.[$k] // [] | join(" ")' <<<"$NATIVE")"
          if [ -n "$packages" ]; then
            just _ensure-native-libs $packages
          fi
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: package-ci-${{ inputs.package }}-test-${{ matrix.environment }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Build messenger desktop stubs
        if: ${{ contains(fromJSON(inputs.runner-tools), 'messenger-desktop-stubs') }}
        shell: bash
        run: |
          set -euo pipefail
          stubs="stub_dunstify stub_notify_send stub_snoretoast stub_burnttoast stub_terminal_notifier stub_alerter"
          build_args=(--all-features -p messenger)
          for stub in $stubs; do
            build_args+=(--bin "$stub")
          done
          cargo build "${build_args[@]}"

          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            stubdir="$(pwd -W)/target/debug"
            suffix=".exe"
          else
            stubdir="$PWD/target/debug"
          fi
          for stub in $stubs; do
            [ -x "$stubdir/$stub$suffix" ] || {
              echo "messenger desktop stub missing after prebuild: $stubdir/$stub$suffix" >&2
              exit 1
            }
          done
          echo "MESSENGER_STUB_BIN_DIR=$stubdir" >>"$GITHUB_ENV"
          echo "messenger desktop stubs built once in $stubdir"
      # Runner tools are a CLOSED vocabulary, implemented here — not an
      # arbitrary command surface. Each entry preserves a package-specific
      # behavior that used to be embedded in an area-level recipe.
      - name: Install AI-provider CLI stubs
        if: ${{ contains(fromJSON(inputs.runner-tools), 'ai-provider-stubs') }}
        shell: bash
        run: |
          set -euo pipefail
          stubdir="$RUNNER_TEMP/ai-cli-stubs"
          mkdir -p "$stubdir"
          for bin in claude opencode roo gemini aider codex goose kimi qwen; do
            if [ "${{ runner.os }}" = "Windows" ]; then
              printf '@echo off\r\nexit /b 0\r\n' >"$stubdir/$bin.cmd"
            else
              printf '#!/usr/bin/env sh\nexit 0\n' >"$stubdir/$bin"
              chmod +x "$stubdir/$bin"
            fi
          done
          echo "$stubdir" >>"$GITHUB_PATH"
      # claudine-cli's `inline_compose_hash` test shells out to darkmatter's
      # `md`, resolved from the workspace target dir before PATH. CI builds only
      # the package's own crates, so the fixture is built explicitly here —
      # the same setup the claudine area recipe's `_ensure-md` dependency
      # performed.
      - name: Build the darkmatter md fixture
        if: ${{ contains(fromJSON(inputs.runner-tools), 'darkmatter-md-fixture') }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v md >/dev/null 2>&1 && [ ! -x target/debug/md ] && [ ! -x target/debug/md.exe ]; then
            cargo build -q -p darkmatter-cli --bin md
          fi
      # Node + pnpm for a package whose declared companion suite is a
      # JavaScript suite (today `homelab-frontend`, owned by `homelab-server`:
      # Vue + Vitest + jsdom). Until this provisioning existed,
      # `pnpm: command not found` killed the suite on EVERY runner while the
      # rollup — which parses Rust JUnit only — rendered the area PASS
      # 222/0/0 on three environments (measured, run 30427703024).
      #
      # Which environments qualify is DERIVED by `affected_scope.py` from the
      # environment capability table; nothing here decides it.
      - name: Set up pnpm
        if: ${{ contains(fromJSON(inputs.node-environments), matrix.environment) }}
        uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Set up Node
        if: ${{ contains(fromJSON(inputs.node-environments), matrix.environment) }}
        uses: actions/setup-node@v6
        with:
          node-version: 22
      # Runtime reachability, mirroring the L2 tier's `tmux -V`: a capability
      # the package DECLARED must fail its own named provisioning step when it
      # is not actually usable, rather than surface minutes later as a suite
      # that "skipped" under a green cell.
      - name: Verify the pnpm toolchain
        if: ${{ contains(fromJSON(inputs.node-environments), matrix.environment) }}
        shell: bash
        run: |
          set -euo pipefail
          node --version
          pnpm --version
      # Gate command: normalized, see the header. Its outcome is the cell.
      - name: L1 tests
        id: l1
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # --no-fail-fast: run ALL of the package's tests so one slow or
          # failing test cannot suppress the rest of the suite's evidence.
          just _test "${{ inputs.package }}" --no-fail-fast ${{ inputs.test-args }}
      # Companion suites are non-Cargo suites OWNED by this package. The step
      # runs even when the Rust suite failed — one red crate cannot hide a red
      # frontend, exactly as the old area recipe's combined status worked —
      # and its outcome reaches the producer status below, so a green Rust
      # JUnit report can never hide a failed or skipped companion suite.
      - name: Companion suite homelab-frontend
        id: companion
        if: ${{ !cancelled() && contains(fromJSON(inputs.companion-suites), 'homelab-frontend') && contains(fromJSON(inputs.node-environments), matrix.environment) }}
        continue-on-error: true
        shell: bash
        run: cd homelab && just test-frontend
      # Per-package/environment JUnit. The artifact name carries the
      # ENVIRONMENT, not the runner label, so a WSL leg (which runs on
      # windows-latest) can never collide with, or be merged into, the native
      # Windows leg.
      #
      # The whole STAGING DIRECTORY, not `target/nextest/ci/test-results.xml`:
      # that single path is overwritten by every nextest invocation. The
      # staging tree carries one XML per invocation plus `manifest.jsonl`, and
      # the manifest — not this artifact's name — is what gives each record
      # its {package, environment, tier} identity.
      - name: Upload L1 JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: junit-${{ inputs.package }}-L1-${{ matrix.environment }}
          path: target/nextest/ci-reports
          if-no-files-found: ignore
      # `L1`, not `test`: `ci-rollup` keys a status by TIER. A status naming a
      # test tier explains a MISSING cell downstream of it; a status naming
      # anything else becomes a cell in its own right. `test` would manufacture
      # a phantom `<package>/<env>/test` cell beside the real L1 one and
      # double-count the same failure.
      - name: Record producer status
        if: ${{ always() }}
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          JOB: L1
          ENVIRONMENT: ${{ matrix.environment }}
          JOB_STATUS: ${{ job.status }}
          GATE: ${{ steps.l1.outcome }}
          COMPANION: ${{ steps.companion.outcome }}
          COMPANION_SUITES: ${{ inputs.companion-suites }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/status"
          # `result` is the CELL's conclusion, not the job's (see the header).
          result="$JOB_STATUS"
          if [ "$result" = "success" ] && { [ "$GATE" = "failure" ] || [ "$COMPANION" = "failure" ]; }; then
            result=failure
            echo "::error title=${PACKAGE} ${JOB} (${ENVIRONMENT}) failed::L1 tests: ${GATE}; companion suite: ${COMPANION}. The job completes so the area rollup judges the cell against its baseline; a failure the baseline does not accept blocks there."
          fi
          # A DECLARED companion suite always records its step outcome, not
          # only on failure: a SKIPPED companion leaves no other evidence, and
          # the rollup downgrades a green Rust cell whose declared companion
          # produced no success evidence (R12).
          companion_json=""
          if [ "$(jq -r 'length' <<<"$COMPANION_SUITES")" -gt 0 ]; then
            companion_json="$(printf ',"companion":"%s"' "${COMPANION:-skipped}")"
          fi
          if [ "$COMPANION" = "failure" ]; then
            detail="companion suite homelab-frontend FAILED; the Rust JUnit report does not cover it"
            printf '{"package":"%s","job":"%s","environment":"%s","result":"%s","detail":"%s"%s}\n' \
              "$PACKAGE" "$JOB" "$ENVIRONMENT" "$result" "$detail" "$companion_json" \
              >"$RUNNER_TEMP/status/status.json"
          else
            printf '{"package":"%s","job":"%s","environment":"%s","result":"%s"%s}\n' \
              "$PACKAGE" "$JOB" "$ENVIRONMENT" "$result" "$companion_json" \
              >"$RUNNER_TEMP/status/status.json"
          fi
      - name: Upload producer status
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: status-${{ inputs.package }}-L1-${{ matrix.environment }}
          path: ${{ runner.temp }}/status

  # This job has no matrix, so a static name is the only label it can have —
  # and AC10 requires lint to say which environment produced its result, which
  # the bare job id would not.
  lint:
    name: lint (ubuntu-latest)
    if: ${{ contains(fromJSON(inputs.gates), 'lint') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # `just/devops.just`'s `_lint` already passes `-D warnings` to clippy;
      # this keeps the package's workspace dependencies held to the same bar
      # while they are compiled for that clippy run.
      RUSTFLAGS: "-D warnings"
      # Same contract the `test` job carries, for the same capability: on the
      # leg that provisions pnpm, a missing pnpm is a PROVISIONING FAILURE and
      # `lint-frontend` must fail rather than self-skip.
      BISCUIT_FRONTEND_REQUIRED: ${{ contains(fromJSON(inputs.node-environments), 'ubuntu-latest') && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Install native prerequisites
        shell: bash
        env:
          NATIVE: ${{ inputs.native }}
          RUNNER_KEY: ubuntu-latest
        run: |
          set -euo pipefail
          packages="$(jq -r --arg k "$RUNNER_KEY" '.[$k] // [] | join(" ")' <<<"$NATIVE")"
          if [ -n "$packages" ]; then
            just _ensure-native-libs $packages
          fi
      # clippy + rustfmt come from rust-toolchain.toml (the single authority).
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - name: Read the pinned Zed extension packager record
        if: ${{ contains(fromJSON(inputs.runner-tools), 'zed-extension') }}
        id: zed-extension-pin
        shell: bash
        run: |
          set -euo pipefail
          config=.github/ci/zed-extension.json
          test "$(jq -r '.schema_version' "$config")" = 1
          for field in zed_commit linux_x86_64_url linux_x86_64_sha256; do
            value="$(jq -er ".${field} | select(type == \"string\" and length > 0)" "$config")"
            printf '%s=%s\n' "$field" "$value" >>"$GITHUB_OUTPUT"
          done
      - name: Cache the pinned Zed extension packager
        if: ${{ contains(fromJSON(inputs.runner-tools), 'zed-extension') }}
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/zed-extension/${{ steps.zed-extension-pin.outputs.zed_commit }}/zed-extension
          key: zed-extension-${{ steps.zed-extension-pin.outputs.zed_commit }}-${{ steps.zed-extension-pin.outputs.linux_x86_64_sha256 }}
      - name: Provision the Zed extension verification toolchain
        if: ${{ contains(fromJSON(inputs.runner-tools), 'zed-extension') }}
        shell: bash
        env:
          ZED_EXTENSION_SHA: ${{ steps.zed-extension-pin.outputs.zed_commit }}
          ZED_EXTENSION_URL: ${{ steps.zed-extension-pin.outputs.linux_x86_64_url }}
          ZED_EXTENSION_SHA256: ${{ steps.zed-extension-pin.outputs.linux_x86_64_sha256 }}
        run: |
          set -euo pipefail
          rustup target add wasm32-wasip2
          tool_dir="$RUNNER_TOOL_CACHE/zed-extension/$ZED_EXTENSION_SHA"
          tool="$tool_dir/zed-extension"
          mkdir -p "$tool_dir"
          if [ ! -f "$tool" ]; then
            curl --fail --location --retry 3 --output "$tool" "$ZED_EXTENSION_URL"
          fi
          printf '%s  %s\n' "$ZED_EXTENSION_SHA256" "$tool" | sha256sum --check --strict
          chmod +x "$tool"
          "$tool" --help >/dev/null
          echo "$tool_dir" >>"$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: package-ci-${{ inputs.package }}-lint-ubuntu-latest
      # A declared companion suite lints too (the homelab area recipe's `lint`
      # ran `lint-frontend` after clippy), so this job needs the same toolchain
      # the `test` job gets.
      - name: Set up pnpm
        if: ${{ contains(fromJSON(inputs.node-environments), 'ubuntu-latest') }}
        uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Set up Node
        if: ${{ contains(fromJSON(inputs.node-environments), 'ubuntu-latest') }}
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify the pnpm toolchain
        if: ${{ contains(fromJSON(inputs.node-environments), 'ubuntu-latest') }}
        shell: bash
        run: |
          set -euo pipefail
          node --version
          pnpm --version
      # Gate commands: normalized, see the header. Their outcomes are the cell.
      - name: Lint
        id: clippy
        continue-on-error: true
        run: just _lint "${{ inputs.package }}"
      - name: Verify the Zed extension package
        id: zed
        if: ${{ !cancelled() && contains(fromJSON(inputs.runner-tools), 'zed-extension') }}
        continue-on-error: true
        shell: bash
        run: cd darkmatter && just zed-verify
      - name: Companion suite homelab-frontend lint
        id: companion
        if: ${{ !cancelled() && contains(fromJSON(inputs.companion-suites), 'homelab-frontend') && contains(fromJSON(inputs.node-environments), 'ubuntu-latest') }}
        continue-on-error: true
        shell: bash
        run: cd homelab && just lint-frontend
      # `lint` emits no JUnit, so this artifact is the sole basis for its
      # rollup cell — and the reason `ci-baseline.toml` can carry
      # `tier = "lint"` entries at all.
      - name: Record producer status
        if: ${{ always() }}
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          JOB: lint
          ENVIRONMENT: ubuntu-latest
          JOB_STATUS: ${{ job.status }}
          GATE: ${{ steps.clippy.outcome }}
          ZED: ${{ steps.zed.outcome }}
          COMPANION: ${{ steps.companion.outcome }}
          COMPANION_SUITES: ${{ inputs.companion-suites }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/status"
          # `result` is the CELL's conclusion, not the job's (see the header).
          result="$JOB_STATUS"
          if [ "$result" = "success" ] && { [ "$GATE" = "failure" ] || [ "$ZED" = "failure" ] || [ "$COMPANION" = "failure" ]; }; then
            result=failure
            echo "::error title=${PACKAGE} ${JOB} (${ENVIRONMENT}) failed::clippy: ${GATE}; Zed extension: ${ZED}; companion lint: ${COMPANION}. The job completes so the area rollup judges the cell against its baseline; a failure the baseline does not accept blocks there."
          fi
          companion_json=""
          if [ "$(jq -r 'length' <<<"$COMPANION_SUITES")" -gt 0 ]; then
            companion_json="$(printf ',"companion":"%s"' "${COMPANION:-skipped}")"
          fi
          if [ "$COMPANION" = "failure" ]; then
            detail="companion suite homelab-frontend lint FAILED; clippy's result does not cover it"
            printf '{"package":"%s","job":"%s","environment":"%s","result":"%s","detail":"%s"%s}\n' \
              "$PACKAGE" "$JOB" "$ENVIRONMENT" "$result" "$detail" "$companion_json" \
              >"$RUNNER_TEMP/status/status.json"
          else
            printf '{"package":"%s","job":"%s","environment":"%s","result":"%s"%s}\n' \
              "$PACKAGE" "$JOB" "$ENVIRONMENT" "$result" "$companion_json" \
              >"$RUNNER_TEMP/status/status.json"
          fi
      - name: Upload producer status
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: status-${{ inputs.package }}-lint
          path: ${{ runner.temp }}/status

  # L2 (real terminal), one leg per environment where a backend is provisioned.
  # tmux/PTY is the ONLY backend headless CI can host (D8) and it installs on
  # BOTH Linux (apt) and macOS (brew), so this is a matrix rather than a
  # hardcoded ubuntu leg. WezTerm/Kitty/Apple Terminal require running INSIDE
  # that GUI, so those tests skip cleanly here via require_level!. The "Report
  # L2 backend coverage" step makes that skip VISIBLE rather than silent.
  #
  # We hard-require the provisioned backend by VERIFYING tmux is reachable
  # rather than setting a global BISCUIT_TEST_LEVEL_REQUIRED, which would panic
  # the GUI-backed tests this runner cannot host.
  #
  # Windows and wsl2-ubuntu are absent by construction: `l2-environments` is
  # derived from package policy crossed with the environment capability table,
  # so an L2 tier there is recorded as a POLICY GAP in the rollup instead of
  # appearing as a green 0-run cell.
  test-l2:
    # Ordering only: this tier runs AFTER L1 for resource staging, but does not
    # require L1 to have passed. A red L1 used to suppress this leg entirely,
    # so the rollup recorded MISSING and one L1 failure erased the whole tier's
    # evidence. Absence of evidence must never be a side effect of a failure
    # elsewhere.
    needs: test
    if: ${{ !cancelled() && inputs.l2-environments != '[]' && contains(fromJSON(inputs.gates), 'test') }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.l2-environments) }}
    runs-on: ${{ matrix.environment }}
    timeout-minutes: 30
    env:
      BISCUIT_CI_ENVIRONMENT: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v5
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Install native prerequisites
        shell: bash
        env:
          NATIVE: ${{ inputs.native }}
          RUNNER_KEY: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          packages="$(jq -r --arg k "$RUNNER_KEY" '.[$k] // [] | join(" ")' <<<"$NATIVE")"
          if [ -n "$packages" ]; then
            just _ensure-native-libs $packages
          fi
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - name: Provision and verify the tmux backend
        shell: bash
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            ubuntu-latest)
              sudo apt-get update && sudo apt-get install -y tmux
              ;;
            macos-latest)
              brew list tmux >/dev/null 2>&1 || brew install tmux
              ;;
            *)
              echo "no tmux provisioning path for environment '$ENVIRONMENT'" >&2
              exit 1
              ;;
          esac
          # Verify runtime reachability (D8): a broken tmux fails this named
          # provisioning step — the hard-require for the one L2 backend CI hosts.
          # `tmux -V` needs no server, no display, and no pane, so it takes no
          # focus. CI must never steal focus.
          tmux -V
      # `neovim` runner tool: dmls's L2 suite runs a real Neovim (headless and
      # inside tmux). Without the binary every gate skips, and backend-proof
      # then rightly fails the tier for producing no tmux evidence.
      - name: Provision neovim
        if: contains(fromJSON(inputs.runner-tools), 'neovim')
        shell: bash
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            ubuntu-latest)
              sudo apt-get update && sudo apt-get install -y neovim
              ;;
            macos-latest)
              brew list neovim >/dev/null 2>&1 || brew install neovim
              ;;
            *)
              echo "no neovim provisioning path for environment '$ENVIRONMENT'" >&2
              exit 1
              ;;
          esac
          nvim --version | head -1
      - name: Report L2 backend coverage
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          ENVIRONMENT: ${{ matrix.environment }}
          DECLARED_BACKENDS: ${{ inputs.backends }}
        run: |
          set -euo pipefail
          # A backend that cannot exist here skips silently inside require_level!.
          # Naming every declared backend and its status turns "0 run / N skipped"
          # from an invisible non-event into a readable row.
          {
            echo "### L2 backends — ${PACKAGE} on ${ENVIRONMENT}"
            echo ""
            echo "| backend | status |"
            echo "|---|---|"
            while IFS= read -r backend; do
              [ -n "$backend" ] || continue
              if [ "$backend" = "tmux" ]; then
                echo "| tmux | provisioned — its tests MUST execute |"
              elif [ "$backend" = "apple-terminal" ] && [ "$ENVIRONMENT" = "macos-latest" ]; then
                echo "| apple-terminal | unavailable — \`available()\` returns false when CI is truthy; its tests skip |"
              else
                echo "| ${backend} | unavailable — needs a live GUI session; its tests skip |"
              fi
            done < <(printf '%s' "$DECLARED_BACKENDS" | jq -r '.[]?')
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: package-ci-${{ inputs.package }}-test-${{ matrix.environment }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      # Gate command: normalized, see the header. Its outcome is the cell.
      - name: L2 tests
        id: l2
        continue-on-error: true
        shell: bash
        env:
          RUNNER_TOOLS: ${{ inputs.runner-tools }}
          DECLARED_BACKENDS: ${{ inputs.backends }}
        run: |
          set -euo pipefail
          # Execution proof, not just availability: require exactly the
          # declared backends this leg actually provisioned (tmux is the only
          # CI-hostable one). With BISCUIT_TEST_REQUIRED_BACKENDS set,
          # `_test_l2`'s backend-proof bracket fails the tier when a required
          # backend produced zero executed tests — an installed tmux plus a
          # suite that skipped everywhere must not render a green cell.
          required="$(jq -r '[.[] | select(. == "tmux")] | join(",")' <<<"$DECLARED_BACKENDS")"
          if [ -n "$required" ]; then
            export BISCUIT_TEST_REQUIRED_BACKENDS="$required"
          fi
          # Only declared self-isolating suites can use the shared worker
          # budget; suites using a shared pane must remain serial.
          if [ "$(jq -r 'contains(["l2-parallel-self-spawn"])' <<<"$RUNNER_TOOLS")" = "true" ]; then
            export BISCUIT_L2_THREADS="${BISCUIT_L2_THREADS:-${NEXTEST_TEST_THREADS:-$(just _test_threads)}}"
          fi
          just _test_l2 "${{ inputs.package }}" ${{ inputs.test-args }}
      # The staging directory, so the manifest travels with the reports. See
      # the L1 upload for why the single overwritten file is not enough.
      - name: Upload L2 JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: junit-${{ inputs.package }}-L2-${{ matrix.environment }}
          path: target/nextest/ci-reports
          if-no-files-found: ignore
      - name: Record producer status
        if: ${{ always() }}
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          JOB: L2
          ENVIRONMENT: ${{ matrix.environment }}
          JOB_STATUS: ${{ job.status }}
          GATE: ${{ steps.l2.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/status"
          # `result` is the CELL's conclusion, not the job's (see the header).
          result="$JOB_STATUS"
          if [ "$result" = "success" ] && [ "$GATE" = "failure" ]; then
            result=failure
            echo "::error title=${PACKAGE} ${JOB} (${ENVIRONMENT}) failed::the L2 tests failed. The job completes so the area rollup judges the cell against its baseline; a failure the baseline does not accept blocks there."
          fi
          printf '{"package":"%s","job":"%s","environment":"%s","result":"%s"}\n' \
            "$PACKAGE" "$JOB" "$ENVIRONMENT" "$result" \
            >"$RUNNER_TEMP/status/status.json"
      - name: Upload producer status
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: status-${{ inputs.package }}-L2-${{ matrix.environment }}
          path: ${{ runner.temp }}/status

  test-browser:
    # Ordering only: this tier runs AFTER L1 for resource staging, but does not
    # require L1 to have passed. A red L1 used to suppress this leg entirely,
    # so the rollup recorded MISSING and one L1 failure erased the whole tier's
    # evidence. Absence of evidence must never be a side effect of a failure
    # elsewhere.
    needs: test
    if: ${{ !cancelled() && inputs.browser-environments != '[]' && contains(fromJSON(inputs.gates), 'test') }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.browser-environments) }}
    runs-on: ${{ matrix.environment }}
    timeout-minutes: 30
    env:
      BISCUIT_BROWSER_REQUIRED: "1"
      BISCUIT_CI_ENVIRONMENT: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v5
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Install native prerequisites
        shell: bash
        env:
          NATIVE: ${{ inputs.native }}
          RUNNER_KEY: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          packages="$(jq -r --arg k "$RUNNER_KEY" '.[$k] // [] | join(" ")' <<<"$NATIVE")"
          if [ -n "$packages" ]; then
            just _ensure-native-libs $packages
          fi
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: package-ci-${{ inputs.package }}-test-${{ matrix.environment }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      # Gate command: normalized, see the header. Its outcome is the cell.
      - name: Browser tests
        id: browser
        continue-on-error: true
        run: just _test_browser "${{ inputs.package }}" ${{ inputs.test-args }}
      # The staging directory, so the manifest travels with the reports. See
      # the L1 upload for why the single overwritten file is not enough.
      - name: Upload browser JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: junit-${{ inputs.package }}-browser-${{ matrix.environment }}
          path: target/nextest/ci-reports
          if-no-files-found: ignore
      - name: Record producer status
        if: ${{ always() }}
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          JOB: browser
          ENVIRONMENT: ${{ matrix.environment }}
          JOB_STATUS: ${{ job.status }}
          GATE: ${{ steps.browser.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/status"
          # `result` is the CELL's conclusion, not the job's (see the header).
          result="$JOB_STATUS"
          if [ "$result" = "success" ] && [ "$GATE" = "failure" ]; then
            result=failure
            echo "::error title=${PACKAGE} ${JOB} (${ENVIRONMENT}) failed::the browser tests failed. The job completes so the area rollup judges the cell against its baseline; a failure the baseline does not accept blocks there."
          fi
          printf '{"package":"%s","job":"%s","environment":"%s","result":"%s"}\n' \
            "$PACKAGE" "$JOB" "$ENVIRONMENT" "$result" \
            >"$RUNNER_TEMP/status/status.json"
      - name: Upload producer status
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: status-${{ inputs.package }}-browser-${{ matrix.environment }}
          path: ${{ runner.temp }}/status

  # WSL2 is a supported Linux environment, not a runner label. Delegating to a
  # dedicated reusable workflow is the whole point: that job runs on
  # `windows-latest` and executes through `wsl-bash`, so if it shared the
  # matrix above, every `runner.os == 'Windows'` branch — native package
  # installation, path handling, shell selection, cache keys, artifact names —
  # would silently apply to a Linux guest.
  wsl2:
    # Ordering only: this tier runs AFTER L1 for resource staging, but does not
    # require L1 to have passed. A red L1 used to suppress this leg entirely,
    # so the rollup recorded MISSING and one L1 failure erased the whole tier's
    # evidence. Absence of evidence must never be a side effect of a failure
    # elsewhere.
    needs: test
    if: ${{ !cancelled() && contains(fromJSON(inputs.gates), 'test') && inputs.wsl }}
    uses: ./.github/workflows/_wsl-ci.yml
    with:
      package: ${{ inputs.package }}
      # Package and features only: `check-args` carries example/bench
      # selectors, which would bake those kinds into the archive the guest
      # runs. The guest's compile coverage is the L1 archive build, nothing more.
      archive-args: -p ${{ inputs.package }} ${{ inputs.test-args }}
      test-args: ${{ inputs.test-args }}
      l1-include-slow: ${{ inputs.l1-include-slow }}
      runner-tools: ${{ inputs.runner-tools }}
      native: ${{ inputs.native }}
    secrets: inherit

  # THERE IS NO `classify` JOB HERE ANY MORE (retired D15 — judgement lives in
  # `_area-ci.yml`'s per-area `rollup`; ci.yml's `ci-gate` only folds job
  # results). Every producer job uploads an explicit
  # `status-<package>-<job>` artifact, which carries the same fact per
  # {package, environment, tier} — including a failed gate command, which the
  # job's own conclusion no longer carries (see the header).
