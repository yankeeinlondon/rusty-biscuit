name: Release-plz

# Three jobs, one tool. Every job gets release-plz through
# `.github/actions/setup-release-plz`, which builds (or restores from cache)
# one patched, pinned build, so the dry run calculates with exactly the tool
# and toolchain the two publishing jobs run.
#
# - `release-plz-pr` prepares: after a successful `ci` push run on `main`, it
#   opens or updates the draft release proposal with the release App's token.
# - `release-plz-release` publishes: after the App's proposal is merged with a
#   merge commit, it tags and releases the proposal's final commit.
# - `release-dry-run` calculates from any branch, read-only, with no App
#   credentials, and keeps its diagnostics even when the calculation fails.
#
# Every decision about an event is made by `scripts/ci/release_path.py`, which
# reads the event from `GITHUB_EVENT_PATH`; the job `if:` guards below are a
# coarse first filter, not the authority. No event value is interpolated into
# shell code. The operational guide is `docs/releases.md`.
#
# Footgun: `workflow_run` workflows execute the definition from the DEFAULT
# BRANCH, not from the triggering commit. Edits to the preparation job take
# effect only once merged to `main`. That is GitHub's rule: a privileged
# definition must not come from the commit it is judging. `release-dry-run`
# is `workflow_dispatch`, which DOES honour the ref you select, so the
# calculation can be exercised from a branch before its definition is merged.
on:
  workflow_run:
    workflows: ["Continuous integration"]
    types:
      - completed
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

env:
  # release-plz shells out to Cargo, which compiles. The repository tracks no
  # rustc wrapper; cleared explicitly so a stray environment value cannot
  # intercept a release build.
  RUSTC_WRAPPER: ""
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The workflow's own token only reads. Every write is made with a short-lived
# installation token of the release App, minted in the job that needs it.
permissions:
  contents: read

jobs:
  release-plz-pr:
    name: Create Release PR
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.repository == 'yankeeinlondon/rusty-biscuit'
    permissions:
      contents: read
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      # The branch, NOT `workflow_run.head_sha`. A bare SHA detaches HEAD, and
      # release-plz resolves the branch it is releasing through
      # `git rev-parse --abbrev-ref --symbolic-full-name @{upstream}`, which on
      # a detached HEAD answers `fatal: HEAD does not point to a branch`. Every
      # release calculation from 2026-08-31 to 2026-09-13 died there. Freshness
      # is asserted against `workflow_run.head_sha` by `select prepare` instead.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # A stale run (main advanced past the commit CI validated) or any event
      # that is not a successful ci push run on main stands down here with a
      # notice, before any tool or credential exists.
      - name: Select the validated main revision
        id: select
        shell: bash
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
          HAS_RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: python3 scripts/ci/release_path.py select prepare

      - name: Set up release-plz
        if: steps.select.outputs.selected == 'true'
        uses: ./.github/actions/setup-release-plz

      - name: Assert clean tracked worktree before release calculation
        if: steps.select.outputs.selected == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error title=release bootstrap::tracked files were modified before release calculation began"
            git status --porcelain --untracked-files=no
            exit 1
          fi

      - name: Mint the release App token
        if: steps.select.outputs.selected == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # release-plz receives the App token as `GIT_TOKEN` for its API calls and
      # through a credential helper scoped to its own process for the push;
      # the bot is author and committer of the proposal commit, for this
      # process only. It calculates in the same environment as the dry run's
      # `update`. Nothing is written to Git configuration.
      - name: Open or update the release proposal
        if: steps.select.outputs.selected == 'true'
        shell: bash
        env:
          GIT_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
        run: python3 scripts/ci/release_path.py release-pr --output "${RUNNER_TEMP}/release-pr.json"

      # `release-pr` commits its proposal to the release branch and pushes it,
      # so the checked-out `main` must finish exactly as clean as it started.
      # A tracked modification here means release-plz edited this checkout in
      # place; `release-dry-run` names such files from a branch first.
      - name: Assert clean tracked worktree after release calculation
        if: steps.select.outputs.selected == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error title=release bootstrap::release calculation left tracked modifications in the worktree"
            git status --porcelain --untracked-files=no
            exit 1
          fi

  release-plz-release:
    name: Publish Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release-plz-') &&
      contains(github.event.pull_request.labels.*.name, 'release') &&
      github.repository == 'yankeeinlondon/rusty-biscuit'
    permissions:
      contents: read
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    steps:
      # The merge commit this event names, never the current `main`: a later
      # push must not change what an earlier merge releases. Tags are fetched
      # with the full history.
      - name: Checkout the merge commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      # Authorship by the release App, canonical repositories, a two-parent
      # merge whose second parent is the proposal's final commit, and the
      # release configuration at that commit, all before any credential.
      - name: Verify the merged release proposal
        id: select
        shell: bash
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
          HAS_RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: python3 scripts/ci/release_path.py select publish

      - name: Inventory tags and Releases before publication
        if: steps.select.outputs.selected == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.select.outputs.merge_sha }}
          HEAD_SHA: ${{ steps.select.outputs.head_sha }}
          BASE_SHA: ${{ steps.select.outputs.base_sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/release_path.py inventory \
            --merge-sha "${MERGE_SHA}" --head-sha "${HEAD_SHA}" --base-sha "${BASE_SHA}" \
            --title "Release inventory before publication" \
            --output "${RUNNER_TEMP}/release-path/inventory-before.json"

      - name: Set up release-plz
        if: steps.select.outputs.selected == 'true'
        uses: ./.github/actions/setup-release-plz

      - name: Assert clean tracked worktree before publication
        if: steps.select.outputs.selected == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error title=release bootstrap::tracked files were modified before publication began"
            git status --porcelain --untracked-files=no
            exit 1
          fi

      - name: Mint the release App token
        if: steps.select.outputs.selected == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # One release-plz process per package, each in a fresh clone detached at
      # the proposal's final commit. A tag that exists without its Release is
      # recovered by creating only the Release; a tag at any other commit, a
      # Release without its tag, or a draft Release stops publication before
      # anything is written. Re-running this run is the recovery path.
      - name: Publish tags and Releases
        if: steps.select.outputs.selected == 'true'
        shell: bash
        env:
          GIT_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
          MERGE_SHA: ${{ steps.select.outputs.merge_sha }}
          HEAD_SHA: ${{ steps.select.outputs.head_sha }}
          BASE_SHA: ${{ steps.select.outputs.base_sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/release_path.py publish \
            --merge-sha "${MERGE_SHA}" --head-sha "${HEAD_SHA}" --base-sha "${BASE_SHA}" \
            --workdir "${RUNNER_TEMP}/release-path/packages" \
            --output "${RUNNER_TEMP}/release-path/publication.json"

      - name: Keep the publication inventory
        if: always() && steps.select.outputs.selected == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: release-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-path/*.json
          if-no-files-found: warn

      - name: Remove disposable clones
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/release-path"

  # The only way to exercise the release calculation from a branch.
  #
  # `release-plz update` computes each crate's next version and writes ONLY to
  # this disposable checkout: no branch, no push, no pull request, no
  # registry. It intentionally leaves its edits in place (manifests,
  # changelogs, possibly new changelog files), which `calculation-report`
  # lists; `release-pr` instead commits the same calculation to the proposal
  # branch and must leave its checkout clean.
  #
  # Read-only: no App token, no private key, and the workflow token only reads.
  # Diagnostics and the artifact run even when the calculation fails, and that
  # failure stays the job's result.
  release-dry-run:
    name: Release Dry Run
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the release calculation has a branch to stand on
        shell: bash
        run: |
          set -euo pipefail
          echo "branch:   $(git rev-parse --abbrev-ref HEAD)"
          echo "upstream: $(git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}')"

      - name: Set up release-plz
        uses: ./.github/actions/setup-release-plz

      - name: Diagnose before the calculation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/release_path.py diagnose \
            --output "${RUNNER_TEMP}/release-diagnostics/before.json" --summary "${GITHUB_STEP_SUMMARY}"

      # `release_path.py update` runs `release-plz update` in the calculation
      # environment `release-pr` also uses (a process-scoped fallback
      # attributes file that keeps historical checkouts of PowerShell scripts
      # clean), so a dry-run success predicts the proposal's calculation.
      - name: Compute next versions
        shell: bash
        env:
          RELEASE_PLZ_LOG: debug
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-diagnostics"
          GIT_TRACE="${RUNNER_TEMP}/release-diagnostics/git-trace.log" \
            python3 scripts/ci/release_path.py update \
            > "${RUNNER_TEMP}/release-diagnostics/update.stdout.log" 2> "${RUNNER_TEMP}/release-diagnostics/update.stderr.log"

      - name: Report what the calculation changed
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/release_path.py calculation-report --output "${RUNNER_TEMP}/release-diagnostics/calculation.json"

      - name: Diagnose after the calculation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-diagnostics"
          git diff > "${RUNNER_TEMP}/release-diagnostics/update.diff"
          git ls-files --others --exclude-standard > "${RUNNER_TEMP}/release-diagnostics/untracked.txt"
          tail -n 40 "${RUNNER_TEMP}/release-diagnostics/update.stderr.log" 2>/dev/null || true
          python3 scripts/ci/release_path.py diagnose \
            --output "${RUNNER_TEMP}/release-diagnostics/after.json" --summary "${GITHUB_STEP_SUMMARY}"

      - name: Keep the diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-diagnostics
          if-no-files-found: warn
