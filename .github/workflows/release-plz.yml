name: Release-plz

# Release automation is gated on validation (D13 / OQ2 Option A): the release-PR
# calculation runs only AFTER the required `ci` workflow concludes successfully
# on `main`, instead of racing it on every push.
#
# Footgun: `workflow_run` workflows execute the definition from the DEFAULT
# BRANCH, not from the triggering commit. Edits to this trigger take effect only
# once merged to `main`.
#
# Lockfile note: lockfiles are TRACKED as of 2026-07-30 (they were gitignored
# from 2026-04-08). The clean-worktree assertions below inspect tracked files
# only, so a lock that release-plz regenerates is now visible to them and will
# fail the release rather than being silently ignored.
#
# That is deliberate for now — a version bump that rewrites a lock should be
# surfaced, not swallowed — but this path only runs on `main` after a green CI
# run and has not been exercised since the policy changed. If it fires, decide
# between committing the regenerated lock as part of the release commit or
# scoping the assertion to exclude lockfiles; do not simply re-ignore them.
# See fixes/2026-07-30-ci-cd-stabilization/plan.md.
on:
  workflow_run:
    workflows: ["ci"]
    types:
      - completed
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed

env:
  # release-plz shells out to `cargo package`/`publish`, which compiles. The
  # repository tracks no rustc wrapper; cleared explicitly so a stray
  # environment value cannot intercept a release build.
  RUSTC_WRAPPER: ""
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz-pr:
    name: Create Release PR
    runs-on: ubuntu-latest
    # Only after a SUCCESSFUL ci run on main in the canonical repository.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.repository == 'yankeeinlondon/rusty-biscuit'
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out exactly the main commit that CI validated.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Backstop for the vendored protoc in rendezvous-core's build.rs:
      # a system protoc if the vendored binary is ever unavailable.
      - name: Install protoc
        uses: ./.github/actions/setup-protoc-retry

      - name: Assert clean tracked worktree before release calculation
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error title=release bootstrap::tracked files were modified before release calculation began"
            git status --porcelain --untracked-files=no
            exit 1
          fi

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release-pr pushes its changes to a dedicated release branch, so the
      # checked-out commit must stay clean. A dirty tracked worktree here means
      # release-plz mutated a tracked file in place — surface it as a release
      # failure rather than letting it silently poison a later checkout.
      - name: Assert clean tracked worktree after release calculation
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error title=release bootstrap::release calculation left tracked modifications in the worktree"
            git status --porcelain --untracked-files=no
            exit 1
          fi

  release-plz-release:
    name: Publish Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release') &&
      github.repository == 'yankeeinlondon/rusty-biscuit'
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Backstop for the vendored protoc in rendezvous-core's build.rs:
      # a system protoc if the vendored binary is ever unavailable.
      - name: Install protoc
        uses: ./.github/actions/setup-protoc-retry

      - name: Assert clean tracked worktree before publication
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error title=release bootstrap::tracked files were modified before publication began"
            git status --porcelain --untracked-files=no
            exit 1
          fi

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
