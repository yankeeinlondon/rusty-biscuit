name: pre-push-hook-tests

# Path-filtered test workflow for the .githooks/ shell hooks and the
# `just` recipes that orchestrate them. Feature branches run through the PR
# event only, avoiding duplicate checks for one push. Main retains push coverage.

on:
  push:
    branches: [main]
    paths:
      - ".githooks/**"
      - "justfile"
      - "just/**"
      - ".github/workflows/pre-push-hook-tests.yml"
  pull_request:
    paths:
      - ".githooks/**"
      - "justfile"
      - "just/**"
      - ".github/workflows/pre-push-hook-tests.yml"
  workflow_dispatch: {}

env:
  # The repository tracks no rustc wrapper; cleared explicitly so a stray
  # environment value cannot silently intercept this workflow's builds.
  RUSTC_WRAPPER: ""
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pre-push-hook-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Hook tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # The hook tests run the hook against a fake `just`, so they never
        # touch the real working tree or its history; a shallow clone
        # would do. Full history is fetched defensively in case future
        # tests grow to inspect the real working tree.
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Run pre-push hook tests
        env:
          PRE_PUSH_TEST_REPORT_DIR: ${{ runner.temp }}/hook-test-results
        run: just test-pre-push-hook

      - name: Upload hook test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hook-test-results
          path: ${{ runner.temp }}/hook-test-results/
          if-no-files-found: error
