name: bench-nightly

# Scheduled performance measurement for darkmatter, pushing results to
# Bencher.dev. This is NOT part of per-commit validation: it is scheduled and
# manually dispatchable only, so a slow benchmark run can never be mistaken for
# a test regression (D14).
#
# Prerequisites:
#   1. Create a project in Bencher Cloud (https://bencher.dev).
#   2. Create a project-scoped API key (starts with `bencher_run_`) and add
#      it as the BENCHER_API_KEY repository secret. User API tokens (JWTs)
#      are NOT accepted on the --key flag; use the matching --token flag if
#      you switch back to a user token.
#   3. Set the BENCHER_PROJECT variable (or hardcode the project slug below).
#
# Timeout budget (D14 / AC30). Measured on `ubuntu-latest` with a warm
# Swatinem cache: six consecutive scheduled runs took 14, 16, 17, 18, 18 and 18
# minutes, of which ~6 min was the darkmatter bench-target compile and ~9 min was
# Criterion execution (run 29971775038). Runs that started from a cold cache were
# killed by the previous 30-minute ceiling, so the cold duration is known only to
# EXCEED 30 minutes — it has never been measured. The budget is therefore set
# provisionally to 90 minutes: comfortably above the warm figure with room for a
# cold compile, and high enough that the first cold run completes and reports its
# own duration instead of being truncated again. The job records its measured
# execution time, runner image, and toolchain in the run summary; tighten this
# budget (or split the 16 bench targets across parallel jobs) once a cold run has
# actually been recorded.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

env:
  # The repository tracks no rustc wrapper; cleared explicitly so a stray
  # environment value cannot silently intercept this workflow's builds.
  RUSTC_WRAPPER: ""
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: bench-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  darkmatter:
    name: benchmark / darkmatter / ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up the pinned Rust toolchain
        run: rustup show

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: bench-nightly-darkmatter

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install Bencher CLI
        uses: bencherdev/bencher@main

      # Benchmark EXECUTION. This step gates the job: a bench that fails to
      # compile or panics is a real failure and must be visible. Criterion output
      # is captured so the upload step never has to re-run the suite.
      - name: Run benchmarks
        id: bench
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          mkdir -p "$RUNNER_TEMP/bench"
          (cd darkmatter && just bench) 2>&1 \
            | tee "$RUNNER_TEMP/bench/darkmatter-criterion.txt"
          echo "seconds=$((SECONDS - started))" >>"$GITHUB_OUTPUT"

      # Result UPLOAD, deliberately separated from execution (D14 / AC31). The
      # Bencher project or API key may be unprovisioned, and a regression alert
      # must not relabel a successful measurement as a failed one. `bencher run`
      # is handed the captured output to parse, so this never re-benchmarks.
      - name: Upload results to Bencher.dev
        if: ${{ !cancelled() && steps.bench.outcome == 'success' }}
        continue-on-error: true
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          bencher run \
            --project "${{ vars.BENCHER_PROJECT || 'darkmatter' }}" \
            --branch "${{ github.ref_name }}" \
            --testbed "ubuntu-latest" \
            --adapter rust_criterion \
            --github-actions '${{ secrets.GITHUB_TOKEN }}' \
            cat "$RUNNER_TEMP/bench/darkmatter-criterion.txt"

      # Runner class and toolchain travel with the numbers: a comparison across
      # different runner images or compilers is not a comparison (D14).
      - name: Record measurement context
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BENCH_SECONDS: ${{ steps.bench.outputs.seconds }}
          BENCH_RESULT: ${{ steps.bench.outcome }}
        run: |
          set -euo pipefail
          # Unset when execution failed before it could report — say so rather
          # than printing a bare "s".
          duration="not measured"
          if [ -n "${BENCH_SECONDS:-}" ]; then
            duration="${BENCH_SECONDS}s"
          fi
          {
            echo "## Nightly benchmark"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| execution | ${BENCH_RESULT} |"
            echo "| measured duration | ${duration} (budget: 90 min) |"
            echo "| runner image | ${ImageOS:-unknown} / ${ImageVersion:-unknown} |"
            echo "| toolchain | $(rustc --version) |"
            echo ""
            echo "Upload to Bencher.dev is best-effort and reported separately;"
            echo "a failed upload does not invalidate the measurement above."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload Criterion output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bench-darkmatter-criterion
          path: ${{ runner.temp }}/bench/darkmatter-criterion.txt
          if-no-files-found: ignore
