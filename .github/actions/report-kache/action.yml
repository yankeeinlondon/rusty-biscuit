name: report-kache
description: >
  Summarize kache cache effectiveness into the run summary after a build.

# Counterpart to `enable-kache`, which activates the wrapper BEFORE Cargo runs.
# Composite actions cannot register a `post:` step, so effectiveness has to be
# reported by an explicit step after the build rather than automatically.
#
# Why this exists: kache was installed and verified but never measured, so
# nobody could say whether it helped. That mattered — the first full
# cross-platform run showed `claudine` spending ~20m45s of a 30-minute job
# budget on compilation against 6m35s of actual test execution, and no data
# existed to say whether the cache was hitting, thrashing, or cold.
#
# This step must NEVER fail a job. A reporting failure that turns a green build
# red would be strictly worse than the blind spot it replaces.

inputs:
  enabled:
    description: >
      Emit the report when 'true'. Mirror the value passed to `enable-kache`
      so the two cannot drift; a report from a leg with no wrapper is noise.
    required: false
    default: "false"
  label:
    description: "Identifies which job the report belongs to (e.g. 'darkmatter test ubuntu-latest 1/4')."
    required: false
    default: "build"

runs:
  using: composite
  steps:
    - name: Report kache effectiveness
      if: ${{ inputs.enabled == 'true' }}
      shell: bash
      env:
        LABEL: ${{ inputs.label }}
      run: |
        # Deliberately no `-e`: every failure path below is swallowed.
        set -uo pipefail

        if ! command -v kache >/dev/null 2>&1; then
          echo "kache is not on PATH; no effectiveness report for ${LABEL}"
          exit 0
        fi

        # A one-line, greppable signal per job. Comparing this line across jobs
        # is how a cache regression gets spotted without opening each summary.
        summary="$(kache stats 2>/dev/null | grep -iE '^(Hit rate|Weighted|Time saved)' | tr '\n' ' ')"
        echo "kache[${LABEL}] ${summary:-no stats available}"

        {
          printf '<details><summary>kache — %s</summary>\n\n' "${LABEL}"
          # `report` renders a markdown table; `stats` is the fallback if the
          # subcommand is unavailable in a future pinned version.
          kache report --format markdown 2>/dev/null \
            || kache stats 2>/dev/null \
            || echo '_kache produced no report._'
          printf '\n</details>\n'
        } >>"${GITHUB_STEP_SUMMARY}" || true

        exit 0
