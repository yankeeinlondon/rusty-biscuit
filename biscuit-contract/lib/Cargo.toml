[package]
name = "biscuit-contract"
version = "0.1.0"
edition = "2024"
description = "Shared provider-neutral contract for one text-inference operation"
license = "MIT"

[lib]
name = "biscuit_contract"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
