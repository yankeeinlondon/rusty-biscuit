[package]
name = "content-policy"
version = "0.1.0"
edition = "2024"
description = "Declare, evaluate, and renew Markdown content policies"

[lib]
name = "content_policy"
path = "src/lib.rs"

[features]
default = []
# Bundled `FileChanged` provider that reads files from disk. Off by default so
# the core build never pulls in `gix` through Biscuit File's file references.
file-adapter = ["biscuit-file/file-reference"]

[dependencies]
biscuit-file = { path = "../../biscuit-file/lib", default-features = false, features = ["yaml"] }
biscuit-hash = { path = "../../biscuit-hash/lib", features = ["xx_hash", "blake3"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "now"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

# CI policy: the L1 suite runs with every feature enabled.
[package.metadata.ci.tests]
all-features = true
